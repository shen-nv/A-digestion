<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1984 — Screen II</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Courier+Prime&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #07080f;
  }

  #bg-video {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 0;
    opacity: 0.85;
  }

  /* Dark overlay to keep text readable */
  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(7, 8, 15, 0.35);
    z-index: 1;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 10;
    opacity: 0.04;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    background-size: 200px;
  }

  #words-layer { position: absolute; inset: 0; z-index: 5; }

  #particle-canvas {
    position: fixed;
    inset: 0;
    z-index: 6;
    pointer-events: none;
  }

  .falling-word {
    position: absolute;
    font-family: 'Courier Prime', 'Courier New', monospace;
    white-space: pre;
    pointer-events: none;
  }

  #status {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Courier Prime', monospace;
    font-size: 10px;
    letter-spacing: 0.25em;
    color: rgba(200, 200, 210, 0.35);
    text-transform: uppercase;
    z-index: 20;
    animation: blink 3s ease-in-out infinite;
    transition: opacity 2s;
  }
  #status.hidden { opacity: 0; }
  @keyframes blink {
    0%, 100% { opacity: 0.3; }
    50%       { opacity: 0.7; }
  }
</style>
</head>
<body>

<video id="bg-video" autoplay muted loop playsinline>
  <source src="bg.mp4" type="video/mp4">
</video>
<div id="overlay"></div>
<canvas id="particle-canvas"></canvas>
<div id="words-layer"></div>
<div id="status">waiting for deletion</div>

<script>
const layer = document.getElementById('words-layer');
const status = document.getElementById('status');
const canvas = document.getElementById('particle-canvas');
const ctx = canvas.getContext('2d');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
window.addEventListener('resize', () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});

let settled = [];
const PADDING = 5;
const SWEEP_INTERVAL = 90000;
let isSweeping = false;
let hasReceived = false;

// ---- Particle system ----
let particles = [];

function rafLoop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  particles = particles.filter(p => p.life > 0);
  for (const p of particles) {
    p.x += p.vx;
    p.y += p.vy;
    p.vy -= 0.02;
    p.vx *= 0.97;
    p.life -= p.decay;
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, p.size, p.size);
  }
  ctx.globalAlpha = 1;
  requestAnimationFrame(rafLoop);
}
requestAnimationFrame(rafLoop);

function spawnParticlesFromElement(el, colorStr) {
  const rect = el.getBoundingClientRect();
  const count = Math.floor((rect.width * rect.height) / 20);
  for (let i = 0; i < Math.min(count, 250); i++) {
    particles.push({
      x: rect.left + Math.random() * rect.width,
      y: rect.top + Math.random() * rect.height,
      vx: (Math.random() - 0.5) * 0.9,
      vy: -(Math.random() * 1.2 + 0.2),
      size: Math.random() * 2 + 0.4,
      color: colorStr,
      life: 0.6 + Math.random() * 0.4,
      decay: 0.007 + Math.random() * 0.01,
    });
  }
}

function triggerSweep() {
  if (isSweeping || settled.length === 0) return;
  isSweeping = true;
  const copy = [...settled];
  copy.forEach((s, i) => {
    setTimeout(() => {
      spawnParticlesFromElement(s.el, s.color);
      s.el.remove();
    }, i * 20);
  });
  setTimeout(() => {
    settled = [];
    isSweeping = false;
  }, copy.length * 20 + 1500);
}

setInterval(() => {
  if (!isSweeping && settled.length > 0) triggerSweep();
}, SWEEP_INTERVAL);

// ---- BroadcastChannel (local, same browser) ----
const bc = new BroadcastChannel('1984_deletion');

bc.onmessage = (e) => {
  const { text, source } = e.data;
  if (!hasReceived) {
    hasReceived = true;
    status.classList.add('hidden');
  }
  setTimeout(() => spawnFalling(text.trim(), source), Math.random() * 300);
};

// ---- Spawn ----
function spawnFalling(text, source) {
  if (!text || text.length === 0) return;
  const display = text.replace(/\n+/g, ' ').replace(/\s+/g, ' ').trim();
  if (display.length === 0) return;

  const isHuman = source === 'human';
  const el = document.createElement('div');
  el.className = 'falling-word';
  el.textContent = display;

  const fontSize = isHuman ? 12 + Math.random() * 6 : 9 + Math.random() * 4;
  const opacity = isHuman ? 0.85 + Math.random() * 0.15 : 0.55 + Math.random() * 0.25;
  const colorStr = isHuman
    ? `rgba(220, 60, 60, ${opacity})`
    : `rgba(225, 228, 235, ${opacity})`;

  el.style.fontSize = fontSize + 'px';
  el.style.color = colorStr;
  el.style.visibility = 'hidden';
  el.style.position = 'absolute';
  el.style.top = '0px';
  el.style.left = '0px';
  layer.appendChild(el);

  const w = el.offsetWidth;
  const h = el.offsetHeight;
  const maxX = Math.max(10, window.innerWidth - w - 20);
  const x = 10 + Math.random() * maxX;

  el.style.left = x + 'px';
  el.style.top = (-h - 10) + 'px';
  el.style.visibility = 'visible';

  const landingTop = findLandingTop(x, w, h);
  const dur = 6 + Math.random() * 4;
  const startY = -h - 10;
  const endY = landingTop;
  const startTime = performance.now();

  function animate(now) {
    const elapsed = (now - startTime) / 1000;
    const progress = Math.min(elapsed / dur, 1);
    const eased = progress < 0.5
      ? 2 * progress * progress
      : 1 - Math.pow(-2 * progress + 2, 2) / 2;
    el.style.top = (startY + (endY - startY) * eased) + 'px';
    if (progress < 1) {
      requestAnimationFrame(animate);
    } else {
      el.style.top = endY + 'px';
      settled.push({ el, x, y: endY, width: w, height: h, color: colorStr });
    }
  }
  requestAnimationFrame(animate);
}

function findLandingTop(x, w, h) {
  let highestOccupied = window.innerHeight;
  for (const s of settled) {
    const overlapX = x < s.x + s.width + PADDING && x + w + PADDING > s.x;
    if (overlapX && s.y < highestOccupied) highestOccupied = s.y;
  }
  return highestOccupied - h - PADDING;
}
</script>
</body>
</html>
