en his nerve so forsook him that he began shouting for mercy even before the\nbeating began, when the mere sight of a fist drawn back for a blow was enough to\nmake him pour forth a confession of real and imaginary crimes. There were other\ntimes when he started out with the resolve of confessing nothing, when every\nword had to be forced out of him between gasps of pain, and there were times\nwhen he feebly tried to compromise, when he said to himself: \u2018I will confess,\nbut not yet. I must hold out till the pain becomes unbearable. Three more kicks,\ntwo more kicks, and then I will tell them what they want.\u2019 Sometimes he was\nbeaten till he could hardly stand, then flung like a sack of potatoes on to the\nstone floor of a cell, left to recuperate for a few hours, and then taken out\nand beaten again. There were also longer\n\nperiods of recovery. He remembered them dimly, because they were spent chiefly\nin sleep or stupor. He remembered a cell with a plank bed, a sort of shelf\nsticking out from the wall, and a tin wash-basin, and meals of hot soup and\nbread and sometimes coffee. He remembered a surly barber arriving to scrape his\nchin and crop his hair, and businesslike, unsympathetic men in white coats\nfeeling his pulse, tapping his reflexes, turning up his eyelids, running harsh\nfingers over him in search for broken bones, and shooting needles into his arm\nto make him sleep.\n\nThe beatings grew less frequent, and became mainly a threat, a horror to which\nhe could be sent back at any moment when his answers were unsatisfactory. His\nquestioners now were not ruffians in black uniforms but Party intellectuals,\nlittle rotund men with quick movements and flashing spectacles, who worked on\nhim in relays over periods which lasted\u2014he thought, he could not be sure\u2014ten or\ntwelve hours at a stretch. These other questioners saw to it that he was in\nconstant slight pain, but it was not chiefly pain that they relied on. They\nslapped his face, wrung his ears, pulled his hair, made him stand on one leg,\nrefused him leave to urinate, shone glaring lights in his face until his eyes\nran with water; but the aim of this was simply to humiliate him and destroy his\npower of arguing and reasoning. Their real weapon was the merciless questioning\nthat went on and on, hour after hour, tripping him up, laying traps for him,\ntwisting everything that he said, convicting him at every step of lies and self-\ncontradiction until he began weeping as much from shame as from nervous fatigue.\nSometimes he wouldweep half a dozen times in a single session. Most of the time\nthey screamed abuse at him and threatened at every hesitation to deliver him\nover to the guards again; but sometimes they would suddenly change their tune,\ncall him comrade, appeal to him in the name of Ingsoc and Big Brother, and ask\nhim sorrowfully whether even now he had not enough loyalty to the Party left to\nmake him wish to undo the evil he had done. When his nerves were in rags after\nhours of questioning, even this appeal could reduce him to snivelling tears. In\nthe end the nagging voices broke him down more completely than the boots and\nfists of the guards. He became simply a mouth that uttered, a hand that signed,\nwhatever was demanded of him. His sole concern was to find out what they wanted\nhim to confess, and then confess it quickly, before the bullying started anew.\nHe confessed to the assassination of eminent Party members, the distribution of\nseditious pamphlets, embezzlement of public funds, sale of military secrets,\nsabotage of every kind. He confessed that he had been a spy in the pay of the\nEastasian government as far back as 1968. He confessed that he was a religious\nbeliever, an admirer of capitalism, and a sexual pervert. He confessed that he\nhad murdered his wife, although he knew, and his questioners must have known,\nthat his wife was still alive. He confessed that for years he had been in\npersonal touch with Goldstein and had been a member of an underground\norganization which had included almost every human being he had ever known. It\nwas easier to confess everything and implicate everybody. Besides, in a sense it\nwas all true. It was true that he had\n\nbeen the enemy of the Party, and in the eyes of the Party there was no\ndistinction between the thought and the deed.\n\nThere were also memories of another kind. They stood out in his mind\ndisconnectedly, like pictures with blackness all round them.\n\nHe was in a cell which might have been either dark or light, because he could\nsee nothing except a pair of eyes. Near at hand some kind of instrument was\nticking slowly and regularly. The eyes grew larger and more luminous. Suddenly\nhe floated out of his seat, dived into the eyes, and was swallowed up.\n\nHe was strapped into a chair surrounded by dials, under dazzling lights. A man\nin a white coat was reading the dials. There was a tramp of heavy boots outside.\nThe door clanged open. The waxed-faced officer marched in, followed by two\nguards.\n\n\u2018Room 101,\u2019 said the officer.\n\nThe man in the white coat did not turn round. He did not look at Winston either;\nhe was looking only at the dials.\n\nHe was rolling down a mighty corridor, a kilometre wide, full of glorious,\ngolden light, roaring with laughter and shouting out confessions at the top of\nhis voice. He was confessing everything, even the things he had succeeded in\nholding back under the torture. He was relating the entire history of his life\nto an audience who knew it already. With him were the guards, the other\nquestioners, the men in white coats, O\u2019Brien, Julia, Mr Charrington, all rolling\ndown the corridor together and shouting with laughter. Some dreadful thing which\nhad lain embedded in the future had somehow been skipped over and had not\nhappened. Everything was all right, there was no more pain, the last detail of\nhis life was laid bare, understood, forgiven.\n\nHe was starting up from the plank bed in the half-certainty that he had heard\nO\u2019Brien\u2019s voice. All through his interrogation, although he had never seen him,\nhe had had the feeling that O\u2019Brien was at his elbow, just out of sight. It was\nO\u2019Brien who was directing everything. It was he who set the guards on to Winston\nand who prevented them from killing him. It was he who decided when Winston\nshould scream with pain, when he should have a respite, when he should be fed,\nwhen he should sleep, when the drugs should be pumped into his arm. It was he\nwho asked the questions and suggested the answers. He was the tormentor, he was\nthe protector, he was the inquisitor, he was the friend. And once\u2014Winston could\nnot remember whether it was in drugged sleep, or in normal sleep, or even in a\nmoment of wakefulness\u2014a voice murmured in his ear: \u2018Don\u2019t worry, Winston; you\nare in my keeping. For seven years I have watched over you. Now the turning-\npoint has come. I shall save you, I shall make you perfect.\u2019 He was not sure\nwhether it was O\u2019Brien\u2019s voice; but it was the same voice that had said to him,\n\u2018We shall meet in the place where there is no darkness,\u2019 in that other dream,\nseven years ago.\n\nHe did not remember any ending to his interrogation. There was a period of\nblackness and then the cell, or room, in which he now was had gradually\nmaterialized round him. He was almost flat on his back, and unable to move. His\nbody was held down at every essential point. Even the backof his head was\ngripped in some manner. O\u2019Brien was looking down at him gravely and rather\nsadly. His face, seen from below, looked coarse and worn, with pouches under the\neyes and tired lines from nose to chin. He was older than Winston had thought\nhim; he was perhaps forty-eight or fifty. Under his hand there was a dial with a\nlever on top and figures running round the face.\n\n\u2018I told you,\u2019 said O\u2019Brien, \u2018that if we met again it would be here.\u2019\n\n\u2018Yes,\u2019 said Winston.\n\nWithout any warning except a slight movement of O\u2019Brien\u2019s hand, a wave of pain\nflooded his body. It was a frightening pain, because he could not see what was\nhappening, and he had the feeling that some mortal injury was being done to him.\nHe did not know whether the thing was really happening, or whether the effect\nwas electrically produced; but his body was being wrenched out of shape, the\njoints were being slowly torn apart. Although the pain had brought the sweat out\non his forehead, the worst of all was the fear that his backbone was about to\nsnap. He set his teeth and breathed hard through his nose, trying to keep silent\nas long as possible.\n\n\u2018You are afraid,\u2019 said O\u2019Brien, watching his face, \u2018that in another moment\nsomething is going to break. Your especial fear is that it will be your\nbackbone. You have a vivid mental picture of the vertebrae snapping apart and\nthe spinal fluid dripping out of them. That is what you are thinking, is it not,\nWinston?\u2019\n\nWinston did not answer. O\u2019Brien drew back the lever onthe dial. The wave of pain receded almost as quickly as it had come.\n\n\u2018That was forty,\u2019 said O\u2019Brien. \u2018You can see that the numbers on this dial run\nup to a hundred. Will you please remember, throughout our conversation, that I\nhave it in my power to inflict pain on you at any moment and to whatever degree\nI choose? If you tell me any lies, or attempt to prevaricate in any way, or even\nfall below your usual level of intelligence, you will cry out with pain,\ninstantly. Do you understand that?\u2019\n\n\u2018Yes,\u2019 said Winston.\n\nO\u2019Brien\u2019s manner became less severe. He resettled his spectacles thoughtfully,\nand took a pace or two up and down. When he spoke his voice was gentle and\npatient. He had the air of a doctor, a teacher, even a priest, anxious to\nexplain and persuade rather than to punish.\n\n\u2018I am taking trouble with you, Winston,\u2019 he said, \u2018because you are worth\ntrouble. You know perfectly well what is the matter with you. You have known it\nfor years, though you have fought against the knowledge. You are mentally\nderanged. You suffer from a defective memory. You are unable to remember real\nevents and you persuade yourself that you remember other events which never\nhappened. Fortunately it is curable. You have never cured yourself of it,\nbecause you did not choose to. There was a small effort of the will that you\nwere not ready to make. Even now, I am well aware, you are clinging to your\ndisease under the impression that it is a virtue. Now we will take an example.\nAt this moment, which power is Oceania at war with?\u2019\n\n\u2018When I was arrested, Oceania was at war with Eastasia.\u2019\n\n\u2018With Eastasia. Good. And Oceania has always been at war with Eastasia, has it\nnot?\u2019\n\nWinston drew in his breath. He opened his mouth to speak and then did not speak.\nHe could not take his eyes away from the dial.\n\n\u2018The truth, please, Winston. YOUR truth. Tell me what you think you remember.\u2019\n\n\u2018I remember that until only a week before I was arrested, we were not at war\nwith Eastasia at all. We were in alliance with them. The war was against\nEurasia. That had lasted for four years. Before that\u2014\u2014\u2019\n\nO\u2019Brien stopped him with a movement of the hand.\n\n\u2018Another example,\u2019 he said. \u2018Some years ago you had a very serious delusion\nindeed. You believed that three men, three one-time Party members named Jones,\nAaronson, and Rutherford\u2014men who were executed for treachery and sabotage after\nmaking the fullest possible confession\u2014 were not guilty of the crimes they were\ncharged with. You believed that you had seen unmistakable documentary evidence\nproving that their confessions were false. There was a certain photograph about\nwhich you had a hallucination. You believed that you had actually held it in\nyour hands. It was a photograph something like this.\u2019\n\nAn oblong slip of newspaper had appeared between O\u2019Brien\u2019s fingers. For perhaps\nfive seconds it was within the angle of Winston\u2019s vision. It was a photograph,\nand there was no question of its identity. It was THE photograph. It was another\ncopy of the photograph of Jones, Aaronson,\n\nand Rutherford at the party function in New York, which he had chanced upon\neleven years ago and promptly destroyed. For only an instant it was before his\neyes, then it was out of sight again. But he had seen it, unquestionably he had\nseen it! He made a desperate, agonizing effort to wrench the top half of his\nbody free. It was impossible to move so much as a centimetre in any direction.\nFor the moment he had even forgotten the dial. All he wanted was to hold the\nphotograph in his fingers again, or at least to see it.\n\n\u2018It exists!\u2019 he cried.\n\n\u2018No,\u2019 said O\u2019Brien.\n\nHe stepped across the room. There was a memory hole in the opposite wall.\nO\u2019Brien lifted the grating. Unseen, the frail slip of paper was whirling away on\nthe current of warm air; it was vanishing in a flash of flame. O\u2019Brien turned\naway from the wall.\n\n\u2018Ashes,\u2019 he said. \u2018Not even identifiable ashes. Dust. It does not exist. It\nnever existed.\u2019\n\n\u2018But it did exist! It does exist! It exists in memory. I remember it. You\nremember it.\u2019\n\n\u2018I do not remember it,\u2019 said O\u2019Brien.\n\nWinston\u2019s heart sank. That was doublethink. He had a feeling of deadly\nhelplessness. If he could have been certain that O\u2019Brien was lying, it would not\nhave seemed to matter. But it was perfectly possible that O\u2019Brien had really\nforgotten the photograph. And if so, then already he would have forgotten his\ndenial of remembering it, and forgotten the act of forgetting. How could one be\nsure that it was simple trickery? Perhaps that lunatic dislocation in the mind\ncouldreally happen: that was the thought that defeated him.\n\nO\u2019Brien was looking down at him speculatively. More than ever he had the air of\na teacher taking pains with a wayward but promising child.\n\n\u2018There is a Party slogan dealing with the control of the past,\u2019 he said. \u2018Repeat\nit, if you please.\u2019\n\n\u2018\u2019Who controls the past controls the future: who controls the present controls\nthe past,\u2018\u2018 repeated Winston obediently.\n\n\u2018\u2019Who controls the present controls the past,\u2018\u2018 said O\u2019Brien, nodding his head\nwith slow approval. \u2018Is it your opinion, Winston, that the past has real\nexistence?\u2019\n\nAgain the feeling of helplessness descended upon Winston. His eyes flitted\ntowards the dial. He not only did not know whether \u2018yes\u2019 or \u2018no\u2019 was the answer\nthat would save him from pain; he did not even know which answer he believed to\nbe the true one.\n\nO\u2019Brien smiled faintly. \u2018You are no metaphysician, Winston,\u2019 he said. \u2018Until\nthis moment you had never considered what is meant by existence. I will put it\nmore precisely. Does the past exist concretely, in space? Is there somewhere or\nother a place, a world of solid objects, where the past is still happening?\u2019\n\n\u2018No.\u2019\n\n\u2018Then where does the past exist, if at all?\u2019\n\n\u2018In records. It is written down.\u2019\n\n\u2018In records. And\u2014\u2014?\u2019\n\n\u2018In the mind. In human memories.\u2019\n\n\u2018In memory. Very well, then. We, the Party, control allrecords, and we control all memories. Then we control the past, do we not?\u2019\n\n\u2018But how can you stop people remembering things?\u2019 cried Winston again\nmomentarily forgetting the dial. \u2018It is involuntary. It is outside oneself. How\ncan you control memory? You have not controlled mine!\u2019\n\nO\u2019Brien\u2019s manner grew stern again. He laid his hand on the dial.\n\n\u2018On the contrary,\u2019 he said, \u2018YOU have not controlled it. That is what has\nbrought you here. You are here because you have failed in humility, in self-\ndiscipline. You would not make the act of submission which is the price of\nsanity. You preferred to be a lunatic, a minority of one. Only the disciplined\nmind can see reality, Winston. You believe that reality is something objective,\nexternal, existing in its own right. You also believe that the nature of reality\nis selfevident. When you delude yourself into thinking that you see something,\nyou assume that everyone else sees the same thing as you. But I tell you,\nWinston, that reality is not external. Reality exists in the human mind, and\nnowhere else. Not in the individual mind, which can make mistakes, and in any\ncase soon perishes: only in the mind of the Party, which is collective and\nimmortal. Whatever the Party holds to be the truth, is truth. It is impossible\nto see reality except by looking through the eyes of the Party. That is the fact\nthat you have got to relearn, Winston. It needs an act of selfdestruction, an\neffort of the will. You must humble yourself before you can become sane.\u2019\n\nHe paused for a few moments, as though to allow whathe had been saying to sink in.\n\n\u2018Do you remember,\u2019 he went on, \u2018writing in your diary, \u2018Freedom is the freedom\nto say that two plus two make four\u2019?\u2019\n\n\u2018Yes,\u2019 said Winston.\n\nO\u2019Brien held up his left hand, its back towards Winston, with the thumb hidden\nand the four fingers extended.\n\n\u2018How many fingers am I holding up, Winston?\u2019\n\n\u2018Four.\u2019\n\n\u2018And if the party says that it is not four but five\u2014then how many?\u2019\n\n\u2018Four.\u2019\n\nThe word ended in a gasp of pain. The needle of the dial had shot up to fifty-\nfive. The sweat had sprung out all over Winston\u2019s body. The air tore into his\nlungs and issued again in deep groans which even by clenching his teeth he could\nnot stop. O\u2019Brien watched him, the four fingers still extended. He drew back the\nlever. This time the pain was only slightly eased.\n\n\u2018How many fingers, Winston?\u2019\n\n\u2018Four.\u2019\n\nThe needle went up to sixty.\n\n\u2018How many fingers, Winston?\u2019\n\n\u2018Four! Four! What else can I say? Four!\u2019\n\nThe needle must have risen again, but he did not look at it. The heavy, stern\nface and the four fingers filled his vision. The fingers stood up before his\neyes like pillars, enormous, blurry, and seeming to vibrate, but unmistakably\nfour.\n\n\u2018How many fingers, Winston?\u2019\n\n\u2018Four! Stop it, stop it! How can you go on? Four! Four!\u2019\n\n\u2018How many fingers, Winston?\u2019\n\n\u2018Five! Five! Five!\u2019\n\n\u2018No, Winston, that is no use. You are lying. You still think there are four. How\nmany fingers, please?\u2019\n\n\u2018Four! five! Four! Anything you like. Only stop it, stop the pain!\u2019\n\nAbruptly he was sitting up with O\u2019Brien\u2019s arm round his shoulders. He had\nperhaps lost consciousness for a few seconds. The bonds that had held his body\ndown were loosened. He felt very cold, he was shaking uncontrollably, his teeth\nwere chattering, the tears were rolling down his cheeks. For a moment he clung\nto O\u2019Brien like a baby, curiously comforted by the heavy arm round his\nshoulders. He had the feeling that O\u2019Brien was his protector, that the pain was\nsomething that came from outside, from some other source, and that it was\nO\u2019Brien who would save him from it.\n\n\u2018You are a slow learner, Winston,\u2019 said O\u2019Brien gently.\n\n\u2018How can I help it?\u2019 he blubbered. \u2018How can I help seeing what is in front of my\neyes? Two and two are four.\u2019\n\nSometimes, Winston. Sometimes they are five. Sometimes they are three. Sometimes\nthey are all of them at once. You must try harder. It is not easy to become\nsane.\u2019\n\nHe laid Winston down on the bed. The grip of his limbs tightened again, but the\npain had ebbed away and the trembling had stopped, leaving him merely weak and\ncold. O\u2019Brien motioned with his head to the man in the white coat, who had stood\nimmobile throughout the proceedings. The man in the white coat bent down and\nlooked closelyinto Winston\u2019s eyes, felt his pulse, laid an ear against his\nchest, tapped here and there, then he nodded to O\u2019Brien.\n\n\u2018Again,\u2019 said O\u2019Brien.\n\nThe pain flowed into Winston\u2019s body. The needle must be at seventy, seventy-\nfive. He had shut his eyes this time. He knew that the fingers were still there,\nand still four. All that mattered was somehow to stay alive until the spasm was\nover. He had ceased to notice whether he was crying out or not. The pain\nlessened again. He opened his eyes. O\u2019Brien had drawn back the lever.\n\n\u2018How many fingers, Winston?\u2019\n\n\u2018Four. I suppose there are four. I would see five if I could. I am trying to see\nfive.\u2019\n\n\u2018Which do you wish: to persuade me that you see five, or really to see them?\u2019\n\n\u2018Really to see them.\u2019\n\n\u2018Again,\u2019 said O\u2019Brien.\n\nPerhaps the needle was eighty\u2014ninety. Winston could not intermittently remember\nwhy the pain was happening. Behind his screwed-up eyelids a forest of fingers\nseemed to be moving in a sort of dance, weaving in and out, disappearing behind\none another and reappearing again. He was trying to count them, he could not\nremember why. He knew only that it was impossible to count them, and that this\nwas somehow due to the mysterious identity between five and four. The pain died\ndown again. When he opened his eyes it was to find that he was still seeing the\nsame thing. Innumerable fingers, like moving trees, were still streaming past in\neither direction, crossing and recrossing. He shuthis eyes again.\n\n\u2018How many fingers am I holding up, Winston?\u2019\n\n\u2018I don\u2019t know. I don\u2019t know. You will kill me if you do that again. Four, five,\nsix\u2014in all honesty I don\u2019t know.\u2019\n\n\u2018Better,\u2019 said O\u2019Brien.\n\nA needle slid into Winston\u2019s arm. Almost in the same instant a blissful, healing\nwarmth spread all through his body. The pain was already half-forgotten. He\nopened his eyes and looked up gratefully at O\u2019Brien. At sight of the heavy,\nlined face, so ugly and so intelligent, his heart seemed to turn over. If he\ncould have moved he would have stretched out a hand and laid it on O\u2019Brien\u2019s\narm. He had never loved him so deeply as at this moment, and not merely because\nhe had stopped the pain. The old feeling, that at bottom it did not matter\nwhether O\u2019Brien was a friend or an enemy, had come back. O\u2019Brien was a person\nwho could be talked to. Perhaps one did not want to be loved so much as to be\nunderstood. O\u2019Brien had tortured him to the edge of lunacy, and in a little\nwhile, it was certain, he would send him to his death. It made no difference. In\nsome sense that went deeper than friendship, they were intimates: somewhere or\nother, although the actual words might never be spoken, there was a place where\nthey could meet and talk. O\u2019Brien was looking down at him with an expression\nwhich suggested that the same thought might be in his own mind. When he spoke it\nwas in an easy, conversational tone.\n\n\u2018Do you know where you are, Winston?\u2019 he said.\n\n\u2018I don\u2019t know. I can guess. In the Ministry of Love.\u2019\n\n\u2018Do you know how long you have been here?\u2019\n\n\u2018I don\u2019t know. Days, weeks, months\u2014I think it is months.\u2019\n\n\u2018And why do you imagine that we bring people to this place?\u2019\n\n\u2018To make them confess.\u2019\n\n\u2018No, that is not the reason. Try again.\u2019\n\n\u2018To punish them.\u2019\n\n\u2018No!\u2019 exclaimed O\u2019Brien. His voice had changed extraordinarily, and his face had\nsuddenly become both stern and animated. \u2018No! Not merely to extract your\nconfession, not to punish you. Shall I tell you why we have brought you here? To\ncure you! To make you sane! Will you understand, Winston, that no one whom we\nbring to this place ever leaves our hands uncured? We are not interested in\nthose stupid crimes that you have committed. The Party is not interested in the\novert act: the thought is all we care about. We do not merely destroy our\nenemies, we change them. Do you understand what I mean by that?\u2019\n\nHe was bending over Winston. His face looked enormous because of its nearness,\nand hideously ugly because it was seen from below. Moreover it was filled with a\nsort of exaltation, a lunatic intensity. Again Winston\u2019s heart shrank. If it had\nbeen possible he would have cowered deeper into the bed. He felt certain that\nO\u2019Brien was about to twist the dial out of sheer wantonness. At this moment,\nhowever, O\u2019Brien turned away. He took a pace or two up and down. Then he\ncontinued less vehemently:\n\n\u2018The first thing for you to understand is that in this place there are no\nmartyrdoms. You have read of the religiouspersecutions of the past. In the\nMiddle Ages there was the Inquisitlon. It was a failure. It set out to eradicate\nheresy, and ended by perpetuating it. For every heretic it burned at the stake,\nthousands of others rose up. Why was that? Because the Inquisition killed its\nenemies in the open, and killed them while they were still unrepentant: in fact,\nit killed them because they were unrepentant. Men were dying because they would\nnot abandon their true beliefs. Naturally all the glory belonged to the victim\nand all the shame to the Inquisitor who burned him. Later, in the twentieth\ncentury, there were the totalitarians, as they were called. There were the\nGerman Nazis and the Russian Communists. The Russians persecuted heresy more\ncruelly than the Inquisition had done. And they imagined that they had learned\nfrom the mistakes of the past; they knew, at any rate, that one must not make\nmartyrs. Before they exposed their victims to public trial, they deliberately\nset themselves to destroy their dignity. They wore them down by torture and\nsolitude until they were despicable, cringing wretches, confessing whatever was\nput into their mouths, covering themselves with abuse, accusing and sheltering\nbehind one another, whimpering for mercy. And yet after only a few years the\nsame thing had happened over again. The dead men had become martyrs and their\ndegradation was forgotten. Once again, why was it? In the first place, because\nthe confessions that they had made were obviously extorted and untrue. We do not\nmake mistakes of that kind. All the confessions that are uttered here are true.\nWe make them true. And above all we do not allow the dead to rise up against us.\nYou must\n\nstop imagining that posterity will vindicate you, Winston. Posterity will never\nhear of you. You will be lifted clean out from the stream of history. We shall\nturn you into gas and pour you into the stratosphere. Nothing will remain of\nyou, not a name in a register, not a memory in a living brain. You will be\nannihilated in the past as well as in the future. You will never have existed.\u2019\n\nThen why bother to torture me? thought Winston, with a momentary bitterness.\nO\u2019Brien checked his step as though Winston had uttered the thought aloud. His\nlarge ugly face came nearer, with the eyes a little narrowed.\n\n\u2018You are thinking,\u2019 he said, \u2018that since we intend to destroy you utterly, so\nthat nothing that you say or do can make the smallest difference\u2014in that case,\nwhy do we go to the trouble of interrogating you first? That is what you were\nthinking, was it not?\u2019\n\n\u2018Yes,\u2019 said Winston.\n\nO\u2019Brien smiled slightly. \u2018You are a flaw in the pattern, Winston. You are a\nstain that must be wiped out. Did I not tell you just now that we are different\nfrom the persecutors of the past? We are not content with negative obedience,\nnor even with the most abject submission. When finally you surrender to us, it\nmust be of your own free will. We do not destroy the heretic because he resists\nus: so long as he resists us we never destroy him. We convert him, we capture\nhis inner mind, we reshape him. We burn all evil and all illusion out of him; we\nbring him over to our side, not in appearance, but genuinely, heart and soul. We\nmake him one of ourselves before we kill him. It is intolerable to us thatan\nerroneous thought should exist anywhere in the world, however secret and\npowerless it may be. Even in the instant of death we cannot permit any\ndeviation. In the old days the heretic walked to the stake still a heretic,\nproclaiming his heresy, exulting in it. Even the victim of the Russian purges\ncould carry rebellion locked up in his skull as he walked down the passage\nwaiting for the bullet. But we make the brain perfect before we blow it out. The\ncommand of the old despotisms was \u2018Thou shalt not\u201d. The command of the\ntotalitarians was \u2018Thou shalt\u201d. Our command is \u2018THOU ART\u201d. No one whom we bring\nto this place ever stands out against us. Everyone is washed clean. Even those\nthree miserable traitors in whose innocence you once believed\u2014Jones, Aaronson,\nand Rutherford\u2014in the end we broke them down. I took part in their interrogation\nmyself. I saw them gradually worn down, whimpering, grovelling, weeping\u2014and in\nthe end it was not with pain or fear, only with penitence. By the time we had\nfinished with them they were only the shells of men. There was nothing left in\nthem except sorrow for what they had done, and love of Big Brother. It was\ntouching to see how they loved him. They begged to be shot quickly, so that they\ncould die while their minds were still clean.\u2019\n\nHis voice had grown almost dreamy. The exaltation, the lunatic enthusiasm, was\nstill in his face. He is not pretending, thought Winston, he is not a hypocrite,\nhe believes every word he says. What most oppressed him was the consciousness of\nhis own intellectual inferiority. He watched the heavy yet graceful form\nstrolling to and fro, in and outof the range of his vision. O\u2019Brien was a being\nin all ways larger than himself. There was no idea that he had ever had, or\ncould have, that O\u2019Brien had not long ago known, examined, and rejected. His\nmind CONTAINED Winston\u2019s mind. But in that case how could it be true that\nO\u2019Brien was mad? It must be he, Winston, who was mad. O\u2019Brien halted and looked\ndown at him. His voice had grown stern again.\n\n\u2018Do not imagine that you will save yourself, Winston, however completely you\nsurrender to us. No one who has once gone astray is ever spared. And even if we\nchose to let you live out the natural term of your life, still you would never\nescape from us. What happens to you here is for ever. Understand that in\nadvance. We shall crush you down to the point from which there is no coming\nback. Things will happen to you from which you could not recover, if you lived a\nthousand years. Never again will you be capable of ordinary human feeling.\nEverything will be dead inside you. Never again will you be capable of love, or\nfriendship, or joy of living, or laughter, or curiosity, or courage, or\nintegrity. You will be hollow. We shall squeeze you empty, and then we shall\nfill you with ourselves.\u2019\n\nHe paused and signed to the man in the white coat. Winston was aware of some\nheavy piece of apparatus being pushed into place behind his head. O\u2019Brien had\nsat down beside the bed, so that his face was almost on a level with Winston\u2019s.\n\n\u2018Three thousand,\u2019 he said, speaking over Winston\u2019s head to the man in the white\ncoat.\n\nTwo soft pads, which felt slightly moist, clamped themselves against Winston\u2019s\ntemples. He quailed. There was pain coming, a new kind of pain. O\u2019Brien laid a\nhand reassuringly, almost kindly, on his.\n\n\u2018This time it will not hurt,\u2019 he said. \u2018Keep your eyes fixed on mine.\u2019\n\nAt this moment there was a devastating explosion, or what seemed like an\nexplosion, though it was not certain whether there was any noise. There was\nundoubtedly a blinding flash of light. Winston was not hurt, only prostrated.\nAlthough he had already been lying on his back when the thing happened, he had a\ncurious feeling that he had been knocked into that position. A terrific painless\nblow had flattened him out. Also something had happened inside his head. As his\neyes regained their focus he remembered who he was, and where he was, and\nrecognized the face that was gazing into his own; but somewhere or other there\nwas a large patch of emptiness, as though a piece had been taken out of his\nbrain.\n\n\u2018It will not last,\u2019 said O\u2019Brien. \u2018Look me in the eyes. What country is Oceania\nat war with?\u2019\n\nWinston thought. He knew what was meant by Oceania and that he himself was a\ncitizen of Oceania. He also remembered Eurasia and Eastasia; but who was at war\nwith whom he did not know. In fact he had not been aware that there was any war.\n\n\u2018I don\u2019t remember.\u2019\n\n\u2018Oceania is at war with Eastasia. Do you remember that now?\u2019\n\n\u2018Yes.\u2019\n\n\u2018Oceania has always been at war with Eastasia. Since the beginning of your life,\nsince the beginning of the Party, since the beginning of history, the war has\ncontinued without a break, always the same war. Do you remember that?\u2019\n\n\u2018Yes.\u2019\n\n\u2018Eleven years ago you created a legend about three men who had been condemned to\ndeath for treachery. You pretended that you had seen a piece of paper which\nproved them innocent. No such piece of paper ever existed. You invented it, and\nlater you grew to believe in it. You remember now the very moment at which you\nfirst invented it. Do you remember that?\u2019\n\n\u2018Yes.\u2019\n\n\u2018Just now I held up the fingers of my hand to you. You saw five fingers. Do you\nremember that?\u2019\n\n\u2018Yes.\u2019\n\nO\u2019Brien held up the fingers of his left hand, with the thumb concealed.\n\n\u2018There are five fingers there. Do you see five fingers?\u2019\n\n\u2018Yes.\u2019\n\nAnd he did see them, for a fleeting instant, before the scenery of his mind\nchanged. He saw five fingers, and there was no deformity. Then everything was\nnormal again, and the old fear, the hatred, and the bewilderment came crowding\nback again. But there had been a moment\u2014he did not know how long, thirty\nseconds, perhaps\u2014of luminous certainty, when each new suggestion of O\u2019Brien\u2019s\nhad filled up a patch of emptiness and become absolute truth, and when two and\ntwo could have been three as easily as five, if thatwere what was needed. It had\nfaded but before O\u2019Brien had dropped his hand; but though he could not recapture\nit, he could remember it, as one remembers a vivid experience at some period of\none\u2019s life when one was in effect a different person.\n\n\u2018You see now,\u2019 said O\u2019Brien, \u2018that it is at any rate possible.\u2019\n\n\u2018Yes,\u2019 said Winston.\n\nO\u2019Brien stood up with a satisfied air. Over to his left Winston saw the man in\nthe white coat break an ampoule and draw back the plunger of a syringe. O\u2019Brien\nturned to Winston with a smile. In almost the old manner he resettled his\nspectacles on his nose.\n\n\u2018Do you remember writing in your diary,\u2019 he said, \u2018that it did not matter\nwhether I was a friend or an enemy, since I was at least a person who understood\nyou and could be talked to? You were right. I enjoy talking to you. Your mind\nappeals to me. It resembles my own mind except that you happen to be insane.\nBefore we bring the session to an end you can ask me a few questions, if you\nchoose.\u2019\n\n\u2018Any question I like?\u2019\n\n\u2018Anything.\u2019 He saw that Winston\u2019s eyes were upon the dial. \u2018It is switched off.\nWhat is your first question?\u2019\n\n\u2018What have you done with Julia?\u2019 said Winston.\n\nO\u2019Brien smiled again. \u2018She betrayed you, Winston. Immediately\u2014unreservedly. I\nhave seldom seen anyone come over to us so promptly. You would hardly recognize\nher if you saw her. All her rebelliousness, her deceit, her folly, her dirty-\nmindedness\u2014everything has been burned out of her.\n\nIt was a perfect conversion, a textbook case.\u2019\n\n\u2018You tortured her?\u2019\n\nO\u2019Brien left this unanswered. \u2018Next question,\u2019 he said.\n\n\u2018Does Big Brother exist?\u2019\n\n\u2018Of course he exists. The Party exists. Big Brother is the embodiment of the\nParty.\u2019\n\n\u2018Does he exist in the same way as I exist?\u2019\n\n\u2018You do not exist,\u2019 said O\u2019Brien.\n\nOnce again the sense of helplessness assailed him. He knew, or he could imagine,\nthe arguments which proved his own nonexistence; but they were nonsense, they\nwere only a play on words. Did not the statement, \u2018You do not exist\u2019, contain a\nlogical absurdity? But what use was it to say so? His mind shrivelled as he\nthought of the unanswerable, mad arguments with which O\u2019Brien would demolish\nhim.\n\n\u2018I think I exist,\u2019 he said wearily. \u2018I am conscious of my own identity. I was\nborn and I shall die. I have arms and legs. I occupy a particular point in\nspace. No other solid object can occupy the same point simultaneously. In that\nsense, does Big Brother exist?\u2019\n\n\u2018It is of no importance. He exists.\u2019\n\n\u2018Will Big Brother ever die?\u2019\n\n\u2018Of course not. How could he die? Next question.\u2019\n\n\u2018Does the Brotherhood exist?\u2019\n\n\u2018That, Winston, you will never know. If we choose to set you free when we have\nfinished with you, and if you live to be ninety years old, still you will never\nlearn whether the answer to that question is Yes or No. As long as you live it\nwill be an unsolved riddle in your mind.\u2019\n\nWinston lay silent. His breast rose and fell a little faster. He still had not\nasked the question that had come into his mind the first. He had got to ask it,\nand yet it was as though his tongue would not utter it. There was a trace of\namusement in O\u2019Brien\u2019s face. Even his spectacles seemed to wear an ironical\ngleam. He knows, thought Winston suddenly, he knows what I am going to ask! At\nthe thought the words burst out of him:\n\n\u2018What is in Room 101?\u2019\n\nThe expression on O\u2019Brien\u2019s face did not change. He answered drily:\n\n\u2018You know what is in Room 101, Winston. Everyone knows what is in Room 101.\u2019\n\nHe raised a finger to the man in the white coat. Evidently the session was at an\nend. A needle jerked into Winston\u2019s arm. He sank almost instantly into deep\nsleep.\n\nChapter 3\n\n\u2018There are three stages in your reintegration,\u2019 said O\u2019Brien. \u2018There is\nlearning, there is understanding, and there is acceptance. It is time for you to\nenter upon the second stage.\u2019\n\nAs always, Winston was lying flat on his back. But of late his bonds were\nlooser. They still held him to the bed, but he could move his knees a little and\ncould turn his head from side to side and raise his arms from the elbow. The\ndial, also, had grown to be less of a terror. He could evade its pangs if he was\nquick-witted enough: it was chiefly when he showed stupidity that O\u2019Brien pulled\nthe lever. Sometimes they got through a whole session without use of the dial.\nHe could not remember how many sessions there had been. The whole process seemed\nto stretch out over a long, indefinite time\u2014weeks, possibly\u2014and the intervals\nbetween the sessions might sometimes have been days, sometimes only an hour or\ntwo.\n\n\u2018As you lie there,\u2019 said O\u2019Brien, \u2018you have often wondered\u2014you have even asked\nme\u2014why the Ministry of Love should expend so much time and trouble on you. And\nwhen you were free you were puzzled by what was essentially the same question.\nYou could grasp the mechanics of the Society you lived in, but not its\nunderlying motives. Do you remember writing in your diary, \u2018I understand HOW: I\ndo not understand WHY\u2019? It was when you thought about\n\n\u2018why\u2019 that you doubted your own sanity. You have read THE BOOK, Goldstein\u2019s\nbook, or parts of it, at least. Did it tell you anything that you did not know\nalready?\u2019\n\n\u2018You have read it?\u2019 said Winston.\n\n\u2018I wrote it. That is to say, I collaborated in writing it. No book is produced\nindividually, as you know.\u2019\n\n\u2018Is it true, what it says?\u2019\n\n\u2018As description, yes. The programme it sets forth is nonsense. The secret\naccumulation of knowledge\u2014a gradual spread of enlightenment\u2014ultimately a\nproletarian rebellion\u2014the overthrow of the Party. You foresaw yourself that that\nwas what it would say. It is all nonsense. The proletarians will never revolt,\nnot in a thousand years or a million. They cannot. I do not have to tell you the\nreason: you know it already. If you have ever cherished any dreams of violent\ninsurrection, you must abandon them. There is no way in which the Party can be\noverthrown. The rule of the Party is for ever. Make that the starting-point of\nyour thoughts.\u2019\n\nHe came closer to the bed. \u2018For ever!\u2019 he repeated. \u2018And now let us get back to\nthe question of \u2018how\u2019 and \u2018why\u201d. You understand well enough HOW the Party\nmaintains itself in power. Now tell me WHY we cling to power. What is our\nmotive? Why should we want power? Go on, speak,\u2019 he added as Winston remained\nsilent.\n\nNevertheless Winston did not speak for another moment or two. A feeling of\nweariness had overwhelmed him. The faint, mad gleam of enthusiasm had come back\ninto O\u2019Brien\u2019s face. He knew in advance what O\u2019Brien would say. That the Party\ndid not seek power for its own ends, but onlyfor the good of the majority. That\nit sought power because men in the mass were frail, cowardly creatures who could\nnot endure liberty or face the truth, and must be ruled over and systematically\ndeceived by others who were stronger than themselves. That the choice for\nmankind lay between freedom and happiness, and that, for the great bulk of\nmankind, happiness was better. That the party was the eternal guardian of the\nweak, a dedicated sect doing evil that good might come, sacrificing its own\nhappiness to that of others. The terrible thing, thought Winston, the terrible\nthing was that when O\u2019Brien said this he would believe it. You could see it in\nhis face. O\u2019Brien knew everything. A thousand times better than Winston he knew\nwhat the world was really like, in what degradation the mass of human beings\nlived and by what lies and barbarities the Party kept them there. He had\nunderstood it all, weighed it all, and it made no difference: all was justified\nby the ultimate purpose. What can you do, thought Winston, against the lunatic\nwho is more intelligent than yourself, who gives your arguments a fair hearing\nand then simply persists in his lunacy?\n\n\u2018You are ruling over us for our own good,\u2019 he said feebly. \u2018You believe that\nhuman beings are not fit to govern themselves, and therefore\u2014\u2014\u2019\n\nHe started and almost cried out. A pang of pain had shot through his body.\nO\u2019Brien had pushed the lever of the dial up to thirty-five.\n\n\u2018That was stupid, Winston, stupid!\u2019 he said. \u2018You should know better than to say\na thing like that.\u2019\n\nHe pulled the lever back and continued:\n\n\u2018Now I will tell you the answer to my question. It is this. The Party seeks\npower entirely for its own sake. We are not interested in the good of others; we\nare interested solely in power. Not wealth or luxury or long life or happiness:\nonly power, pure power. What pure power means you will understand presently. We\nare different from all the oligarchies of the past, in that we know what we are\ndoing. All the others, even those who resembled ourselves, were cowards and\nhypocrites. The German Nazis and the Russian Communists came very close to us in\ntheir methods, but they never had the courage to recognize their own motives.\nThey pretended, perhaps they even believed, that they had seized power\nunwillingly and for a limited time, and that just round the corner there lay a\nparadise where human beings would be free and equal. We are not like that. We\nknow that no one ever seizes power with the intention of relinquishing it. Power\nis not a means, it is an end. One does not establish a dictatorship in order to\nsafeguard a revolution; one makes the revolution in order to establish the\ndictatorship. The object of persecution is persecution. The object of torture is\ntorture. The object of power is power. Now do you begin to understand me?\u2019\n\nWinston was struck, as he had been struck before, by the tiredness of O\u2019Brien\u2019s\nface. It was strong and fleshy and brutal, it was full of intelligence and a\nsort of controlled passion before which he felt himself helpless; but it was\ntired. There were pouches under the eyes, the skin sagged from the cheekbones.\nO\u2019Brien leaned over him, deliberately bringing the worn face nearer.\n\n\u2018You are thinking,\u2019 he said, \u2018that my face is old and tired. You are thinking\nthat I talk of power, and yet I am not even able to prevent the decay of my own\nbody. Can you not understand, Winston, that the individual is only a cell? The\nweariness of the cell is the vigour of the organism. Do you die when you cut\nyour fingernails?\u2019\n\nHe turned away from the bed and began strolling up and down again, one hand in\nhis pocket.\n\n\u2018We are the priests of power,\u2019 he said. \u2018God is power. But at present power is\nonly a word so far as you are concerned. It is time for you to gather some idea\nof what power means. The first thing you must realize is that power is\ncollective. The individual only has power in so far as he ceases to be an\nindividual. You know the Party slogan: \u2018Freedom is Slavery\u201d. Has it ever\noccurred to you that it is reversible? Slavery is freedom. Alone\u2014free\u2014the human\nbeing is always defeated. It must be so, because every human being is doomed to\ndie, which is the greatest of all failures. But if he can make complete, utter\nsubmission, if he can escape from his identity, if he can merge himself in the\nParty so that he IS the Party, then he is all-powerful and immortal. The second\nthing for you to realize is that power is power over human beings. Over the\nbody\u2014but, above all, over the mind. Power over matter\u2014external reality, as you\nwould call it\u2014is not important. Already our control over matter is absolute.\u2019\n\nFor a moment Winston ignored the dial. He made a violent effort to raise himself\ninto a sitting position, and merely succeeded in wrenching his body painfully.\n\n\u2018But how can you control matter?\u2019 he burst out. \u2018You don\u2019teven control the\nclimate or the law of gravity. And there are disease, pain, death\u2014\u2014\u2019\n\nO\u2019Brien silenced him by a movement of his hand. \u2018We control matter because we\ncontrol the mind. Reality is inside the skull. You will learn by degrees,\nWinston. There is nothing that we could not do. Invisibility,\nlevitation\u2014anything. I could float off this floor like a soap bubble if I wish\nto. I do not wish to, because the Party does not wish it. You must get rid of\nthose nineteenth-century ideas about the laws of Nature. We make the laws of\nNature.\u2019\n\n\u2018But you do not! You are not even masters of this planet. What about Eurasia and\nEastasia? You have not conquered them yet.\u2019\n\n\u2018Unimportant. We shall conquer them when it suits us. And if we did not, what\ndifference would it make? We can shut them out of existence. Oceania is the\nworld.\u2019\n\n\u2018But the world itself is only a speck of dust. And man is tiny\u2014helpless! How\nlong has he been in existence? For millions of years the earth was uninhabited.\u2019\n\n\u2018Nonsense. The earth is as old as we are, no older. How could it be older?\nNothing exists except through human consciousness.\u2019\n\n\u2018But the rocks are full of the bones of extinct animals\u2014 mammoths and mastodons\nand enormous reptiles which lived here long before man was ever heard of.\u2019\n\n\u2018Have you ever seen those bones, Winston? Of course not. Nineteenth-century\nbiologists invented them. Before man there was nothing. After man, if he could\ncome to an end, there would be nothing. Outside man there is nothing.\u2019\n\n\u2018But the whole universe is outside us. Look at the stars! Some of them are a\nmillion light-years away. They are out of our reach for ever.\u2019\n\n\u2018What are the stars?\u2019 said O\u2019Brien indifferently. \u2018They are bits of fire a few\nkilometres away. We could reach them if we wanted to. Or we could blot them out.\nThe earth is the centre of the universe. The sun and the stars go round it.\u2019\n\nWinston made another convulsive movement. This time he did not say anything.\nO\u2019Brien continued as though answering a spoken objection:\n\n\u2018For certain purposes, of course, that is not true. When we navigate the ocean,\nor when we predict an eclipse, we often find it convenient to assume that the\nearth goes round the sun and that the stars are millions upon millions of\nkilometres away. But what of it? Do you suppose it is beyond us to produce a\ndual system of astronomy? The stars can be near or distant, according as we need\nthem. Do you suppose our mathematicians are unequal to that? Have you forgotten\ndoublethink?\u2019\n\nWinston shrank back upon the bed. Whatever he said, the swift answer crushed him\nlike a bludgeon. And yet he knew, he KNEW, that he was in the right. The belief\nthat nothing exists outside your own mind\u2014surely there must be some way of\ndemonstrating that it was false? Had it not been exposed long ago as a fallacy?\nThere was even a name for it, which he had forgotten. A faint smile twitched the\ncorners of O\u2019Brien\u2019s mouth as he looked down at him.\n\n\u2018I told you, Winston,\u2019 he said, \u2018that metaphysics is not your strong point. The\nword you are trying to think of issolipsism. But you are mistaken. This is not\nsolipsism. Collective solipsism, if you like. But that is a different thing: in\nfact, the opposite thing. All this is a digression,\u2019 he added in a different\ntone. \u2018The real power, the power we have to fight for night and day, is not\npower over things, but over men.\u2019 He paused, and for a moment assumed again his\nair of a schoolmaster questioning a promising pupil: \u2018How does one man assert\nhis power over another, Winston?\u2019\n\nWinston thought. \u2018By making him suffer,\u2019 he said.\n\n\u2018Exactly. By making him suffer. Obedience is not enough. Unless he is suffering,\nhow can you be sure that he is obeying your will and not his own? Power is in\ninflicting pain and humiliation. Power is in tearing human minds to pieces and\nputting them together again in new shapes of your own choosing. Do you begin to\nsee, then, what kind of world we are creating? It is the exact opposite of the\nstupid hedonistic Utopias that the old reformers imagined. A world of fear and\ntreachery and torment, a world of trampling and being trampled upon, a world\nwhich will grow not less but MORE merciless as it refines itself. Progress in\nour world will be progress towards more pain. The old civilizations claimed that\nthey were founded on love or justice. Ours is founded upon hatred. In our world\nthere will be no emotions except fear, rage, triumph, and self-abasement.\nEverything else we shall destroy\u2014everything. Already we are breaking down the\nhabits of thought which have survived from before the Revolution. We have cut\nthe links between child and parent, and between man and man, and between man and\nwoman. No one dares trust a wife or a child or a friendany longer. But in the\nfuture there will be no wives and no friends. Children will be taken from their\nmothers at birth, as one takes eggs from a hen. The sex instinct will be\neradicated. Procreation will be an annual formality like the renewal of a ration\ncard. We shall abolish the orgasm. Our neurologists are at work upon it now.\nThere will be no loyalty, except loyalty towards the Party. There will be no\nlove, except the love of Big Brother. There will be no laughter, except the\nlaugh of triumph over a defeated enemy. There will be no art, no literature, no\nscience. When we are omnipotent we shall have no more need of science. There\nwill be no distinction between beauty and ugliness. There will be no curiosity,\nno enjoyment of the process of life. All competing pleasures will be destroyed.\nBut always\u2014do not forget this, Winston\u2014always there will be the intoxication of\npower, constantly increasing and constantly growing subtler. Always, at every\nmoment, there will be the thrill of victory, the sensation of trampling on an\nenemy who is helpless. If you want a picture of the future, imagine a boot\nstamping on a human face\u2014for ever.\u2019\n\nHe paused as though he expected Winston to speak. Winston had tried to shrink\nback into the surface of the bed again. He could not say anything. His heart\nseemed to be frozen. O\u2019Brien went on:\n\n\u2018And remember that it is for ever. The face will always be there to be stamped\nupon. The heretic, the enemy of society, will always be there, so that he can be\ndefeated and humiliated over again. Everything that you have undergone since you\nhave been in our hands\u2014all that will continue,\n\nand worse. The espionage, the betrayals, the arrests, the tortures, the\nexecutions, the disappearances will never cease. It will be a world of terror as\nmuch as a world of triumph. The more the Party is powerful, the less it will be\ntolerant: the weaker the opposition, the tighter the despotism. Goldstein and\nhis heresies will live for ever. Every day, at every moment, they will be\ndefeated, discredited, ridiculed, spat upon and yet they will always survive.\nThis drama that I have played out with you during seven years will be played out\nover and over again generation after generation, always in subtler forms. Always\nwe shall have the heretic here at our mercy, screaming with pain, broken up,\ncontemptible\u2014and in the end utterly penitent, saved from himself, crawling to\nour feet of his own accord. That is the world that we are preparing, Winston. A\nworld of victory after victory, triumph after triumph after triumph: an endless\npressing, pressing, pressing upon the nerve of power. You are beginning, I can\nsee, to realize what that world will be like. But in the end you will do more\nthan understand it. You will accept it, welcome it, become part of it.\u2019\n\nWinston had recovered himself sufficiently to speak. \u2018You can\u2019t!\u2019 he said\nweakly.\n\n\u2018What do you mean by that remark, Winston?\u2019\n\n\u2018You could not create such a world as you have just described. It is a dream. It\nis impossible.\u2019\n\n\u2018Why?\u2019\n\n\u2018It is impossible to found a civilization on fear and hatred and cruelty. It\nwould never endure.\u2019\n\n\u2018Why not?\u2019\n\n\u2018It would have no vitality. It would disintegrate. It would commit suicide.\u2019\n\n\u2018Nonsense. You are under the impression that hatred is more exhausting than\nlove. Why should it be? And if it were, what difference would that make? Suppose\nthat we choose to wear ourselves out faster. Suppose that we quicken the tempo\nof human life till men are senile at thirty. Still what difference would it\nmake? Can you not understand that the death of the individual is not death? The\nparty is immortal.\u2019\n\nAs usual, the voice had battered Winston into helplessness. Moreover he was in\ndread that if he persisted in his disagreement O\u2019Brien would twist the dial\nagain. And yet he could not keep silent. Feebly, without arguments, with nothing\nto support him except his inarticulate horror of what O\u2019Brien had said, he\nreturned to the attack.\n\n\u2018I don\u2019t know\u2014I don\u2019t care. Somehow you will fail. Something will defeat you.\nLife will defeat you.\u2019\n\n\u2018We control life, Winston, at all its levels. You are imagining that there is\nsomething called human nature which will be outraged by what we do and will turn\nagainst us. But we create human nature. Men are infinitely malleable. Or perhaps\nyou have returned to your old idea that the proletarians or the slaves will\narise and overthrow us. Put it out of your mind. They are helpless, like the\nanimals. Humanity is the Party. The others are outside\u2014irrelevant.\u2019\n\n\u2018I don\u2019t care. In the end they will beat you. Sooner or later they will see you\nfor what you are, and then they will tear you to pieces.\u2019\n\n\u2018Do you see any evidence that that is happening? Or any reason why it should?\u2019\n\n\u2018No. I believe it. I KNOW that you will fail. There is something in the\nuniverse\u2014I don\u2019t know, some spirit, some principle\u2014that you will never\novercome.\u2019\n\n\u2018Do you believe in God, Winston?\u2019\n\n\u2018No.\u2019\n\n\u2018Then what is it, this principle that will defeat us?\u2019\n\n\u2018I don\u2019t know. The spirit of Man.\u2019\n\n\u2018And do you consider yourself a man?\u2019\n\n\u2018Yes.\u2019\n\n\u2018If you are a man, Winston, you are the last man. Your kind is extinct; we are\nthe inheritors. Do you understand that you are ALONE? You are outside history,\nyou are nonexistent.\u2019 His manner changed and he said more harshly: \u2018And you\nconsider yourself morally superior to us, with our lies and our cruelty?\u2019\n\n\u2018Yes, I consider myself superior.\u2019\n\nO\u2019Brien did not speak. Two other voices were speaking. After a moment Winston\nrecognized one of them as his own. It was a sound-track of the conversation he\nhad had with O\u2019Brien, on the night when he had enrolled himself in the\nBrotherhood. He heard himself promising to lie, to steal, to forge, to murder,\nto encourage drug-taking and prostitution, to disseminate venereal diseases, to\nthrow vitriol in a child\u2019s face. O\u2019Brien made a small impatient gesture, as\nthough to say that the demonstration was hardly worth making. Then he turned a\nswitch and the voices stopped.\n\n\u2018Get up from that bed,\u2019 he said.\n\nThe bonds had loosened themselves. Winston lowered himself to the floor and\nstood up unsteadily.\n\n\u2018You are the last man,\u2019 said O\u2019Brien. \u2018You are the guardian of the human spirit.\nYou shall see yourself as you are. Take off your clothes.\u2019\n\nWinston undid the bit of string that held his overalls together. The zip\nfastener had long since been wrenched out of them. He could not remember whether\nat any time since his arrest he had taken off all his clothes at one time.\nBeneath the overalls his body was looped with filthy yellowish rags, just\nrecognizable as the remnants of underclothes. As he slid them to the ground he\nsaw that there was a three-sided mirror at the far end of the room. He\napproached it, then stopped short. An involuntary cry had broken out of him.\n\n\u2018Go on,\u2019 said O\u2019Brien. \u2018Stand between the wings of the mirror. You shall see the\nside view as well.\u2019\n\nHe had stopped because he was frightened. A bowed, grey-coloured, skeleton-like\nthing was coming towards him. Its actual appearance was frightening, and not\nmerely the fact that he knew it to be himself. He moved closer to the glass. The\ncreature\u2019s face seemed to be protruded, because of its bent carriage. A forlorn,\njailbird\u2019s face with a nobby forehead running back into a bald scalp, a crooked\nnose, and battered-looking cheekbones above which his eyes were fierce and\nwatchful. The cheeks were seamed, the mouth had a drawn-in look. Certainly it\nwas his own face, but it seemed to him that it had changed more than he had\nchanged inside. The emotions it registered would be different from the ones he\nfelt. He had gone partially bald. For thefirst moment he had thought that he had\ngone grey as well, but it was only the scalp that was grey. Except for his hands\nand a circle of his face, his body was grey all over with ancient, ingrained\ndirt. Here and there under the dirt there were the red scars of wounds, and near\nthe ankle the varicose ulcer was an inflamed mass with flakes of skin peeling\noff it. But the truly frightening thing was the emaciation of his body. The\nbarrel of the ribs was as narrow as that of a skeleton: the legs had shrunk so\nthat the knees were thicker than the thighs. He saw now what O\u2019Brien had meant\nabout seeing the side view. The curvature of the spine was astonishing. The thin\nshoulders were hunched forward so as to make a cavity of the chest, the scraggy\nneck seemed to be bending double under the weight of the skull. At a guess he\nwould have said that it was the body of a man of sixty, suffering from some\nmalignant disease.\n\n\u2018You have thought sometimes,\u2019 said O\u2019Brien, \u2018that my face\u2014the face of a member\nof the Inner Party\u2014looks old and worn. What do you think of your own face?\u2019\n\nHe seized Winston\u2019s shoulder and spun him round so that he was facing him.\n\n\u2018Look at the condition you are in!\u2019 he said. \u2018Look at this filthy grime all over\nyour body. Look at the dirt between your toes. Look at that disgusting running\nsore on your leg. Do you know that you stink like a goat? Probably you have\nceased to notice it. Look at your emaciation. Do you see? I can make my thumb\nand forefinger meet round your bicep. I could snap your neck like a carrot. Do\nyou know that you have lost twenty-five kilograms since you have been in\nourhands? Even your hair is coming out in handfuls. Look!\u2019 He plucked at\nWinston\u2019s head and brought away a tuft of hair. \u2018Open your mouth. Nine, ten,\neleven teeth left. How many had you when you came to us? And the few you have\nleft are dropping out of your head. Look here!\u2019\n\nHe seized one of Winston\u2019s remaining front teeth between his powerful thumb and\nforefinger. A twinge of pain shot through Winston\u2019s jaw. O\u2019Brien had wrenched\nthe loose tooth out by the roots. He tossed it across the cell.\n\n\u2018You are rotting away,\u2019 he said; \u2018you are falling to pieces. What are you? A bag\nof filth. Now turn around and look into that mirror again. Do you see that thing\nfacing you? That is the last man. If you are human, that is humanity. Now put\nyour clothes on again.\u2019\n\nWinston began to dress himself with slow stiff movements. Until now he had not\nseemed to notice how thin and weak he was. Only one thought stirred in his mind:\nthat he must have been in this place longer than he had imagined. Then suddenly\nas he fixed the miserable rags round himself a feeling of pity for his ruined\nbody overcame him. Before he knew what he was doing he had collapsed on to a\nsmall stool that stood beside the bed and burst into tears. He was aware of his\nugliness, his gracelessness, a bundle of bones in filthy underclothes sitting\nweeping in the harsh white light: but he could not stop himself. O\u2019Brien laid a\nhand on his shoulder, almost kindly.\n\n\u2018It will not last for ever,\u2019 he said. \u2018You can escape from it whenever you\nchoose. Everything depends on yourself.\u2019\n\n\u2018You did it!\u2019 sobbed Winston. \u2018You reduced me to thisstate.\u2019\n\n\u2018No, Winston, you reduced yourself to it. This is what you accepted when you set\nyourself up against the Party. It was all contained in that first act. Nothing\nhas happened that you did not foresee.\u2019\n\nHe paused, and then went on:\n\n\u2018We have beaten you, Winston. We have broken you up. You have seen what your\nbody is like. Your mind is in the same state. I do not think there can be much\npride left in you. You have been kicked and flogged and insulted, you have\nscreamed with pain, you have rolled on the floor in your own blood and vomit.\nYou have whimpered for mercy, you have betrayed everybody and everything. Can\nyou think of a single degradation that has not happened to you?\u2019\n\nWinston had stopped weeping, though the tears were still oozing out of his eyes.\nHe looked up at O\u2019Brien.\n\n\u2018I have not betrayed Julia,\u2019 he said.\n\nO\u2019Brien looked down at him thoughtfully. \u2018No,\u2019 he said; \u2018no; that is perfectly\ntrue. You have not betrayed Julia.\u2019\n\nThe peculiar reverence for O\u2019Brien, which nothing seemed able to destroy,\nflooded Winston\u2019s heart again. How intelligent, he thought, how intelligent!\nNever did O\u2019Brien fail to understand what was said to him. Anyone else on earth\nwould have answered promptly that he HAD betrayed Julia. For what was there that\nthey had not screwed out of him under the torture? He had told them everything\nhe knew about her, her habits, her character, her past life; he had confessed in\nthe most trivial detail everything that had happened at their meetings, all that\nhe had said to herand she to him, their black-market meals, their adulteries,\ntheir vague plottings against the Party\u2014everything. And yet, in the sense in\nwhich he intended the word, he had not betrayed her. He had not stopped loving\nher; his feelings towards her had remained the same. O\u2019Brien had seen what he\nmeant without the need for explanation.\n\n\u2018Tell me,\u2019 he said, \u2018how soon will they shoot me?\u2019\n\n\u2018It might be a long time,\u2019 said O\u2019Brien. \u2018You are a difficult case. But don\u2019t\ngive up hope. Everyone is cured sooner or later. In the end we shall shoot you.\u2019\n\nChapter 4\n\nH     e was much better. He was growing fatter and strongerevery day, if it was proper to speak of days.\n\nThe white light and the humming sound were the same as ever, but the cell was a\nlittle more comfortable than the others he had been in. There was a pillow and a\nmattress on the plank bed, and a stool to sit on. They had given him a bath, and\nthey allowed him to wash himself fairly frequently in a tin basin. They even\ngave him warm water to wash with. They had given him new underclothes and a\nclean suit of overalls. They had dressed his varicose ulcer with soothing\nointment. They had pulled out the remnants of his teeth and given him a new set\nof dentures.\n\nWeeks or months must have passed. It would have been possible now to keep count\nof the passage of time, if he had felt any interest in doing so, since he was\nbeing fed at what appeared to be regular intervals. He was getting, he judged,\nthree meals in the twenty-four hours; sometimes he wondered dimly whether he was\ngetting them by night or by day. The food was surprisingly good, with meat at\nevery third meal. Once there was even a packet of cigarettes. He had no matches,\nbut the never-speaking guard who brought his food would give him a light. The\nfirst time he tried to smoke it made him sick, but he persevered, and spun the\npacket out for a long time, smoking half a cigarette after each meal.\n\nThey had given him a white slate with a stump of pencil tied to the corner. At\nfirst he made no use of it. Even when he was awake he was completely torpid.\nOften he would lie from one meal to the next almost without stirring, sometimes\nasleep, sometimes waking into vague reveries in which it was too much trouble to\nopen his eyes. He had long grown used to sleeping with a strong light on his\nface. It seemed to make no difference, except that one\u2019s dreams were more\ncoherent. He dreamed a great deal all through this time, and they were always\nhappy dreams. He was in the Golden Country, or he was sitting among enormous\nglorious, sunlit ruins, with his mother, with Julia, with O\u2019Brien\u2014not doing\nanything, merely sitting in the sun, talking of peaceful things. Such thoughts\nas he had when he was awake were mostly about his dreams. He seemed to have lost\nthe power of intellectual effort, now that the stimulus of pain had been\nremoved. He was not bored, he had no desire for conversation or distraction.\nMerely to be alone, not to be beaten or questioned, to have enough to eat, and\nto be clean all over, was completely satisfying.\n\nBy degrees he came to spend less time in sleep, but he still felt no impulse to\nget off the bed. All he cared for was to lie quiet and feel the strength\ngathering in his body. He would finger himself here and there, trying to make\nsure that it was not an illusion that his muscles were growing rounder and his\nskin tauter. Finally it was established beyond a doubt that he was growing\nfatter; his thighs were now definitely thicker than his knees. After that,\nreluctantly at first, he began exercising himself regularly. In a little while\nhecould walk three kilometres, measured by pacing the cell, and his bowed\nshoulders were growing straighter. He attempted more elaborate exercises, and\nwas astonished and humiliated to find what things he could not do. He could not\nmove out of a walk, he could not hold his stool out at arm\u2019s length, he could\nnot stand on one leg without falling over. He squatted down on his heels, and\nfound that with agonizing pains in thigh and calf he could just lift himself to\na standing position. He lay flat on his belly and tried to lift his weight by\nhis hands. It was hopeless, he could not raise himself a centimetre. But after a\nfew more days\u2014a few more mealtimes\u2014even that feat was accomplished. A time came\nwhen he could do it six times running. He began to grow actually proud of his\nbody, and to cherish an intermittent belief that his face also was growing back\nto normal. Only when he chanced to put his hand on his bald scalp did he\nremember the seamed, ruined face that had looked back at him out of the mirror.\n\nHis mind grew more active. He sat down on the plank bed, his back against the\nwall and the slate on his knees, and set to work deliberately at the task of re-\neducating himself.\n\nHe had capitulated, that was agreed. In reality, as he saw now, he had been\nready to capitulate long before he had taken the decision. From the moment when\nhe was inside the Ministry of Love\u2014and yes, even during those minutes when he\nand Julia had stood helpless while the iron voice from the telescreen told them\nwhat to do\u2014he had grasped the frivolity, the shallowness of his attempt to set\nhimselfup against the power of the Party. He knew now that for seven years the\nThought Police had watched him like a beetle under a magnifying glass. There was\nno physical act, no word spoken aloud, that they had not noticed, no train of\nthought that they had not been able to infer. Even the speck of whitish dust on\nthe cover of his diary they had carefully replaced. They had played sound-tracks\nto him, shown him photographs. Some of them were photographs of Julia and\nhimself. Yes, even... He could not fight against the Party any longer. Besides,\nthe Party was in the right. It must be so; how could the immortal, collective\nbrain be mistaken? By what external standard could you check its judgements?\nSanity was statistical. It was merely a question of learning to think as they\nthought. Only\u2014\u2014!\n\nThe pencil felt thick and awkward in his fingers. He began to write down the\nthoughts that came into his head. He wrote first in large clumsy capitals:\n\nFREEDOM IS SLAVERY\n\nThen almost without a pause he wrote beneath it:\n\nTWO AND TWO MAKE FIVE\n\nBut then there came a sort of check. His mind, as though shying away from\nsomething, seemed unable to concentrate. He knew that he knew what came next,\nbut for the moment he could not recall it. When he did recall it, it was only by\nconsciously reasoning out what it must be: it did notcome of its own accord. He\nwrote:\n\nGOD IS POWER\n\nHe accepted everything. The past was alterable. The past never had been altered.\nOceania was at war with Eastasia. Oceania had always been at war with Eastasia.\nJones, Aaronson, and Rutherford were guilty of the crimes they were charged\nwith. He had never seen the photograph that disproved their guilt. It had never\nexisted, he had invented it. He remembered remembering contrary things, but\nthose were false memories, products of self-deception. How easy it all was! Only\nsurrender, and everything else followed. It was like swimming against a current\nthat swept you backwards however hard you struggled, and then suddenly deciding\nto turn round and go with the current instead of opposing it. Nothing had\nchanged except your own attitude: the predestined thing happened in any case. He\nhardly knew why he had ever rebelled. Everything was easy, except\u2014\u2014!\n\nAnything could be true. The so-called laws of Nature were nonsense. The law of\ngravity was nonsense. \u2018If I wished,\u2019 O\u2019Brien had said, \u2018I could float off this\nfloor like a soap bubble.\u2019 Winston worked it out. \u2018If he THINKS he floats off\nthe floor, and if I simultaneously THINK I see him do it, then the thing\nhappens.\u2019 Suddenly, like a lump of submerged wreckage breaking the surface of\nwater, the thought burst into his mind: \u2018It doesn\u2019t really happen. We imagine\nit. It is hallucination.\u2019 He pushed the thought under instantly. The fallacy was\nobvious. It presupposed thatsomewhere or other, outside oneself, there was a\n\u2018real\u2019 world where \u2018real\u2019 things happened. But how could there be such a world?\nWhat knowledge have we of anything, save through our own minds? All happenings\nare in the mind. Whatever happens in all minds, truly happens.\n\nHe had no difficulty in disposing of the fallacy, and he was in no danger of\nsuccumbing to it. He realized, nevertheless, that it ought never to have\noccurred to him. The mind should develop a blind spot whenever a dangerous\nthought presented itself. The process should be automatic, instinctive.\nCRIMESTOP, they called it in Newspeak.\n\nHe set to work to exercise himself in crimestop. He presented himself with\npropositions\u2014\u2019the Party says the earth is flat\u2019, \u2018the party says that ice is\nheavier than water\u2019\u2014and trained himself in not seeing or not understanding the\narguments that contradicted them. It was not easy. It needed great powers of\nreasoning and improvisation. The arithmetical problems raised, for instance, by\nsuch a statement as \u2018two and two make five\u2019 were beyond his intellectual grasp.\nIt needed also a sort of athleticism of mind, an ability at one moment to make\nthe most delicate use of logic and at the next to be unconscious of the crudest\nlogical errors. Stupidity was as necessary as intelligence, and as difficult to\nattain.\n\nAll the while, with one part of his mind, he wondered how soon they would shoot\nhim. \u2018Everything depends on yourself,\u2019 O\u2019Brien had said; but he knew that there\nwas no conscious act by which he could bring it nearer. It might be ten minutes\nhence, or ten years. They might keep himfor years in solitary confinement, they\nmight send him to a labour-camp, they might release him for a while, as they\nsometimes did. It was perfectly possible that before he was shot the whole drama\nof his arrest and interrogation would be enacted all over again. The one certain\nthing was that death never came at an expected moment. The tradition\u2014 the\nunspoken tradition: somehow you knew it, though you never heard it said\u2014was that\nthey shot you from behind; always in the back of the head, without warning, as\nyou walked down a corridor from cell to cell.\n\nOne day\u2014but \u2018one day\u2019 was not the right expression; just as probably it was in\nthe middle of the night: once\u2014he fell into a strange, blissful reverie. He was\nwalking down the corridor, waiting for the bullet. He knew that it was coming in\nanother moment. Everything was settled, smoothed out, reconciled. There were no\nmore doubts, no more arguments, no more pain, no more fear. His body was healthy\nand strong. He walked easily, with a joy of movement and with a feeling of\nwalking in sunlight. He was not any longer in the narrow white corridors in the\nMinistry of Love, he was in the enormous sunlit passage, a kilometre wide, down\nwhich he had seemed to walk in the delirium induced by drugs. He was in the\nGolden Country, following the foottrack across the old rabbit-cropped pasture.\nHe could feel the short springy turf under his feet and the gentle sunshine on\nhis face. At the edge of the field were the elm trees, faintly stirring, and\nsomewhere beyond that was the stream where the dace lay in the green pools under\nthe willows.\n\nSuddenly he started up with a shock of horror. Thesweat broke out on his backbone. He had heard himself cry aloud:\n\n\u2018Julia! Julia! Julia, my love! Julia!\u2019\n\nFor a moment he had had an overwhelming hallucination of her presence. She had\nseemed to be not merely with him, but inside him. It was as though she had got\ninto the texture of his skin. In that moment he had loved her far more than he\nhad ever done when they were together and free. Also he knew that somewhere or\nother she was still alive and needed his help.\n\nHe lay back on the bed and tried to compose himself. What had he done? How many\nyears had he added to his servitude by that moment of weakness?\n\nIn another moment he would hear the tramp of boots outside. They could not let\nsuch an outburst go unpunished. They would know now, if they had not known\nbefore, that he was breaking the agreement he had made with them. He obeyed the\nParty, but he still hated the Party. In the old days he had hidden a heretical\nmind beneath an appearance of conformity. Now he had retreated a step further:\nin the mind he had surrendered, but he had hoped to keep the inner heart\ninviolate. He knew that he was in the wrong, but he preferred to be in the\nwrong. They would understand that\u2014O\u2019Brien would understand it. It was all\nconfessed in that single foolish cry.\n\nHe would have to start all over again. It might take years. He ran a hand over\nhis face, trying to familiarize himself with the new shape. There were deep\nfurrows in the cheeks, the cheekbones felt sharp, the nose flattened. Besides,\nsincelast seeing himself in the glass he had been given a complete new set of\nteeth. It was not easy to preserve inscrutability when you did not know what\nyour face looked like. In any case, mere control of the features was not enough.\nFor the first time he perceived that if you want to keep a secret you must also\nhide it from yourself. You must know all the while that it is there, but until\nit is needed you must never let it emerge into your consciousness in any shape\nthat could be given a name. From now onwards he must not only think right; he\nmust feel right, dream right. And all the while he must keep his hatred locked\nup inside him like a ball of matter which was part of himself and yet\nunconnected with the rest of him, a kind of cyst.\n\nOne day they would decide to shoot him. You could not tell when it would happen,\nbut a few seconds beforehand it should be possible to guess. It was always from\nbehind, walking down a corridor. Ten seconds would be enough. In that time the\nworld in
