 a hundred metres away.\u2019\n\n\u2018What is your name?\u2019 said Winston.\n\n\u2018Julia. I know yours. It\u2019s Winston\u2014Winston Smith.\u2019\n\n\u2018How did you find that out?\u2019\n\n\u2018I expect I\u2019m better at finding things out than you are, dear. Tell me, what did\nyou think of me before that day I gave you the note?\u2019\n\nHe did not feel any temptation to tell lies to her. It was even a sort of love-\noffering to start off by telling the worst.\n\n\u2018I hated the sight of you,\u2019 he said. \u2018I wanted to rape you and then murder you\nafterwards. Two weeks ago I thought seriously of smashing your head in with a\ncobblestone. If you really want to know, I imagined that you had something to do\nwith the Thought Police.\u2019\n\nThe girl laughed delightedly, evidently taking this as a tribute to the\nexcellence of her disguise.\n\n\u2018Not the Thought Police! You didn\u2019t honestly think that?\u2019\n\n\u2018Well, perhaps not exactly that. But from your general appearance\u2014merely because\nyou\u2019re young and fresh and healthy, you understand\u2014I thought that probably\u2014\u2014\u2019\n\n\u2018You thought I was a good Party member. Pure in word and deed. Banners,\nprocessions, slogans, games, community hikes all that stuff. And you thought\nthat if I had a quarter of a chance I\u2019d denounce you as a thought-criminaland\nget you killed off?\u2019\n\n\u2018Yes, something of that kind. A great many young girls are like that, you know.\u2019\n\n\u2018It\u2019s this bloody thing that does it,\u2019 she said, ripping off the scarlet sash of\nthe Junior Anti-Sex League and flinging it on to a bough. Then, as though\ntouching her waist had reminded her of something, she felt in the pocket of her\noveralls and produced a small slab of chocolate. She broke it in half and gave\none of the pieces to Winston. Even before he had taken it he knew by the smell\nthat it was very unusual chocolate. It was dark and shiny, and was wrapped in\nsilver paper. Chocolate normally was dull-brown crumbly stuff that tasted, as\nnearly as one could describe it, like the smoke of a rubbish fire. But at some\ntime or another he had tasted chocolate like the piece she had given him. The\nfirst whiff of its scent had stirred up some memory which he could not pin down,\nbut which was powerful and troubling.\n\n\u2018Where did you get this stuff?\u2019 he said.\n\n\u2018Black market,\u2019 she said indifferently. \u2018Actually I am that sort of girl, to\nlook at. I\u2019m good at games. I was a troop-leader in the Spies. I do voluntary\nwork three evenings a week for the Junior Anti-Sex League. Hours and hours I\u2019ve\nspent pasting their bloody rot all over London. I always carry one end of a\nbanner in the processions. I always Iook cheerful and I never shirk anything.\nAlways yell with the crowd, that\u2019s what I say. It\u2019s the only way to be safe.\u2019\n\nThe first fragment of chocolate had melted on Winston\u2019s tongue. The taste was\ndelightful. But there was stillthat memory moving round the edges of his\nconsciousness, something strongly felt but not reducible to definite shape, like\nan object seen out of the corner of one\u2019s eye. He pushed it away from him, aware\nonly that it was the memory of some action which he would have liked to undo but\ncould not.\n\n\u2018You are very young,\u2019 he said. \u2018You are ten or fifteen years younger than I am.\nWhat could you see to attract you in a man like me?\u2019\n\n\u2018It was something in your face. I thought I\u2019d take a chance. I\u2019m good at\nspotting people who don\u2019t belong. As soon as I saw you I knew you were against\nTHEM.\u2019\n\nTHEM, it appeared, meant the Party, and above all the Inner Party, about whom\nshe talked with an open jeering hatred which made Winston feel uneasy, although\nhe knew that they were safe here if they could be safe anywhere. A thing that\nastonished him about her was the coarseness of her language. Party members were\nsupposed not to swear, and Winston himself very seldom did swear, aloud, at any\nrate. Julia, however, seemed unable to mention the Party, and especially the\nInner Party, without using the kind of words that you saw chalked up in dripping\nalley-ways. He did not dislike it. It was merely one symptom of her revolt\nagainst the Party and all its ways, and somehow it seemed natural and healthy,\nlike the sneeze of a horse that smells bad hay. They had left the clearing and\nwere wandering again through the chequered shade, with their arms round each\nother\u2019s waists whenever it was wide enough to walk two abreast. He noticed how\nmuch softer her waist seemedto feel now that the sash was gone. They did not\nspeak above a whisper. Outside the clearing, Julia said, it was better to go\nquietly. Presently they had reached the edge of the little wood. She stopped\nhim.\n\n\u2018Don\u2019t go out into the open. There might be someone watching. We\u2019re all right if\nwe keep behind the boughs.\u2019\n\nThey were standing in the shade of hazel bushes. The sunlight, filtering through\ninnumerable leaves, was still hot on their faces. Winston looked out into the\nfield beyond, and underwent a curious, slow shock of recognition. He knew it by\nsight. An old, closebitten pasture, with a footpath wandering across it and a\nmolehill here and there. In the ragged hedge on the opposite side the boughs of\nthe elm trees swayed just perceptibly in the breeze, and their leaves stirred\nfaintly in dense masses like women\u2019s hair. Surely somewhere nearby, but out of\nsight, there must be a stream with green pools where dace were swimming?\n\n\u2018Isn\u2019t there a stream somewhere near here?\u2019 he whispered.\n\n\u2018That\u2019s right, there is a stream. It\u2019s at the edge of the next field, actually.\nThere are fish in it, great big ones. You can watch them lying in the pools\nunder the willow trees, waving their tails.\u2019\n\n\u2018It\u2019s the Golden Country\u2014almost,\u2019 he murmured.\n\n\u2018The Golden Country?\u2019\n\n\u2018It\u2019s nothing, really. A landscape I\u2019ve seen sometimes in a dream.\u2019\n\n\u2018Look!\u2019 whispered Julia.\n\nA thrush had alighted on a bough not five metres away,\n\nalmost at the level of their faces. Perhaps it had not seen them. It was in the\nsun, they in the shade. It spread out its wings, fitted them carefully into\nplace again, ducked its head for a moment, as though making a sort of obeisance\nto the sun, and then began to pour forth a torrent of song. In the afternoon\nhush the volume of sound was startling. Winston and Julia clung together,\nfascinated. The music went on and on, minute after minute, with astonishing\nvariations, never once repeating itself, almost as though the bird were\ndeliberately showing off its virtuosity. Sometimes it stopped for a few seconds,\nspread out and resettled its wings, then swelled its speckled breast and again\nburst into song. Winston watched it with a sort of vague reverence. For whom,\nfor what, was that bird singing? No mate, no rival was watching it. What made it\nsit at the edge of the lonely wood and pour its music into nothingness? He\nwondered whether after all there was a microphone hidden somewhere near. He and\nJulia had spoken only in low whispers, and it would not pick up what they had\nsaid, but it would pick up the thrush. Perhaps at the other end of the\ninstrument some small, beetle-like man was listening intently\u2014listening to that.\nBut by degrees the flood of music drove all speculations out of his mind. It was\nas though it were a kind of liquid stuff that poured all over him and got mixed\nup with the sunlight that filtered through the leaves. He stopped thinking and\nmerely felt. The girl\u2019s waist in the bend of his arm was soft and warm. He\npulled her round so that they were breast to breast; her body seemed to melt\ninto his. Wherever his hands moved it was all as yielding as water. Their\nmouthsclung together; it was quite different from the hard kisses they had\nexchanged earlier. When they moved their faces apart again both of them sighed\ndeeply. The bird took fright and fled with a clatter of wings.\n\nWinston put his lips against her ear. \u2018NOW,\u2019 he whispered.\n\n\u2018Not here,\u2019 she whispered back. \u2018Come back to the hideout. It\u2019s safer.\u2019\n\nQuickly, with an occasional crackle of twigs, they threaded their way back to\nthe clearing. When they were once inside the ring of saplings she turned and\nfaced him. They were both breathing fast, but the smile had reappeared round the\ncorners of her mouth. She stood looking at him for an instant, then felt at the\nzipper of her overalls. And, yes! it was almost as in his dream. Almost as\nswiftly as he had imagined it, she had torn her clothes off, and when she flung\nthem aside it was with that same magnificent gesture by which a whole\ncivilization seemed to be annihilated. Her body gleamed white in the sun. But\nfor a moment he did not look at her body; his eyes were anchored by the freckled\nface with its faint, bold smile. He knelt down before her and took her hands in\nhis.\n\n\u2018Have you done this before?\u2019\n\n\u2018Of course. Hundreds of times\u2014well, scores of times, anyway.\u2019\n\n\u2018With Party members?\u2019\n\n\u2018Yes, always with Party members.\u2019\n\n\u2018With members of the Inner Party?\u2019\n\n\u2018Not with those swine, no. But there\u2019s plenty that WOULDif they got half a chance. They\u2019re not so holy as they make out.\u2019\n\nHis heart leapt. Scores of times she had done it: he wished it had been\nhundreds\u2014thousands. Anything that hinted at corruption always filled him with a\nwild hope. Who knew, perhaps the Party was rotten under the surface, its cult of\nstrenuousness and self-denial simply a sham concealing iniquity. If he could\nhave infected the whole lot of them with leprosy or syphilis, how gladly he\nwould have done so! Anything to rot, to weaken, to undermine! He pulled her down\nso that they were kneeling face to face.\n\n\u2018Listen. The more men you\u2019ve had, the more I love you. Do you understand that?\u2019\n\n\u2018Yes, perfectly.\u2019\n\n\u2018I hate purity, I hate goodness! I don\u2019t want any virtue to exist anywhere. I\nwant everyone to be corrupt to the bones.\u2019\n\n\u2018Well then, I ought to suit you, dear. I\u2019m corrupt to the bones.\u2019\n\n\u2018You like doing this? I don\u2019t mean simply me: I mean the thing in itself?\u2019\n\n\u2018I adore it.\u2019\n\nThat was above all what he wanted to hear. Not merely the love of one person but\nthe animal instinct, the simple undifferentiated desire: that was the force that\nwould tear the Party to pieces. He pressed her down upon the grass, among the\nfallen bluebells. This time there was no difficulty. Presently the rising and\nfalling of their breasts slowed to normal speed, and in a sort of pleasant\nhelplessness theyfell apart. The sun seemed to have grown hotter. They were both\nsleepy. He reached out for the discarded overalls and pulled them partly over\nher. Almost immediately they fell asleep and slept for about half an hour.\n\nWinston woke first. He sat up and watched the freckled face, still peacefully\nasleep, pillowed on the palm of her hand. Except for her mouth, you could not\ncall her beautiful. There was a line or two round the eyes, if you looked\nclosely. The short dark hair was extraordinarily thick and soft. It occurred to\nhim that he still did not know her surname or where she lived.\n\nThe young, strong body, now helpless in sleep, awoke in him a pitying,\nprotecting feeling. But the mindless tenderness that he had felt under the hazel\ntree, while the thrush was singing, had not quite come back. He pulled the\noveralls aside and studied her smooth white flank. In the old days, he thought,\na man looked at a girl\u2019s body and saw that it was desirable, and that was the\nend of the story. But you could not have pure love or pure lust nowadays. No\nemotion was pure, because everything was mixed up with fear and hatred. Their\nembrace had been a battle, the climax a victory. It was a blow struck against\nthe Party. It was a political act.\n\nChapter 3\n\n\u2018 We can come here once again,\u2019 said Julia. \u2018It\u2019s generally safe to use any\nhide-out twice. But not for another month or two, of course.\u2019\n\nAs soon as she woke up her demeanour had changed. She became alert and business-\nlike, put her clothes on, knotted the scarlet sash about her waist, and began\narranging the details of the journey home. It seemed natural to leave this to\nher. She obviously had a practical cunning which Winston lacked, and she seemed\nalso to have an exhaustive knowledge of the countryside round London, stored\naway from innumerable community hikes. The route she gave him was quite\ndifferent from the one by which he had come, and brought him out at a different\nrailway station. \u2018Never go home the same way as you went out,\u2019 she said, as\nthough enunciating an important general principle. She would leave first, and\nWinston was to wait half an hour before following her.\n\nShe had named a place where they could meet after work, four evenings hence. It\nwas a street in one of the poorer quarters, where there was an open market which\nwas generally crowded and noisy. She would be hanging about among the stalls,\npretending to be in search of shoelaces or sewingthread. If she judged that the\ncoast was clear she would blow her nose when he approached; otherwise he was to\nwalkpast her without recognition. But with luck, in the middle of the crowd, it\nwould be safe to talk for a quarter of an hour and arrange another meeting.\n\n\u2018And now I must go,\u2019 she said as soon as he had mastered his instructions. \u2018I\u2019m\ndue back at nineteen-thirty. I\u2019ve got to put in two hours for the Junior Anti-\nSex League, handing out leaflets, or something. Isn\u2019t it bloody? Give me a\nbrushdown, would you? Have I got any twigs in my hair? Are you sure? Then good-\nbye, my love, good-bye!\u2019\n\nShe flung herself into his arms, kissed him almost violently, and a moment later\npushed her way through the saplings and disappeared into the wood with very\nlittle noise. Even now he had not found out her surname or her address. However,\nit made no difference, for it was inconceivable that they could ever meet\nindoors or exchange any kind of written communication.\n\nAs it happened, they never went back to the clearing in the wood. During the\nmonth of May there was only one further occasion on which they actually\nsucceeded in making love. That was in another hidlng-place known to Julia, the\nbelfry of a ruinous church in an almost-deserted stretch of country where an\natomic bomb had fallen thirty years earlier. It was a good hiding-place when\nonce you got there, but the getting there was very dangerous. For the rest they\ncould meet only in the streets, in a different place every evening and never for\nmore than half an hour at a time. In the street it was usually possible to talk,\nafter a fashion. As they drifted down the crowded pavements, not quite abreast\nand never looking at one another, they carried on a curious, intermittent\nconversation which flicked on and off like the beams of a lighthouse, suddenly\nnipped into silence by the approach of a Party uniform or the proximity of a\ntelescreen, then taken up again minutes later in the middle of a sentence, then\nabruptly cut short as they parted at the agreed spot, then continued almost\nwithout introduction on the following day. Julia appeared to be quite used to\nthis kind of conversation, which she called \u2018talking by instalments\u2019. She was\nalso surprisingly adept at speaking without moving her lips. Just once in almost\na month of nightly meetings they managed to exchange a kiss. They were passing\nin silence down a side-street (Julia would never speak when they were away from\nthe main streets) when there was a deafening roar, the earth heaved, and the air\ndarkened, and Winston found himself lying on his side, bruised and terrified. A\nrocket bomb must have dropped quite near at hand. Suddenly he became aware of\nJulia\u2019s face a few centimetres from his own, deathly white, as white as chalk.\nEven her lips were white. She was dead! He clasped her against him and found\nthat he was kissing a live warm face. But there was some powdery stuff that got\nin the way of his lips. Both of their faces were thickly coated with plaster.\n\nThere were evenings when they reached their rendezvous and then had to walk past\none another without a sign, because a patrol had just come round the corner or a\nhelicopter was hovering overhead. Even if it had been less dangerous, it would\nstill have been difficult to find time to meet. Winston\u2019s working week was sixty\nhours, Julia\u2019s was even longer, and their free days varied according to the\npressure of workand did not often coincide. Julia, in any case, seldom had an\nevening completely free. She spent an astonishing amount of time in attending\nlectures and demonstrations, distributing literature for the junior Anti-Sex\nLeague, preparing banners for Hate Week, making collections for the savings\ncampaign, and such-like activities. It paid, she said, it was camouflage. If you\nkept the small rules, you could break the big ones. She even induced Winston to\nmortgage yet another of his evenings by enrolling himself for the part-time\nmunition work which was done voluntarily by zealous Party members. So, one\nevening every week, Winston spent four hours of paralysing boredom, screwing\ntogether small bits of metal which were probably parts of bomb fuses, in a\ndraughty, ill-lit workshop where the knocking of hammers mingled drearily with\nthe music of the telescreens.\n\nWhen they met in the church tower the gaps in their fragmentary conversation\nwere filled up. It was a blazing afternoon. The air in the little square chamber\nabove the bells was hot and stagnant, and smelt overpoweringly of pigeon dung.\nThey sat talking for hours on the dusty, twig-littered floor, one or other of\nthem getting up from time to time to cast a glance through the arrowslits and\nmake sure that no one was coming.\n\nJulia was twenty-six years old. She lived in a hostel with thirty other girls\n(\u2019Always in the stink of women! How I hate women!\u2019 she said parenthetically),\nand she worked, as he had guessed, on the novel-writing machines in the Fiction\nDepartment. She enjoyed her work, which consisted chiefly in running and\nservicing a powerful but tricky electric motor. She was \u2018not clever\u2019, but was\nfond of using her hands and felt at home with machinery. She could describe the\nwhole process of composing a novel, from the general directive issued by the\nPlanning Committee down to the final touching-up by the Rewrite Squad. But she\nwas not interested in the finished product. She \u2018didn\u2019t much care for reading,\u2019\nshe said. Books were just a commodity that had to be produced, like jam or\nbootlaces.\n\nShe had no memories of anything before the early sixties and the only person she\nhad ever known who talked frequently of the days before the Revolution was a\ngrandfather who had disappeared when she was eight. At school she had been\ncaptain of the hockey team and had won the gymnastics trophy two years running.\nShe had been a troopleader in the Spies and a branch secretary in the Youth\nLeague before joining the Junior Anti-Sex League. She had always borne an\nexcellent character. She had even (an infallible mark of good reputation) been\npicked out to work in Pornosec, the sub-section of the Fiction Department which\nturned out cheap pornography for distribution among the proles. It was nicknamed\nMuck House by the people who worked in it, she remarked. There she had remained\nfor a year, helping to produce booklets in sealed packets with titles like\n\u2018Spanking Stories\u2019 or \u2018One Night in a Girls\u2019 School\u2019, to be bought furtively by\nproletarian youths who were under the impression that they were buying something\nillegal.\n\n\u2018What are these books like?\u2019 said Winston curiously.\n\n\u2018Oh, ghastly rubbish. They\u2019re boring, really. They only have six plots, but they\nswap them round a bit. Of course\n\nI was only on the kaleidoscopes. I was never in the Rewrite Squad. I\u2019m not\nliterary, dear\u2014not even enough for that.\u2019\n\nHe learned with astonishment that all the workers in Pornosec, except the heads\nof the departments, were girls. The theory was that men, whose sex instincts\nwere less controllable than those of women, were in greater danger of being\ncorrupted by the filth they handled.\n\n\u2018They don\u2019t even like having married women there,\u2019 she added. Girls are always\nsupposed to be so pure. Here\u2019s one who isn\u2019t, anyway.\n\nShe had had her first love-affair when she was sixteen, with a Party member of\nsixty who later committed suicide to avoid arrest. \u2018And a good job too,\u2019 said\nJulia, \u2018otherwise they\u2019d have had my name out of him when he confessed.\u2019 Since\nthen there had been various others. Life as she saw it was quite simple. You\nwanted a good time; \u2018they\u2019, meaning the Party, wanted to stop you having it; you\nbroke the rules as best you could. She seemed to think it just as natural that\n\u2018they\u2019 should want to rob you of your pleasures as that you should want to avoid\nbeing caught. She hated the Party, and said so in the crudest words, but she\nmade no general criticism of it. Except where it touched upon her own life she\nhad no interest in Party doctrine. He noticed that she never used Newspeak words\nexcept the ones that had passed into everyday use. She had never heard of the\nBrotherhood, and refused to believe in its existence. Any kind of organized\nrevolt against the Party, which was bound to be a failure, struck her as stupid.\nThe clever thing was to break the rules and stay alive all the same. He wondered\nvaguely how manyothers like her there might be in the younger generation people\nwho had grown up in the world of the Revolution, knowing nothing else, accepting\nthe Party as something unalterable, like the sky, not rebelling against its\nauthority but simply evading it, as a rabbit dodges a dog.\n\nThey did not discuss the possibility of getting married. It was too remote to be\nworth thinking about. No imaginable committee would ever sanction such a\nmarriage even if Katharine, Winston\u2019s wife, could somehow have been got rid of.\nIt was hopeless even as a daydream.\n\n\u2018What was she like, your wife?\u2019 said Julia.\n\n\u2018She was\u2014do you know the Newspeak word GOOD- THINKFUL? Meaning naturally\northodox, incapable of thinking a bad thought?\u2019\n\n\u2018No, I didn\u2019t know the word, but I know the kind of person, right enough.\u2019\n\nHe began telling her the story of his married life, but curiously enough she\nappeared to know the essential parts of it already. She described to him, almost\nas though she had seen or felt it, the stiffening of Katharine\u2019s body as soon as\nhe touched her, the way in which she still seemed to be pushing him from her\nwith all her strength, even when her arms were clasped tightly round him. With\nJulia he felt no difficulty in talking about such things: Katharine, in any\ncase, had long ceased to be a painful memory and became merely a distasteful\none.\n\n\u2018I could have stood it if it hadn\u2019t been for one thing,\u2019 he said. He told her\nabout the frigid little ceremony that Katharine had forced him to go through on\nthe same night everyweek. \u2018She hated it, but nothing would make her stop doing\nit. She used to call it\u2014but you\u2019ll never guess.\u2019\n\n\u2018Our duty to the Party,\u2019 said Julia promptly.\n\n\u2018How did you know that?\u2019\n\n\u2018I\u2019ve been at school too, dear. Sex talks once a month for the over-sixteens.\nAnd in the Youth Movement. They rub it into you for years. I dare say it works\nin a lot of cases. But of course you can never tell; people are such\nhypocrites.\u2019\n\nShe began to enlarge upon the subject. With Julia, everything came back to her\nown sexuality. As soon as this was touched upon in any way she was capable of\ngreat acuteness. Unlike Winston, she had grasped the inner meaning of the\nParty\u2019s sexual puritanism. It was not merely that the sex instinct created a\nworld of its own which was outside the Party\u2019s control and which therefore had\nto be destroyed if possible. What was more important was that sexual privation\ninduced hysteria, which was desirable because it could be transformed into war-\nfever and leader-worship. The way she put it was:\n\n\u2018When you make love you\u2019re using up energy; and afterwards you feel happy and\ndon\u2019t give a damn for anything. They can\u2019t bear you to feel like that. They want\nyou to be bursting with energy all the time. All this marching up and down and\ncheering and waving flags is simply sex gone sour. If you\u2019re happy inside\nyourself, why should you get excited about Big Brother and the Three-Year Plans\nand the Two Minutes Hate and all the rest of their bloody rot?\u2019\n\nThat was very true, he thought. There was a direct intimate connexion between\nchastity and political orthodoxy.\n\nFor how could the fear, the hatred, and the lunatic credulity which the Party\nneeded in its members be kept at the right pitch, except by bottling down some\npowerful instinct and using it as a driving force? The sex impulse was dangerous\nto the Party, and the Party had turned it to account. They had played a similar\ntrick with the instinct of parenthood. The family could not actually be\nabolished, and, indeed, people were encouraged to be fond of their children, in\nalmost the old-fashioned way. The children, on the other hand, were\nsystematically turned against their parents and taught to spy on them and report\ntheir deviations. The family had become in effect an extension of the Thought\nPolice. It was a device by means of which everyone could be surrounded night and\nday by informers who knew him intimately.\n\nAbruptly his mind went back to Katharine. Katharine would unquestionably have\ndenounced him to the Thought Police if she had not happened to be too stupid to\ndetect the unorthodoxy of his opinions. But what really recalled her to him at\nthis moment was the stifling heat of the afternoon, which had brought the sweat\nout on his forehead. He began telling Julia of something that had happened, or\nrather had failed to happen, on another sweltering summer afternoon, eleven\nyears ago.\n\nIt was three or four months after they were married. They had lost their way on\na community hike somewhere in Kent. They had only lagged behind the others for a\ncouple of minutes, but they took a wrong turning, and presently found themselves\npulled up short by the edge of an old chalk quarry. It was a sheer drop of ten\nor twenty metres, withboulders at the bottom. There was nobody of whom they\ncould ask the way. As soon as she realized that they were lost Katharine became\nvery uneasy. To be away from the noisy mob of hikers even for a moment gave her\na feeling of wrong- doing. She wanted to hurry back by the way they had come and\nstart searching in the other direction. But at this moment Winston noticed some\ntufts of loosestrife growing in the cracks of the cliff beneath them. One tuft\nwas of two colours, magenta and brick-red, apparently growing on the same root.\nHe had never seen anything of the kind before, and he called to Katharine to\ncome and look at it.\n\n\u2018Look, Katharine! Look at those flowers. That clump down near the bottom. Do you\nsee they\u2019re two different colours?\u2019\n\nShe had already turned to go, but she did rather fretfully come back for a\nmoment. She even leaned out over the cliff face to see where he was pointing. He\nwas standing a little behind her, and he put his hand on her waist to steady\nher. At this moment it suddenly occurred to him how completely alone they were.\nThere was not a human creature anywhere, not a leaf stirring, not even a bird\nawake. In a place like this the danger that there would be a hidden microphone\nwas very small, and even if there was a microphone it would only pick up sounds.\nIt was the hottest sleepiest hour of the afternoon. The sun blazed down upon\nthem, the sweat tickled his face. And the thought struck him...\n\n\u2018Why didn\u2019t you give her a good shove?\u2019 said Julia. \u2018I would have.\u2019\n\n\u2018Yes, dear, you would have. I would, if I\u2019d been the sameperson then as I am now. Or perhaps I would\u2014I\u2019m not certain.\u2019\n\n\u2018Are you sorry you didn\u2019t?\u2019\n\n\u2018Yes. On the whole I\u2019m sorry I didn\u2019t.\u2019\n\nThey were sitting side by side on the dusty floor. He pulled her closer against\nhim. Her head rested on his shoulder, the pleasant smell of her hair conquering\nthe pigeon dung. She was very young, he thought, she still expected something\nfrom life, she did not understand that to push an inconvenient person over a\ncliff solves nothing.\n\n\u2018Actually it would have made no difference,\u2019 he said.\n\n\u2018Then why are you sorry you didn\u2019t do it?\u2019\n\n\u2018Only because I prefer a positive to a negative. In this game that we\u2019re\nplaying, we can\u2019t win. Some kinds of failure are better than other kinds, that\u2019s\nall.\u2019\n\nHe felt her shoulders give a wriggle of dissent. She always contradicted him\nwhen he said anything of this kind. She would not accept it as a law of nature\nthat the individual is always defeated. In a way she realized that she herself\nwas doomed, that sooner or later the Thought Police would catch her and kill\nher, but with another part of her mind she believed that it was somehow possible\nto construct a secret world in which you could live as you chose. All you needed\nwas luck and cunning and boldness. She did not understand that there was no such\nthing as happiness, that the only victory lay in the far future, long after you\nwere dead, that from the moment of declaring war on the Party it was better to\nthink of yourself as a corpse.\n\n\u2018We are the dead,\u2019 he said.\n\n\u2018We\u2019re not dead yet,\u2019 said Julia prosaically.\n\n\u2018Not physically. Six months, a year\u2014five years, conceivably. I am afraid of\ndeath. You are young, so presumably you\u2019re more afraid of it than I am.\nObviously we shall put it off as long as we can. But it makes very little\ndifference. So long as human beings stay human, death and life are the same\nthing.\u2019\n\n\u2018Oh, rubbish! Which would you sooner sleep with, me or a skeleton? Don\u2019t you\nenjoy being alive? Don\u2019t you like feeling: This is me, this is my hand, this is\nmy leg, I\u2019m real, I\u2019m solid, I\u2019m alive! Don\u2019t you like THIS?\u2019\n\nShe twisted herself round and pressed her bosom against him. He could feel her\nbreasts, ripe yet firm, through her overalls. Her body seemed to be pouring some\nof its youth and vigour into his.\n\n\u2018Yes, I like that,\u2019 he said.\n\n\u2018Then stop talking about dying. And now listen, dear, we\u2019ve got to fix up about\nthe next time we meet. We may as well go back to the place in the wood. We\u2019ve\ngiven it a good long rest. But you must get there by a different way this time.\nI\u2019ve got it all planned out. You take the train\u2014but look, I\u2019ll draw it out for\nyou.\u2019\n\nAnd in her practical way she scraped together a small square of dust, and with a\ntwig from a pigeon\u2019s nest began drawing a map on the floor.\n\nChapter 4\n\nW      inston looked round the shabby little room above Mr\n\nCharrington\u2019s shop. Beside the window the enormous bed was made up, with ragged\nblankets and a coverless bolster. The old-fashioned clock with the twelve-hour\nface was ticking away on the mantelpiece. In the corner, on the gateleg table,\nthe glass paperweight which he had bought on his last visit gleamed softly out\nof the half-darkness.\n\nIn the fender was a battered tin oilstove, a saucepan, and two cups, provided by\nMr Charrington. Winston lit the burner and set a pan of water to boil. He had\nbrought an envelope full of Victory Coffee and some saccharine tablets. The\nclock\u2019s hands said seventeen-twenty: it was nineteentwenty really. She was\ncoming at nineteen-thirty.\n\nFolly, folly, his heart kept saying: conscious, gratuitous, suicidal folly. Of\nall the crimes that a Party member could commit, this one was the least possible\nto conceal. Actually the idea had first floated into his head in the form of a\nvision, of the glass paperweight mirrored by the surface of the gateleg table.\nAs he had foreseen, Mr Charrington had made no difficulty about letting the\nroom. He was obviously glad of the few dollars that it would bring him. Nor did\nhe seem shocked or become offensively knowing when it was made clear that\nWinston wanted the room for the purpose of a love-affair. Instead he looked into\nthe middle distanceand spoke in generalities, with so delicate an air as to give\nthe impression that he had become partly invisible. Privacy, he said, was a very\nvaluable thing. Everyone wanted a place where they could be alone occasionally.\nAnd when they had such a place, it was only common courtesy in anyone else who\nknew of it to keep his knowledge to himself. He even, seeming almost to fade out\nof existence as he did so, added that there were two entries to the house, one\nof them through the back yard, which gave on an alley.\n\nUnder the window somebody was singing. Winston peeped out, secure in the\nprotection of the muslin curtain. The June sun was still high in the sky, and in\nthe sun-filled court below, a monstrous woman, solid as a Norman pillar, with\nbrawny red forearms and a sacking apron strapped about her middle, was stumping\nto and fro between a washtub and a clothes line, pegging out a series of square\nwhite things which Winston recognized as babies\u2019 diapers. Whenever her mouth was\nnot corked with clothes pegs she was singing in a powerful contralto:\n\nIt was only an \u2018opeless fancy.\n\nIt passed like an Ipril dye,\n\nBut a look an\u2019 a word an\u2019 the dreams they stirred!\n\nThey \u2018avestolen my \u2018eart awye!\n\nThe tune had been haunting London for weeks past. It was one of countless\nsimilar songs published for the benefit of the proles by a sub-section of the\nMusic Department.\n\nThe words of these songs were composed without any human intervention whatever\non an instrument known as a versificator. But the woman sang so tunefully as to\nturn the dreadful rubbish into an almost pleasant sound. He could hear the woman\nsinging and the scrape of her shoes on the flagstones, and the cries of the\nchildren in the street, and somewhere in the far distance a faint roar of\ntraffic, and yet the room seemed curiously silent, thanks to the absence of a\ntelescreen.\n\nFolly, folly, folly! he thought again. It was inconceivable that they could\nfrequent this place for more than a few weeks without being caught. But the\ntemptation of having a hiding-place that was truly their own, indoors and near\nat hand, had been too much for both of them. For some time after their visit to\nthe church belfry it had been impossible to arrange meetings. Working hours had\nbeen drastically increased in anticipation of Hate Week. It was more than a\nmonth distant, but the enormous, complex preparations that it entailed were\nthrowing extra work on to everybody. Finally both of them managed to secure a\nfree afternoon on the same day. They had agreed to go back to the clearing in\nthe wood. On the evening beforehand they met briefly in the street. As usual,\nWinston hardly looked at Julia as they drifted towards one another in the crowd,\nbut from the short glance he gave her it seemed to him that she was paler than\nusual.\n\n\u2018It\u2019s all off,\u2019 she murmured as soon as she judged it safe to speak. \u2018Tomorrow,\nI mean.\u2019\n\n\u2018What?\u2019\n\n\u2018Tomorrow afternoon. I can\u2019t come.\u2019\n\n\u2018Why not?\u2019\n\n\u2018Oh, the usual reason. It\u2019s started early this time.\u2019\n\nFor a moment he was violently angry. During the month that he had known her the\nnature of his desire for her had changed. At the beginning there had been little\ntrue sensuality in it. Their first love-making had been simply an act of the\nwill. But after the second time it was different. The smell of her hair, the\ntaste of her mouth, the feeling of her skin seemed to have got inside him, or\ninto the air all round him. She had become a physical necessity, something that\nhe not only wanted but felt that he had a right to. When she said that she could\nnot come, he had the feeling that she was cheating him. But just at this moment\nthe crowd pressed them together and their hands accidentally met. She gave the\ntips of his fingers a quick squeeze that seemed to invite not desire but\naffection. It struck him that when one lived with a woman this particular\ndisappointment must be a normal, recurring event; and a deep tenderness, such as\nhe had not felt for her before, suddenly took hold of him. He wished that they\nwere a married couple of ten years\u2019 standing. He wished that he were walking\nthrough the streets with her just as they were doing now but openly and without\nfear, talking of trivialities and buying odds and ends for the household. He\nwished above all that they had some place where they could be alone together\nwithout feeling the obligation to make love every time they met. It was not\nactually at that moment, but at some time on the following day, that the idea of\nrenting Mr Charrington\u2019s room had occurred to him. When he suggested it to Julia\nshe had agreed with unexpected readiness. Both of them knew that it was lunacy.\nIt was as though they were intentionally stepping nearer to their graves. As he\nsat waiting on the edge of the bed he thought again of the cellars of the\nMinistry of Love. It was curious how that predestined horror moved in and out of\none\u2019s consciousness. There it lay, fixed in future times, preceding death as\nsurely as 99 precedes 100. One could not avoid it, but one could perhaps\npostpone it: and yet instead, every now and again, by a conscious, wilful act,\none chose to shorten the interval before it happened.\n\nAt this moment there was a quick step on the stairs. Julia burst into the room.\nShe was carrying a tool-bag of coarse brown canvas, such as he had sometimes\nseen her carrying to and fro at the Ministry. He started forward to take her in\nhis arms, but she disengaged herself rather hurriedly, partly because she was\nstill holding the tool-bag.\n\n\u2018Half a second,\u2019 she said. \u2018Just let me show you what I\u2019ve brought. Did you\nbring some of that filthy Victory Coffee? I thought you would. You can chuck it\naway again, because we shan\u2019t be needing it. Look here.\u2019\n\nShe fell on her knees, threw open the bag, and tumbled out some spanners and a\nscrewdriver that filled the top part of it. Underneath were a number of neat\npaper packets. The first packet that she passed to Winston had a strange and yet\nvaguely familiar feeling. It was filled with some kind of heavy, sand-like stuff\nwhich yielded wherever you touched it.\n\n\u2018It isn\u2019t sugar?\u2019 he said.\n\n\u2018Real sugar. Not saccharine, sugar. And here\u2019s a loaf of bread\u2014proper white\nbread, not our bloody stuff\u2014and a little pot of jam. And here\u2019s a tin of\nmilk\u2014but look! This is the one I\u2019m really proud of. I had to wrap a bit of\nsacking round it, because\u2014\u2014\u2019\n\nBut she did not need to tell him why she had wrapped it up. The smell was\nalready filling the room, a rich hot smell which seemed like an emanation from\nhis early childhood, but which one did occasionally meet with even now, blowing\ndown a passage-way before a door slammed, or diffusing itself mysteriously in a\ncrowded street, sniffed for an instant and then lost again.\n\n\u2018It\u2019s coffee,\u2019 he murmured, \u2018real coffee.\u2019\n\n\u2018It\u2019s Inner Party coffee. There\u2019s a whole kilo here,\u2019 she said.\n\n\u2018How did you manage to get hold of all these things?\u2019\n\n\u2018It\u2019s all Inner Party stuff. There\u2019s nothing those swine don\u2019t have, nothing.\nBut of course waiters and servants and people pinch things, and\u2014look, I got a\nlittle packet of tea as well.\u2019\n\nWinston had squatted down beside her. He tore open a corner of the packet.\n\n\u2018It\u2019s real tea. Not blackberry leaves.\u2019\n\n\u2018There\u2019s been a lot of tea about lately. They\u2019ve captured India, or something,\u2019\nshe said vaguely. \u2018But listen, dear. I want you to turn your back on me for\nthree minutes. Go and sit on the other side of the bed. Don\u2019t go too near the\nwindow. And don\u2019t turn round till I tell you.\u2019\n\nWinston gazed abstractedly through the muslin curtain.\n\nDown in the yard the red-armed woman was still marching to and fro between the\nwashtub and the line. She took two more pegs out of her mouth and sang with deep\nfeeling:\n\nThey sye that time \u2018eals all things,\n\nThey sye you can always forget;\n\nBut the smiles an\u2019 the tears acrorss the years\n\nThey twist my\n\n\u2018eart-strings yet!\n\nShe knew the whole drivelling song by heart, it seemed. Her voice floated upward\nwith the sweet summer air, very tuneful, charged with a sort of happy\nmelancholy. One had the feeling that she would have been perfectly content, if\nthe June evening had been endless and the supply of clothes inexhaustible, to\nremain there for a thousand years, pegging out diapers and singing rubbish. It\nstruck him as a curious fact that he had never heard a member of the Party\nsinging alone and spontaneously. It would even have seemed slightly unorthodox,\na dangerous eccentricity, like talking to oneself. Perhaps it was only when\npeople were somewhere near the starvation level that they had anything to sing\nabout.\n\n\u2018You can turn round now,\u2019 said Julia.\n\nHe turned round, and for a second almost failed to recognize her. What he had\nactually expected was to see her naked. But she was not naked. The\ntransformation that had happened was much more surprising than that. She had\npainted her face.\n\nShe must have slipped into some shop in the proletarianquarters and bought\nherself a complete set of make-up materials. Her lips were deeply reddened, her\ncheeks rouged, her nose powdered; there was even a touch of something under the\neyes to make them brighter. It was not very skilfully done, but Winston\u2019s\nstandards in such matters were not high. He had never before seen or imagined a\nwoman of the Party with cosmetics on her face. The improvement in her appearance\nwas startling. With just a few dabs of colour in the right places she had become\nnot only very much prettier, but, above all, far more feminine. Her short hair\nand boyish overalls merely added to the effect. As he took her in his arms a\nwave of synthetic violets flooded his nostrils. He remembered the half-darkness\nof a basement kitchen, and a woman\u2019s cavernous mouth. It was the very same scent\nthat she had used; but at the moment it did not seem to matter.\n\n\u2018Scent too!\u2019 he said.\n\n\u2018Yes, dear, scent too. And do you know what I\u2019m going to do next? I\u2019m going to\nget hold of a real woman\u2019s frock from somewhere and wear it instead of these\nbloody trousers. I\u2019ll wear silk stockings and high-heeled shoes! In this room\nI\u2019m going to be a woman, not a Party comrade.\u2019\n\nThey flung their clothes off and climbed into the huge mahogany bed. It was the\nfirst time that he had stripped himself naked in her presence. Until now he had\nbeen too much ashamed of his pale and meagre body, with the varicose veins\nstanding out on his calves and the discoloured patch over his ankle. There were\nno sheets, but the blanket they lay on was threadbare and smooth, and the size\nand springiness of the bed astonished both of them. \u2018It\u2019s sureto be full of\nbugs, but who cares?\u2019 said Julia. One never saw a double bed nowadays, except in\nthe homes of the proles. Winston had occasionally slept in one in his boyhood:\nJulia had never been in one before, so far as she could remember.\n\nPresently they fell asleep for a little while. When Winston woke up the hands of\nthe clock had crept round to nearly nine. He did not stir, because Julia was\nsleeping with her head in the crook of his arm. Most of her make-up had\ntransferred itself to his own face or the bolster, but a light stain of rouge\nstill brought out the beauty of her cheekbone. A yellow ray from the sinking sun\nfell across the foot of the bed and lighted up the fireplace, where the water in\nthe pan was boiling fast. Down in the yard the woman had stopped singing, but\nthe faint shouts of children floated in from the street. He wondered vaguely\nwhether in the abolished past it had been a normal experience to lie in bed like\nthis, in the cool of a summer evening, a man and a woman with no clothes on,\nmaking love when they chose, talking of what they chose, not feeling any\ncompulsion to get up, simply lying there and listening to peaceful sounds\noutside. Surely there could never have been a time when that seemed ordinary?\nJulia woke up, rubbed her eyes, and raised herself on her elbow to look at the\noilstove.\n\n\u2018Half that water\u2019s boiled away,\u2019 she said. \u2018I\u2019ll get up and make some coffee in\nanother moment. We\u2019ve got an hour. What time do they cut the lights off at your\nflats?\u2019\n\n\u2018Twenty-three thirty.\u2019\n\n\u2018It\u2019s twenty-three at the hostel. But you have to get in earlier than that,\nbecause\u2014Hi! Get out, you filthy brute!\u2019\n\nShe suddenly twisted herself over in the bed, seized a shoe from the floor, and\nsent it hurtling into the corner with a boyish jerk of her arm, exactly as he\nhad seen her fling the dictionary at Goldstein, that morning during the Two\nMinutes Hate.\n\n\u2018What was it?\u2019 he said in surprise.\n\n\u2018A rat. I saw him stick his beastly nose out of the wainscoting. There\u2019s a hole\ndown there. I gave him a good fright, anyway.\u2019\n\n\u2018Rats!\u2019 murmured Winston. \u2018In this room!\u2019\n\n\u2018They\u2019re all over the place,\u2019 said Julia indifferently as she lay down again.\n\u2018We\u2019ve even got them in the kitchen at the hostel. Some parts of London are\nswarming with them. Did you know they attack children? Yes, they do. In some of\nthese streets a woman daren\u2019t leave a baby alone for two minutes. It\u2019s the great\nhuge brown ones that do it. And the nasty thing is that the brutes always\u2014\u2014\u2019\n\n\u2018DON\u2019T GO ON!\u2019 said Winston, with his eyes tightly shut.\n\n\u2018Dearest! You\u2019ve gone quite pale. What\u2019s the matter? Do they make you feel\nsick?\u2019\n\n\u2018Of all horrors in the world\u2014a rat!\u2019\n\nShe pressed herself against him and wound her limbs round him, as though to\nreassure him with the warmth of her body. He did not reopen his eyes\nimmediately. For several moments he had had the feeling of being back in a\nnightmare which had recurred from time to time throughout his life. It was\nalways very much the same. He was standing in front of a wall of darkness, and\non the otherside of it there was something unendurable, something too dreadful\nto be faced. In the dream his deepest feeling was always one of self-deception,\nbecause he did in fact know what was behind the wall of darkness. With a deadly\neffort, like wrenching a piece out of his own brain, he could even have dragged\nthe thing into the open. He always woke up without discovering what it was: but\nsomehow it was connected with what Julia had been saying when he cut her short.\n\n\u2018I\u2019m sorry,\u2019 he said, \u2018it\u2019s nothing. I don\u2019t like rats, that\u2019s all.\u2019\n\n\u2018Don\u2019t worry, dear, we\u2019re not going to have the filthy brutes in here. I\u2019ll\nstuff the hole with a bit of sacking before we go. And next time we come here\nI\u2019ll bring some plaster and bung it up properly.\u2019\n\nAlready the black instant of panic was half-forgotten. Feeling slightly ashamed\nof himself, he sat up against the bedhead. Julia got out of bed, pulled on her\noveralls, and made the coffee. The smell that rose from the saucepan was so\npowerful and exciting that they shut the window lest anybody outside should\nnotice it and become inquisitive. What was even better than the taste of the\ncoffee was the silky texture given to it by the sugar, a thing Winston had\nalmost forgotten after years of saccharine. With one hand in her pocket and a\npiece of bread and jam in the other, Julia wandered about the room, glancing\nindifferently at the bookcase, pointing out the best way of repairing the\ngateleg table, plumping herself down in the ragged arm-chair to see if it was\ncomfortable, and examining the absurd twelvehour clock with a sort of tolerant\namusement. She brought the glass paperweight over to the bed to have a look at\nit in a better light. He took it out of her hand, fascinated, as always, by the\nsoft, rainwatery appearance of the glass.\n\n\u2018What is it, do you think?\u2019 said Julia.\n\n\u2018I don\u2019t think it\u2019s anything\u2014I mean, I don\u2019t think it was ever put to any use.\nThat\u2019s what I like about it. It\u2019s a little chunk of history that they\u2019ve\nforgotten to alter. It\u2019s a message from a hundred years ago, if one knew how to\nread it.\u2019\n\n\u2018And that picture over there\u2019\u2014she nodded at the engraving on the opposite\nwall\u2014\u2019would that be a hundred years old?\u2019\n\n\u2018More. Two hundred, I dare say. One can\u2019t tell. It\u2019s impossible to discover the\nage of anything nowadays.\u2019\n\nShe went over to look at it. \u2018Here\u2019s where that brute stuck his nose out,\u2019 she\nsaid, kicking the wainscoting immediately below the picture. \u2018What is this\nplace? I\u2019ve seen it before somewhere.\u2019\n\n\u2018It\u2019s a church, or at least it used to be. St Clement Danes its name was.\u2019 The\nfragment of rhyme that Mr Charrington had taught him came back into his head,\nand he added half-nostalgically: \u2018Oranges and lemons, say the bells of St\nClement\u2019s!\u2019\n\nTo his astonishment she capped the line:\n\n\u2019You owe me three farthings, say the bells of St Martin\u2019s,\n\nWhen will you pay me? say the bells of Old Bailey\u2014\u2014\u2019\n\n\u2018I can\u2019t remember how it goes on after that. But anyway\n\nI remember it ends up, \u2018Here comes a candle to light you to bed, here comes a\nchopper to chop off your head!\u2018\u2018\n\nIt was like the two halves of a countersign. But there must be another line\nafter \u2018the bells of Old Bailey\u2019. Perhaps it could be dug out of Mr Charrington\u2019s\nmemory, if he were suitably prompted.\n\n\u2018Who taught you that?\u2019 he said.\n\n\u2018My grandfather. He used to say it to me when I was a little girl. He was\nvaporized when I was eight\u2014at any rate, he disappeared. I wonder what a lemon\nwas,\u2019 she added inconsequently. \u2018I\u2019ve seen oranges. They\u2019re a kind of round\nyellow fruit with a thick skin.\u2019\n\n\u2018I can remember lemons,\u2019 said Winston. \u2018They were quite common in the fifties.\nThey were so sour that it set your teeth on edge even to smell them.\u2019\n\n\u2018I bet that picture\u2019s got bugs behind it,\u2019 said Julia. \u2018I\u2019ll take it down and\ngive it a good clean some day. I suppose it\u2019s almost time we were leaving. I\nmust start washing this paint off. What a bore! I\u2019ll get the lipstick off your\nface afterwards.\u2019\n\nWinston did not get up for a few minutes more. The room was darkening. He turned\nover towards the light and lay gazing into the glass paperweight. The\ninexhaustibly interesting thing was not the fragment of coral but the interior\nof the glass itself. There was such a depth of it, and yet it was almost as\ntransparent as air. It was as though the surface of the glass had been the arch\nof the sky, enclosing a tiny world with its atmosphere complete. He had the\nfeeling that he could get inside it, and that in fact he was insideit, along\nwith the mahogany bed and the gateleg table, and the clock and the steel\nengraving and the paperweight itself. The paperweight was the room he was in,\nand the coral was Julia\u2019s life and his own, fixed in a sort of eternity at the\nheart of the crystal.\n\nChapter 5\n\nS  yme had vanished. A morning came, and he was missing from work: a few\nthoughtless people commented on his absence. On the next day nobody mentioned\nhim. On the third day Winston went into the vestibule of the Records Department\nto look at the notice-board. One of the notices carried a printed list of the\nmembers of the Chess Committee, of whom Syme had been one. It looked almost\nexactly as it had looked before\u2014nothing had been crossed out\u2014but it was one name\nshorter. It was enough. Syme had ceased to exist: he had never existed.\n\nThe weather was baking hot. In the labyrinthine Ministry the windowless, air-\nconditioned rooms kept their normal temperature, but outside the pavements\nscorched one\u2019s feet and the stench of the Tubes at the rush hours was a horror.\nThe preparations for Hate Week were in full swing, and the staffs of all the\nMinistries were working overtime. Processions, meetings, military parades,\nlectures, waxworks, displays, film shows, telescreen programmes all had to be\norganized; stands had to be erected, effigies built, slogans coined, songs\nwritten, rumours circulated, photographs faked. Julia\u2019s unit in the Fiction\nDepartment had been taken off the production of novels and was rushing out a\nseries of atrocity pamphlets. Winston, in addition to his regular work, spent\nlong periods every day in going through backfiles of \u2018The Times\u2019 and altering\nand embellishing news items which were to be quoted in speeches. Late at night,\nwhen crowds of rowdy proles roamed the streets, the town had a curiously febrile\nair. The rocket bombs crashed oftener than ever, and sometimes in the far\ndistance there were enormous explosions which no one could explain and about\nwhich there were wild rumours.\n\nThe new tune which was to be the theme-song of Hate Week (the Hate Song, it was\ncalled) had already been composed and was being endlessly plugged on the\ntelescreens. It had a savage, barking rhythm which could not exactly be called\nmusic, but resembled the beating of a drum. Roared out by hundreds of voices to\nthe tramp of marching feet, it was terrifying. The proles had taken a fancy to\nit, and in the midnight streets it competed with the still-popular \u2018It was only\na hopeless fancy\u2019. The Parsons children played it at all hours of the night and\nday, unbearably, on a comb and a piece of toilet paper. Winston\u2019s evenings were\nfuller than ever. Squads of volunteers, organized by Parsons, were preparing the\nstreet for Hate Week, stitching banners, painting posters, erecting flagstaffs\non the roofs, and perilously slinging wires across the street for the reception\nof streamers. Parsons boasted that Victory Mansions alone would display four\nhundred metres of bunting. He was in his native element and as happy as a lark.\nThe heat and the manual work had even given him a pretext for reverting to\nshorts and an open shirt in the evenings. He was everywhere at once, pushing,\npulling, sawing, hammering, improvising, jollying everyone along with comradely\nexhortations and givingout from every fold of his body what seemed an\ninexhaustible supply of acrid- smelling sweat.\n\nA new poster had suddenly appeared all over London. It had no caption, and\nrepresented simply the monstrous figure of a Eurasian soldier, three or four\nmetres high, striding forward with expressionless Mongolian face and enormous\nboots, a submachine gun pointed from his hip. From whatever angle you looked at\nthe poster, the muzzle of the gun, magnified by the foreshortening, seemed to be\npointed straight at you. The thing had been plastered on every blank space on\nevery wall, even outnumbering the portraits of Big Brother. The proles, normally\napathetic about the war, were being lashed into one of their periodical frenzies\nof patriotism. As though to harmonize with the general mood, the rocket bombs\nhad been killing larger numbers of people than usual. One fell on a crowded film\ntheatre in Stepney, burying several hundred victims among the ruins. The whole\npopulation of the neighbourhood turned out for a long, trailing funeral which\nwent on for hours and was in effect an indignation meeting. Another bomb fell on\na piece of waste ground which was used as a playground and several dozen\nchildren were blown to pieces. There were further angry demonstrations,\nGoldstein was burned in effigy, hundreds of copies of the poster of the Eurasian\nsoldier were torn down and added to the flames, and a number of shops were\nlooted in the turmoil; then a rumour flew round that spies were directing the\nrocket bombs by means of wireless waves, and an old couple who were suspected of\nbeing of foreign extraction had their house set on fire and perishedof\nsuffocation.\n\nIn the room over Mr Charrington\u2019s shop, when they could get there, Julia and\nWinston lay side by side on a stripped bed under the open window, naked for the\nsake of coolness. The rat had never come back, but the bugs had multiplied\nhideously in the heat. It did not seem to matter. Dirty or clean, the room was\nparadise. As soon as they arrived they would sprinkle everything with pepper\nbought on the black market, tear off their clothes, and make love with sweating\nbodies, then fall asleep and wake to find that the bugs had rallied and were\nmassing for the counter-attack.\n\nFour, five, six\u2014seven times they met during the month of June. Winston had\ndropped his habit of drinking gin at all hours. He seemed to have lost the need\nfor it. He had grown fatter, his varicose ulcer had subsided, leaving only a\nbrown stain on the skin above his ankle, his fits of coughing in the early\nmorning had stopped. The process of life had ceased to be intolerable, he had no\nlonger any impulse to make faces at the telescreen or shout curses at the top of\nhis voice. Now that they had a secure hiding-place, almost a home, it did not\neven seem a hardship that they could only meet infrequently and for a couple of\nhours at a time. What mattered was that the room over the junk-shop should\nexist. To know that it was there, inviolate, was almost the same as being in it.\nThe room was a world, a pocket of the past where extinct animals could walk. Mr\nCharrington, thought Winston, was another extinct animal. He usually stopped to\ntalk with Mr Charrington for a few minutes on his way upstairs. The old man\nseemed seldom or never to go out of doors,\n\nand on the other hand to have almost no customers. He led a ghostlike existence\nbetween the tiny, dark shop, and an even tinier back kitchen where he prepared\nhis meals and which contained, among other things, an unbelievably ancient\ngramophone with an enormous horn. He seemed glad of the opportunity to talk.\nWandering about among his worthless stock, with his long nose and thick\nspectacles and his bowed shoulders in the velvet jacket, he had always vaguely\nthe air of being a collector rather than a tradesman. With a sort of faded\nenthusiasm he would finger this scrap of rubbish or that\u2014a china bottle-stopper,\nthe painted lid of a broken snuffbox, a pinchbeck locket containing a strand of\nsome long-dead baby\u2019s hair\u2014never asking that Winston should buy it, merely that\nhe should admire it. To talk to him was like listening to the tinkling of a\nworn-out musicalbox. He had dragged out from the corners of his memory some more\nfragments of forgotten rhymes. There was one about four and twenty blackbirds,\nand another about a cow with a crumpled horn, and another about the death of\npoor Cock Robin. \u2018It just occurred to me you might be interested,\u2019 he would say\nwith a deprecating little laugh whenever he produced a new fragment. But he\ncould never recall more than a few lines of any one rhyme.\n\nBoth of them knew\u2014in a way, it was never out of their minds that what was now\nhappening could not last long. There were times when the fact of impending death\nseemed as palpable as the bed they lay on, and they would cling together with a\nsort of despairing sensuality, like a damned soul grasping at his last morsel of\npleasure when the clockis within five minutes of striking. But there were also\ntimes when they had the illusion not only of safety but of permanence. So long\nas they were actually in this room, they both felt, no harm could come to them.\nGetting there was difficult and dangerous, but the room itself was sanctuary. It\nwas as when Winston had gazed into the heart of the paperweight, with the\nfeeling that it would be possible to get inside that glassy world, and that once\ninside it time could be arrested. Often they gave themselves up to daydreams of\nescape. Their luck would hold indefinitely, and they would carry on their\nintrigue, just like this, for the remainder of their natural lives. Or Katharine\nwould die, and by subtle manoeuvrings Winston and Julia would succeed in getting\nmarried. Or they would commit suicide together. Or they would disappear, alter\nthemselves out of recognition, learn to speak with proletarian accents, get jobs\nin a factory and live out their lives undetected in a back-street. It was all\nnonsense, as they both knew. In reality there was no escape. Even the one plan\nthat was practicable, suicide, they had no intention of carrying out. To hang on\nfrom day to day and from week to week, spinning out a present that had no\nfuture, seemed an unconquerable instinct, just as one\u2019s lungs will always draw\nthe next breath so long as there is air available.\n\nSometimes, too, they talked of engaging in active rebellion against the Party,\nbut with no notion of how to take the first step. Even if the fabulous\nBrotherhood was a reality, there still remained the difficulty of finding one\u2019s\nway into it. He told her of the strange intimacy that existed, orseemed to\nexist, between himself and O\u2019Brien, and of the impulse he sometimes felt, simply\nto walk into O\u2019Brien\u2019s presence, announce that he was the enemy of the Party,\nand demand his help. Curiously enough, this did not strike her as an impossibly\nrash thing to do. She was used to judging people by their faces, and it seemed\nnatural to her that Winston should believe O\u2019Brien to be trustworthy on the\nstrength of a single flash of the eyes. Moreover she took it for granted that\neveryone, or nearly everyone, secretly hated the Party and would break the rules\nif he thought it safe to do so. But she refused to believe that widespread,\norganized opposition existed or could exist. The tales about Goldstein and his\nunderground army, she said, were simply a lot of rubbish which the Party had\ninvented for its own purposes and which you had to pretend to believe in. Times\nbeyond number, at Party rallies and spontaneous demonstrations, she had shouted\nat the top of her voice for the execution of people whose names she had never\nheard and in whose supposed crimes she had not the faintest belief. When public\ntrials were happening she had taken her place in the detachments from the Youth\nLeague who surrounded the courts from morning to night, chanting at intervals\n\u2018Death to the traitors!\u2019 During the Two Minutes Hate she always excelled all\nothers in shouting insults at Goldstein. Yet she had only the dimmest idea of\nwho Goldstein was and what doctrines he was supposed to represent. She had grown\nup since the Revolution and was too young to remember the ideological battles of\nthe fifties and sixties. Such a thing as an independent political movement was\noutside her imagination: and\n\nin any case the Party was invincible. It would always exist, and it would always\nbe the same. You could only rebel against it by secret disobedience or, at most,\nby isolated acts of violence such as killing somebody or blowing something up.\n\nIn some ways she was far more acute than Winston, and far less susceptible to\nParty propaganda. Once when he happened in some connexion to mention the war\nagainst Eurasia, she startled him by saying casually that in her opinion the war\nwas not happening. The rocket bombs which fell daily on London were probably\nfired by the Government of Oceania itself, \u2018just to keep people frightened\u2019.\nThis was an idea that had literally never occurred to him. She also stirred a\nsort of envy in him by telling him that during the Two Minutes Hate her great\ndifficulty was to avoid bursting out laughing. But she only questioned the\nteachings of the Party when they in some way touched upon her own life. Often\nshe was ready to accept the official mythology, simply because the difference\nbetween truth and falsehood did not seem important to her. She believed, for\ninstance, having learnt it at school, that the Party had invented aeroplanes.\n(In his own schooldays, Winston remembered, in the late fifties, it was only the\nhelicopter that the Party claimed to have invented; a dozen years later, when\nJulia was at school, it was already claiming the aeroplane; one generation more,\nand it would be claiming the steam engine.) And when he told her that aeroplanes\nhad been in existence before he was born and long before the Revolution, the\nfact struck her as totally uninteresting. After all, what did it matter who\nhadinvented aeroplanes? It was rather more of a shock to him when he discovered\nfrom some chance remark that she did not remember that Oceania, four years ago,\nhad been at war with Eastasia and at peace with Eurasia. It was true that she\nregarded the whole war as a sham: but apparently she had not even noticed that\nthe name of the enemy had changed. \u2018I thought we\u2019d always been at war with\nEurasia,\u2019 she said vaguely. It frightened him a little. The invention of\naeroplanes dated from long before her birth, but the switchover in the war had\nhappened only four years ago, well after she was grown up. He argued with her\nabout it for perhaps a quarter of an hour. In the end he succeeded in forcing\nher memory back until she did dimly recall that at one time Eastasia and not\nEurasia had been the enemy. But the issue still struck her as unimportant. \u2018Who\ncares?\u2019 she said impatiently. \u2018It\u2019s always one bloody war after another, and one\nknows the news is all lies anyway.\u2019\n\nSometimes he talked to her of the Records Department and the impudent forgeries\nthat he committed there. Such things did not appear to horrify her. She did not\nfeel the abyss opening beneath her feet at the thought of lies becoming truths.\nHe told her the story of Jones, Aaronson, and Rutherford and the momentous slip\nof paper which he had once held between his fingers. It did not make much\nimpression on her. At first, indeed, she failed to grasp the point of the story.\n\n\u2018Were they friends of yours?\u2019 she said.\n\n\u2018No, I never knew them. They were Inner Party members. Besides, they were far\nolder men than I was. They belongedto the old days, before the Revolution. I\nbarely knew them by sight.\u2019\n\n\u2018Then what was there to worry about? People are being killed off all the time,\naren\u2019t they?\u2019\n\nHe tried to make her understand. \u2018This was an exceptional case. It wasn\u2019t just a\nquestion of somebody being killed. Do you realize that the past, starting from\nyesterday, has been actually abolished? If it survives anywhere, it\u2019s in a few\nsolid objects with no words attached to them, like that lump of glass there.\nAlready we know almost literally nothing about the Revolution and the years\nbefore the Revolution. Every record has been destroyed or falsified, every book\nhas been rewritten, every picture has been repainted, every statue and street\nand building has been renamed, every date has been altered. And that process is\ncontinuing day by day and minute by minute. History has stopped. Nothing exists\nexcept an endless present in which the Party is always right. I know, of course,\nthat the past is falsified, but it would never be possible for me to prove it,\neven when I did the falsification myself. After the thing is done, no evidence\never remains. The only evidence is inside my own mind, and I don\u2019t know with any\ncertainty that any other human being shares my memories. Just in that one\ninstance, in my whole life, I did possess actual concrete evidence after the\nevent\u2014years after it.\u2019\n\n\u2018And what good was that?\u2019\n\n\u2018It was no good, because I threw it away a few minutes later. But if the same\nthing happened today, I should keep it.\u2019\n\n\u2018Well, I wouldn\u2019t!\u2019 said Julia. \u2018I\u2019m quite ready to takerisks, but only for\nsomething worth while, not for bits of old newspaper. What could you have done\nwith it even if you had kept it?\u2019\n\n\u2018Not much, perhaps. But it was evidence. It might have planted a few doubts here\nand there, supposing that I\u2019d dared to show it to anybody. I don\u2019t imagine that\nwe can alter anything in our own lifetime. But one can imagine little knots of\nresistance springing up here and there\u2014small groups of people banding themselves\ntogether, and gradually growing, and even leaving a few records behind, so that\nthe next generations can carry on where we leave off.\u2019\n\n\u2018I\u2019m not interested in the next generation, dear. I\u2019m interested in US.\u2019\n\n\u2018You\u2019re only a rebel from the waist downwards,\u2019 he told her.\n\nShe thought this brilliantly witty and flung her arms round him in delight.\n\nIn the ramifications of party doctrine she had not the faintest interest.\nWhenever he began to talk of the principles of Ingsoc, doublethink, the\nmutability of the past, and the denial of objective reality, and to use Newspeak\nwords, she became bored and confused and said that she never paid any attention\nto that kind of thing. One knew that it was all rubbish, so why let oneself be\nworried by it? She knew when to cheer and when to boo, and that was all one\nneeded. If he persisted in talking of such subjects, she had a disconcerting\nhabit of falling asleep. She was one of those people who can go to sleep at any\nhour and in any position. Talking to her, he realized how easy it was to present\nan appearance of orthodoxy while having no grasp whatever of what orthodoxy\nmeant. In a way, the world-view of the Party imposed itself most successfully on\npeople incapable of understanding it. They could be made to accept the most\nflagrant violations of reality, because they never fully grasped the enormity of\nwhat was demanded of them, and were not sufficiently interested in public events\nto notice what was happening. By lack of understanding they remained sane. They\nsimply swallowed everything, and what they swallowed did them no harm, because\nit left no residue behind, just as a grain of corn will pass undigested through\nthe body of a bird.\n\nChapter 6\n\nI   t had happened at last. The expected message had come.\n\nAll his life, it seemed to him, he had been waiting for this to happen.\n\nHe was walking down the long corridor at the Ministry and he was almost at the\nspot where Julia had slipped the note into his hand when he became aware that\nsomeone larger than himself was walking just behind him. The person, whoever it\nwas, gave a small cough, evidently as a prelude to speaking. Winston stopped\nabruptly and turned. It was O\u2019Brien.\n\nAt last they were face to face, and it seemed that his only impulse was to run\naway. His heart bounded violently. He would have been incapable of speaking.\nO\u2019Brien, however, had continued forward in the same movement, laying a friendly\nhand for a moment on Winston\u2019s arm, so that the two of them were walking side by\nside. He began speaking with the peculiar grave courtesy that differentiated him\nfrom the majority of Inner Party members.\n\n\u2018I had been hoping for an opportunity of talking to you,\u2019 he said. \u2018I was\nreading one of your Newspeak articles in \u2018The Times\u2019 the other day. You take a\nscholarly interest in Newspeak, I believe?\u2019\n\nWinston had recovered part of his self-possession. \u2018Hardly scholarly,\u2019 he said.\n\u2018I\u2019m only an amateur. It\u2019s not mysubject. I have never had anything to do with\nthe actual construction of the language.\u2019\n\n\u2018But you write it very elegantly,\u2019 said O\u2019Brien. \u2018That is not only my own\nopinion. I was talking recently to a friend of yours who is certainly an expert.\nHis name has slipped my memory for the moment.\u2019\n\nAgain Winston\u2019s heart stirred painfully. It was inconceivable that this was\nanything other than a reference to Syme. But Syme was not only dead, he was\nabolished, an unperson. Any identifiable reference to him would have been\nmortally dangerous. O\u2019Brien\u2019s remark must obviously have been intended as a\nsignal, a codeword. By sharing a small act of thoughtcrime he had turned the two\nof them into accomplices. They had continued to stroll slowly down the corridor,\nbut now O\u2019Brien halted. With the curious, disarming friendliness that he always\nmanaged to put in to the gesture he resettled his spectacles on his nose. Then\nhe went on:\n\n\u2018What I had really intended to say was that in your article I noticed you had\nused two words which have become obsolete. But they have only become so very\nrecently. Have you seen the tenth edition of the Newspeak Dictionary?\u2019\n\n\u2018No,\u2019 said Winston. \u2018I didn\u2019t think it had been issued yet. We are still using\nthe ninth in the Records Department.\u2019\n\n\u2018The tenth edition is not due to appear for some months, I believe. But a few\nadvance copies have been circulated. I have one myself. It might interest you to\nlook at it, perhaps?\u2019\n\n\u2018Very much so,\u2019 said Winston, immediately seeing wherethis tended.\n\n\u2018Some of the new developments are most ingenious. The reduction in the number of\nverbs\u2014that is the point that will appeal to you, I think. Let me see, shall I\nsend a messenger to you with the dictionary? But I am afraid I invariably forget\nanything of that kind. Perhaps you could pick it up at my flat at some time that\nsuited you? Wait. Let me give you my address.\u2019\n\nThey were standing in front of a telescreen. Somewhat absentmindedly O\u2019Brien\nfelt two of his pockets and then produced a small leather-covered notebook and a\ngold ink-pencil. Immediately beneath the telescreen, in such a position that\nanyone who was watching at the other end of the instrument could read what he\nwas writing, he scribbled an address, tore out the page and handed it to\nWinston.\n\n\u2018I am usually at home in the evenings,\u2019 he said. \u2018If not, my servant will give\nyou the dictionary.\u2019\n\nHe was gone, leaving Winston holding the scrap of paper, which this time there\nwas no need to conceal. Nevertheless he carefully memorized what was written on\nit, and some hours later dropped it into the memory hole along with a mass of\nother papers.\n\nThey had been talking to one another for a couple of minutes at the most. There\nwas only one meaning that the episode could possibly have. It had been contrived\nas a way of letting Winston know O\u2019Brien\u2019s address. This was necessary, because\nexcept by direct enquiry it was never possible to discover where anyone lived.\nThere were no directories of any kind. \u2018If you ever want to see me, this is\nwhere I canbe found,\u2019 was what O\u2019Brien had been saying to him. Perhaps there\nwould even be a message concealed somewhere in the dictionary. But at any rate,\none thing was certain. The conspiracy that he had dreamed of did exist, and he\nhad reached the outer edges of it.\n\nHe knew that sooner or later he would obey O\u2019Brien\u2019s summons. Perhaps tomorrow,\nperhaps after a long delay\u2014he was not certain. What was happening was only the\nworking-out of a process that had started years ago. The first step had been a\nsecret, involuntary thought, the second had been the opening of the diary. He\nhad moved from thoughts to words, and now from words to actions. The last step\nwas something that would happen in the Ministry of Love. He had accepted it. The\nend was contained in the beginning. But it was frightening: or, more exactly, it\nwas like a foretaste of death, like being a little less alive. Even while he was\nspeaking to O\u2019Brien, when the meaning of the words had sunk in, a chilly\nshuddering feeling had taken possession of his body. He had the sensation of\nstepping into the dampness of a grave, and it was not much better because he had\nalways known that the grave was there and waiting for him.\n\nChapter 7\n\nW      inston had woken up with his eyes full of tears. Julia rolled sleepily\nagainst him, murmuring something that might have been \u2018What\u2019s the matter?\u2019\n\n\u2018I dreamt\u2014\u2019 he began, and stopped short. It was too complex to be put into\nwords. There was the dream itself, and there was a memory connected with it that\nhad swum into his mind in the few seconds after waking.\n\nHe lay back with his eyes shut, still sodden in the atmosphere of the dream. It\nwas a vast, luminous dream in which his whole life seemed to stretch out before\nhim like a landscape on a summer evening after rain. It had all occurred inside\nthe glass paperweight, but the surface of the glass was the dome of the sky, and\ninside the dome everything was flooded with clear soft light in which one could\nsee into interminable distances. The dream had also been comprehended by\u2014indeed,\nin some sense it had consisted in\u2014a gesture of the arm made by his mother, and\nmade again thirty years later by the Jewish woman he had seen on the news film,\ntrying to shelter the small boy from the bullets, before the helicopter blew\nthem both to pieces.\n\n\u2018Do you know,\u2019 he said, \u2018that until this moment I believed I had murdered my\nmother?\u2019\n\n\u2018Why did you murder her?\u2019 said Julia, almost asleep.\n\n\u2018I didn\u2019t murder her. Not physically.\u2019\n\nIn the dream he had remembered his last glimpse of his mother, and within a few\nmoments of waking the cluster of small events surrounding it had all come back.\nIt was a memory that he must have deliberately pushed out of his consciousness\nover many years. He was not certain of the date, but he could not have been less\nthan ten years old, possibly twelve, when it had happened.\n\nHis father had disappeared some time earlier, how much earlier he could not\nremember. He remembered better the rackety, uneasy circumstances of the time:\nthe periodical panics about air-raids and the sheltering in Tube sta
