<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1984</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IM+Fell+English&family=Courier+Prime&display=swap');

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  :root {
    --bg: #0a0a08;
    --text: #c8c0a8;
    --dim: #3a3830;
    --accent: #e8e0c8;
    --deleted-human: rgba(200, 192, 168, 0.08);
    --deleted-ai: rgba(200, 192, 168, 0.04);
  }

  html, body {
    width: 100%;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Courier Prime', 'Courier New', monospace;
    font-size: 13px;
    line-height: 1.85;
    overflow-x: hidden;
  }

  #status {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 100;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 32px;
    background: rgba(10,10,8,0.92);
    backdrop-filter: blur(4px);
    border-bottom: 1px solid var(--dim);
    font-size: 11px;
    letter-spacing: 0.15em;
    color: var(--dim);
  }

  #status .label {
    text-transform: uppercase;
  }

  #counter {
    color: var(--text);
    font-variant-numeric: tabular-nums;
    transition: color 0.3s;
  }

  #counter.low {
    color: #c84830;
  }

  #ai-indicator {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  #ai-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--dim);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 1; background: #c8c0a8; }
  }

  #canvas {
    max-width: 680px;
    margin: 0 auto;
    padding: 80px 32px 120px;
    min-height: 100vh;
    position: relative;
    user-select: text;
    cursor: text;
  }

  #text-container {
    white-space: pre-wrap;
    word-break: break-word;
    letter-spacing: 0.02em;
  }

  .chunk {
    display: inline;
  }

  /* Selection style */
  ::selection {
    background: rgba(200, 192, 168, 0.25);
    color: var(--accent);
  }

  #delete-hint {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    color: var(--dim);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    pointer-events: none;
    opacity: 1;
    transition: opacity 1s;
  }

  #delete-hint.hidden {
    opacity: 0;
  }

  /* Delete button that appears on selection */
  #delete-btn {
    position: fixed;
    display: none;
    background: var(--bg);
    border: 1px solid var(--dim);
    color: var(--text);
    font-family: 'Courier Prime', monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 6px 14px;
    cursor: pointer;
    z-index: 200;
    transition: border-color 0.2s, color 0.2s;
  }

  #delete-btn:hover {
    border-color: var(--text);
    color: var(--accent);
  }

  /* Blank end state */
  #end-screen {
    display: none;
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 24px;
  }

  #end-screen.visible {
    display: flex;
    animation: fadeIn 3s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  #end-text {
    font-family: 'IM Fell English', serif;
    font-size: 13px;
    color: var(--dim);
    letter-spacing: 0.3em;
    text-transform: uppercase;
  }

  /* Grain overlay */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 999;
    opacity: 0.035;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    background-size: 200px;
  }
</style>
</head>

<div id="status">
  <span class="label">1984 &mdash; George Orwell</span>
  <span id="counter"></span>

<script>
const RAW = "Chapter 1\n\nI t was a bright cold day in April, and the clocks were striking thirteen.\nWinston Smith, his chin nuzzled into his breast in an effort to escape the vile\nwind, slipped quickly through the glass doors of Victory Mansions, though not\nquickly enough to prevent a swirl of gritty dust from entering along with him.\n\nThe hallway smelt of boiled cabbage and old rag mats. At one end of it a\ncoloured poster, too large for indoor display, had been tacked to the wall. It\ndepicted simply an enormous face, more than a metre wide: the face of a man of\nabout forty-five, with a heavy black moustache and ruggedly handsome features.\nWinston made for the stairs. It was no use trying the lift. Even at the best of\ntimes it was seldom working, and at present the electric current was cut off\nduring daylight hours. It was part of the economy drive in preparation for Hate\nWeek. The flat was seven flights up, and Winston, who was thirty-nine and had a\nvaricose ulcer above his right ankle, went slowly, resting several times on the\nway. On each landing, opposite the lift-shaft, the poster with the enormous face\ngazed from the wall. It was one of those pictures which are so contrived that\nthe eyes follow you about when you move. BIG BROTHER IS WATCHING YOU, the\ncaption beneath it ran.\n\nInside the flat a fruity voice was reading out a list of figures which had\nsomething to do with the production of pig-iron. The voice came from an oblong\nmetal plaque like a dulled mirror which formed part of the surface of the right-\nhand wall. Winston turned a switch and the voice sank somewhat, though the words\nwere still distinguishable. The instrument (the telescreen, it was called) could\nbe dimmed, but there was no way of shutting it off completely. He moved over to\nthe window: a smallish, frail figure, the meagreness of his body merely\nemphasized by the blue overalls which were the uniform of the party. His hair\nwas very fair, his face naturally sanguine, his skin roughened by coarse soap\nand blunt razor blades and the cold of the winter that had just ended.\n\nOutside, even through the shut window-pane, the world looked cold. Down in the\nstreet little eddies of wind were whirling dust and torn paper into spirals, and\nthough the sun was shining and the sky a harsh blue, there seemed to be no\ncolour in anything, except the posters that were plastered everywhere. The\nblackmoustachio\u2019d face gazed down from every commanding corner. There was one on\nthe house-front immediately opposite. BIG BROTHER IS WATCHING YOU, the caption\nsaid, while the dark eyes looked deep into Winston\u2019s own. Down at street level\nanother poster, torn at one corner, flapped fitfully in the wind, alternately\ncovering and uncovering the single word IN- GSOC. In the far distance a\nhelicopter skimmed down between the roofs, hovered for an instant like a\nbluebottle, and darted away again with a curving flight. It was the police\npatrol, snooping into people\u2019s windows. The patrols didnot matter, however. Only\nthe Thought Police mattered.\n\nBehind Winston\u2019s back the voice from the telescreen was still babbling away\nabout pig-iron and the overfulfilment of the Ninth Three-Year Plan. The\ntelescreen received and transmitted simultaneously. Any sound that Winston made,\nabove the level of a very low whisper, would be picked up by it, moreover, so\nlong as he remained within the field of vision which the metal plaque commanded,\nhe could be seen as well as heard. There was of course no way of knowing whether\nyou were being watched at any given moment. How often, or on what system, the\nThought Police plugged in on any individual wire was guesswork. It was even\nconceivable that they watched everybody all the time. But at any rate they could\nplug in your wire whenever they wanted to. You had to live\u2014did live, from habit\nthat became instinct\u2014in the assumption that every sound you made was overheard,\nand, except in darkness, every movement scrutinized.\n\nWinston kept his back turned to the telescreen. It was safer, though, as he well\nknew, even a back can be revealing. A kilometre away the Ministry of Truth, his\nplace of work, towered vast and white above the grimy landscape. This, he\nthought with a sort of vague distaste\u2014this was London, chief city of Airstrip\nOne, itself the third most populous of the provinces of Oceania. He tried to\nsqueeze out some childhood memory that should tell him whether London had always\nbeen quite like this. Were there always these vistas of rotting nineteenth-\ncentury houses, their sides shored up with baulks of timber, their windows\npatched with cardboard and their roofs with corrugated iron, their crazygarden\nwalls sagging in all directions? And the bombed sites where the plaster dust\nswirled in the air and the willow-herb straggled over the heaps of rubble; and\nthe places where the bombs had cleared a larger patch and there had sprung up\nsordid colonies of wooden dwellings like chicken-houses? But it was no use, he\ncould not remember: nothing remained of his childhood except a series of\nbrightlit tableaux occurring against no background and mostly unintelligible.\n\nThe Ministry of Truth\u2014Minitrue, in Newspeak [Newspeak was the official language\nof Oceania. For an account of its structure and etymology see Appendix.]\u2014was\nstartlingly different from any other object in sight. It was an enormous\npyramidal structure of glittering white concrete, soaring up, terrace after\nterrace, 300 metres into the air. From where Winston stood it was just possible\nto read, picked out on its white face in elegant lettering, the three slogans of\nthe Party:\n\nWAR IS PEACE\n\nFREEDOM IS SLAVERY\n\nIGNORANCE IS STRENGTH\n\nThe Ministry of Truth contained, it was said, three thousand rooms above ground\nlevel, and corresponding ramifications below. Scattered about London there were\njust three other buildings of similar appearance and size. So completely did\nthey dwarf the surrounding architecture that from the roof of Victory Mansions\nyou could seeall four of them simultaneously. They were the homes of the four\nMinistries between which the entire apparatus of government was divided. The\nMinistry of Truth, which concerned itself with news, entertainment, education,\nand the fine arts. The Ministry of Peace, which concerned itself with war. The\nMinistry of Love, which maintained law and order. And the Ministry of Plenty,\nwhich was responsible for economic affairs. Their names, in Newspeak: Minitrue,\nMinipax, Miniluv, and Miniplenty.\n\nThe Ministry of Love was the really frightening one. There were no windows in it\nat all. Winston had never been inside the Ministry of Love, nor within half a\nkilometre of it. It was a place impossible to enter except on official business,\nand then only by penetrating through a maze of barbedwire entanglements, steel\ndoors, and hidden machine-gun nests. Even the streets leading up to its outer\nbarriers were roamed by gorilla-faced guards in black uniforms, armed with\njointed truncheons.\n\nWinston turned round abruptly. He had set his features into the expression of\nquiet optimism which it was advisable to wear when facing the telescreen. He\ncrossed the room into the tiny kitchen. By leaving the Ministry at this time of\nday he had sacrificed his lunch in the canteen, and he was aware that there was\nno food in the kitchen except a hunk of dark-coloured bread which had got to be\nsaved for tomorrow\u2019s breakfast. He took down from the shelf a bottle of\ncolourless liquid with a plain white label marked VICTORY GIN. It gave off a\nsickly, oily smell, as of Chinese rice-spirit. Winston poured out nearly a\nteacupful, nervedhimself for a shock, and gulped it down like a dose of\nmedicine.\n\nInstantly his face turned scarlet and the water ran out of his eyes. The stuff\nwas like nitric acid, and moreover, in swallowing it one had the sensation of\nbeing hit on the back of the head with a rubber club. The next moment, however,\nthe burning in his belly died down and the world began to look more cheerful. He\ntook a cigarette from a crumpled packet marked VICTORY CIGARETTES and\nincautiously held it upright, whereupon the tobacco fell out on to the floor.\nWith the next he was more successful. He went back to the living-room and sat\ndown at a small table that stood to the left of the telescreen. From the table\ndrawer he took out a penholder, a bottle of ink, and a thick, quarto-sized blank\nbook with a red back and a marbled cover.\n\nFor some reason the telescreen in the living-room was in an unusual position.\nInstead of being placed, as was normal, in the end wall, where it could command\nthe whole room, it was in the longer wall, opposite the window. To one side of\nit there was a shallow alcove in which Winston was now sitting, and which, when\nthe flats were built, had probably been intended to hold bookshelves. By sitting\nin the alcove, and keeping well back, Winston was able to remain outside the\nrange of the telescreen, so far as sight went. He could be heard, of course, but\nso long as he stayed in his present position he could not be seen. It was partly\nthe unusual geography of the room that had suggested to him the thing that he\nwas now about to do.\n\nBut it had also been suggested by the book that he hadjust taken out of the\ndrawer. It was a peculiarly beautiful book. Its smooth creamy paper, a little\nyellowed by age, was of a kind that had not been manufactured for at least forty\nyears past. He could guess, however, that the book was much older than that. He\nhad seen it lying in the window of a frowsy little junk-shop in a slummy quarter\nof the town (just what quarter he did not now remember) and had been stricken\nimmediately by an overwhelming desire to possess it. Party members were supposed\nnot to go into ordinary shops (\u2019dealing on the free market\u2019, it was called), but\nthe rule was not strictly kept, because there were various things, such as\nshoelaces and razor blades, which it was impossible to get hold of in any other\nway. He had given a quick glance up and down the street and then had slipped\ninside and bought the book for two dollars fifty. At the time he was not\nconscious of wanting it for any particular purpose. He had carried it guiltily\nhome in his briefcase. Even with nothing written in it, it was a compromising\npossession.\n\nThe thing that he was about to do was to open a diary. This was not illegal\n(nothing was illegal, since there were no longer any laws), but if detected it\nwas reasonably certain that it would be punished by death, or at least by\ntwentyfive years in a forced-labour camp. Winston fitted a nib into the\npenholder and sucked it to get the grease off. The pen was an archaic\ninstrument, seldom used even for signatures, and he had procured one, furtively\nand with some difficulty, simply because of a feeling that the beautiful creamy\npaper deserved to be written on with a real nib instead of being scratched with\nan ink-pencil. Actually he was not used towriting by hand. Apart from very short\nnotes, it was usual to dictate everything into the speak-write which was of\ncourse impossible for his present purpose. He dipped the pen into the ink and\nthen faltered for just a second. A tremor had gone through his bowels. To mark\nthe paper was the decisive act. In small clumsy letters he wrote:\n\nApril 4th, 1984.\n\nHe sat back. A sense of complete helplessness had descended upon him. To begin\nwith, he did not know with any certainty that this was 1984. It must be round\nabout that date, since he was fairly sure that his age was thirty-nine, and he\nbelieved that he had been born in 1944 or 1945; but it was never possible\nnowadays to pin down any date within a year or two.\n\nFor whom, it suddenly occurred to him to wonder, was he writing this diary? For\nthe future, for the unborn. His mind hovered for a moment round the doubtful\ndate on the page, and then fetched up with a bump against the Newspeak word\nDOUBLETHINK. For the first time the magnitude of what he had undertaken came\nhome to him. How could you communicate with the future? It was of its nature\nimpossible. Either the future would resemble the present, in which case it would\nnot listen to him: or it would be different from it, and his predicament would\nbe meaningless.\n\nFor some time he sat gazing stupidly at the paper. The telescreen had changed\nover to strident military music. It was curious that he seemed not merely to\nhave lost the power of expressing himself, but even to have forgotten what it\nwas that he had originally intended to say. For weeks past he had been making\nready for this moment, and it had never crossed his mind that anything would be\nneeded except courage. The actual writing would be easy. All he had to do was to\ntransfer to paper the interminable restless monologue that had been running\ninside his head, literally for years. At this moment, however, even the\nmonologue had dried up. Moreover his varicose ulcer had begun itching\nunbearably. He dared not scratch it, because if he did so it always became\ninflamed. The seconds were ticking by. He was conscious of nothing except the\nblankness of the page in front of him, the itching of the skin above his ankle,\nthe blaring of the music, and a slight booziness caused by the gin.\n\nSuddenly he began writing in sheer panic, only imperfectly aware of what he was\nsetting down. His small but childish handwriting straggled up and down the page,\nshedding first its capital letters and finally even its full stops:\n\nApril 4th, 1984. Last night to the flicks. All war films. Onevery good one of a ship full of refugees being bombed\n\nsomewhere in the Mediterranean. Audience much amusedby shots of a great huge fat man trying to swim away with\n\na helicopter after him, first you saw him wallowing alongin the water like a porpoise, then you saw him through the\n\nhelicopters gunsights, then he was full of holes and the searound him turned pink and he sank as suddenly as though\n\nthe holes had let in the water, audience shouting with laughterwhen he sank. then you saw a lifeboat full of children with a\n\nhelicopter hovering over it. there was a middle-aged womanmight have been a jewess sitting up in the bow with a little\n\nboy about three years old in her arms. little boy screamingwith fright and hiding his head between her breasts as if he\n\nwas trying to burrow right into her and the woman puttingher arms round him and comforting him although she was\n\nblue with fright herself, all the time covering him up as muchas possible as if she thought her arms could keep the bullets\n\noff him. then the helicopter planted a 20 kilo bomb in amongthem terrific flash and the boat went all to matchwood. then\n\nthere was a wonderful shot of a child\u2019s arm going up up upright up into the air a helicopter with a camera in its nose\n\nmust have followed it up and there was a lot of applause fromthe party seats but a woman down in the prole part of the\n\nhouse suddenly started kicking up a fuss and shouting theydidnt oughter of showed it not in front of kids they didnt it\n\naint right not in front of kids it aint until the police turnedher turned her out i dont suppose anything happened to her\n\nnobody cares what the proles say typical prole reaction theynever\u2014\u2014\n\nWinston stopped writing, partly because he was suffering from cramp. He did not\nknow what had made him pour out this stream of rubbish. But the curious thing\nwas that while he was doing so a totally different memory had clarified itself\nin his mind, to the point where he almost felt equal to writing it down. It was,\nhe now realized, because of this other incident that he had suddenly decided to\ncomehome and begin the diary today.\n\nIt had happened that morning at the Ministry, if anything so nebulous could be\nsaid to happen.\n\nIt was nearly eleven hundred, and in the Records Department, where Winston\nworked, they were dragging the chairs out of the cubicles and grouping them in\nthe centre of the hall opposite the big telescreen, in preparation for the Two\nMinutes Hate. Winston was just taking his place in one of the middle rows when\ntwo people whom he knew by sight, but had never spoken to, came unexpectedly\ninto the room. One of them was a girl whom he often passed in the corridors. He\ndid not know her name, but he knew that she worked in the Fiction Department.\nPresumably\u2014since he had sometimes seen her with oily hands and carrying a\nspanner\u2014she had some mechanical job on one of the novel-writing machines. She\nwas a bold-looking girl, of about twenty-seven, with thick hair, a freckled\nface, and swift, athletic movements. A narrow scarlet sash, emblem of the Junior\nAnti-Sex League, was wound several times round the waist of her overalls, just\ntightly enough to bring out the shapeliness of her hips. Winston had disliked\nher from the very first moment of seeing her. He knew the reason. It was because\nof the atmosphere of hockey-fields and cold baths and community hikes and\ngeneral clean-mindedness which she managed to carry about with her. He disliked\nnearly all women, and especially the young and pretty ones. It was always the\nwomen, and above all the young ones, who were the most bigoted adherents of the\nParty, the swallowers of slogans, the amateur spies and nosers-out of\nunorthodoxy. But this particular girl gave him the impression of being more\ndangerous than most. Once when they passed in the corridor she gave him a quick\nsidelong glance which seemed to pierce right into him and for a moment had\nfilled him with black terror. The idea had even crossed his mind that she might\nbe an agent of the Thought Police. That, it was true, was very unlikely. Still,\nhe continued to feel a peculiar uneasiness, which had fear mixed up in it as\nwell as hostility, whenever she was anywhere near him.\n\nThe other person was a man named O\u2019Brien, a member of the Inner Party and holder\nof some post so important and remote that Winston had only a dim idea of its\nnature. A momentary hush passed over the group of people round the chairs as\nthey saw the black overalls of an Inner Party member approaching. O\u2019Brien was a\nlarge, burly man with a thick neck and a coarse, humorous, brutal face. In spite\nof his formidable appearance he had a certain charm of manner. He had a trick of\nresettling his spectacles on his nose which was curiously disarming\u2014in some\nindefinable way, curiously civilized. It was a gesture which, if anyone had\nstill thought in such terms, might have recalled an eighteenth-century nobleman\noffering his snuffbox. Winston had seen O\u2019Brien perhaps a dozen times in almost\nas many years. He felt deeply drawn to him, and not solely because he was\nintrigued by the contrast between O\u2019Brien\u2019s urbane manner and his prize-\nfighter\u2019s physique. Much more it was because of a secretly held belief\u2014or\nperhaps not even a belief, merely a hope\u2014that O\u2019Brien\u2019s political orthodoxy was\nnot perfect. Something in his face suggested it irresistibly.\n\nAnd again, perhaps it was not even unorthodoxy that was written in his face, but\nsimply intelligence. But at any rate he had the appearance of being a person\nthat you could talk to if somehow you could cheat the telescreen and get him\nalone. Winston had never made the smallest effort to verify this guess: indeed,\nthere was no way of doing so. At this moment O\u2019Brien glanced at his wrist-watch,\nsaw that it was nearly eleven hundred, and evidently decided to stay in the\nRecords Department until the Two Minutes Hate was over. He took a chair in the\nsame row as Winston, a couple of places away. A small, sandy-haired woman who\nworked in the next cubicle to Winston was between them. The girl with dark hair\nwas sitting immediately behind.\n\nThe next moment a hideous, grinding speech, as of some monstrous machine running\nwithout oil, burst from the big telescreen at the end of the room. It was a\nnoise that set one\u2019s teeth on edge and bristled the hair at the back of one\u2019s\nneck. The Hate had started.\n\nAs usual, the face of Emmanuel Goldstein, the Enemy of the People, had flashed\non to the screen. There were hisses here and there among the audience. The\nlittle sandy-haired woman gave a squeak of mingled fear and disgust. Goldstein\nwas the renegade and backslider who once, long ago (how long ago, nobody quite\nremembered), had been one of the leading figures of the Party, almost on a level\nwith Big Brother himself, and then had engaged in counter-revolutionary\nactivities, had been condemned to death, and had mysteriously escaped and\ndisappeared. The programmes of the Two Minutes Hate varied from day to day, but\nthere wasnone in which Goldstein was not the principal figure. He was the primal\ntraitor, the earliest defiler of the Party\u2019s purity. All subsequent crimes\nagainst the Party, all treacheries, acts of sabotage, heresies, deviations,\nsprang directly out of his teaching. Somewhere or other he was still alive and\nhatching his conspiracies: perhaps somewhere beyond the sea, under the\nprotection of his foreign paymasters, perhaps even\u2014so it was occasionally\nrumoured\u2014in some hidingplace in Oceania itself.\n\nWinston\u2019s diaphragm was constricted. He could never see the face of Goldstein\nwithout a painful mixture of emotions. It was a lean Jewish face, with a great\nfuzzy aureole of white hair and a small goatee beard\u2014a clever face, and yet\nsomehow inherently despicable, with a kind of senile silliness in the long thin\nnose, near the end of which a pair of spectacles was perched. It resembled the\nface of a sheep, and the voice, too, had a sheep-like quality. Goldstein was\ndelivering his usual venomous attack upon the doctrines of the Party\u2014an attack\nso exaggerated and perverse that a child should have been able to see through\nit, and yet just plausible enough to fill one with an alarmed feeling that other\npeople, less level-headed than oneself, might be taken in by it. He was abusing\nBig Brother, he was denouncing the dictatorship of the Party, he was demanding\nthe immediate conclusion of peace with Eurasia, he was advocating freedom of\nspeech, freedom of the Press, freedom of assembly, freedom of thought, he was\ncrying hysterically that the revolution had been betrayed\u2014and all this in rapid\npolysyllabic speech which was a sort of parody of the habitual style of the\norators of the Party, and even contained Newspeak words: more Newspeak words,\nindeed, than any Party member would normally use in real life. And all the\nwhile, lest one should be in any doubt as to the reality which Goldstein\u2019s\nspecious claptrap covered, behind his head on the telescreen there marched the\nendless columns of the Eurasian army\u2014row after row of solid-looking men with\nexpressionless Asiatic faces, who swam up to the surface of the screen and\nvanished, to be replaced by others exactly similar. The dull rhythmic tramp of\nthe soldiers\u2019 boots formed the background to Goldstein\u2019s bleating voice.\n\nBefore the Hate had proceeded for thirty seconds, uncontrollable exclamations of\nrage were breaking out from half the people in the room. The self-satisfied\nsheep-like face on the screen, and the terrifying power of the Eurasian army\nbehind it, were too much to be borne: besides, the sight or even the thought of\nGoldstein produced fear and anger automatically. He was an object of hatred more\nconstant than either Eurasia or Eastasia, since when Oceania was at war with one\nof these Powers it was generally at peace with the other. But what was strange\nwas that although Goldstein was hated and despised by everybody, although every\nday and a thousand times a day, on platforms, on the telescreen, in newspapers,\nin books, his theories were refuted, smashed, ridiculed, held up to the general\ngaze for the pitiful rubbish that they were\u2014in spite of all this, his influence\nnever seemed to grow less. Always there were fresh dupes waiting to be seduced\nby him. A day never passed when spies and saboteurs acting under his directions\nwere not unmaskedby the Thought Police. He was the commander of a vast shadowy\narmy, an underground network of conspirators dedicated to the overthrow of the\nState. The Brotherhood, its name was supposed to be. There were also whispered\nstories of a terrible book, a compendium of all the heresies, of which Goldstein\nwas the author and which circulated clandestinely here and there. It was a book\nwithout a title. People referred to it, if at all, simply as THE BOOK. But one\nknew of such things only through vague rumours. Neither the Brotherhood nor THE\nBOOK was a subject that any ordinary Party member would mention if there was a\nway of avoiding it.\n\nIn its second minute the Hate rose to a frenzy. People were leaping up and down\nin their places and shouting at the tops of their voices in an effort to drown\nthe maddening bleating voice that came from the screen. The little sandy-haired\nwoman had turned bright pink, and her mouth was opening and shutting like that\nof a landed fish. Even O\u2019Brien\u2019s heavy face was flushed. He was sitting very\nstraight in his chair, his powerful chest swelling and quivering as though he\nwere standing up to the assault of a wave. The dark-haired girl behind Winston\nhad begun crying out \u2018Swine! Swine! Swine!\u2019 and suddenly she picked up a heavy\nNewspeak dictionary and flung it at the screen. It struck Goldstein\u2019s nose and\nbounced off; the voice continued inexorably. In a lucid moment Winston found\nthat he was shouting with the others and kicking his heel violently against the\nrung of his chair. The horrible thing about the Two Minutes Hate was not that\none was obliged to acta part, but, on the contrary, that it was impossible to\navoid joining in. Within thirty seconds any pretence was always unnecessary. A\nhideous ecstasy of fear and vindictiveness, a desire to kill, to torture, to\nsmash faces in with a sledgehammer, seemed to flow through the whole group of\npeople like an electric current, turning one even against one\u2019s will into a\ngrimacing, screaming lunatic. And yet the rage that one felt was an abstract,\nundirected emotion which could be switched from one object to another like the\nflame of a blowlamp. Thus, at one moment Winston\u2019s hatred was not turned against\nGoldstein at all, but, on the contrary, against Big Brother, the Party, and the\nThought Police; and at such moments his heart went out to the lonely, derided\nheretic on the screen, sole guardian of truth and sanity in a world of lies. And\nyet the very next instant he was at one with the people about him, and all that\nwas said of Goldstein seemed to him to be true. At those moments his secret\nloathing of Big Brother changed into adoration, and Big Brother seemed to tower\nup, an invincible, fearless protector, standing like a rock against the hordes\nof Asia, and Goldstein, in spite of his isolation, his helplessness, and the\ndoubt that hung about his very existence, seemed like some sinister enchanter,\ncapable by the mere power of his voice of wrecking the structure of\ncivilization.\n\nIt was even possible, at moments, to switch one\u2019s hatred this way or that by a\nvoluntary act. Suddenly, by the sort of violent effort with which one wrenches\none\u2019s head away from the pillow in a nightmare, Winston succeeded in\ntransferring his hatred from the face on the screen tothe dark-haired girl\nbehind him. Vivid, beautiful hallucinations flashed through his mind. He would\nflog her to death with a rubber truncheon. He would tie her naked to a stake and\nshoot her full of arrows like Saint Sebastian. He would ravish her and cut her\nthroat at the moment of climax. Better than before, moreover, he realized WHY it\nwas that he hated her. He hated her because she was young and pretty and\nsexless, because he wanted to go to bed with her and would never do so, because\nround her sweet supple waist, which seemed to ask you to encircle it with your\narm, there was only the odious scarlet sash, aggressive symbol of chastity.\n\nThe Hate rose to its climax. The voice of Goldstein had become an actual sheep\u2019s\nbleat, and for an instant the face changed into that of a sheep. Then the sheep-\nface melted into the figure of a Eurasian soldier who seemed to be advancing,\nhuge and terrible, his sub-machine gun roaring, and seeming to spring out of the\nsurface of the screen, so that some of the people in the front row actually\nflinched backwards in their seats. But in the same moment, drawing a deep sigh\nof relief from everybody, the hostile figure melted into the face of Big\nBrother, black-haired, black-moustachio\u2019d, full of power and mysterious calm,\nand so vast that it almost filled up the screen. Nobody heard what Big Brother\nwas saying. It was merely a few words of encouragement, the sort of words that\nare uttered in the din of battle, not distinguishable individually but restoring\nconfidence by the fact of being spoken. Then the face of Big Brother faded away\nagain, and instead the three slogans of the Party stood outin bold capitals:\n\nWAR IS PEACE\n\nFREEDOM IS SLAVERY\n\nIGNORANCE IS STRENGTH\n\nBut the face of Big Brother seemed to persist for several seconds on the screen,\nas though the impact that it had made on everyone\u2019s eyeballs was too vivid to\nwear off immediately. The little sandy-haired woman had flung herself forward\nover the back of the chair in front of her. With a tremulous murmur that sounded\nlike \u2018My Saviour!\u2019 she extended her arms towards the screen. Then she buried her\nface in her hands. It was apparent that she was uttering a prayer.\n\nAt this moment the entire group of people broke into a deep, slow, rhythmical\nchant of \u2018B-B!...B-B!\u2019\u2014over and over again, very slowly, with a long pause\nbetween the first \u2018B\u2019 and the second\u2014a heavy, murmurous sound, somehow curiously\nsavage, in the background of which one seemed to hear the stamp of naked feet\nand the throbbing of tomtoms. For perhaps as much as thirty seconds they kept it\nup. It was a refrain that was often heard in moments of overwhelming emotion.\nPartly it was a sort of hymn to the wisdom and majesty of Big Brother, but still\nmore it was an act of self-hypnosis, a deliberate drowning of consciousness by\nmeans of rhythmic noise. Winston\u2019s entrails seemed to grow cold. In the Two\nMinutes Hate he could not help sharing in the general delirium, but this sub-\nhuman chanting of \u2018B-B!...B-B!\u2019 always filled him with horror. Of course he\nchanted with the rest: it was impossible to do otherwise. To dissemble your\nfeelings, to control your face, to do what everyone else was doing, was an\ninstinctive reaction. But there was a space of a couple of seconds during which\nthe expression of his eyes might conceivably have betrayed him. And it was\nexactly at this moment that the significant thing happened\u2014if, indeed, it did\nhappen.\n\nMomentarily he caught O\u2019Brien\u2019s eye. O\u2019Brien had stood up. He had taken off his\nspectacles and was in the act of resettling them on his nose with his\ncharacteristic gesture. But there was a fraction of a second when their eyes\nmet, and for as long as it took to happen Winston knew\u2014yes, he KNEW!\u2014that\nO\u2019Brien was thinking the same thing as himself. An unmistakable message had\npassed. It was as though their two minds had opened and the thoughts were\nflowing from one into the other through their eyes. \u2018I am with you,\u2019 O\u2019Brien\nseemed to be saying to him. \u2018I know precisely what you are feeling. I know all\nabout your contempt, your hatred, your disgust. But don\u2019t worry, I am on your\nside!\u2019 And then the flash of intelligence was gone, and O\u2019Brien\u2019s face was as\ninscrutable as everybody else\u2019s.\n\nThat was all, and he was already uncertain whether it had happened. Such\nincidents never had any sequel. All that they did was to keep alive in him the\nbelief, or hope, that others besides himself were the enemies of the Party.\nPerhaps the rumours of vast underground conspiracies were true after all\u2014perhaps\nthe Brotherhood really existed! It was impossible, in spite of the endless\narrests and confessionsand executions, to be sure that the Brotherhood was not\nsimply a myth. Some days he believed in it, some days not. There was no\nevidence, only fleeting glimpses that might mean anything or nothing: snatches\nof overheard conversation, faint scribbles on lavatory walls\u2014once, even, when\ntwo strangers met, a small movement of the hand which had looked as though it\nmight be a signal of recognition. It was all guesswork: very likely he had\nimagined everything. He had gone back to his cubicle without looking at O\u2019Brien\nagain. The idea of following up their momentary contact hardly crossed his mind.\nIt would have been inconceivably dangerous even if he had known how to set about\ndoing it. For a second, two seconds, they had exchanged an equivocal glance, and\nthat was the end of the story. But even that was a memorable event, in the\nlocked loneliness in which one had to live.\n\nWinston roused himself and sat up straighter. He let out a belch. The gin was\nrising from his stomach.\n\nHis eyes re-focused on the page. He discovered that while he sat helplessly\nmusing he had also been writing, as though by automatic action. And it was no\nlonger the same cramped, awkward handwriting as before. His pen had slid\nvoluptuously over the smooth paper, printing in large neat capitals\u2014DOWN WITH\nBIG BROTHER DOWN WITH BIG BROTHER DOWN WITH BIG BROTHER DOWN WITH BIG BROTHER\nDOWN WITH BIG BROTHERover and over again, filling half a page.\n\nHe could not help feeling a twinge of panic. It was absurd, since the writing of\nthose particular words was notmore dangerous than the initial act of opening the\ndiary, but for a moment he was tempted to tear out the spoiled pages and abandon\nthe enterprise altogether.\n\nHe did not do so, however, because he knew that it was useless. Whether he wrote\nDOWN WITH BIG BROTHER, or whether he refrained from writing it, made no\ndifference. Whether he went on with the diary, or whether he did not go on with\nit, made no difference. The Thought Police would get him just the same. He had\ncommitted\u2014would still have committed, even if he had never set pen to paper\u2014the\nessential crime that contained all others in itself. Thoughtcrime, they called\nit. Thoughtcrime was not a thing that could be concealed for ever. You might\ndodge successfully for a while, even for years, but sooner or later they were\nbound to get you.\n\nIt was always at night\u2014the arrests invariably happened at night. The sudden jerk\nout of sleep, the rough hand shaking your shoulder, the lights glaring in your\neyes, the ring of hard faces round the bed. In the vast majority of cases there\nwas no trial, no report of the arrest. People simply disappeared, always during\nthe night. Your name was removed from the registers, every record of everything\nyou had ever done was wiped out, your one-time existence was denied and then\nforgotten. You were abolished, annihilated: VA- PORIZED was the usual word.\n\nFor a moment he was seized by a kind of hysteria. He began writing in a hurried\nuntidy scrawl:\n\ntheyll shoot me i don\u2019t care theyll shoot me in the back of theneck i dont care down with big brother they always shoot you\n\nin the back of the neck i dont care down with big brother\u2014\u2014\n\nHe sat back in his chair, slightly ashamed of himself, and laid down the pen.\nThe next moment he started violently. There was a knocking at the door.\n\nAlready! He sat as still as a mouse, in the futile hope that whoever it was\nmight go away after a single attempt. But no, the knocking was repeated. The\nworst thing of all would be to delay. His heart was thumping like a drum, but\nhis face, from long habit, was probably expressionless. He got up and moved\nheavily towards the door.\n\nChapter 2\n\nA     s he put his hand to the door-knob Winston saw thathe had left the diary\nopen on the table. DOWN WITH BIG BROTHER was written all over it, in letters\nalmost big enough to be legible across the room. It was an inconceivably stupid\nthing to have done. But, he realized, even in his panic he had not wanted to\nsmudge the creamy paper by shutting the book while the ink was wet.\n\nHe drew in his breath and opened the door. Instantly a warm wave of relief\nflowed through him. A colourless, crushed-looking woman, with wispy hair and a\nlined face, was standing outside.\n\n\u2018Oh, comrade,\u2019 she began in a dreary, whining sort of voice, \u2018I thought I heard\nyou come in. Do you think you could come across and have a look at our kitchen\nsink? It\u2019s got blocked up and\u2014\u2014\u2019\n\nIt was Mrs Parsons, the wife of a neighbour on the same floor. (\u2019Mrs\u2019 was a word\nsomewhat discountenanced by the Party\u2014you were supposed to call everyone\n\u2018comrade\u2019\u2014 but with some women one used it instinctively.) She was a woman of\nabout thirty, but looking much older. One had the impression that there was dust\nin the creases of her face. Winston followed her down the passage. These amateur\nrepair jobs were an almost daily irritation. Victory Mansions were old flats,\nbuilt in 1930 or thereabouts, and were fallingto pieces. The plaster flaked\nconstantly from ceilings and walls, the pipes burst in every hard frost, the\nroof leaked whenever there was snow, the heating system was usually running at\nhalf steam when it was not closed down altogether from motives of economy.\nRepairs, except what you could do for yourself, had to be sanctioned by remote\ncommittees which were liable to hold up even the mending of a window-pane for\ntwo years.\n\n\u2018Of course it\u2019s only because Tom isn\u2019t home,\u2019 said Mrs Parsons vaguely.\n\nThe Parsons\u2019 flat was bigger than Winston\u2019s, and dingy in a different way.\nEverything had a battered, trampled-on look, as though the place had just been\nvisited by some large violent animal. Games impedimenta\u2014hockey-sticks, boxing-\ngloves, a burst football, a pair of sweaty shorts turned inside out\u2014lay all over\nthe floor, and on the table there was a litter of dirty dishes and dog-eared\nexercise-books. On the walls were scarlet banners of the Youth League and the\nSpies, and a full-sized poster of Big Brother. There was the usual boiled-\ncabbage smell, common to the whole building, but it was shot through by a\nsharper reek of sweat, which\u2014 one knew this at the first sniff, though it was\nhard to say how\u2014was the sweat of some person not present at the moment. In\nanother room someone with a comb and a piece of toilet paper was trying to keep\ntune with the military music which was still issuing from the telescreen.\n\n\u2018It\u2019s the children,\u2019 said Mrs Parsons, casting a half-apprehensive glance at the\ndoor. \u2018They haven\u2019t been out today. And of course\u2014\u2014\u2019\n\nShe had a habit of breaking off her sentences in the middle. The kitchen sink\nwas full nearly to the brim with filthy greenish water which smelt worse than\never of cabbage. Winston knelt down and examined the angle-joint of the pipe. He\nhated using his hands, and he hated bending down, which was always liable to\nstart him coughing. Mrs Parsons looked on helplessly.\n\n\u2018Of course if Tom was home he\u2019d put it right in a moment,\u2019 she said. \u2018He loves\nanything like that. He\u2019s ever so good with his hands, Tom is.\u2019\n\nParsons was Winston\u2019s fellow-employee at the Ministry of Truth. He was a fattish\nbut active man of paralysing stupidity, a mass of imbecile enthusiasms\u2014one of\nthose completely unquestioning, devoted drudges on whom, more even than on the\nThought Police, the stability of the Party depended. At thirty-five he had just\nbeen unwillingly evicted from the Youth League, and before graduating into the\nYouth League he had managed to stay on in the Spies for a year beyond the\nstatutory age. At the Ministry he was employed in some subordinate post for\nwhich intelligence was not required, but on the other hand he was a leading\nfigure on the Sports Committee and all the other committees engaged in\norganizing community hikes, spontaneous demonstrations, savings campaigns, and\nvoluntary activities generally. He would inform you with quiet pride, between\nwhiffs of his pipe, that he had put in an appearance at the Community Centre\nevery evening for the past four years. An overpowering smell of sweat, a sort of\nunconscious testimony to the strenuousness of his life, followedhim about\nwherever he went, and even remained behind him after he had gone.\n\n\u2018Have you got a spanner?\u2019 said Winston, fiddling with the nut on the angle-\njoint.\n\n\u2018A spanner,\u2019 said Mrs Parsons, immediately becoming invertebrate. \u2018I don\u2019t know,\nI\u2019m sure. Perhaps the children\u2014 \u2014\u2019\n\nThere was a trampling of boots and another blast on the comb as the children\ncharged into the living-room. Mrs Parsons brought the spanner. Winston let out\nthe water and disgustedly removed the clot of human hair that had blocked up the\npipe. He cleaned his fingers as best he could in the cold water from the tap and\nwent back into the other room.\n\n\u2018Up with your hands!\u2019 yelled a savage voice.\n\nA handsome, tough-looking boy of nine had popped up from behind the table and\nwas menacing him with a toy automatic pistol, while his small sister, about two\nyears younger, made the same gesture with a fragment of wood. Both of them were\ndressed in the blue shorts, grey shirts, and red neckerchiefs which were the\nuniform of the Spies. Winston raised his hands above his head, but with an\nuneasy feeling, so vicious was the boy\u2019s demeanour, that it was not altogether a\ngame.\n\n\u2018You\u2019re a traitor!\u2019 yelled the boy. \u2018You\u2019re a thought-criminal! You\u2019re a\nEurasian spy! I\u2019ll shoot you, I\u2019ll vaporize you, I\u2019ll send you to the salt\nmines!\u2019\n\nSuddenly they were both leaping round him, shouting \u2018Traitor!\u2019 and \u2018Thought-\ncriminal!\u2019 the little girl imitatingher brother in every movement. It was\nsomehow slightly frightening, like the gambolling of tiger cubs which will soon\ngrow up into man-eaters. There was a sort of calculating ferocity in the boy\u2019s\neye, a quite evident desire to hit or kick Winston and a consciousness of being\nvery nearly big enough to do so. It was a good job it was not a real pistol he\nwas holding, Winston thought.\n\nMrs Parsons\u2019 eyes flitted nervously from Winston to the children, and back\nagain. In the better light of the livingroom he noticed with interest that there\nactually was dust in the creases of her face.\n\n\u2018They do get so noisy,\u2019 she said. \u2018They\u2019re disappointed because they couldn\u2019t go\nto see the hanging, that\u2019s what it is. I\u2019m too busy to take them. and Tom won\u2019t\nbe back from work in time.\u2019\n\n\u2018Why can\u2019t we go and see the hanging?\u2019 roared the boy in his huge voice.\n\n\u2018Want to see the hanging! Want to see the hanging!\u2019 chanted the little girl,\nstill capering round.\n\nSome Eurasian prisoners, guilty of war crimes, were to be hanged in the Park\nthat evening, Winston remembered. This happened about once a month, and was a\npopular spectacle. Children always clamoured to be taken to see it. He took his\nleave of Mrs Parsons and made for the door. But he had not gone six steps down\nthe passage when something hit the back of his neck an agonizingly painful blow.\nIt was as though a red-hot wire had been jabbed into him. He spun round just in\ntime to see Mrs Parsons dragging her son back into the doorway while the boy\npocketed a catapult.\n\n\u2018Goldstein!\u2019 bellowed the boy as the door closed on him. But what most struck\nWinston was the look of helpless fright on the woman\u2019s greyish face.\n\nBack in the flat he stepped quickly past the telescreen and sat down at the\ntable again, still rubbing his neck. The music from the telescreen had stopped.\nInstead, a clipped military voice was reading out, with a sort of brutal relish,\na description of the armaments of the new Floating Fortress which had just been\nanchored between Iceland and the Faroe lslands.\n\nWith those children, he thought, that wretched woman must lead a life of terror.\nAnother year, two years, and they would be watching her night and day for\nsymptoms of unorthodoxy. Nearly all children nowadays were horrible. What was\nworst of all was that by means of such organizations as the Spies they were\nsystematically turned into ungovernable little savages, and yet this produced in\nthem no tendency whatever to rebel against the discipline of the Party. On the\ncontrary, they adored the Party and everything connected with it. The songs, the\nprocessions, the banners, the hiking, the drilling with dummy rifles, the\nyelling of slogans, the worship of Big Brother\u2014it was all a sort of glorious\ngame to them. All their ferocity was turned outwards, against the enemies of the\nState, against foreigners, traitors, saboteurs, thought-criminals. It was almost\nnormal for people over thirty to be frightened of their own children. And with\ngood reason, for hardly a week passed in which \u2018The Times\u2019 did not carry a\nparagraph describing how some eavesdropping little sneak\u2014\u2019child hero\u2019 was\nthephrase generally used\u2014had overheard some compromising remark and denounced\nits parents to the Thought Police.\n\nThe sting of the catapult bullet had worn off. He picked up his pen half-\nheartedly, wondering whether he could find something more to write in the diary.\nSuddenly he began thinking of O\u2019Brien again.\n\nYears ago\u2014how long was it? Seven years it must be\u2014he had dreamed that he was\nwalking through a pitch-dark room. And someone sitting to one side of him had\nsaid as he passed: \u2018We shall meet in the place where there is no darkness.\u2019 It\nwas said very quietly, almost casually\u2014a statement, not a command. He had walked\non without pausing. What was curious was that at the time, in the dream, the\nwords had not made much impression on him. It was only later and by degrees that\nthey had seemed to take on significance. He could not now remember whether it\nwas before or after having the dream that he had seen O\u2019Brien for the first\ntime, nor could he remember when he had first identified the voice as O\u2019Brien\u2019s.\nBut at any rate the identification existed. It was O\u2019Brien who had spoken to him\nout of the dark.\n\nWinston had never been able to feel sure\u2014even after this morning\u2019s flash of the\neyes it was still impossible to be sure whether O\u2019Brien was a friend or an\nenemy. Nor did it even seem to matter greatly. There was a link of understanding\nbetween them, more important than affection or partisanship. \u2018We shall meet in\nthe place where there is no darkness,\u2019 he had said. Winston did not know what it\nmeant, only that in some way or another it would come true.\n\nThe voice from the telescreen paused. A trumpet call, clear and beautiful,\nfloated into the stagnant air. The voice continued raspingly:\n\n\u2019Attention! Your attention, please! A newsflash has thismoment arrived from the Malabar front. Our forces in South\n\nIndia have won a glorious victory. I am authorized to saythat the action we are now reporting may well bring the war\n\nwithin measurable distance of its end. Here is the newsflash\u2014 \u2014\u2019\n\nBad news coming, thought Winston. And sure enough, following on a gory\ndescription of the annihilation of a Eurasian army, with stupendous figures of\nkilled and prisoners, came the announcement that, as from next week, the\nchocolate ration would be reduced from thirty grammes to twenty.\n\nWinston belched again. The gin was wearing off, leaving a deflated feeling. The\ntelescreen\u2014perhaps to celebrate the victory, perhaps to drown the memory of the\nlost chocolate\u2014 crashed into \u2018Oceania, \u2018tis for thee\u2019. You were supposed to\nstand to attention. However, in his present position he was invisible.\n\n\u2018Oceania, \u2018tis for thee\u2019 gave way to lighter music. Winston walked over to the\nwindow, keeping his back to the telescreen. The day was still cold and clear.\nSomewhere far away a rocket bomb exploded with a dull, reverberating roar. About\ntwenty or thirty of them a week were falling on London at present.\n\nDown in the street the wind flapped the torn poster to and fro, and the word\nINGSOC fitfully appeared and vanished. Ingsoc. The sacred principles of Ingsoc.\nNewspeak, doublethink, the mutability of the past. He felt as though he were\nwandering in the forests of the sea bottom, lost in a monstrous world where he\nhimself was the monster. He was alone. The past was dead, the future was\nunimaginable. What certainty had he that a single human creature now living was\non his side? And what way of knowing that the dominion of the Party would not\nendure FOR EVER? Like an answer, the three slogans on the white face of the\nMinistry of Truth came back to him:\n\nWAR IS PEACE\n\nFREEDOM IS SLAVERY\n\nIGNORANCE IS STRENGTH\n\nHe took a twenty-five cent piece out of his pocket. There, too, in tiny clear\nlettering, the same slogans were inscribed, and on the other face of the coin\nthe head of Big Brother. Even from the coin the eyes pursued you. On coins, on\nstamps, on the covers of books, on banners, on posters, and on the wrappings of\na cigarette packet\u2014everywhere. Always the eyes watching you and the voice\nenveloping you. Asleep or awake, working or eating, indoors or out of doors, in\nthe bath or in bed\u2014no escape. Nothing was your own except the few cubic\ncentimetres inside your skull.\n\nThe sun had shifted round, and the myriad windows of the Ministry of Truth, with\nthe light no longer shining onthem, looked grim as the loopholes of a fortress.\nHis heart quailed before the enormous pyramidal shape. It was too strong, it\ncould not be stormed. A thousand rocket bombs would not batter it down. He\nwondered again for whom he was writing the diary. For the future, for the\npast\u2014for an age that might be imaginary. And in front of him there lay not death\nbut annihilation. The diary would be reduced to ashes and himself to vapour.\nOnly the Thought Police would read what he had written, before they wiped it out\nof existence and out of memory. How could you make appeal to the future when not\na trace of you, not even an anonymous word scribbled on a piece of paper, could\nphysically survive?\n\nThe telescreen struck fourteen. He must leave in ten minutes. He had to be back\nat work by fourteen-thirty.\n\nCuriously, the chiming of the hour seemed to have put new heart into him. He was\na lonely ghost uttering a truth that nobody would ever hear. But so long as he\nuttered it, in some obscure way the continuity was not broken. It was not by\nmaking yourself heard but by staying sane that you carried on the human\nheritage. He went back to the table, dipped his pen, and wrote:\n\nTo the future or to the past, to a time when thought isfree, when men are different from one another and do not\n\nlive alone\u2014to a time when truth exists and what is donecannot be undone: From the age of uniformity, from the\n\nage of solitude, from the age of Big Brother, from the age ofdoublethink\u2014greetings!\n\nHe was already dead, he reflected. It seemed to him that it was only now, when\nhe had begun to be able to formulate his thoughts, that he had taken the\ndecisive step. The consequences of every act are included in the act itself. He\nwrote:\n\nThoughtcrime does not entail death: thoughtcrime IS death.\n\nNow he had recognized himself as a dead man it became important to stay alive as\nlong as possible. Two fingers of his right hand were inkstained. It was exactly\nthe kind of detail that might betray you. Some nosing zealot in the Ministry (a\nwoman, probably: someone like the little sandy-haired woman or the dark-haired\ngirl from the Fiction Department) might start wondering why he had been writing\nduring the lunch interval, why he had used an old-fashioned pen, WHAT he had\nbeen writing\u2014and then drop a hint in the appropriate quarter. He went to the\nbathroom and carefully scrubbed the ink away with the gritty darkbrown soap\nwhich rasped your skin like sandpaper and was therefore well adapted for this\npurpose.\n\nHe put the diary away in the drawer. It was quite useless to think of hiding it,\nbut he could at least make sure whether or not its existence had been\ndiscovered. A hair laid across the page-ends was too obvious. With the tip of\nhis finger he picked up an identifiable grain of whitish dust and deposited it\non the corner of the cover, where it was bound to be shaken off if the book was\nmoved.\n\nChapter 3\n\nW      inston was dreaming of his mother.\n\nHe must, he thought, have been ten or eleven years old when his mother had\ndisappeared. She was a tall, statuesque, rather silent woman with slow movements\nand magnificent fair hair. His father he remembered more vaguely as dark and\nthin, dressed always in neat dark clothes (Winston remembered especially the\nvery thin soles of his father\u2019s shoes) and wearing spectacles. The two of them\nmust evidently have been swallowed up in one of the first great purges of the\nfifties.\n\nAt this moment his mother was sitting in some place deep down beneath him, with\nhis young sister in her arms. He did not remember his sister at all, except as a\ntiny, feeble baby, always silent, with large, watchful eyes. Both of them were\nlooking up at him. They were down in some subterranean place\u2014the bottom of a\nwell, for instance, or a very deep grave\u2014but it was a place which, already far\nbelow him, was itself moving downwards. They were in the saloon of a sinking\nship, looking up at him through the darkening water. There was still air in the\nsaloon, they could still see him and he them, but all the while they were\nsinking down, down into the green waters which in another moment must hide them\nfrom sight for ever. He was out in the light and air while they were being\nsucked down to death, and theywere down there because he was up here. He knew it\nand they knew it, and he could see the knowledge in their faces. There was no\nreproach either in their faces or in their hearts, only the knowledge that they\nmust die in order that he might remain alive, and that this was part of the\nunavoidable order of things.\n\nHe could not remember what had happened, but he knew in his dream that in some\nway the lives of his mother and his sister had been sacrificed to his own. It\nwas one of those dreams which, while retaining the characteristic dream scenery,\nare a continuation of one\u2019s intellectual life, and in which one becomes aware of\nfacts and ideas which still seem new and valuable after one is awake. The thing\nthat now suddenly struck Winston was that his mother\u2019s death, nearly thirty\nyears ago, had been tragic and sorrowful in a way that was no longer possible.\nTragedy, he perceived, belonged to the ancient time, to a time when there was\nstill privacy, love, and friendship, and when the members of a family stood by\none another without needing to know the reason. His mother\u2019s memory tore at his\nheart because she had died loving him, when he was too young and selfish to love\nher in return, and because somehow, he did not remember how, she had sacrificed\nherself to a conception of loyalty that was private and unalterable. Such\nthings, he saw, could not happen today. Today there were fear, hatred, and pain,\nbut no dignity of emotion, no deep or complex sorrows. All this he seemed to see\nin the large eyes of his mother and his sister, looking up at him through the\ngreen water, hundreds of fathoms down and still sinking.\n\nSuddenly he was standing on short springy turf, on a summer evening when the\nslanting rays of the sun gilded the ground. The landscape that he was looking at\nrecurred so often in his dreams that he was never fully certain whether or not\nhe had seen it in the real world. In his waking thoughts he called it the Golden\nCountry. It was an old, rabbit-bitten pasture, with a foot-track wandering\nacross it and a molehill here and there. In the ragged hedge on the opposite\nside of the field the boughs of the elm trees were swaying very faintly in the\nbreeze, their leaves just stirring in dense masses like women\u2019s hair. Somewhere\nnear at hand, though out of sight, there was a clear, slow-moving stream where\ndace were swimming in the pools under the willow trees.\n\nThe girl with dark hair was coming towards them across the field. With what\nseemed a single movement she tore off her clothes and flung them disdainfully\naside. Her body was white and smooth, but it aroused no desire in him, indeed he\nbarely looked at it. What overwhelmed him in that instant was admiration for the\ngesture with which she had thrown her clothes aside. With its grace and\ncarelessness it seemed to annihilate a whole culture, a whole system of thought,\nas though Big Brother and the Party and the Thought Police could all be swept\ninto nothingness by a single splendid movement of the arm. That too was a\ngesture belonging to the ancient time. Winston woke up with the word\n\u2018Shakespeare\u2019 on his lips.\n\nThe telescreen was giving forth an ear-splitting whistle which continued on the\nsame note for thirty seconds. Itwas nought seven fifteen, getting-up time for\noffice workers. Winston wrenched his body out of bed\u2014naked, for a member of the\nOuter Party received only 3,000 clothing coupons annually, and a suit of pyjamas\nwas 600\u2014and seized a dingy singlet and a pair of shorts that were lying across a\nchair. The Physical Jerks would begin in three minutes. The next moment he was\ndoubled up by a violent coughing fit which nearly always attacked him soon after\nwaking up. It emptied his lungs so completely that he could only begin breathing\nagain by lying on his back and taking a series of deep gasps. His veins had\nswelled with the effort of the cough, and the varicose ulcer had started\nitching.\n\n\u2018Thirty to forty group!\u2019 yapped a piercing female voice. \u2018Thirty to forty group!\nTake your places, please. Thirties to forties!\u2019\n\nWinston sprang to attention in front of the telescreen, upon which the image of\na youngish woman, scrawny but muscular, dressed in tunic and gym-shoes, had\nalready appeared.\n\n\u2018Arms bending and stretching!\u2019 she rapped out. \u2018Take your time by me. ONE, two,\nthree, four! ONE, two, three, four! Come on, comrades, put a bit of life into\nit! ONE, two, three four! ONE two, three, four!...\u2019\n\nThe pain of the coughing fit had not quite driven out of Winston\u2019s mind the\nimpression made by his dream, and the rhythmic movements of the exercise\nrestored it somewhat. As he mechanically shot his arms back and forth, wearing\non his face the look of grim enjoyment which was considered proper during the\nPhysical Jerks, he was strugglingto think his way backward into the dim period\nof his early childhood. It was extraordinarily difficult. Beyond the late\nfifties everything faded. When there were no external records that you could\nrefer to, even the outline of your own life lost its sharpness. You remembered\nhuge events which had quite probably not happened, you remembered the detail of\nincidents without being able to recapture their atmosphere, and there were long\nblank periods to which you could assign nothing. Everything had been different\nthen. Even the names of countries, and their shapes on the map, had been\ndifferent. Airstrip One, for instance, had not been so called in those days: it\nhad been called England or Britain, though London, he felt fairly certain, had\nalways been called London.\n\nWinston could not definitely remember a time when his country had not been at\nwar, but it was evident that there had been a fairly long interval of peace\nduring his childhood, because one of his early memories was of an air raid which\nappeared to take everyone by surprise. Perhaps it was the time when the atomic\nbomb had fallen on Colchester. He did not remember the raid itself, but he did\nremember his father\u2019s hand clutching his own as they hurried down, down, down\ninto some place deep in the earth, round and round a spiral staircase which rang\nunder his feet and which finally so wearied his legs that he began whimpering\nand they had to stop and rest. His mother, in her slow, dreamy way, was\nfollowing a long way behind them. She was carrying his baby sister\u2014or perhaps it\nwas only a bundle of blankets that she was carrying: he was not certain\nwhetherhis sister had been born then. Finally they had emerged into a noisy,\ncrowded place which he had realized to be a Tube station.\n\nThere were people sitting all over the stone-flagged floor, and other people,\npacked tightly together, were sitting on metal bunks, one above the other.\nWinston and his mother and father found themselves a place on the floor, and\nnear them an old man and an old woman were sitting side by side on a bunk. The\nold man had on a decent dark suit and a black cloth cap pushed back from very\nwhite hair: his face was scarlet and his eyes were blue and full of tears. He\nreeked of gin. It seemed to breathe out of his skin in place of sweat, and one\ncould have fancied that the tears welling from his eyes were pure gin. But\nthough slightly drunk he was also suffering under some grief that was genuine\nand unbearable. In his childish way Winston grasped that some terrible thing,\nsomething that was beyond forgiveness and could never be remedied, had just\nhappened. It also seemed to him that he knew what it was. Someone whom the old\nman loved\u2014a little granddaughter, perhaps\u2014had been killed. Every few minutes the\nold man kept repeating:\n\n\u2019We didn\u2019t ought to \u2018ave trusted \u2018em. I said so, Ma, didn\u2019t I?\n\nThat\u2019s what comes of trusting \u2018em. I said so all along. Wedidn\u2019t ought to \u2018ave trusted the buggers.\u2019\n\nBut which buggers they didn\u2019t ought to have trusted Winston could not now\nremember. Since about that time, war had been literally continuous, though\nstrictly speaking it had not always been the same war. For several months during\nhis childhood there had been confused street fighting in London itself, some of\nwhich he remembered vividly. But to trace out the history of the whole period,\nto say who was fighting whom at any given moment, would have been utterly\nimpossible, since no written record, and no spoken word, ever made mention of\nany other alignment than the existing one. At this moment, for example, in 1984\n(if it was 1984), Oceania was at war with Eurasia and in alliance with Eastasia.\nIn no public or private utterance was it ever admitted that the three powers had\nat any time been grouped along different lines. Actually, as Winston well knew,\nit was only four years since Oceania had been at war with Eastasia and in\nalliance with Eurasia. But that was merely a piece of furtive knowledge which he\nhappened to possess because his memory was not satisfactorily under control.\nOfficially the change of partners had never happened. Oceania was at war with\nEurasia: therefore Oceania had always been at war with Eurasia. The enemy of the\nmoment always represented absolute evil, and it followed that any past or future\nagreement with him was impossible.\n\nThe frightening thing, he reflected for the ten thousandth time as he forced his\nshoulders painfully backward (with hands on hips, they were gyrating their\nbodies from the waist, an exercise that was supposed to be good for the back\nmuscles)\u2014the frightening thing was that it might all be true. If the Party could\nthrust its hand into the past and say of this or that event, IT NEVER\nHAPPENED\u2014that,\n\nsurely, was more terrifying than mere torture and death?\n\nThe Party said that Oceania had never been in alliance with Eurasia. He, Winston\nSmith, knew that Oceania had been in alliance with Eurasia as short a time as\nfour years ago. But where did that knowledge exist? Only in his own\nconsciousness, which in any case must soon be annihilated. And if all others\naccepted the lie which the Party imposed\u2014 if all records told the same tale\u2014then\nthe lie passed into history and became truth. \u2018Who controls the past,\u2019 ran the\nParty slogan, \u2018controls the future: who controls the present controls the past.\u2019\nAnd yet the past, though of its nature alterable, never had been altered.\nWhatever was true now was true from everlasting to everlasting. It was quite\nsimple. All that was needed was an unending series of victories over your own\nmemory. \u2018Reality control\u2019, they called it: in Newspeak, \u2018doublethink\u2019.\n\n\u2018Stand easy!\u2019 barked the instructress, a little more genially.\n\nWinston sank his arms to his sides and slowly refilled his lungs with air. His\nmind slid away into the labyrinthine world of doublethink. To know and not to\nknow, to be conscious of complete truthfulness while telling carefully\nconstructed lies, to hold simultaneously two opinions which cancelled out,\nknowing them to be contradictory and believing in both of them, to use logic\nagainst logic, to repudiate morality while laying claim to it, to believe that\ndemocracy was impossible and that the Party was the guardian of democracy, to\nforget whatever it was necessary to forget, then to draw it back into memory\nagain at themoment when it was needed, and then promptly to forget it again: and\nabove all, to apply the same process to the process itself. That was the\nultimate subtlety: consciously to induce unconsciousness, and then, once again,\nto become unconscious of the act of hypnosis you had just performed. Even to\nunderstand the word \u2018doublethink\u2019 involved the use of doublethink.\n\nThe instructress had called them to attention again. \u2018And now let\u2019s see which of\nus can touch our toes!\u2019 she said enthusiastically. \u2018Right over from the hips,\nplease, comrades. ONE-two! ONE-two!...\u2019\n\nWinston loathed this exercise, which sent shooting pains all the way from his\nheels to his buttocks and often ended by bringing on another coughing fit. The\nhalf-pleasant quality went out of his meditations. The past, he reflected, had\nnot merely been altered, it had been actually destroyed. For how could you\nestablish even the most obvious fact when there existed no record outside your\nown memory? He tried to remember in what year he had first heard mention of Big\nBrother. He thought it must have been at some time in the sixties, but it was\nimpossible to be certain. In the Party histories, of course, Big Brother figured\nas the leader and guardian of the Revolution since its very earliest days. His\nexploits had been gradually pushed backwards in time until already they extended\ninto the fabulous world of the forties and the thirties, when the capitalists in\ntheir strange cylindrical hats still rode through the streets of London in great\ngleaming motor-cars or horse carriages with glass sides. There was no knowing\nhow much of this legend was trueand how much invented. Winston could not even\nremember at what date the Party itself had come into existence. He did not\nbelieve he had ever heard the word Ingsoc before 1960, but it was possible that\nin its Oldspeak form\u2014\u2019English Socialism\u2019, that is to say\u2014it had been current\nearlier. Everything melted into mist. Sometimes, indeed, you could put your\nfinger on a definite lie. It was not true, for example, as was claimed in the\nParty history books, that the Party had invented aeroplanes. He remembered\naeroplanes since his earliest childhood. But you could prove nothing. There was\nnever any evidence. Just once in his whole life he had held in his hands\nunmistakable documentary proof of the falsification of an historical fact. And\non that occasion\u2014\u2014\n\n\u2018Smith!\u2019 screamed the shrewish voice from the telescreen. \u20186079 Smith W.! Yes,\nYOU! Bend lower, please! You can do better than that. You\u2019re not trying. Lower,\nplease! THAT\u2019S better, comrade. Now stand at ease, the whole squad, and watch\nme.\u2019\n\nA sudden hot sweat had broken out all over Winston\u2019s body. His face remained\ncompletely inscrutable. Never show dismay! Never show resentment! A single\nflicker of the eyes could give you away. He stood watching while the\ninstructress raised her arms above her head and\u2014one could not say gracefully,\nbut with remarkable neatness and efficiency\u2014bent over and tucked the first joint\nof her fingers under her toes.\n\n\u2018THERE, comrades! THAT\u2019S how I want to see you doing it. Watch me again. I\u2019m\nthirty-nine and I\u2019ve had four children. Now look.\u2019 She bent over again. \u2018You see\nMYknees aren\u2019t bent. You can all do it if you want to,\u2019 she added as she\nstraightened herself up. \u2018Anyone under forty-five is perfectly capable of\ntouching his toes. We don\u2019t all have the privilege of fighting in the front\nline, but at least we can all keep fit. Remember our boys on the Malabar front!\nAnd the sailors in the Floating Fortresses! Just think what THEY have to put up\nwith. Now try again. That\u2019s better, comrade, that\u2019s MUCH better,\u2019 she added\nencouragingly as Winston, with a violent lunge, succeeded in touching his toes\nwith knees unbent, for the first time in several years.\n\nChapter 4\n\nW      ith the deep, unconscious sigh which not even thenearness of the\ntelescreen could prevent him from uttering when his day\u2019s work started, Winston\npulled the speakwrite towards him, blew the dust from its mouthpiece, and put on\nhis spectacles. Then he unrolled and clipped together four small cylinders of\npaper which had already flopped out of the pneumatic tube on the right-hand side\nof his desk.\n\nIn the walls of the cubicle there were three orifices. To the right of the\nspeakwrite, a small pneumatic tube for written messages, to the left, a larger\none for newspapers; and in the side wall, within easy reach of Winston\u2019s arm, a\nlarge oblong slit protected by a wire grating. This last was for the disposal of\nwaste paper. Similar slits existed in thousands or tens of thousands throughout\nthe building, not only in every room but at short intervals in every corridor.\nFor some reason they were nicknamed memory holes. When one knew that any\ndocument was due for destruction, or even when one saw a scrap of waste paper\nlying about, it was an automatic action to lift the flap of the nearest memory\nhole and drop it in, whereupon it would be whirled away on a current of warm air\nto the enormous furnaces which were hidden somewhere in the recesses of the\nbuilding.\n\nWinston examined the four slips of paper which he hadunrolled. Each contained a\nmessage of only one or two lines, in the abbreviated jargon\u2014not actually\nNewspeak, but consisting largely of Newspeak words\u2014which was used in the\nMinistry for internal purposes. They ran:\n\ntimes 17.3.84 bb speech malreported africa rectifytimes 19.12.83 forecasts 3 yp 4th quarter 83 misprints verify\n\ncurrent issuetimes 14.2.84 miniplenty malquoted chocolate rectify\n\ntimes 3.12.83 reporting bb dayorder doubleplusungood refsunpersons rewrite fullwise upsub antefiling\n\nWith a faint feeling of satisfaction Winston laid the fourth message aside. It\nwas an intricate and responsible job and had better be dealt with last. The\nother three were routine matters, though the second one would probably mean some\ntedious wading through lists of figures.\n\nWinston dialled \u2018back numbers\u2019 on the telescreen and called for the appropriate\nissues of \u2018The Times\u2019, which slid out of the pneumatic tube after only a few\nminutes\u2019 delay. The messages he had received referred to articles or news items\nwhich for one reason or another it was thought necessary to alter, or, as the\nofficial phrase had it, to rectify. For example, it appeared from \u2018The Times\u2019 of\nthe seventeenth of March that Big Brother, in his speech of the previous day,\nhad predicted that the South Indian front would remain quiet but that a Eurasian\noffensive would shortly belaunched in North Africa. As it happened, the Eurasian\nHigher Command had launched its offensive in South India and left North Africa\nalone. It was therefore necessary to rewrite a paragraph of Big Brother\u2019s\nspeech, in such a way as to make him predict the thing that had actually\nhappened. Or again, \u2018The Times\u2019 of the nineteenth of December had published the\nofficial forecasts of the output of various classes of consumption goods in the\nfourth quarter of 1983, which was also the sixth quarter of the Ninth Three-Year\nPlan. Today\u2019s issue contained a statement of the actual output, from which it\nappeared that the forecasts were in every instance grossly wrong. Winston\u2019s job\nwas to rectify the
