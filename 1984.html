 worth while to pull up the\ncounterpane. From below came the familiar sound of singing and the scrape of\nboots on the flagstones. The brawny red-armed woman whom Winston had seen there\non his first visit was almost a fixture in the yard. There seemed to be no hour\nof daylight when she was not marching to and fro between the washtub and the\nline, alternately gagging herself with clothes pegs and breaking forth into\nlusty song. Julia had settled down on her side and seemed to be already on the\npoint of falling asleep. He reached out for the book, which was lying on the\nfloor, and sat up against the bedhead.\n\n\u2018We must read it,\u2019 he said. \u2018You too. All members of the Brotherhood have to\nread it.\u2019\n\n\u2018You read it,\u2019 she said with her eyes shut. \u2018Read it aloud. That\u2019s the best way.\nThen you can explain it to me as you go.\u2019\n\nThe clock\u2019s hands said six, meaning eighteen. They had three or four hours ahead\nof them. He propped the book against his knees and began reading:\n\nChapter I Ignorance is Strength\n\nThroughout recorded time, and probably since the end of the Neolithic Age, there\nhave been three kinds of people in the world, the High, the Middle, and the Low.\nThey have been subdivided in many ways, they have borne countless different\nnames, and their relative numbers, as well as their attitude towards one\nanother, have varied from age to age: but the essential structure of society has\nnever altered. Even after enormous upheavals and seemingly irrevocable changes,\nthe same pattern has always reasserted itself, just as a gyroscope will always\nreturn to equilibnum, however far it is pushed one way or the other\n\n\u2018Julia, are you awake?\u2019 said Winston.\n\n\u2018Yes, my love, I\u2019m listening. Go on. It\u2019s marvellous.\u2019\n\nHe continued reading:\n\nThe aims of these three groups are entirely irreconcilable. The aim of the High\nis to remain where they are. The aim of the Middle is to change places with the\nHigh. The aim of the Low, when they have an aim\u2014for it is an abiding\ncharacteristic of the Low that they are too much crushed by drudgery to be more\nthan intermittently conscious of anything outside their daily lives\u2014is to\nabolish all distinctions and create a society in which all men shall be equal.\nThus throughout history a struggle which is the same in its main outlines recurs\nover and over again. For long periods the High seem to be securely in power, but\nsooner or laterthere always comes a moment when they lose either their belief in\nthemselves or their capacity to govern efficiently, or both. They are then\noverthrown by the Middle, who enlist the Low on their side by pretending to them\nthat they are fighting for liberty and justice. As soon as they have reached\ntheir objective, the Middle thrust the Low back into their old position of\nservitude, and themselves become the High. Presently a new Middle group splits\noff from one of the other groups, or from both of them, and the struggle begins\nover again. Of the three groups, only the Low are never even temporarily\nsuccessful in achieving their aims. It would be an exaggeration to say that\nthroughout history there has been no progress of a material kind. Even today, in\na period of decline, the average human being is physically better off than he\nwas a few centuries ago. But no advance in wealth, no softening of manners, no\nreform or revolution has ever brought human equality a millimetre nearer. From\nthe point of view of the Low, no historic change has ever meant much more than a\nchange in the name of their masters.\n\nBy the late nineteenth century the recurrence of this pattern had become obvious\nto many observers. There then rose schools of thinkers who interpreted history\nas a cyclical process and claimed to show that inequality was the unalterable\nlaw of human life. This doctrine, of course, had always had its adherents, but\nin the manner in which it was now put forward there was a significant change. In\nthe past the need for a hierarchical form of society had been the doctrine\nspecifically of the High. It had been preached by kingsand aristocrats and by\nthe priests, lawyers, and the like who were parasitical upon them, and it had\ngenerally been softened by promises of compensation in an imaginary world beyond\nthe grave. The Middle, so long as it was struggling for power, had always made\nuse of such terms as freedom, justice, and fraternity. Now, however, the concept\nof human brotherhood began to be assailed by people who were not yet in\npositions of command, but merely hoped to be so before long. In the past the\nMiddle had made revolutions under the banner of equality, and then had\nestablished a fresh tyranny as soon as the old one was overthrown. The new\nMiddle groups in effect proclaimed their tyranny beforehand. Socialism, a theory\nwhich appeared in the early nineteenth century and was the last link in a chain\nof thought stretching back to the slave rebellions of antiquity, was still\ndeeply infected by the Utopianism of past ages. But in each variant of Socialism\nthat appeared from about 1900 onwards the aim of establishing liberty and\nequality was more and more openly abandoned. The new movements which appeared in\nthe middle years of the century, Ingsoc in Oceania, Neo-Bolshevism in Eurasia,\nDeath-Worship, as it is commonly called, in Eastasia, had the conscious aim of\nperpetuating UNfreedom and INequality. These new movements, of course, grew out\nof the old ones and tended to keep their names and pay lip-service to their\nideology. But the purpose of all of them was to arrest progress and freeze\nhistory at a chosen moment. The familiar pendulum swing was to happen once more,\nand then stop. As usual, the High were to be turned out by the Middle, who would\n\nthen become the High; but this time, by conscious strategy, the High would be\nable to maintain their position permanently.\n\nThe new doctrines arose partly because of the accumulation of historical\nknowledge, and the growth of the historical sense, which had hardly existed\nbefore the nineteenth century. The cyclical movement of history was now\nintelligible, or appeared to be so; and if it was intelligible, then it was\nalterable. But the principal, underlying cause was that, as early as the\nbeginning of the twentieth century, human equality had become technically\npossible. It was still true that men were not equal in their native talents and\nthat functions had to be specialized in ways that favoured some individuals\nagainst others; but there was no longer any real need for class distinctions or\nfor large differences of wealth. In earlier ages, class distinctions had been\nnot only inevitable but desirable. Inequality was the price of civilization.\nWith the development of machine production, however, the case was altered. Even\nif it was still necessary for human beings to do different kinds of work, it was\nno longer necessary for them to live at different social or economic levels.\nTherefore, from the point of view of the new groups who were on the point of\nseizing power, human equality was no longer an ideal to be striven after, but a\ndanger to be averted. In more primitive ages, when a just and peaceful society\nwas in fact not possible, it had been fairly easy to believe it. The idea of an\nearthly paradise in which men should live together in a state of brotherhood,\nwithout laws and without brute labour, had haunted the human imagination\nforthousands of years. And this vision had had a certain hold even on the groups\nwho actually profited by each historical change. The heirs of the French,\nEnglish, and American revolutions had partly believed in their own phrases about\nthe rights of man, freedom of speech, equality before the law, and the like, and\nhave even allowed their conduct to be influenced by them to some extent. But by\nthe fourth decade of the twentieth century all the main currents of political\nthought were authoritarian. The earthly paradise had been discredited at exactly\nthe moment when it became realizable. Every new political theory, by whatever\nname it called itself, led back to hierarchy and regimentation. And in the\ngeneral hardening of outlook that set in round about 1930, practices which had\nbeen long abandoned, in some cases for hundreds of years\u2014imprisonment without\ntrial, the use of war prisoners as slaves, public executions, torture to extract\nconfessions, the use of hostages, and the deportation of whole populations\u2014not\nonly became common again, but were tolerated and even defended by people who\nconsidered themselves enlightened and progressive.\n\nIt was only after a decade of national wars, civil wars, revolutions, and\ncounter-revolutions in all parts of the world that Ingsoc and its rivals emerged\nas fully workedout political theories. But they had been foreshadowed by the\nvarious systems, generally called totalitarian, which had appeared earlier in\nthe century, and the main outlines of the world which would emerge from the\nprevailing chaos had long been obvious. What kind of people would control this\nworld had been equally obvious. The new aristocracywas made up for the most part\nof bureaucrats, scientists, technicians, trade- union organizers, publicity\nexperts, sociologists, teachers, journalists, and professional politicians.\nThese people, whose origins lay in the salaried middle class and the upper\ngrades of the working class, had been shaped and brought together by the barren\nworld of monopoly industry and centralized government. As compared with their\nopposite numbers in past ages, they were less avaricious, less tempted by\nluxury, hungrier for pure power, and, above all, more conscious of what they\nwere doing and more intent on crushing opposition. This last difference was\ncardinal. By comparison with that existing today, all the tyrannies of the past\nwere half-hearted and inefficient. The ruling groups were always infected to\nsome extent by liberal ideas, and were content to leave loose ends everywhere,\nto regard only the overt act and to be uninterested in what their subjects were\nthinking. Even the Catholic Church of the Middle Ages was tolerant by modern\nstandards. Part of the reason for this was that in the past no government had\nthe power to keep its citizens under constant surveillance. The invention of\nprint, however, made it easier to manipulate public opinion, and the film and\nthe radio carried the process further. With the development of television, and\nthe technical advance which made it possible to receive and transmit\nsimultaneously on the same instrument, private life came to an end. Every\ncitizen, or at least every citizen important enough to be worth watching, could\nbe kept for twenty-four hours a day under the eyes of the police and in the\nsound of official propaganda, with all other channels\n\nof communication closed. The possibility of enforcing not only complete\nobedience to the will of the State, but complete uniformity of opinion on all\nsubjects, now existed for the first time.\n\nAfter the revolutionary period of the fifties and sixties, society regrouped\nitself, as always, into High, Middle, and Low. But the new High group, unlike\nall its forerunners, did not act upon instinct but knew what was needed to\nsafeguard its position. It had long been realized that the only secure basis for\noligarchy is collectivism. Wealth and privilege are most easily defended when\nthey are possessed jointly. The so-called \u2018abolition of private property\u2019 which\ntook place in the middle years of the century meant, in effect, the\nconcentration of property in far fewer hands than before: but with this\ndifference, that the new owners were a group instead of a mass of individuals.\nIndividually, no member of the Party owns anything, except petty personal\nbelongings. Collectively, the Party owns everything in Oceania, because it\ncontrols everything, and disposes of the products as it thinks fit. In the years\nfollowing the Revolution it was able to step into this commanding position\nalmost unopposed, because the whole process was represented as an act of\ncollectivization. It had always been assumed that if the capitalist class were\nexpropriated, Socialism must follow: and unquestionably the capitalists had been\nexpropriated. Factories, mines, land, houses, transport\u2014everything had been\ntaken away from them: and since these things were no longer private property, it\nfollowed that they must be public property. Ingsoc, which grew out of the\nearlier Socialist movement and inherited its phraseology, has in fact carried\nout the main item in the Socialist programme; with the result, foreseen and\nintended beforehand, that economic inequality has been made permanent.\n\nBut the problems of perpetuating a hierarchical society go deeper than this.\nThere are only four ways in which a ruling group can fall from power. Either it\nis conquered from without, or it governs so inefficiently that the masses are\nstirred to revolt, or it allows a strong and discontented Middle group to come\ninto being, or it loses its own selfconfidence and willingness to govern. These\ncauses do not operate singly, and as a rule all four of them are present in some\ndegree. A ruling class which could guard against all of them would remain in\npower permanently. Ultimately the determining factor is the mental attitude of\nthe ruling class itself.\n\nAfter the middle of the present century, the first danger had in reality\ndisappeared. Each of the three powers which now divide the world is in fact\nunconquerable, and could only become conquerable through slow demographic\nchanges which a government with wide powers can easily avert. The second danger,\nalso, is only a theoretical one. The masses never revolt of their own accord,\nand they never revolt merely because they are oppressed. Indeed, so long as they\nare not permitted to have standards of comparison, they never even become aware\nthat they are oppressed. The recurrent economic crises of past times were\ntotally unnecessary and are not now permitted to happen, but other and equally\nlarge dislocations can and do happen withouthaving political results, because\nthere is no way in which discontent can become articulate. As for the problem of\nover-production, which has been latent in our society since the development of\nmachine technique, it is solved by the device of continuous warfare (see Chapter\nIII), which is also useful in keying up public morale to the necessary pitch.\nFrom the point of view of our present rulers, therefore, the only genuine\ndangers are the splitting-off of a new group of able, under-employed, power-\nhungry people, and the growth of liberalism and scepticism in their own ranks.\nThe problem, that is to say, is educational. It is a problem of continuously\nmoulding the consciousness both of the directing group and of the larger\nexecutive group that lies immediately below it. The consciousness of the masses\nneeds only to be influenced in a negative way.\n\nGiven this background, one could infer, if one did not know it already, the\ngeneral structure of Oceanic society. At the apex of the pyramid comes Big\nBrother. Big Brother is infallible and all-powerful. Every success, every\nachievement, every victory, every scientific discovery, all knowledge, all\nwisdom, all happiness, all virtue, are held to issue directly from his\nleadership and inspiration. Nobody has ever seen Big Brother. He is a face on\nthe hoardings, a voice on the telescreen. We may be reasonably sure that he will\nnever die, and there is already considerable uncertainty as to when he was born.\nBig Brother is the guise in which the Party chooses to exhibit itself to the\nworld. His function is to act as a focusing point for love, fear, and reverence,\nemotions which are more easily felt towards an individual than towards\nanorganization. Below Big Brother comes the Inner Party. Its numbers limited to\nsix millions, or something less than 2 per cent of the population of Oceania.\nBelow the Inner Party comes the Outer Party, which, if the Inner Party is\ndescribed as the brain of the State, may be justly likened to the hands. Below\nthat come the dumb masses whom we habitually refer to as \u2018the proles\u2019, numbering\nperhaps 85 per cent of the population. In the terms of our earlier\nclassification, the proles are the Low: for the slave population of the\nequatorial lands who pass constantly from conqueror to conqueror, are not a\npermanent or necessary part of the structure.\n\nIn principle, membership of these three groups is not hereditary. The child of\nInner Party parents is in theory not born into the Inner Party. Admission to\neither branch of the Party is by examination, taken at the age of sixteen. Nor\nis there any racial discrimination, or any marked domination of one province by\nanother. Jews, Negroes, South Americans of pure Indian blood are to be found in\nthe highest ranks of the Party, and the administrators of any area are always\ndrawn from the inhabitants of that area. In no part of Oceania do the\ninhabitants have the feeling that they are a colonial population ruled from a\ndistant capital. Oceania has no capital, and its titular head is a person whose\nwhereabouts nobody knows. Except that English is its chief LINGUA FRANCA and\nNewspeak its official language, it is not centralized in any way. Its rulers are\nnot held together by blood-ties but by adherence to a common doctrine. It is\ntrue that our society is stratified, and very rigidly stratified, on what at\nfirst sight appear to be hereditary lines.\n\nThere is far less to-and-fro movement between the different groups than happened\nunder capitalism or even in the pre-industrial age. Between the two branches of\nthe Party there is a certain amount of interchange, but only so much as will\nensure that weaklings are excluded from the Inner Party and that ambitious\nmembers of the Outer Party are made harmless by allowing them to rise.\nProletarians, in practice, are not allowed to graduate into the Party. The most\ngifted among them, who might possibly become nuclei of discontent, are simply\nmarked down by the Thought Police and eliminated. But this state of affairs is\nnot necessarily permanent, nor is it a matter of principle. The Party is not a\nclass in the old sense of the word. It does not aim at transmitting power to its\nown children, as such; and if there were no other way of keeping the ablest\npeople at the top, it would be perfectly prepared to recruit an entire new\ngeneration from the ranks of the proletariat. In the crucial years, the fact\nthat the Party was not a hereditary body did a great deal to neutralize\nopposition. The older kind of Socialist, who had been trained to fight against\nsomething called \u2018class privilege\u2019 assumed that what is not hereditary cannot be\npermanent. He did not see that the continuity of an oligarchy need not be\nphysical, nor did he pause to reflect that hereditary aristocracies have always\nbeen shortlived, whereas adoptive organizations such as the Catholic Church have\nsometimes lasted for hundreds or thousands of years. The essence of oligarchical\nrule is not father-to-son inheritance, but the persistence of a certain world-\nview and a certain way of life, imposed by the dead upon the living. Aruling\ngroup is a ruling group so long as it can nominate its successors. The Party is\nnot concerned with perpetuating its blood but with perpetuating itself. WHO\nwields power is not important, provided that the hierarchical structure remains\nalways the same.\n\nAll the beliefs, habits, tastes, emotions, mental attitudes that characterize\nour time are really designed to sustain the mystique of the Party and prevent\nthe true nature of present-day society from being perceived. Physical rebellion,\nor any preliminary move towards rebellion, is at present not possible. From the\nproletarians nothing is to be feared. Left to themselves, they will continue\nfrom generation to generation and from century to century, working, breeding,\nand dying, not only without any impulse to rebel, but without the power of\ngrasping that the world could be other than it is. They could only become\ndangerous if the advance of industrial technique made it necessary to educate\nthem more highly; but, since military and commercial rivalry are no longer\nimportant, the level of popular education is actually declining. What opinions\nthe masses hold, or do not hold, is looked on as a matter of indifference. They\ncan be granted intellectual liberty because they have no intellect. In a Party\nmember, on the other hand, not even the smallest deviation of opinion on the\nmost unimportant subject can be tolerated.\n\nA Party member lives from birth to death under the eye of the Thought Police.\nEven when he is alone he can never be sure that he is alone. Wherever he may be,\nasleep or awake, working or resting, in his bath or in bed, he can be\ninspectedwithout warning and without knowing that he is being inspected. Nothing\nthat he does is indifferent. His friendships, his relaxations, his behaviour\ntowards his wife and children, the expression of his face when he is alone, the\nwords he mutters in sleep, even the characteristic movements of his body, are\nall jealously scrutinized. Not only any actual misdemeanour, but any\neccentricity, however small, any change of habits, any nervous mannerism that\ncould possibly be the symptom of an inner struggle, is certain to be detected.\nHe has no freedom of choice in any direction whatever. On the other hand his\nactions are not regulated by law or by any clearly formulated code of behaviour.\nIn Oceania there is no law. Thoughts and actions which, when detected, mean\ncertain death are not formally forbidden, and the endless purges, arrests,\ntortures, imprisonments, and vaporizations are not inflicted as punishment for\ncrimes which have actually been committed, but are merely the wiping-out of\npersons who might perhaps commit a crime at some time in the future. A Party\nmember is required to have not only the right opinions, but the right instincts.\nMany of the beliefs and attitudes demanded of him are never plainly stated, and\ncould not be stated without laying bare the contradictions inherent in Ingsoc.\nIf he is a person naturally orthodox (in Newspeak a GOODTHINKER), he will in all\ncircumstances know, without taking thought, what is the true belief or the\ndesirable emotion. But in any case an elaborate mental training, undergone in\nchildhood and grouping itself round the Newspeak words CRIMESTOP, BLACKWHITE,\nand DOUBLETHINK, makes him unwilling and unable to\n\nthink too deeply on any subject whatever.\n\nA Party member is expected to have no private emotions and no respites from\nenthusiasm. He is supposed to live in a continuous frenzy of hatred of foreign\nenemies and internal traitors, triumph over victories, and self-abasement before\nthe power and wisdom of the Party. The discontents produced by his bare,\nunsatisfying life are deliberately turned outwards and dissipated by such\ndevices as the Two Minutes Hate, and the speculations which might possibly\ninduce a sceptical or rebellious attitude are killed in advance by his early\nacquired inner discipline. The first and simplest stage in the discipline, which\ncan be taught even to young children, is called, in Newspeak, CRIMESTOP.\nCRIMESTOP means the faculty of stopping short, as though by instinct, at the\nthreshold of any dangerous thought. It includes the power of not grasping\nanalogies, of failing to perceive logical errors, of misunderstanding the\nsimplest arguments if they are inimical to Ingsoc, and of being bored or\nrepelled by any train of thought which is capable of leading in a heretical\ndirection. CRIMESTOP, in short, means protective stupidity. But stupidity is not\nenough. On the contrary, orthodoxy in the full sense demands a control over\none\u2019s own mental processes as complete as that of a contortionist over his body.\nOceanic society rests ultimately on the belief that Big Brother is omnipotent\nand that the Party is infallible. But since in reality Big Brother is not\nomnipotent and the party is not infallible, there is need for an unwearying,\nmoment-to-moment flexibility in the treatment of facts. The keyword here is\nBLACKWHITE. Like so many\n\nNewspeak words, this word has two mutually contradictory meanings. Applied to an\nopponent, it means the habit of impudently claiming that black is white, in\ncontradiction of the plain facts. Applied to a Party member, it means a loyal\nwillingness to say that black is white when Party discipline demands this. But\nit means also the ability to BELIEVE that black is white, and more, to KNOW that\nblack is white, and to forget that one has ever believed the contrary. This\ndemands a continuous alteration of the past, made possible by the system of\nthought which really embraces all the rest, and which is known in Newspeak as\nDOUBLETHINK.\n\nThe alteration of the past is necessary for two reasons, one of which is\nsubsidiary and, so to speak, precautionary. The subsidiary reason is that the\nParty member, like the proletarian, tolerates present-day conditions partly\nbecause he has no standards of comparison. He must be cut off from the past,\njust as he must be cut off from foreign countries, because it is necessary for\nhim to believe that he is better off than his ancestors and that the average\nlevel of material comfort is constantly rising. But by far the more important\nreason for the readjustment of the past is the need to safeguard the\ninfallibility of the Party. It is not merely that speeches, statistics, and\nrecords of every kind must be constantly brought up to date in order to show\nthat the predictions of the Party were in all cases right. It is also that no\nchange in doctrine or in political alignment can ever be admitted. For to change\none\u2019s mind, or even one\u2019s policy, is a confession of weakness. If, for example,\nEurasia or Eastasia (whichever it may be) is the enemy today, thenthat country\nmust always have been the enemy. And if the facts say otherwise then the facts\nmust be altered. Thus history is continuously rewritten. This day-to-day\nfalsification of the past, carried out by the Ministry of Truth, is as necessary\nto the stability of the regime as the work of repression and espionage carried\nout by the Ministry of Love.\n\nThe mutability of the past is the central tenet of Ingsoc. Past events, it is\nargued, have no objective existence, but survive only in written records and in\nhuman memories. The past is whatever the records and the memories agree upon.\nAnd since the Party is in full control of all records and in equally full\ncontrol of the minds of its members, it follows that the past is whatever the\nParty chooses to make it. It also follows that though the past is alterable, it\nnever has been altered in any specific instance. For when it has been recreated\nin whatever shape is needed at the moment, then this new version IS the past,\nand no different past can ever have existed. This holds good even when, as often\nhappens, the same event has to be altered out of recognition several times in\nthe course of a year. At all times the Party is in possession of absolute truth,\nand clearly the absolute can never have been different from what it is now. It\nwill be seen that the control of the past depends above all on the training of\nmemory. To make sure that all written records agree with the orthodoxy of the\nmoment is merely a mechanical act. But it is also necessary to REMEMBER that\nevents happened in the desired manner. And if it is necessary to rearrange one\u2019s\nmemories or to tamper with written records, then it is necessary to FORGET that\nonehas done so. The trick of doing this can be learned like any other mental\ntechnique. It is learned by the majority of Party members, and certainly by all\nwho are intelligent as well as orthodox. In Oldspeak it is called, quite\nfrankly, \u2018reality control\u2019. In Newspeak it is called DOUBLETHINK, though\nDOUBLETHINK comprises much else as well.\n\nDOUBLETHINK means the power of holding two contradictory beliefs in one\u2019s mind\nsimultaneously, and accepting both of them. The Party intellectual knows in\nwhich direction his memories must be altered; he therefore knows that he is\nplaying tricks with reality; but by the exercise of DOUBLETHINK he also\nsatisfies himself that reality is not violated. The process has to be conscious,\nor it would not be carried out with sufficient precision, but it also has to be\nunconscious, or it would bring with it a feeling of falsity and hence of guilt.\nDOUBLETHINK lies at the very heart of Ingsoc, since the essential act of the\nParty is to use conscious deception while retaining the firmness of purpose that\ngoes with complete honesty. To tell deliberate lies while genuinely believing in\nthem, to forget any fact that has become inconvenient, and then, when it becomes\nnecessary again, to draw it back from oblivion for just so long as it is needed,\nto deny the existence of objective reality and all the while to take account of\nthe reality which one denies\u2014all this is indispensably necessary. Even in using\nthe word DOUBLE- THINK it is necessary to exercise DOUBLETHINK. For by using the\nword one admits that one is tampering with reality; by a fresh act of\nDOUBLETHINK one erases this knowledge; and so on indefinitely, with the lie\nalways oneleap ahead of the truth. Ultimately it is by means of DOU- BLETHINK\nthat the Party has been able\u2014and may, for all we know, continue to be able for\nthousands of years\u2014to arrest the course of history.\n\nAll past oligarchies have fallen from power either because they ossified or\nbecause they grew soft. Either they became stupid and arrogant, failed to adjust\nthemselves to changing circumstances, and were overthrown; or they became\nliberal and cowardly, made concessions when they should have used force, and\nonce again were overthrown. They fell, that is to say, either through\nconsciousness or through unconsciousness. It is the achievement of the Party to\nhave produced a system of thought in which both conditions can exist\nsimultaneously. And upon no other intellectual basis could the dominion of the\nParty be made permanent. If one is to rule, and to continue ruling, one must be\nable to dislocate the sense of reality. For the secret of rulership is to\ncombine a belief in one\u2019s own infallibility with the Power to learn from past\nmistakes.\n\nIt need hardly be said that the subtlest practitioners of DOUBLETHINK are those\nwho invented DOUBLETHINK and know that it is a vast system of mental cheating.\nIn our society, those who have the best knowledge of what is happening are also\nthose who are furthest from seeing the world as it is. In general, the greater\nthe understanding, the greater the delusion; the more intelligent, the less\nsane. One clear illustration of this is the fact that war hysteria increases in\nintensity as one rises in the social scale. Those whose attitude towards the war\nis most nearly rational are the subject peoples of the disputed territories. To\nthese people the war is simply a continuous calamity which sweeps to and fro\nover their bodies like a tidal wave. Which side is winning is a matter of\ncomplete indifference to them. They are aware that a change of overlordship\nmeans simply that they will be doing the same work as before for new masters who\ntreat them in the same manner as the old ones. The slightly more favoured\nworkers whom we call \u2018the proles\u2019 are only intermittently conscious of the war.\nWhen it is necessary they can be prodded into frenzies of fear and hatred, but\nwhen left to themselves they are capable of forgetting for long periods that the\nwar is happening. It is in the ranks of the Party, and above all of the Inner\nParty, that the true war enthusiasm is found. World-conquest is believed in most\nfirmly by those who know it to be impossible. This peculiar linking-together of\nopposites\u2014knowledge with ignorance, cynicism with fanaticism\u2014is one of the chief\ndistinguishing marks of Oceanic society. The official ideology abounds with\ncontradictions even when there is no practical reason for them. Thus, the Party\nrejects and vilifies every principle for which the Socialist movement originally\nstood, and it chooses to do this in the name of Socialism. It preaches a\ncontempt for the working class unexampled for centuries past, and it dresses its\nmembers in a uniform which was at one time peculiar to manual workers and was\nadopted for that reason. It systematically undermines the solidarity of the\nfamily, and it calls its leader by a name which is a direct appeal to the\nsentiment of family loyalty. Even the names of the four Ministries by which we\nare governed exhibit a sort\n\nof impudence in their deliberate reversal of the facts. The Ministry of Peace\nconcerns itself with war, the Ministry of Truth with lies, the Ministry of Love\nwith torture and the Ministry of Plenty with starvation. These contradictions\nare not accidental, nor do they result from ordinary hypocrisy; they are\ndeliberate exercises in DOUBLETHINK. For it is only by reconciling\ncontradictions that power can be retained indefinitely. In no other way could\nthe ancient cycle be broken. If human equality is to be for ever averted\u2014if the\nHigh, as we have called them, are to keep their places permanently\u2014then the\nprevailing mental condition must be controlled insanity.\n\nBut there is one question which until this moment we have almost ignored. It is;\nWHY should human equality be averted? Supposing that the mechanics of the\nprocess have been rightly described, what is the motive for this huge,\naccurately planned effort to freeze history at a particular moment of time?\n\nHere we reach the central secret. As we have seen. the mystique of the Party,\nand above all of the Inner Party, depends upon DOUBLETHINK But deeper than this\nlies the original motive, the never-questioned instinct that first led to the\nseizure of power and brought DOUBLETHINK, the Thought Police, continuous\nwarfare, and all the other necessary paraphernalia into existence afterwards.\nThis motive really consists...\n\nWinston became aware of silence, as one becomes aware of a new sound. It seemed\nto him that Julia had been very still for some time past. She was lying on her\nside, naked from the waist upwards, with her cheek pillowed on her hand and one\ndark lock tumbling across her eyes. Her breast rose and fell slowly and\nregularly.\n\n\u2018Julia.\u2019\n\nNo answer.\n\n\u2018Julia, are you awake?\u2019\n\nNo answer. She was asleep. He shut the book, put it carefully on the floor, lay\ndown, and pulled the coverlet over both of them.\n\nHe had still, he reflected, not learned the ultimate secret. He understood HOW;\nhe did not understand WHY. Chapter I, like Chapter III, had not actually told\nhim anything that he did not know, it had merely systematized the knowledge that\nhe possessed already. But after reading it he knew better than before that he\nwas not mad. Being in a minority, even a minority of one, did not make you mad.\nThere was truth and there was untruth, and if you clung to the truth even\nagainst the whole world, you were not mad. A yellow beam from the sinking sun\nslanted in through the window and fell across the pillow. He shut his eyes. The\nsun on his face and the girl\u2019s smooth body touching his own gave him a strong,\nsleepy, confident feeling. He was safe, everything was all right. He fell asleep\nmurmuring \u2018Sanity is not statistical,\u2019 with the feeling that this remark\ncontained in it a profound wisdom.\n\n*****\n\nWhen he woke it was with the sensation of having slept for a long time, but a\nglance at the old-fashioned clock told him that it was only twenty-thirty. He\nlay dozing for a while;\n\nthen the usual deep-lunged singing struck up from the yard below:\n\n\u2018It was only an \u2018opeless fancy,\n\nIt passed like an Ipril dye,\n\nBut a look an\u2019 a word an\u2019 the dreams they stirred\n\nThey \u2018ave stolen my \u2018eart awye!\u2019\n\nThe driveling song seemed to have kept its popularity. You still heard it all\nover the place. It had outlived the Hate Song. Julia woke at the sound,\nstretched herself luxuriously, and got out of bed. \u2018I\u2019m hungry,\u2019 she said.\n\u2018Let\u2019s make some more coffee. Damn! The stove\u2019s gone out and the water\u2019s cold.\u2019\nShe picked the stove up and shook it. \u2018There\u2019s no oil in it.\u2019 \u2018We can get some\nfrom old Charrington, I expect.\u2019 \u2018The funny thing is I made sure it was full.\nI\u2019m going to put my clothes on,\u2019 she added. \u2018It seems to have got colder.\u2019\n\nWinston also got up and dressed himself. The indefatigable voice sang on:\n\n\u2018They sye that time \u2018eals all things,\n\nThey sye you can always forget;\n\nBut the smiles an\u2019 the tears acrorss the years\n\nThey twist my \u2018eart-strings yet!\u2019\n\nAs he fastened the belt of his overalls he strolled across to the window. The\nsun must have gone down behind the houses; it was not shining into the yard any\nlonger. The flagstones were wet as though they had just been washed, and he had\nthe feeling that the sky had been washed too, so fresh and pale was the blue\nbetween the chimney- pots. Tirelessly the woman marched to and fro, corking and\nuncorking herself, singing and falling silent, and pegging out more diapers, and\nmore and yet more. He wondered whether she took in washing for a living or was\nmerely the slave of twenty or thirty grandchildren. Julia had come across to his\nside; together they gazed down with a sort of fascination at the sturdy figure\nbelow. As he looked at the woman in her characteristic attitude, her thick arms\nreaching up for the line, her powerful mare-like buttocks protruded, it struck\nhim for the first time that she was beautiful. It had never before occurred to\nhim that the body of a woman of fifty, blown up to monstrous dimensions by\nchildbearing, then hardened, roughened by work till it was coarse in the grain\nlike an over-ripe turnip, could be beautiful. But it was so, and after all, he\nthought, why not? The solid, contourless body, like a block of granite, and the\nrasping red skin, bore the same relation to the body of a girl as the rose-hip\nto the rose. Why should the fruit be held inferior to the flower?\n\n\u2018She\u2019s beautiful,\u2019 he murmured.\n\n\u2018She\u2019s a metre across the hips, easily,\u2019 said Julia.\n\n\u2018That is her style of beauty,\u2019 said Winston.\n\nHe held Julia\u2019s supple waist easily encircled by his arm. From the hip to the\nknee her flank was against his. Out of their bodies no child would ever come.\nThat was the one thing they could never do. Only by word of mouth, from mind to\nmind, could they pass on the secret. The womandown there had no mind, she had\nonly strong arms, a warm heart, and a fertile belly. He wondered how many\nchildren she had given birth to. It might easily be fifteen. She had had her\nmomentary flowering, a year, perhaps, of wild-rose beauty and then she had\nsuddenly swollen like a fertilized fruit and grown hard and red and coarse, and\nthen her life had been laundering, scrubbing, darning, cooking, sweeping,\npolishing, mending, scrubbing, laundering, first for children, then for\ngrandchildren, over thirty unbroken years. At the end of it she was still\nsinging. The mystical reverence that he felt for her was somehow mixed up with\nthe aspect of the pale, cloudless sky, stretching away behind the chimney-pots\ninto interminable distance. It was curious to think that the sky was the same\nfor everybody, in Eurasia or Eastasia as well as here. And the people under the\nsky were also very much the same\u2014everywhere, all over the world, hundreds of\nthousands of millions of people just like this, people ignorant of one another\u2019s\nexistence, held apart by walls of hatred and lies, and yet almost exactly the\nsame\u2014people who had never learned to think but who were storing up in their\nhearts and bellies and muscles the power that would one day overturn the world.\nIf there was hope, it lay in the proles! Without having read to the end of THE\nBOOK, he knew that that must be Goldstein\u2019s final message. The future belonged\nto the proles. And could he be sure that when their time came the world they\nconstructed would not be just as alien to him, Winston Smith, as the world of\nthe Party? Yes, because at the least it would be a world of sanity. Where there\nis equality there can be sanity. Sooner or later\n\nit would happen, strength would change into consciousness. The proles were\nimmortal, you could not doubt it when you looked at that valiant figure in the\nyard. In the end their awakening would come. And until that happened, though it\nmight be a thousand years, they would stay alive against all the odds, like\nbirds, passing on from body to body the vitality which the Party did not share\nand could not kill.\n\n\u2018Do you remember,\u2019 he said, \u2018the thrush that sang to us, that first day, at the\nedge of the wood?\u2019\n\n\u2018He wasn\u2019t singing to us,\u2019 said Julia. \u2018He was singing to please himself. Not\neven that. He was just singing.\u2019\n\nThe birds sang, the proles sang. the Party did not sing. All round the world, in\nLondon and New York, in Africa and Brazil, and in the mysterious, forbidden\nlands beyond the frontiers, in the streets of Paris and Berlin, in the villages\nof the endless Russian plain, in the bazaars of China and Japan\u2014everywhere stood\nthe same solid unconquerable figure, made monstrous by work and childbearing,\ntoiling from birth to death and still singing. Out of those mighty loins a race\nof conscious beings must one day come. You were the dead, theirs was the future.\nBut you could share in that future if you kept alive the mind as they kept alive\nthe body, and passed on the secret doctrine that two plus two make four.\n\n\u2018We are the dead,\u2019 he said.\n\n\u2018We are the dead,\u2019 echoed Julia dutifully.\n\n\u2018You are the dead,\u2019 said an iron voice behind them.\n\nThey sprang apart. Winston\u2019s entrails seemed to have turned into ice. He could\nsee the white all round the irises of\n\nJulia\u2019s eyes. Her face had turned a milky yellow. The smear of rouge that was\nstill on each cheekbone stood out sharply, almost as though unconnected with the\nskin beneath.\n\n\u2018You are the dead,\u2019 repeated the iron voice.\n\n\u2018It was behind the picture,\u2019 breathed Julia.\n\n\u2018It was behind the picture,\u2019 said the voice. \u2018Remain exactly where you are. Make\nno movement until you are ordered.\u2019\n\nIt was starting, it was starting at last! They could do nothing except stand\ngazing into one another\u2019s eyes. To run for life, to get out of the house before\nit was too late\u2014no such thought occurred to them. Unthinkable to disobey the\niron voice from the wall. There was a snap as though a catch had been turned\nback, and a crash of breaking glass. The picture had fallen to the floor\nuncovering the telescreen behind it.\n\n\u2018Now they can see us,\u2019 said Julia.\n\n\u2018Now we can see you,\u2019 said the voice. \u2018Stand out in the middle of the room.\nStand back to back. Clasp your hands behind your heads. Do not touch one\nanother.\u2019\n\nThey were not touching, but it seemed to him that he could feel Julia\u2019s body\nshaking. Or perhaps it was merely the shaking of his own. He could just stop his\nteeth from chattering, but his knees were beyond his control. There was a sound\nof trampling boots below, inside the house and outside. The yard seemed to be\nfull of men. Something was being dragged across the stones. The woman\u2019s singing\nhad stopped abruptly. There was a long, rolling clang, as though the washtub had\nbeen flung across the yard, and then a confusion of angry shouts which ended in\na yell of pain.\n\n\u2018The house is surrounded,\u2019 said Winston.\n\n\u2018The house is surrounded,\u2019 said the voice.\n\nHe heard Julia snap her teeth together. \u2018I suppose we may as well say good-bye,\u2019\nshe said.\n\n\u2018You may as well say good-bye,\u2019 said the voice. And then another quite different\nvoice, a thin, cultivated voice which Winston had the impression of having heard\nbefore, struck in; \u2018And by the way, while we are on the subject, \u2018Here comes a\ncandle to light you to bed, here comes a chopper to chop off your head\u2019!\u2019\n\nSomething crashed on to the bed behind Winston\u2019s back. The head of a ladder had\nbeen thrust through the window and had burst in the frame. Someone was climbing\nthrough the window. There was a stampede of boots up the stairs. The room was\nfull of solid men in black uniforms, with ironshod boots on their feet and\ntruncheons in their hands.\n\nWinston was not trembling any longer. Even his eyes he barely moved. One thing\nalone mattered; to keep still, to keep still and not give them an excuse to hit\nyou! A man with a smooth prize-fighter\u2019s jowl in which the mouth was only a slit\npaused opposite him balancing his truncheon meditatively between thumb and\nforefinger. Winston met his eyes. The feeling of nakedness, with one\u2019s hands\nbehind one\u2019s head and one\u2019s face and body all exposed, was almost unbearable.\nThe man protruded the tip of a white tongue, licked the place where his lips\nshould have been, and then passed on. There was another crash. Someone had\npicked up the glass paperweight from the table and smashed it to pieces on the\nhearth-stone.\n\nThe fragment of coral, a tiny crinkle of pink like a sugar rosebud from a cake,\nrolled across the mat. How small, thought Winston, how small it always was!\nThere was a gasp and a thump behind him, and he received a violent kick on the\nankle which nearly flung him off his balance. One of the men had smashed his\nfist into Julia\u2019s solar plexus, doubling her up like a pocket ruler. She was\nthrashing about on the floor, fighting for breath. Winston dared not turn his\nhead even by a millimetre, but sometimes her livid, gasping face came within the\nangle of his vision. Even in his terror it was as though he could feel the pain\nin his own body, the deadly pain which nevertheless was less urgent than the\nstruggle to get back her breath. He knew what it was like; the terrible,\nagonizing pain which was there all the while but could not be suffered yet,\nbecause before all else it was necessary to be able to breathe. Then two of the\nmen hoisted her up by knees and shoulders, and carried her out of the room like\na sack. Winston had a glimpse of her face, upside down, yellow and contorted,\nwith the eyes shut, and still with a smear of rouge on either cheek; and that\nwas the last he saw of her.\n\nHe stood dead still. No one had hit him yet. Thoughts which came of their own\naccord but seemed totally uninteresting began to flit through his mind. He\nwondered whether they had got Mr Charrington. He wondered what they had done to\nthe woman in the yard. He noticed that he badly wanted to urinate, and felt a\nfaint surprise, because he had done so only two or three hours ago. He noticed\nthat the clock on the mantelpiece said nine, meaning twentyone. But the light\nseemed too strong. Would not the lightbe fading at twenty-one hours on an August\nevening? He wondered whether after all he and Julia had mistaken the time\u2014had\nslept the clock round and thought it was twenty-thirty when really it was nought\neight-thirty on the following morning. But he did not pursue the thought\nfurther. It was not interesting.\n\nThere ws another, lighter step in the passage. Mr Charrington came into the\nroom. The demeanour of the black-uniformed men suddenly became more subdued.\nSomething had also changed in Mr Charrington\u2019s appearance. His eye fell on the\nfragments of the glass paperweight.\n\n\u2018Pick up those pieces,\u2019 he said sharply.\n\nA man stooped to obey. The cockney accent had disappeared; Winston suddenly\nrealized whose voice it was that he had heard a few moments ago on the\ntelescreen. Mr Charrington was still wearing his old velvet jacket, but his\nhair, which had been almost white, had turned black. Also he was not wearing his\nspectacles. He gave Winston a single sharp glance, as though verifying his\nidentity, and then paid no more attention to him. He was still recognizable, but\nhe was not the same person any longer. His body had straightened, and seemed to\nhave grown bigger. His face had undergone only tiny changes that had\nnevertheless worked a complete transformation. The black eyebrows were less\nbushy, the wrinkles were gone, the whole lines of the face seemed to have\naltered; even the nose seemed shorter. It was the alert, cold face of a man of\nabout five-and-thirty. It occurred to Winston that for the first time in his\nlife he was looking,\n\nwith knowledge, at a member of the Thought Police.\n\nPart Three\n\nChapter 1\n\nH      e did not know where he was. Presumably he was inthe Ministry of Love,\nbut there was no way of making certain. He was in a high- ceilinged windowless\ncell with walls of glittering white porcelain. Concealed lamps flooded it with\ncold light, and there was a low, steady humming sound which he supposed had\nsomething to do with the air supply. A bench, or shelf, just wide enough to sit\non ran round the wall, broken only by the door and, at the end opposite the\ndoor, a lavatory pan with no wooden seat. There were four telescreens, one in\neach wall.\n\nThere was a dull aching in his belly. It had been there ever since they had\nbundled him into the closed van and driven him away. But he was also hungry,\nwith a gnawing, unwholesome kind of hunger. It might be twenty-four hours since\nhe had eaten, it might be thirty-six. He still did not know, probably never\nwould know, whether it had been morning or evening when they arrested him. Since\nhe was arrested he had not been fed.\n\nHe sat as still as he could on the narrow bench, with his hands crossed on his\nknee. He had already learned to sit still. If you made unexpected movements they\nyelled at you from the telescreen. But the craving for food was growing upon\nhim. What he longed for above all was a piece of bread. He had an idea that\nthere were a few breadcrumbs in thepocket of his overalls. It was even\npossible\u2014he thought this because from time to time something seemed to tickle\nhis leg\u2014that there might be a sizeable bit of crust there. In the end the\ntemptation to find out overcame his fear; he slipped a hand into his pocket.\n\n\u2018Smith!\u2019 yelled a voice from the telescreen. \u20186079 Smith W.! Hands out of\npockets in the cells!\u2019\n\nHe sat still again, his hands crossed on his knee. Before being brought here he\nhad been taken to another place which must have been an ordinary prison or a\ntemporary lock-up used by the patrols. He did not know how long he had been\nthere; some hours at any rate; with no clocks and no daylight it was hard to\ngauge the time. It was a noisy, evilsmelling place. They had put him into a cell\nsimilar to the one he was now in, but filthily dirty and at all times crowded by\nten or fifteen people. The majority of them were common criminals, but there\nwere a few political prisoners among them. He had sat silent against the wall,\njostled by dirty bodies, too preoccupied by fear and the pain in his belly to\ntake much interest in his surroundings, but still noticing the astonishing\ndifference in demeanour between the Party prisoners and the others. The Party\nprisoners were always silent and terrified, but the ordinary criminals seemed to\ncare nothing for anybody. They yelled insults at the guards, fought back\nfiercely when their belongings were impounded, wrote obscene words on the floor,\nate smuggled food which they produced from mysterious hiding-places in their\nclothes, and even shouted down the telescreen when it tried to restore order. On\nthe other hand some of them seemedto be on good terms with the guards, called\nthem by nicknames, and tried to wheedle cigarettes through the spyhole in the\ndoor. The guards, too, treated the common criminals with a certain forbearance,\neven when they had to handle them roughly. There was much talk about the forced-\nlabour camps to which most of the prisoners expected to be sent. It was \u2018all\nright\u2019 in the camps, he gathered, so long as you had good contacts and knew the\nropes. There was bribery, favouritism, and racketeering of every kind, there was\nhomosexuality and prostitution, there was even illicit alcohol distilled from\npotatoes. The positions of trust were given only to the common criminals,\nespecially the gangsters and the murderers, who formed a sort of aristocracy.\nAll the dirty jobs were done by the politicals.\n\nThere was a constant come-and-go of prisoners of every description: drug-\npeddlers, thieves, bandits, black-marketeers, drunks, prostitutes. Some of the\ndrunks were so violent that the other prisoners had to combine to suppress them.\nAn enormous wreck of a woman, aged about sixty, with great tumbling breasts and\nthick coils of white hair which had come down in her struggles, was carried in,\nkicking and shouting, by four guards, who had hold of her one at each corner.\nThey wrenched off the boots with which she had been trying to kick them, and\ndumped her down across Winston\u2019s lap, almost breaking his thigh-bones. The woman\nhoisted herself upright and followed them out with a yell of \u2018F\u2014\u2014 bastards!\u2019\nThen, noticing that she was sitting on something uneven, she slid off Winston\u2019s\nknees on to the bench.\n\n\u2018Beg pardon, dearie,\u2019 she said. \u2018I wouldn\u2019t \u2018a sat on you, only the buggers put\nme there. They dono \u2018ow to treat a lady, do they?\u2019 She paused, patted her\nbreast, and belched. \u2018Pardon,\u2019 she said, \u2018I ain\u2019t meself, quite.\u2019\n\nShe leant forward and vomited copiously on the floor.\n\n\u2018Thass better,\u2019 she said, leaning back with closed eyes. \u2018Never keep it down,\nthass what I say. Get it up while it\u2019s fresh on your stomach, like.\u2019\n\nShe revived, turned to have another look at Winston and seemed immediately to\ntake a fancy to him. She put a vast arm round his shoulder and drew him towards\nher, breathing beer and vomit into his face.\n\n\u2018Wass your name, dearie?\u2019 she said.\n\n\u2018Smith,\u2019 said Winston.\n\n\u2018Smith?\u2019 said the woman. \u2018Thass funny. My name\u2019s Smith too. Why,\u2019 she added\nsentimentally, \u2018I might be your mother!\u2019\n\nShe might, thought Winston, be his mother. She was about the right age and\nphysique, and it was probable that people changed somewhat after twenty years in\na forced-labour camp.\n\nNo one else had spoken to him. To a surprising extent the ordinary criminals\nignored the Party prisoners. \u2018The polITS,\u2019 they called them, with a sort of\nuninterested contempt. The Party prisoners seemed terrified of speaking to\nanybody, and above all of speaking to one another. Only once, when two Party\nmembers, both women, were pressed close together on the bench, he overheard amid\nthe din of voices a few hurriedly-whispered words; and in particular areference\nto something called \u2018room one-oh-one\u2019, which he did not understand.\n\nIt might be two or three hours ago that they had brought him here. The dull pain\nin his belly never went away, but sometimes it grew better and sometimes worse,\nand his thoughts expanded or contracted accordingly. When it grew worse he\nthought only of the pain itself, and of his desire for food. When it grew\nbetter, panic took hold of him. There were moments when he foresaw the things\nthat would happen to him with such actuality that his heart galloped and his\nbreath stopped. He felt the smash of truncheons on his elbows and iron-shod\nboots on his shins; he saw himself grovelling on the floor, screaming for mercy\nthrough broken teeth. He hardly thought of Julia. He could not fix his mind on\nher. He loved her and would not betray her; but that was only a fact, known as\nhe knew the rules of arithmetic. He felt no love for her, and he hardly even\nwondered what was happening to her. He thought oftener of O\u2019Brien, with a\nflickering hope. O\u2019Brien might know that he had been arrested. The Brotherhood,\nhe had said, never tried to save its members. But there was the razor blade;\nthey would send the razor blade if they could. There would be perhaps five\nseconds before the guard could rush into the cell. The blade would bite into him\nwith a sort of burning coldness, and even the fingers that held it would be cut\nto the bone. Everything came back to his sick body, which shrank trembling from\nthe smallest pain. He was not certain that he would use the razor blade even if\nhe got the chance. It was more natural to exist from moment to moment,\nacceptinganother ten minutes\u2019 life even with the certainty that there was\ntorture at the end of it.\n\nSometimes he tried to calculate the number of porcelain bricks in the walls of\nthe cell. It should have been easy, but he always lost count at some point or\nanother. More often he wondered where he was, and what time of day it was. At\none moment he felt certain that it was broad daylight outside, and at the next\nequally certain that it was pitch darkness. In this place, he knew\ninstinctively, the lights would never be turned out. It was the place with no\ndarkness: he saw now why O\u2019Brien had seemed to recognize the allusion. In the\nMinistry of Love there were no windows. His cell might be at the heart of the\nbuilding or against its outer wall; it might be ten floors below ground, or\nthirty above it. He moved himself mentally from place to place, and tried to\ndetermine by the feeling of his body whether he was perched high in the air or\nburied deep underground.\n\nThere was a sound of marching boots outside. The steel door opened with a clang.\nA young officer, a trim black-uniformed figure who seemed to glitter all over\nwith polished leather, and whose pale, straight-featured face was like a wax\nmask, stepped smartly through the doorway. He motioned to the guards outside to\nbring in the prisoner they were leading. The poet Ampleforth shambled into the\ncell. The door clanged shut again.\n\nAmpleforth made one or two uncertain movements from side to side, as though\nhaving some idea that there was another door to go out of, and then began to\nwander up and down the cell. He had not yet noticed Winston\u2019s presence.\n\nHis troubled eyes were gazing at the wall about a metre above the level of\nWinston\u2019s head. He was shoeless; large, dirty toes were sticking out of the\nholes in his socks. He was also several days away from a shave. A scrubby beard\ncovered his face to the cheekbones, giving him an air of ruffianism that went\noddly with his large weak frame and nervous movements.\n\nWinston roused hirnself a little from his lethargy. He must speak to Ampleforth,\nand risk the yell from the telescreen. It was even conceivable that Ampleforth\nwas the bearer of the razor blade.\n\n\u2018Ampleforth,\u2019 he said.\n\nThere was no yell from the telescreen. Ampleforth paused, mildly startled. His\neyes focused themselves slowly on Winston.\n\n\u2018Ah, Smith!\u2019 he said. \u2018You too!\u2019\n\n\u2018What are you in for?\u2019\n\n\u2018To tell you the truth\u2014\u2019 He sat down awkwardly on the bench opposite Winston.\n\u2018There is only one offence, is there not?\u2019 he said.\n\n\u2018And have you committed it?\u2019\n\n\u2018Apparently I have.\u2019\n\nHe put a hand to his forehead and pressed his temples for a moment, as though\ntrying to remember something.\n\n\u2018These things happen,\u2019 he began vaguely. \u2018I have been able to recall one\ninstance\u2014a possible instance. It was an indiscretion, undoubtedly. We were\nproducing a definitive edition of the poems of Kipling. I allowed the word \u2018God\u2019\nto remain at the end of a line. I could not help it!\u2019 he added almost\nindignantly, raising his face to look at Winston. \u2018It was impossible to change\nthe line. The rhyme was \u2018rod\u201d. Do you realize that there are only twelve rhymes\nto \u2018rod\u2019 in the entire language? For days I had racked my brains. There WAS no\nother rhyme.\u2019\n\nThe expression on his face changed. The annoyance passed out of it and for a\nmoment he looked almost pleased. A sort of intellectual warmth, the joy of the\npedant who has found out some useless fact, shone through the dirt and scrubby\nhair.\n\n\u2018Has it ever occurred to you,\u2019 he said, \u2018that the whole history of English\npoetry has been determined by the fact that the English language lacks rhymes?\u2019\n\nNo, that particular thought had never occurred to Winston. Nor, in the\ncircumstances, did it strike him as very important or interesting.\n\n\u2018Do you know what time of day it is?\u2019 he said.\n\nAmpleforth looked startled again. \u2018I had hardly thought about it. They arrested\nme\u2014it could be two days ago\u2014perhaps three.\u2019 His eyes flitted round the walls, as\nthough he half expected to find a window somewhere. \u2018There is no difference\nbetween night and day in this place. I do not see how one can calculate the\ntime.\u2019\n\nThey talked desultorily for some minutes, then, without apparent reason, a yell\nfrom the telescreen bade them be silent. Winston sat quietly, his hands crossed.\nAmpleforth, too large to sit in comfort on the narrow bench, fidgeted from side\nto side, clasping his lank hands first round one knee, then round the other. The\ntelescreen barked at him tokeep still. Time passed. Twenty minutes, an hour\u2014it\nwas difficult to judge. Once more there was a sound of boots outside. Winston\u2019s\nentrails contracted. Soon, very soon, perhaps in five minutes, perhaps now, the\ntramp of boots would mean that his own turn had come.\n\nThe door opened. The cold-faced young officer stepped into the cell. With a\nbrief movement of the hand he indicated Ampleforth.\n\n\u2018Room 101,\u2019 he said.\n\nAmpleforth marched clumsily out between the guards, his face vaguely perturbed,\nbut uncomprehending.\n\nWhat seemed like a long time passed. The pain in Winston\u2019s belly had revived.\nHis mind sagged round and round on the same trick, like a ball falling again and\nagain into the same series of slots. He had only six thoughts. The pain in his\nbelly; a piece of bread; the blood and the screaming; O\u2019Brien; Julia; the razor\nblade. There was another spasm in his entrails, the heavy boots were\napproaching. As the door opened, the wave of air that it created brought in a\npowerful smell of cold sweat. Parsons walked into the cell. He was wearing khaki\nshorts and a sports-shirt.\n\nThis time Winston was startled into self-forgetfulness.\n\n\u2018YOU here!\u2019 he said.\n\nParsons gave Winston a glance in which there was neither interest nor surprise,\nbut only misery. He began walking jerkily up and down, evidently unable to keep\nstill. Each time he straightened his pudgy knees it was apparent that they were\ntrembling. His eyes had a wide-open, staring look, as though he could not\nprevent himself from gazing atsomething in the middle distance.\n\n\u2018What are you in for?\u2019 said Winston.\n\n\u2018Thoughtcrime!\u2019 said Parsons, almost blubbering. The tone of his voice implied\nat once a complete admission of his guilt and a sort of incredulous horror that\nsuch a word could be applied to himself. He paused opposite Winston and began\neagerly appealing to him: \u2018You don\u2019t think they\u2019ll shoot me, do you, old chap?\nThey don\u2019t shoot you if you haven\u2019t actually done anything\u2014only thoughts, which\nyou can\u2019t help? I know they give you a fair hearing. Oh, I trust them for that!\nThey\u2019ll know my record, won\u2019t they? YOU know what kind of chap I was. Not a bad\nchap in my way. Not brainy, of course, but keen. I tried to do my best for the\nParty, didn\u2019t I? I\u2019ll get off with five years, don\u2019t you think? Or even ten\nyears? A chap like me could make himself pretty useful in a labour-camp. They\nwouldn\u2019t shoot me for going off the rails just once?\u2019\n\n\u2018Are you guilty?\u2019 said Winston.\n\n\u2018Of course I\u2019m guilty!\u2019 cried Parsons with a servile glance at the telescreen.\n\u2018You don\u2019t think the Party would arrest an innocent man, do you?\u2019 His frog-like\nface grew calmer, and even took on a slightly sanctimonious expression.\n\u2018Thoughtcrime is a dreadful thing, old man,\u2019 he said sententiously. \u2018It\u2019s\ninsidious. It can get hold of you without your even knowing it. Do you know how\nit got hold of me? In my sleep! Yes, that\u2019s a fact. There I was, working away,\ntrying to do my bit\u2014never knew I had any bad stuff in my mind at all. And then I\nstarted talking in my sleep. Do you know what they heard me saying?\u2019\n\nHe sank his voice, like someone who is obliged for medical reasons to utter an\nobscenity.\n\n\u2018\u2019Down with Big Brother!\u2019 Yes, I said that! Said it over and over again, it\nseems. Between you and me, old man, I\u2019m glad they got me before it went any\nfurther. Do you know what I\u2019m going to say to them when I go up before the\ntribunal? \u2018Thank you,\u2019 I\u2019m going to say, \u2018thank you for saving me before it was\ntoo late.\u2018\u2018\n\n\u2018Who denounced you?\u2019 said Winston.\n\n\u2018It was my little daughter,\u2019 said Parsons with a sort of doleful pride. \u2018She\nlistened at the keyhole. Heard what I was saying, and nipped off to the patrols\nthe very next day. Pretty smart for a nipper of seven, eh? I don\u2019t bear her any\ngrudge for it. In fact I\u2019m proud of her. It shows I brought her up in the right\nspirit, anyway.\u2019\n\nHe made a few more jerky movements up and down, several times, casting a longing\nglance at the lavatory pan. Then he suddenly ripped down his shorts.\n\n\u2018Excuse me, old man,\u2019 he said. \u2018I can\u2019t help it. It\u2019s the waiting.\u2019\n\nHe plumped his large posterior into the lavatory pan. Winston covered his face\nwith his hands.\n\n\u2018Smith!\u2019 yelled the voice from the telescreen. \u20186079 Smith W! Uncover your face.\nNo faces covered in the cells.\u2019\n\nWinston uncovered his face. Parsons used the lavatory, loudly and abundantly. It\nthen turned out that the plug was defective and the cell stank abominably for\nhours afterwards.\n\nParsons was removed. More prisoners came and went,\n\nmysteriously. One, a woman, was consigned to \u2018Room 101\u2019, and, Winston noticed,\nseemed to shrivel and turn a different colour when she heard the words. A time\ncame when, if it had been morning when he was brought here, it would be\nafternoon; or if it had been afternoon, then it would be midnight. There were\nsix prisoners in the cell, men and women. All sat very still. Opposite Winston\nthere sat a man with a chinless, toothy face exactly like that of some large,\nharmless rodent. His fat, mottled cheeks were so pouched at the bottom that it\nwas difficult not to believe that he had little stores of food tucked away\nthere. His pale-grey eyes flitted timorously from face to face and turned\nquickly away again when he caught anyone\u2019s eye.\n\nThe door opened, and another prisoner was brought in whose appearance sent a\nmomentary chill through Winston. He was a commonplace, mean-looking man who\nmight have been an engineer or technician of some kind. But what was startling\nwas the emaciation of his face. It was like a skull. Because of its thinness the\nmouth and eyes looked disproportionately large, and the eyes seemed filled with\na murderous, unappeasable hatred of somebody or something.\n\nThe man sat down on the bench at a little distance from Winston. Winston did not\nlook at him again, but the tormented, skull-like face was as vivid in his mind\nas though it had been straight in front of his eyes. Suddenly he realized what\nwas the matter. The man was dying of starvation. The same thought seemed to\noccur almost simultaneously to everyone in the cell. There was a very faint\nstirring allthe way round the bench. The eyes of the chinless man kept flitting\ntowards the skull-faced man, then turning guiltily away, then being dragged back\nby an irresistible attraction. Presently he began to fidget on his seat. At last\nhe stood up, waddled clumsily across the cell, dug down into the pocket of his\noveralls, and, with an abashed air, held out a grimy piece of bread to the\nskull-faced man.\n\nThere was a furious, deafening roar from the telescreen. The chinless man jumped\nin his tracks. The skull-faced man had quickly thrust his hands behind his back,\nas though demonstrating to all the world that he refused the gift.\n\n\u2018Bumstead!\u2019 roared the voice. \u20182713 Bumstead J.! Let fall that piece of bread!\u2019\n\nThe chinless man dropped the piece of bread on the floor.\n\n\u2018Remain standing where you are,\u2019 said the voice. \u2018Face the door. Make no\nmovement.\u2019\n\nThe chinless man obeyed. His large pouchy cheeks were quivering uncontrollably.\nThe door clanged open. As the young officer entered and stepped aside, there\nemerged from behind him a short stumpy guard with enormous arms and shoulders.\nHe took his stand opposite the chinless man, and then, at a signal from the\nofficer, let free a frightful blow, with all the weight of his body behind it,\nfull in the chinless man\u2019s mouth. The force of it seemed almost to knock him\nclear of the floor. His body was flung across the cell and fetched up against\nthe base of the lavatory seat. For a moment he lay as though stunned, with dark\nblood oozing from his mouth and nose. A very faint whimpering or squeaking,\nwhich seemed unconscious, came out of him. Then he rolled over and raised\nhimself unsteadily on hands and knees. Amid a stream of blood and saliva, the\ntwo halves of a dental plate fell out of his mouth.\n\nThe prisoners sat very still, their hands crossed on their knees. The chinless\nman climbed back into his place. Down one side of his face the flesh was\ndarkening. His mouth had swollen into a shapeless cherry-coloured mass with a\nblack hole in the middle of it.\n\nFrom time to time a little blood dripped on to the breast of his overalls. His\ngrey eyes still flitted from face to face, more guiltily than ever, as though he\nwere trying to discover how much the others despised him for his humiliation.\n\nThe door opened. With a small gesture the officer indicated the skull-faced man.\n\n\u2018Room 101,\u2019 he said.\n\nThere was a gasp and a flurry at Winston\u2019s side. The man had actually flung\nhimself on his knees on the floor, with his hand clasped together.\n\n\u2018Comrade! Officer!\u2019 he cried. \u2018You don\u2019t have to take me to that place! Haven\u2019t\nI told you everything already? What else is it you want to know? There\u2019s nothing\nI wouldn\u2019t confess, nothing! Just tell me what it is and I\u2019ll confess straight\noff. Write it down and I\u2019ll sign it\u2014anything! Not room 101!\u2019\n\n\u2018Room 101,\u2019 said the officer.\n\nThe man\u2019s face, already very pale, turned a colour Winston would not have\nbelieved possible. It was definitely, unmistakably, a shade of green.\n\n\u2018Do anything to me!\u2019 he yelled. \u2018You\u2019ve been starving mefor weeks. Finish it off\nand let me die. Shoot me. Hang me. Sentence me to twenty-five years. Is there\nsomebody else you want me to give away? Just say who it is and I\u2019ll tell you\nanything you want. I don\u2019t care who it is or what you do to them. I\u2019ve got a\nwife and three children. The biggest of them isn\u2019t six years old. You can take\nthe whole lot of them and cut their throats in front of my eyes, and I\u2019ll stand\nby and watch it. But not Room 101!\u2019\n\n\u2018Room 101,\u2019 said the officer.\n\nThe man looked frantically round at the other prisoners, as though with some\nidea that he could put another victim in his own place. His eyes settled on the\nsmashed face of the chinless man. He flung out a lean arm.\n\n\u2018That\u2019s the one you ought to be taking, not me!\u2019 he shouted. \u2018You didn\u2019t hear\nwhat he was saying after they bashed his face. Give me a chance and I\u2019ll tell\nyou every word of it. HE\u2019S the one that\u2019s against the Party, not me.\u2019 The guards\nstepped forward. The man\u2019s voice rose to a shriek. \u2018You didn\u2019t hear him!\u2019 he\nrepeated. \u2018Something went wrong with the telescreen. HE\u2019S the one you want. Take\nhim, not me!\u2019\n\nThe two sturdy guards had stooped to take him by the arms. But just at this\nmoment he flung himself across the floor of the cell and grabbed one of the iron\nlegs that supported the bench. He had set up a wordless howling, like an animal.\nThe guards took hold of him to wrench him loose, but he clung on with\nastonishing strength. For perhaps twenty seconds they were hauling at him. The\nprisoners sat quiet, their hands crossed on their knees, looking straight in\nfront of them. The howling stopped; the man had nobreath left for anything\nexcept hanging on. Then there was a different kind of cry. A kick from a guard\u2019s\nboot had broken the fingers of one of his hands. They dragged him to his feet.\n\n\u2018Room 101,\u2019 said the officer.\n\nThe man was led out, walking unsteadily, with head sunken, nursing his crushed\nhand, all the fight had gone out of him.\n\nA long time passed. If it had been midnight when the skull-faced man was taken\naway, it was morning: if morning, it was afternoon. Winston was alone, and had\nbeen alone for hours. The pain of sitting on the narrow bench was such that\noften he got up and walked about, unreproved by the telescreen. The piece of\nbread still lay where the chinless man had dropped it. At the beginning it\nneeded a hard effort not to look at it, but presently hunger gave way to thirst.\nHis mouth was sticky and evil-tasting. The humming sound and the unvarying white\nlight induced a sort of faintness, an empty feeling inside his head. He would\nget up because the ache in his bones was no longer bearable, and then would sit\ndown again almost at once because he was too dizzy to make sure of staying on\nhis feet. Whenever his physical sensations were a little under control the\nterror returned. Sometimes with a fading hope he thought of O\u2019Brien and the\nrazor blade. It was thinkable that the razor blade might arrive concealed in his\nfood, if he were ever fed. More dimly he thought of Julia. Somewhere or other\nshe was suffering perhaps far worse than he. She might be screaming with pain at\nthis moment. He thought: \u2018If I couldsave Julia by doubling my own pain, would I\ndo it? Yes, I would.\u2019 But that was merely an intellectual decision, taken\nbecause he knew that he ought to take it. He did not feel it. In this place you\ncould not feel anything, except pain and foreknowledge of pain. Besides, was it\npossible, when you were actually suffering it, to wish for any reason that your\nown pain should increase? But that question was not answerable yet.\n\nThe boots were approaching again. The door opened. O\u2019Brien came in.\n\nWinston started to his feet. The shock of the sight had driven all caution out\nof him. For the first time in many years he forgot the presence of the\ntelescreen.\n\n\u2018They\u2019ve got you too!\u2019 he cried.\n\n\u2018They got me a long time ago,\u2019 said O\u2019Brien with a mild, almost regretful irony.\nHe stepped aside. From behind him there emerged a broad-chested guard with a\nlong black truncheon in his hand.\n\n\u2018You know this, Winston,\u2019 said O\u2019Brien. \u2018Don\u2019t deceive yourself. You did know\nit\u2014you have always known it.\u2019\n\nYes, he saw now, he had always known it. But there was no time to think of that.\nAll he had eyes for was the truncheon in the guard\u2019s hand. It might fall\nanywhere; on the crown, on the tip of the ear, on the upper arm, on the elbow\u2014\u2014\n\nThe elbow! He had slumped to his knees, almost paralysed, clasping the stricken\nelbow with his other hand. Everything had exploded into yellow light.\nInconceivable, inconceivable that one blow could cause such pain! The light\ncleared and he could see the other two looking downat him. The guard was\nlaughing at his contortions. One question at any rate was answered. Never, for\nany reason on earth, could you wish for an increase of pain. Of pain you could\nwish only one thing: that it should stop. Nothing in the world was so bad as\nphysical pain. In the face of pain there are no heroes, no heroes, he thought\nover and over as he writhed on the floor, clutching uselessly at his disabled\nleft arm.\n\nChapter 2\n\nH     e was lying on something that felt like a camp bed, except that it was\nhigher off the ground and that he was fixed down in some way so that he could\nnot move. Light that seemed stronger than usual was falling on his face. O\u2019Brien\nwas standing at his side, looking down at him intently. At the other side of him\nstood a man in a white coat, holding a hypodermic syringe.\n\nEven after his eyes were open he took in his surroundings only gradually. He had\nthe impression of swimming up into this room from some quite different world, a\nsort of underwater world far beneath it. How long he had been down there he did\nnot know. Since the moment when they arrested him he had not seen darkness or\ndaylight. Besides, his memories were not continuous. There had been times when\nconsciousness, even the sort of consciousness that one has in sleep, had stopped\ndead and started again after a blank interval. But whether the intervals were of\ndays or weeks or only seconds, there was no way of knowing.\n\nWith that first blow on the elbow the nightmare had started. Later he was to\nrealize that all that then happened was merely a preliminary, a routine\ninterrogation to which nearly all prisoners were subjected. There was a long\nrange of crimes\u2014espionage, sabotage, and the like\u2014to which everyone had to\nconfess as a matter of course. The confessionwas a formality, though the torture\nwas real. How many times he had been beaten, how long the beatings had\ncontinued, he could not remember. Always there were five or six men in black\nuniforms at him simultaneously. Sometimes it was fists, sometimes it was\ntruncheons, sometimes it was steel rods, sometimes it was boots. There were\ntimes when he rolled about the floor, as shameless as an animal, writhing his\nbody this way and that in an endless, hopeless effort to dodge the kicks, and\nsimply inviting more and yet more kicks, in his ribs, in his belly, on his\nelbows, on his shins, in his groin, in his testicles, on the bone at the base of\nhis spine. There were times when it went on and on until the cruel, wicked,\nunforgivable thing seemed to him not that the guards continued to beat him but\nthat he could not force hirnself into losing consciousness. There were times\nwh
