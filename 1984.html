with Eurasia, and it must have been to\nthe agents of Eastasia that the three dead men had betrayed their country. Since\nthen there had been other changes\u2014two, three, he could not remember how many.\nVery likely the confessions had been rewritten and rewritten until the original\nfacts and dates no longer had the smallest significance. The past not only\nchanged, but changed continuously. What most afflicted him with the sense of\nnightmare was that he had never clearly understood why the huge imposture was\nundertaken. The immediate advantages of falsifying the past were obvious, but\nthe ultimate motive was mysterious. He took up his pen again and wrote:\n\nI understand HOW: I do not understand WHY.\n\nHe wondered, as he had many times wondered before, whether he himself was a\nlunatic. Perhaps a lunatic was simply a minority of one. At one time it had been\na sign of madness to believe that the earth goes round the sun; today, to\nbelieve that the past is inalterable. He might be ALONE in holding that belief,\nand if alone, then a lunatic. But the thought of being a lunatic did not greatly\ntrouble him: the horror was that he might also be wrong.\n\nHe picked up the children\u2019s history book and looked at the portrait of Big\nBrother which formed its frontispiece. The hypnotic eyes gazed into his own. It\nwas as though some huge force were pressing down upon you\u2014something that\npenetrated inside your skull, battering against your brain, frightening you out\nof your beliefs, persuading you, almost, to deny the evidence of your senses. In\nthe end the Party would announce that two and two made five, and you would have\nto believe it. It was inevitable that they should make that claim sooner or\nlater: the logic of their position demanded it. Not merely the validity of\nexperience, but the very existence of external reality, was tacitly denied by\ntheir philosophy. The heresy of heresies was common sense. And what was\nterrifying was not that they would kill you for thinking otherwise, but that\nthey might be right. For, after all, how do we know that two and two make four?\nOr that the force of gravity works? Or that the past is unchangeable? If both\nthe past and the external world exist only in the mind, and if the mind itself\nis controllable what then?\n\nBut no! His courage seemed suddenly to stiffen of its own accord. The face of\nO\u2019Brien, not called up by any obvious association, had floated into his mind. He\nknew, with more certainty than before, that O\u2019Brien was on his side. He was\nwriting the diary for O\u2019Brien\u2014TO O\u2019Brien: it was like an interminable letter\nwhich no one would ever read, but which was addressed to a particular person and\ntook its colour from that fact.\n\nThe Party told you to reject the evidence of your eyes and ears. It was their\nfinal, most essential command. His heart sank as he thought of the enormous\npower arrayed against him, the ease with which any Party intellectual would\noverthrow him in debate, the subtle arguments which he would not be able to\nunderstand, much less answer. And yet he was in the right! They were wrong and\nhe was right. The obvious, the silly, and the true had got to be defended.\nTruisms are true, hold on to that! The solid world exists, its laws do not\nchange. Stones are hard, water is wet, objects unsupported fall towards the\nearth\u2019s centre. With the feeling that he was speaking to O\u2019Brien, and also that\nhe was setting forth an important axiom, he wrote:\n\nFreedom is the freedom to say that two plus two make four. Ifthat is granted, all else follows.\n\nChapter 8\n\nF   rom somewhere at the bottom of a passage the smell ofroasting coffee\u2014real\ncoffee, not Victory Coffee\u2014came floating out into the street. Winston paused\ninvoluntarily. For perhaps two seconds he was back in the half-forgotten world\nof his childhood. Then a door banged, seeming to cut off the smell as abruptly\nas though it had been a sound.\n\nHe had walked several kilometres over pavements, and his varicose ulcer was\nthrobbing. This was the second time in three weeks that he had missed an evening\nat the Community Centre: a rash act, since you could be certain that the number\nof your attendances at the Centre was carefully checked. In principle a Party\nmember had no spare time, and was never alone except in bed. It was assumed that\nwhen he was not working, eating, or sleeping he would be taking part in some\nkind of communal recreation: to do anything that suggested a taste for solitude,\neven to go for a walk by yourself, was always slightly dangerous. There was a\nword for it in Newspeak: OWNLIFE, it was called, meaning individualism and\neccentricity. But this evening as he came out of the Ministry the balminess of\nthe April air had tempted him. The sky was a warmer blue than he had seen it\nthat year, and suddenly the long, noisy evening at the Centre, the boring,\nexhausting games, the lectures, the creaking camaraderie oiled by gin, had\nseemed intolerable. On impulse he had turned away from the bus-stop and wandered\noff into the labyrinth of London, first south, then east, then north again,\nlosing himself among unknown streets and hardly bothering in which direction he\nwas going.\n\n\u2018If there is hope,\u2019 he had written in the diary, \u2018it lies in the proles.\u2019 The\nwords kept coming back to him, statement of a mystical truth and a palpable\nabsurdity. He was somewhere in the vague, brown-coloured slums to the north and\neast of what had once been Saint Pancras Station. He was walking up a cobbled\nstreet of little two-storey houses with battered doorways which gave straight on\nthe pavement and which were somehow curiously suggestive of ratholes. There were\npuddles of filthy water here and there among the cobbles. In and out of the dark\ndoorways, and down narrow alley-ways that branched off on either side, people\nswarmed in astonishing numbers\u2014girls in full bloom, with crudely lipsticked\nmouths, and youths who chased the girls, and swollen waddling women who showed\nyou what the girls would be like in ten years\u2019 time, and old bent creatures\nshuffling along on splayed feet, and ragged barefooted children who played in\nthe puddles and then scattered at angry yells from their mothers. Perhaps a\nquarter of the windows in the street were broken and boarded up. Most of the\npeople paid no attention to Winston; a few eyed him with a sort of guarded\ncuriosity. Two monstrous women with brick-red forearms folded across thelr\naprons were talking outside a doorway. Winston caught scraps of conversation as\nhe approached.\n\n\u2018\u2019Yes,\u2019 I says to \u2018er, \u2018that\u2019s all very well,\u2019 I says. \u2018But if you\u2019dof been in\nmy place you\u2019d of done the same as what I done. It\u2019s easy to criticize,\u2019 I says,\n\u2018but you ain\u2019t got the same problems as what I got.\u2018\u2018\n\n\u2018Ah,\u2019 said the other, \u2018that\u2019s jest it. That\u2019s jest where it is.\u2019\n\nThe strident voices stopped abruptly. The women studied him in hostile silence\nas he went past. But it was not hostility, exactly; merely a kind of wariness, a\nmomentary stiffening, as at the passing of some unfamiliar animal. The blue\noveralls of the Party could not be a common sight in a street like this. Indeed,\nit was unwise to be seen in such places, unless you had definite business there.\nThe patrols might stop you if you happened to run into them. \u2018May I see your\npapers, comrade? What are you doing here? What time did you leave work? Is this\nyour usual way home?\u2019\u2014and so on and so forth. Not that there was any rule\nagainst walking home by an unusual route: but it was enough to draw attention to\nyou if the Thought Police heard about it.\n\nSuddenly the whole street was in commotion. There were yells of warning from all\nsides. People were shooting into the doorways like rabbits. A young woman leapt\nout of a doorway a little ahead of Winston, grabbed up a tiny child playing in a\npuddle, whipped her apron round it, and leapt back again, all in one movement.\nAt the same instant a man in a concertina-like black suit, who had emerged from\na side alley, ran towards Winston, pointing excitedly to the sky.\n\n\u2018Steamer!\u2019 he yelled. \u2018Look out, guv\u2019nor! Bang over\u2019ead! Lay down quick!\u2019\n\n\u2018Steamer\u2019 was a nickname which, for some reason, theproles applied to rocket\nbombs. Winston promptly flung himself on his face. The proles were nearly always\nright when they gave you a warning of this kind. They seemed to possess some\nkind of instinct which told them several seconds in advance when a rocket was\ncoming, although the rockets supposedly travelled faster than sound. Winston\nclasped his forearms above his head. There was a roar that seemed to make the\npavement heave; a shower of light objects pattered on to his back. When he stood\nup he found that he was covered with fragments of glass from the nearest window.\n\nHe walked on. The bomb had demolished a group of houses 200 metres up the\nstreet. A black plume of smoke hung in the sky, and below it a cloud of plaster\ndust in which a crowd was already forming around the ruins. There was a little\npile of plaster lying on the pavement ahead of him, and in the middle of it he\ncould see a bright red streak. When he got up to it he saw that it was a human\nhand severed at the wrist. Apart from the bloody stump, the hand was so\ncompletely whitened as to resemble a plaster cast.\n\nHe kicked the thing into the gutter, and then, to avoid the crowd, turned down a\nside-street to the right. Within three or four minutes he was out of the area\nwhich the bomb had affected, and the sordid swarming life of the streets was\ngoing on as though nothing had happened. It was nearly twenty hours, and the\ndrinking-shops which the proles frequented (\u2019pubs\u2019, they called them) were\nchoked with customers. From their grimy swing doors, endlessly opening and\nshutting, there came forth a smell of urine,\n\nsawdust, and sour beer. In an angle formed by a projecting house-front three men\nwere standing very close together, the middle one of them holding a folded-up\nnewspaper which the other two were studying over his shoulder. Even before he\nwas near enough to make out the expression on their faces, Winston could see\nabsorption in every line of their bodies. It was obviously some serious piece of\nnews that they were reading. He was a few paces away from them when suddenly the\ngroup broke up and two of the men were in violent altercation. For a moment they\nseemed almost on the point of blows.\n\n\u2018Can\u2019t you bleeding well listen to what I say? I tell you no number ending in\nseven ain\u2019t won for over fourteen months!\u2019\n\n\u2018Yes, it \u2018as, then!\u2019\n\n\u2018No, it \u2018as not! Back \u2018ome I got the \u2018ole lot of \u2018em for over two years wrote\ndown on a piece of paper. I takes \u2018em down reg\u2019lar as the clock. An\u2019 I tell you,\nno number ending in seven\u2014\u2014\u2019\n\n\u2018Yes, a seven \u2018AS won! I could pretty near tell you the bleeding number. Four oh\nseven, it ended in. It were in February\u2014second week in February.\u2019\n\n\u2018February your grandmother! I got it all down in black and white. An\u2019 I tell\nyou, no number\u2014\u2014\u2019\n\n\u2018Oh, pack it in!\u2019 said the third man.\n\nThey were talking about the Lottery. Winston looked back when he had gone thirty\nmetres. They were still arguing, with vivid, passionate faces. The Lottery, with\nits weekly pay-out of enormous prizes, was the one public eventto which the\nproles paid serious attention. It was probable that there were some millions of\nproles for whom the Lottery was the principal if not the only reason for\nremaining alive. It was their delight, their folly, their anodyne, their\nintellectual stimulant. Where the Lottery was concerned, even people who could\nbarely read and write seemed capable of intricate calculations and staggering\nfeats of memory. There was a whole tribe of men who made a living simply by\nselling systems, forecasts, and lucky amulets. Winston had nothing to do with\nthe running of the Lottery, which was managed by the Ministry of Plenty, but he\nwas aware (indeed everyone in the party was aware) that the prizes were largely\nimaginary. Only small sums were actually paid out, the winners of the big prizes\nbeing non-existent persons. In the absence of any real intercommunication\nbetween one part of Oceania and another, this was not difficult to arrange.\n\nBut if there was hope, it lay in the proles. You had to cling on to that. When\nyou put it in words it sounded reasonable: it was when you looked at the human\nbeings passing you on the pavement that it became an act of faith. The street\ninto which he had turned ran downhill. He had a feeling that he had been in this\nneighbourhood before, and that there was a main thoroughfare not far away. From\nsomewhere ahead there came a din of shouting voices. The street took a sharp\nturn and then ended in a flight of steps which led down into a sunken alley\nwhere a few stall-keepers were selling tiredlooking vegetables. At this moment\nWinston remembered where he was. The alley led out into the main street, anddown\nthe next turning, not five minutes away, was the junkshop where he had bought\nthe blank book which was now his diary. And in a small stationer\u2019s shop not far\naway he had bought his penholder and his bottle of ink.\n\nHe paused for a moment at the top of the steps. On the opposite side of the\nalley there was a dingy little pub whose windows appeared to be frosted over but\nin reality were merely coated with dust. A very old man, bent but active, with\nwhite moustaches that bristled forward like those of a prawn, pushed open the\nswing door and went in. As Winston stood watching, it occurred to him that the\nold man, who must be eighty at the least, had already been middleaged when the\nRevolution happened. He and a few others like him were the last links that now\nexisted with the vanished world of capitalism. In the Party itself there were\nnot many people left whose ideas had been formed before the Revolution. The\nolder generation had mostly been wiped out in the great purges of the fifties\nand sixties, and the few who survived had long ago been terrified into complete\nintellectual surrender. If there was any one still alive who could give you a\ntruthful account of conditions in the early part of the century, it could only\nbe a prole. Suddenly the passage from the history book that he had copied into\nhis diary came back into Winston\u2019s mind, and a lunatic impulse took hold of him.\nHe would go into the pub, he would scrape acquaintance with that old man and\nquestion him. He would say to him: \u2018Tell me about your life when you were a boy.\nWhat was it like in those days? Were things better than they are now, or were\nthey worse?\u2019\n\nHurriedly, lest he should have time to become frightened, he descended the steps\nand crossed the narrow street. It was madness of course. As usual, there was no\ndefinite rule against talking to proles and frequenting their pubs, but it was\nfar too unusual an action to pass unnoticed. If the patrols appeared he might\nplead an attack of faintness, but it was not likely that they would believe him.\nHe pushed open the door, and a hideous cheesy smell of sour beer hit him in the\nface. As he entered the din of voices dropped to about half its volume. Behind\nhis back he could feel everyone eyeing his blue overalls. A game of darts which\nwas going on at the other end of the room interrupted itself for perhaps as much\nas thirty seconds. The old man whom he had followed was standing at the bar,\nhaving some kind of altercation with the barman, a large, stout, hook-nosed\nyoung man with enormous forearms. A knot of others, standing round with glasses\nin their hands, were watching the scene.\n\n\u2018I arst you civil enough, didn\u2019t I?\u2019 said the old man, straightening his\nshoulders pugnaciously. \u2018You telling me you ain\u2019t got a pint mug in the \u2018ole\nbleeding boozer?\u2019\n\n\u2018And what in hell\u2019s name IS a pint?\u2019 said the barman, leaning forward with the\ntips of his fingers on the counter.\n\n\u2018\u2019Ark at \u2018im! Calls \u2018isself a barman and don\u2019t know what a pint is! Why, a\npint\u2019s the \u2018alf of a quart, and there\u2019s four quarts to the gallon. \u2018Ave to teach\nyou the A, B, C next.\u2019\n\n\u2018Never heard of \u2018em,\u2019 said the barman shortly. \u2018Litre and half litre\u2014that\u2019s all\nwe serve. There\u2019s the glasses on the shelf in front of you.\u2019\n\n\u2018I likes a pint,\u2019 persisted the old man. \u2018You could \u2018a drawedme off a pint easy\nenough. We didn\u2019t \u2018ave these bleeding litres when I was a young man.\u2019\n\n\u2018When you were a young man we were all living in the treetops,\u2019 said the barman,\nwith a glance at the other customers.\n\nThere was a shout of laughter, and the uneasiness caused by Winston\u2019s entry\nseemed to disappear. The old man\u2019s whitestubbled face had flushed pink. He\nturned away, muttering to himself, and bumped into Winston. Winston caught him\ngently by the arm.\n\n\u2018May I offer you a drink?\u2019 he said.\n\n\u2018You\u2019re a gent,\u2019 said the other, straightening his shoulders again. He appeared\nnot to have noticed Winston\u2019s blue overalls. \u2018Pint!\u2019 he added aggressively to\nthe barman. \u2018Pint of wallop.\u2019\n\nThe barman swished two half-litres of dark-brown beer into thick glasses which\nhe had rinsed in a bucket under the counter. Beer was the only drink you could\nget in prole pubs. The proles were supposed not to drink gin, though in practice\nthey could get hold of it easily enough. The game of darts was in full swing\nagain, and the knot of men at the bar had begun talking about lottery tickets.\nWinston\u2019s presence was forgotten for a moment. There was a deal table under the\nwindow where he and the old man could talk without fear of being overheard. It\nwas horribly dangerous, but at any rate there was no telescreen in the room, a\npoint he had made sure of as soon as he came in.\n\n\u2018\u2019E could \u2018a drawed me off a pint,\u2019 grumbled the old man as he settled down\nbehind a glass. \u2018A \u2018alf litre ain\u2019t enough. Itdon\u2019t satisfy. And a \u2018ole litre\u2019s\ntoo much. It starts my bladder running. Let alone the price.\u2019\n\n\u2018You must have seen great changes since you were a young man,\u2019 said Winston\ntentatively.\n\nThe old man\u2019s pale blue eyes moved from the darts board to the bar, and from the\nbar to the door of the Gents, as though it were in the bar-room that he expected\nthe changes to have occurred.\n\n\u2018The beer was better,\u2019 he said finally. \u2018And cheaper! When I was a young man,\nmild beer\u2014wallop we used to call it\u2014 was fourpence a pint. That was before the\nwar, of course.\u2019\n\n\u2018Which war was that?\u2019 said Winston.\n\n\u2018It\u2019s all wars,\u2019 said the old man vaguely. He took up his glass, and his\nshoulders straightened again. \u2018\u2019Ere\u2019s wishing you the very best of \u2018ealth!\u2019\n\nIn his lean throat the sharp-pointed Adam\u2019s apple made a surprisingly rapid up-\nand-down movement, and the beer vanished. Winston went to the bar and came back\nwith two more half-litres. The old man appeared to have forgotten his prejudice\nagainst drinking a full litre.\n\n\u2018You are very much older than I am,\u2019 said Winston. \u2018You must have been a grown\nman before I was born. You can remember what it was like in the old days, before\nthe Revolution. People of my age don\u2019t really know anything about those times.\nWe can only read about them in books, and what it says in the books may not be\ntrue. I should like your opinion on that. The history books say that life before\nthe Revolution was completely different from what it is now. There was the most\nterrible oppression, injustice, povertyworse than anything we can imagine. Here\nin London, the great mass of the people never had enough to eat from birth to\ndeath. Half of them hadn\u2019t even boots on their feet. They worked twelve hours a\nday, they left school at nine, they slept ten in a room. And at the same time\nthere were a very few people, only a few thousands\u2014the capitalists, they were\ncalled\u2014who were rich and powerful. They owned everything that there was to own.\nThey lived in great gorgeous houses with thirty servants, they rode about in\nmotor-cars and four-horse carriages, they drank champagne, they wore top hats\u2014\u2014\u2019\n\nThe old man brightened suddenly.\n\n\u2018Top \u2018ats!\u2019 he said. \u2018Funny you should mention \u2018em. The same thing come into my\n\u2018ead only yesterday, I dono why. I was jest thinking, I ain\u2019t seen a top \u2018at in\nyears. Gorn right out, they \u2018ave. The last time I wore one was at my sister-\ninlaw\u2019s funeral. And that was\u2014well, I couldn\u2019t give you the date, but it must\u2019a\nbeen fifty years ago. Of course it was only \u2018ired for the occasion, you\nunderstand.\u2019\n\n\u2018It isn\u2019t very important about the top hats,\u2019 said Winston patiently. \u2018The point\nis, these capitalists\u2014they and a few lawyers and priests and so forth who lived\non them\u2014were the lords of the earth. Everything existed for their benefit.\nYou\u2014the ordinary people, the workers\u2014were their slaves. They could do what they\nliked with you. They could ship you off to Canada like cattle. They could sleep\nwith your daughters if they chose. They could order you to be flogged with\nsomething called a cat-o\u2019-nine tails. You had to take your cap off when you\npassed them. Every capitalist wentabout with a gang of lackeys who\u2014\u2014\u2019\n\nThe old man brightened again.\n\n\u2018Lackeys!\u2019 he said. \u2018Now there\u2019s a word I ain\u2019t \u2018eard since ever so long.\nLackeys! That reg\u2019lar takes me back, that does. I recollect oh, donkey\u2019s years\nago\u2014I used to sometimes go to \u2018Yde Park of a Sunday afternoon to \u2018ear the blokes\nmaking speeches. Salvation Army, Roman Catholics, Jews, Indians\u2014all sorts there\nwas. And there was one bloke\u2014well, I couldn\u2019t give you \u2018is name, but a real\npowerful speaker \u2018e was. \u2018E didn\u2019t \u2018alf give it \u2018em! \u2018Lackeys!\u2019 \u2018e says,\n\u2018lackeys of the bourgeoisie! Flunkies of the ruling class!\u2019 Parasites\u2014 that was\nanother of them. And \u2018yenas\u2014\u2019e definitely called \u2018em \u2018yenas. Of course \u2018e was\nreferring to the Labour Party, you understand.\u2019\n\nWinston had the feeling that they were talking at crosspurposes.\n\n\u2018What I really wanted to know was this,\u2019 he said. \u2018Do you feel that you have\nmore freedom now than you had in those days? Are you treated more like a human\nbeing? In the old days, the rich people, the people at the top\u2014\u2014\u2019\n\n\u2018The \u2018Ouse of Lords,\u2019 put in the old man reminiscently.\n\n\u2018The House of Lords, if you like. What I am asking is, were these people able to\ntreat you as an inferior, simply because they were rich and you were poor? Is it\na fact, for instance, that you had to call them \u2018Sir\u2019 and take off your cap when\nyou passed them?\u2019\n\nThe old man appeared to think deeply. He drank off about a quarter of his beer\nbefore answering.\n\n\u2018Yes,\u2019 he said. \u2018They liked you to touch your cap to \u2018em.\n\nIt showed respect, like. I didn\u2019t agree with it, myself, but I done it often\nenough. Had to, as you might say.\u2019\n\n\u2018And was it usual\u2014I\u2019m only quoting what I\u2019ve read in history books\u2014was it usual\nfor these people and their servants to push you off the pavement into the\ngutter?\u2019\n\n\u2018One of \u2018em pushed me once,\u2019 said the old man. \u2018I recollect it as if it was\nyesterday. It was Boat Race night\u2014terribly rowdy they used to get on Boat Race\nnight\u2014and I bumps into a young bloke on Shaftesbury Avenue. Quite a gent, \u2018e\nwas\u2014dress shirt, top \u2018at, black overcoat. \u2018E was kind of zig-zagging across the\npavement, and I bumps into \u2018im accidental-like. \u2018E says, \u2018Why can\u2019t you look\nwhere you\u2019re going?\u2019 \u2018e says. I say, \u2018Ju think you\u2019ve bought the bleeding\npavement?\u2019 \u2018E says, \u2018I\u2019ll twist your bloody \u2018ead off if you get fresh with me.\u2019\nI says, \u2018You\u2019re drunk. I\u2019ll give you in charge in \u2018alf a minute,\u2019 I says. An\u2019 if\nyou\u2019ll believe me, \u2018e puts \u2018is \u2018and on my chest and gives me a shove as pretty\nnear sent me under the wheels of a bus. Well, I was young in them days, and I\nwas going to \u2018ave fetched \u2018im one, only\u2014\u2014\u2019\n\nA sense of helplessness took hold of Winston. The old man\u2019s memory was nothing\nbut a rubbish-heap of details. One could question him all day without getting\nany real information. The party histories might still be true, after a fashion:\nthey might even be completely true. He made a last attempt.\n\n\u2018Perhaps I have not made myself clear,\u2019 he said. \u2018What I\u2019m trying to say is\nthis. You have been alive a very long time; you lived half your life before the\nRevolution. In 1925, for instance, you were already grown up. Would you say\nfromwhat you can remember, that life in 1925 was better than it is now, or\nworse? If you could choose, would you prefer to live then or now?\u2019\n\nThe old man looked meditatively at the darts board. He finished up his beer,\nmore slowly than before. When he spoke it was with a tolerant philosophical air,\nas though the beer had mellowed him.\n\n\u2018I know what you expect me to say,\u2019 he said. \u2018You expect me to say as I\u2019d sooner\nbe young again. Most people\u2019d say they\u2019d sooner be young, if you arst\u2019 \u2018em. You\ngot your \u2018ealth and strength when you\u2019re young. When you get to my time of life\nyou ain\u2019t never well. I suffer something wicked from my feet, and my bladder\u2019s\njest terrible. Six and seven times a night it \u2018as me out of bed. On the other\n\u2018and, there\u2019s great advantages in being a old man. You ain\u2019t got the same\nworries. No truck with women, and that\u2019s a great thing. I ain\u2019t \u2018ad a woman for\nnear on thirty year, if you\u2019d credit it. Nor wanted to, what\u2019s more.\u2019\n\nWinston sat back against the window-sill. It was no use going on. He was about\nto buy some more beer when the old man suddenly got up and shuffled rapidly into\nthe stinking urinal at the side of the room. The extra half-litre was already\nworking on him. Winston sat for a minute or two gazing at his empty glass, and\nhardly noticed when his feet carried him out into the street again. Within\ntwenty years at the most, he reflected, the huge and simple question, \u2018Was life\nbetter before the Revolution than it is now?\u2019 would have ceased once and for all\nto be answerable. But in effect it was unanswerable even now, since the few\nscattered survivors from the ancient world were incapable of comparing one age\nwith another. They remembered a million useless things, a quarrel with a\nworkmate, a hunt for a lost bicycle pump, the expression on a long-dead sister\u2019s\nface, the swirls of dust on a windy morning seventy years ago: but all the\nrelevant facts were outside the range of their vision. They were like the ant,\nwhich can see small objects but not large ones. And when memory failed and\nwritten records were falsified\u2014when that happened, the claim of the Party to\nhave improved the conditions of human life had got to be accepted, because there\ndid not exist, and never again could exist, any standard against which it could\nbe tested.\n\nAt this moment his train of thought stopped abruptly. He halted and looked up.\nHe was in a narrow street, with a few dark little shops, interspersed among\ndwelling-houses. Immediately above his head there hung three discoloured metal\nballs which looked as if they had once been gilded. He seemed to know the place.\nOf course! He was standing outside the junk-shop where he had bought the diary.\n\nA twinge of fear went through him. It had been a sufficiently rash act to buy\nthe book in the beginning, and he had sworn never to come near the place again.\nAnd yet the instant that he allowed his thoughts to wander, his feet had brought\nhim back here of their own accord. It was precisely against suicidal impulses of\nthis kind that he had hoped to guard himself by opening the diary. At the same\ntime he noticed that although it was nearly twenty-one hours the shop was still\nopen. With the feeling that he would be less conspicuous inside than hanging\nabout on the pavement,\n\nhe stepped through the doorway. If questioned, he could plausibly say that he\nwas trying to buy razor blades.\n\nThe proprietor had just lighted a hanging oil lamp which gave off an unclean but\nfriendly smell. He was a man of perhaps sixty, frail and bowed, with a long,\nbenevolent nose, and mild eyes distorted by thick spectacles. His hair was\nalmost white, but his eyebrows were bushy and still black. His spectacles, his\ngentle, fussy movements, and the fact that he was wearing an aged jacket of\nblack velvet, gave him a vague air of intellectuality, as though he had been\nsome kind of literary man, or perhaps a musician. His voice was soft, as though\nfaded, and his accent less debased than that of the majority of proles.\n\n\u2018I recognized you on the pavement,\u2019 he said immediately. \u2018You\u2019re the gentleman\nthat bought the young lady\u2019s keepsake album. That was a beautiful bit of paper,\nthat was. Creamlaid, it used to be called. There\u2019s been no paper like that made\nfor\u2014oh, I dare say fifty years.\u2019 He peered at Winston over the top of his\nspectacles. \u2018Is there anything special I can do for you? Or did you just want to\nlook round?\u2019\n\n\u2018I was passing,\u2019 said Winston vaguely. \u2018I just looked in. I don\u2019t want anything\nin particular.\u2019\n\n\u2018It\u2019s just as well,\u2019 said the other, \u2018because I don\u2019t suppose I could have\nsatisfied you.\u2019 He made an apologetic gesture with his softpalmed hand. \u2018You see\nhow it is; an empty shop, you might say. Between you and me, the antique trade\u2019s\njust about finished. No demand any longer, and no stock either. Furniture,\nchina, glass it\u2019s all been broken up by degrees. And of course the metal stuff\u2019s\nmostly been melted down. Ihaven\u2019t seen a brass candlestick in years.\u2019\n\nThe tiny interior of the shop was in fact uncomfortably full, but there was\nalmost nothing in it of the slightest value. The floorspace was very restricted,\nbecause all round the walls were stacked innumerable dusty picture-frames. In\nthe window there were trays of nuts and bolts, worn-out chisels, penknives with\nbroken blades, tarnished watches that did not even pretend to be in going order,\nand other miscellaneous rubbish. Only on a small table in the corner was there a\nlitter of odds and ends\u2014lacquered snuffboxes, agate brooches, and the like\u2014which\nlooked as though they might include something interesting. As Winston wandered\ntowards the table his eye was caught by a round, smooth thing that gleamed\nsoftly in the lamplight, and he picked it up.\n\nIt was a heavy lump of glass, curved on one side, flat on the other, making\nalmost a hemisphere. There was a peculiar softness, as of rainwater, in both the\ncolour and the texture of the glass. At the heart of it, magnified by the curved\nsurface, there was a strange, pink, convoluted object that recalled a rose or a\nsea anemone.\n\n\u2018What is it?\u2019 said Winston, fascinated.\n\n\u2018That\u2019s coral, that is,\u2019 said the old man. \u2018It must have come from the Indian\nOcean. They used to kind of embed it in the glass. That wasn\u2019t made less than a\nhundred years ago. More, by the look of it.\u2019\n\n\u2018It\u2019s a beautiful thing,\u2019 said Winston.\n\n\u2018It is a beautiful thing,\u2019 said the other appreciatively. \u2018But there\u2019s not many\nthat\u2019d say so nowadays.\u2019 He coughed. \u2018Now,\n\nif it so happened that you wanted to buy it, that\u2019d cost you four dollars. I can\nremember when a thing like that would have fetched eight pounds, and eight\npounds was\u2014well, I can\u2019t work it out, but it was a lot of money. But who cares\nabout genuine antiques nowadays\u2014even the few that\u2019s left?\u2019\n\nWinston immediately paid over the four dollars and slid the coveted thing into\nhis pocket. What appealed to him about it was not so much its beauty as the air\nit seemed to possess of belonging to an age quite different from the present\none. The soft, rainwatery glass was not like any glass that he had ever seen.\nThe thing was doubly attractive because of its apparent uselessness, though he\ncould guess that it must once have been intended as a paperweight. It was very\nheavy in his pocket, but fortunately it did not make much of a bulge. It was a\nqueer thing, even a compromising thing, for a Party member to have in his\npossession. Anything old, and for that matter anything beautiful, was always\nvaguely suspect. The old man had grown noticeably more cheerful after receiving\nthe four dollars. Winston realized that he would have accepted three or even\ntwo.\n\n\u2018There\u2019s another room upstairs that you might care to take a look at,\u2019 he said.\n\u2018There\u2019s not much in it. Just a few pieces. We\u2019ll do with a light if we\u2019re going\nupstairs.\u2019\n\nHe lit another lamp, and, with bowed back, led the way slowly up the steep and\nworn stairs and along a tiny passage, into a room which did not give on the\nstreet but looked out on a cobbled yard and a forest of chimney-pots. Winston\nnoticed that the furniture was still arranged as though theroom were meant to be\nlived in. There was a strip of carpet on the floor, a picture or two on the\nwalls, and a deep, slatternly arm-chair drawn up to the fireplace. An old-\nfashioned glass clock with a twelve-hour face was ticking away on the\nmantelpiece. Under the window, and occupying nearly a quarter of the room, was\nan enormous bed with the mattress still on it.\n\n\u2018We lived here till my wife died,\u2019 said the old man half apologetically. \u2018I\u2019m\nselling the furniture off by little and little. Now that\u2019s a beautiful mahogany\nbed, or at least it would be if you could get the bugs out of it. But I dare say\nyou\u2019d find it a little bit cumbersome.\u2019\n\nHe was holdlng the lamp high up, so as to illuminate the whole room, and in the\nwarm dim light the place looked curiously inviting. The thought flitted through\nWinston\u2019s mind that it would probably be quite easy to rent the room for a few\ndollars a week, if he dared to take the risk. It was a wild, impossible notion,\nto be abandoned as soon as thought of; but the room had awakened in him a sort\nof nostalgia, a sort of ancestral memory. It seemed to him that he knew exactly\nwhat it felt like to sit in a room like this, in an armchair beside an open fire\nwith your feet in the fender and a kettle on the hob; utterly alone, utterly\nsecure, with nobody watching you, no voice pursuing you, no sound except the\nsinging of the kettle and the friendly ticking of the clock.\n\n\u2018There\u2019s no telescreen!\u2019 he could not help murmuring.\n\n\u2018Ah,\u2019 said the old man, \u2018I never had one of those things. Too expensive. And I\nnever seemed to feel the need of it, somehow. Now that\u2019s a nice gateleg table in\nthe corner there.\n\nThough of course you\u2019d have to put new hinges on it if you wanted to use the\nflaps.\u2019\n\nThere was a small bookcase in the other corner, and Winston had already\ngravitated towards it. It contained nothing but rubbish. The hunting-down and\ndestruction of books had been done with the same thoroughness in the prole\nquarters as everywhere else. It was very unlikely that there existed anywhere in\nOceania a copy of a book printed earlier than 1960. The old man, still carrying\nthe lamp, was standing in front of a picture in a rosewood frame which hung on\nthe other side of the fireplace, opposite the bed.\n\n\u2018Now, if you happen to be interested in old prints at all\u2014 \u2014\u2019 he began\ndelicately.\n\nWinston came across to examine the picture. It was a steel engraving of an oval\nbuilding with rectangular windows, and a small tower in front. There was a\nrailing running round the building, and at the rear end there was what appeared\nto be a statue. Winston gazed at it for some moments. It seemed vaguely\nfamiliar, though he did not remember the statue.\n\n\u2018The frame\u2019s fixed to the wall,\u2019 said the old man, \u2018but I could unscrew it for\nyou, I dare say.\u2019\n\n\u2018I know that building,\u2019 said Winston finally. \u2018It\u2019s a ruin now. It\u2019s in the\nmiddle of the street outside the Palace of Justice.\u2019\n\n\u2018That\u2019s right. Outside the Law Courts. It was bombed in\u2014 oh, many years ago. It\nwas a church at one time, St Clement Danes, its name was.\u2019 He smiled\napologetically, as though conscious of saying something slightly ridiculous, and\nadded: \u2018Oranges and lemons, say the bells of St Clement\u2019s!\u2019\n\n\u2018What\u2019s that?\u2019 said Winston.\n\n\u2018Oh\u2014\u2018Oranges and lemons, say the bells of St Clement\u2019s.\u2019 That was a rhyme we had\nwhen I was a little boy. How it goes on I don\u2019t remember, but I do know it ended\nup, \u2018Here comes a candle to light you to bed, Here comes a chopper to chop off\nyour head.\u2019 It was a kind of a dance. They held out their arms for you to pass\nunder, and when they came to \u2018Here comes a chopper to chop off your head\u2019 they\nbrought their arms down and caught you. It was just names of churches. All the\nLondon churches were in it\u2014all the principal ones, that is.\u2019\n\nWinston wondered vaguely to what century the church belonged. It was always\ndifficult to determine the age of a London building. Anything large and\nimpressive, if it was reasonably new in appearance, was automatically claimed as\nhaving been built since the Revolution, while anything that was obviously of\nearlier date was ascribed to some dim period called the Middle Ages. The\ncenturies of capitalism were held to have produced nothing of any value. One\ncould not learn history from architecture any more than one could learn it from\nbooks. Statues, inscriptions, memorial stones, the names of streets\u2014anything\nthat might throw light upon the past had been systematically altered.\n\n\u2018I never knew it had been a church,\u2019 he said.\n\n\u2018There\u2019s a lot of them left, really,\u2019 said the old man, \u2018though they\u2019ve been put\nto other uses. Now, how did that rhyme go? Ah! I\u2019ve got it!\n\n\u2018Oranges and lemons, say the bells of St Clement\u2019s, Youowe me three farthings, say the bells of St Martin\u2019s\u2014\u2014\u2018\n\nthere, now, that\u2019s as far as I can get. A farthing, that was a small copper\ncoin, looked something like a cent.\u2019\n\n\u2018Where was St Martin\u2019s?\u2019 said Winston.\n\n\u2018St Martin\u2019s? That\u2019s still standing. It\u2019s in Victory Square, alongside the\npicture gallery. A building with a kind of a triangular porch and pillars in\nfront, and a big flight of steps.\u2019\n\nWinston knew the place well. It was a museum used for propaganda displays of\nvarious kinds\u2014scale models of rocket bombs and Floating Fortresses, waxwork\ntableaux illustrating enemy atrocities, and the like.\n\n\u2018St Martin\u2019s-in-the-Fields it used to be called,\u2019 supplemented the old man,\n\u2018though I don\u2019t recollect any fields anywhere in those parts.\u2019\n\nWinston did not buy the picture. It would have been an even more incongruous\npossession than the glass paperweight, and impossible to carry home, unless it\nwere taken out of its frame. But he lingered for some minutes more, talking to\nthe old man, whose name, he discovered, was not Weeks\u2014as one might have gathered\nfrom the inscription over the shop-front\u2014but Charrington. Mr Charrington, it\nseemed, was a widower aged sixty-three and had inhabited this shop for thirty\nyears. Throughout that time he had been intending to alter the name over the\nwindow, but had never quite got to the point of doing it. All the while that\nthey were talking the half-remembered rhyme kept running through Winston\u2019s head.\nOranges and lemons say the bells of St Clement\u2019s, You owe me three farthings,\nsay the bells of St Martin\u2019s! It was curious, but when you said it toyourself\nyou had the illusion of actually hearing bells, the bells of a lost London that\nstill existed somewhere or other, disguised and forgotten. From one ghostly\nsteeple after another he seemed to hear them pealing forth. Yet so far as he\ncould remember he had never in real life heard church bells ringing.\n\nHe got away from Mr Charrington and went down the stairs alone, so as not to let\nthe old man see him reconnoitring the street before stepping out of the door. He\nhad already made up his mind that after a suitable interval\u2014a month, say\u2014he\nwould take the risk of visiting the shop again. It was perhaps not more\ndangerous than shirking an evening at the Centre. The serious piece of folly had\nbeen to come back here in the first place, after buying the diary and without\nknowing whether the proprietor of the shop could be trusted. However\u2014\u2014!\n\nYes, he thought again, he would come back. He would buy further scraps of\nbeautiful rubbish. He would buy the engraving of St Clement Danes, take it out\nof its frame, and carry it home concealed under the jacket of his overalls. He\nwould drag the rest of that poem out of Mr Charrington\u2019s memory. Even the\nlunatic project of renting the room upstairs flashed momentarily through his\nmind again. For perhaps five seconds exaltation made him careless, and he\nstepped out on to the pavement without so much as a preliminary glance through\nthe window. He had even started humming to an improvised tune\n\nOranges and lemons, say the bells of St Clement\u2019s, You owe me three farthings,\nsay the\u2014\u2014\n\nSuddenly his heart seemed to turn to ice and his bowels to water. A figure in\nblue overalls was coming down the pavement, not ten metres away. It was the girl\nfrom the Fiction Department, the girl with dark hair. The light was failing, but\nthere was no difficulty in recognizing her. She looked him straight in the face,\nthen walked quickly on as though she had not seen him.\n\nFor a few seconds Winston was too paralysed to move. Then he turned to the right\nand walked heavily away, not noticing for the moment that he was going in the\nwrong direction. At any rate, one question was settled. There was no doubting\nany longer that the girl was spying on him. She must have followed him here,\nbecause it was not credible that by pure chance she should have happened to be\nwalking on the same evening up the same obscure backstreet, kilometres distant\nfrom any quarter where Party members lived. It was too great a coincidence.\nWhether she was really an agent of the Thought Police, or simply an amateur spy\nactuated by officiousness, hardly mattered. It was enough that she was watching\nhim. Probably she had seen him go into the pub as well.\n\nIt was an effort to walk. The lump of glass in his pocket banged against his\nthigh at each step, and he was half minded to take it out and throw it away. The\nworst thing was the pain in his belly. For a couple of minutes he had the\nfeeling that he would die if he did not reach a lavatory soon. But there would\nbe no public lavatories in a quarter like this. Then the spasm passed, leaving a\ndull ache behind.\n\nThe street was a blind alley. Winston halted, stoodfor several seconds wondering\nvaguely what to do, then turned round and began to retrace his steps. As he\nturned it occurred to him that the girl had only passed him three minutes ago\nand that by running he could probably catch up with her. He could keep on her\ntrack till they were in some quiet place, and then smash her skull in with a\ncobblestone. The piece of glass in his pocket would be heavy enough for the job.\nBut he abandoned the idea immediately, because even the thought of making any\nphysical effort was unbearable. He could not run, he could not strike a blow.\nBesides, she was young and lusty and would defend herself. He thought also of\nhurrying to the Community Centre and staying there till the place closed, so as\nto establish a partial alibi for the evening. But that too was impossible. A\ndeadly lassitude had taken hold of him. All he wanted was to get home quickly\nand then sit down and be quiet.\n\nIt was after twenty-two hours when he got back to the flat. The lights would be\nswitched off at the main at twentythree thirty. He went into the kitchen and\nswallowed nearly a teacupful of Victory Gin. Then he went to the table in the\nalcove, sat down, and took the diary out of the drawer. But he did not open it\nat once. From the telescreen a brassy female voice was squalling a patriotic\nsong. He sat staring at the marbled cover of the book, trying without success to\nshut the voice out of his consciousness.\n\nIt was at night that they came for you, always at night. The proper thing was to\nkill yourself before they got you. Undoubtedly some people did so. Many of the\ndisappearances were actually suicides. But it needed desperate courage tokill\nyourself in a world where firearms, or any quick and certain poison, were\ncompletely unprocurable. He thought with a kind of astonishment of the\nbiological uselessness of pain and fear, the treachery of the human body which\nalways freezes into inertia at exactly the moment when a special effort is\nneeded. He might have silenced the darkhaired girl if only he had acted quickly\nenough: but precisely because of the extremity of his danger he had lost the\npower to act. It struck him that in moments of crisis one is never fighting\nagainst an external enemy, but always against one\u2019s own body. Even now, in spite\nof the gin, the dull ache in his belly made consecutive thought impossible. And\nit is the same, he perceived, in all seemingly heroic or tragic situations. On\nthe battlefield, in the torture chamber, on a sinking ship, the issues that you\nare fighting for are always forgotten, because the body swells up until it fills\nthe universe, and even when you are not paralysed by fright or screaming with\npain, life is a moment-to-moment struggle against hunger or cold or\nsleeplessness, against a sour stomach or an aching tooth.\n\nHe opened the diary. It was important to write something down. The woman on the\ntelescreen had started a new song. Her voice seemed to stick into his brain like\njagged splinters of glass. He tried to think of O\u2019Brien, for whom, or to whom,\nthe diary was written, but instead he began thinking of the things that would\nhappen to him after the Thought Police took him away. It would not matter if\nthey killed you at once. To be killed was what you expected. But before death\n(nobody spoke of such things, yet everybodyknew of them) there was the routine\nof confession that had to be gone through: the grovelling on the floor and\nscreaming for mercy, the crack of broken bones, the smashed teeth, and bloody\nclots of hair.\n\nWhy did you have to endure it, since the end was always the same? Why was it not\npossible to cut a few days or weeks out of your life? Nobody ever escaped\ndetection, and nobody ever failed to confess. When once you had succumbed to\nthoughtcrime it was certain that by a given date you would be dead. Why then did\nthat horror, which altered nothing, have to lie embedded in future time?\n\nHe tried with a little more success than before to summon up the image of\nO\u2019Brien. \u2018We shall meet in the place where there is no darkness,\u2019 O\u2019Brien had\nsaid to him. He knew what it meant, or thought he knew. The place where there is\nno darkness was the imagined future, which one would never see, but which, by\nforeknowledge, one could mystically share in. But with the voice from the\ntelescreen nagging at his ears he could not follow the train of thought further.\nHe put a cigarette in his mouth. Half the tobacco promptly fell out on to his\ntongue, a bitter dust which was difficult to spit out again. The face of Big\nBrother swam into his mind, displacing that of O\u2019Brien. Just as he had done a\nfew days earlier, he slid a coin out of his pocket and looked at it. The face\ngazed up at him, heavy, calm, protecting: but what kind of smile was hidden\nbeneath the dark moustache? Like a leaden knell the words came back at him:\n\nWAR IS PEACE\n\nFREEDOM IS SLAVERY\n\nIGNORANCE IS STRENGTH\n\nPart Two\n\nChapter 1\n\nI t was the middle of the morning, and Winston had left the cubicle to go to the\nlavatory.\n\nA solitary figure was coming towards him from the other end of the long,\nbrightly-lit corridor. It was the girl with dark hair. Four days had gone past\nsince the evening when he had run into her outside the junk-shop. As she came\nnearer he saw that her right arm was in a sling, not noticeable at a distance\nbecause it was of the same colour as her overalls. Probably she had crushed her\nhand while swinging round one of the big kaleidoscopes on which the plots of\nnovels were \u2018roughed in\u2019. It was a common accident in the Fiction Department.\n\nThey were perhaps four metres apart when the girl stumbled and fell almost flat\non her face. A sharp cry of pain was wrung out of her. She must have fallen\nright on the injured arm. Winston stopped short. The girl had risen to her\nknees. Her face had turned a milky yellow colour against which her mouth stood\nout redder than ever. Her eyes were fixed on his, with an appealing expression\nthat looked more like fear than pain.\n\nA curious emotion stirred in Winston\u2019s heart. In front of him was an enemy who\nwas trying to kill him: in front of him, also, was a human creature, in pain and\nperhaps with a broken bone. Already he had instinctively started forwardto help\nher. In the moment when he had seen her fall on the bandaged arm, it had been as\nthough he felt the pain in his own body.\n\n\u2018You\u2019re hurt?\u2019 he said.\n\n\u2018It\u2019s nothing. My arm. It\u2019ll be all right in a second.\u2019\n\nShe spoke as though her heart were fluttering. She had certainly turned very\npale.\n\n\u2018You haven\u2019t broken anything?\u2019\n\n\u2018No, I\u2019m all right. It hurt for a moment, that\u2019s all.\u2019\n\nShe held out her free hand to him, and he helped her up. She had regained some\nof her colour, and appeared very much better.\n\n\u2018It\u2019s nothing,\u2019 she repeated shortly. \u2018I only gave my wrist a bit of a bang.\nThanks, comrade!\u2019\n\nAnd with that she walked on in the direction in which she had been going, as\nbriskly as though it had really been nothing. The whole incident could not have\ntaken as much as half a minute. Not to let one\u2019s feelings appear in one\u2019s face\nwas a habit that had acquired the status of an instinct, and in any case they\nhad been standing straight in front of a telescreen when the thing happened.\nNevertheless it had been very difficult not to betray a momentary surprise, for\nin the two or three seconds while he was helping her up the girl had slipped\nsomething into his hand. There was no question that she had done it\nintentionally. It was something small and flat. As he passed through the\nlavatory door he transferred it to his pocket and felt it with the tips of his\nfingers. It was a scrap of paper folded into a square.\n\nWhile he stood at the urinal he managed, with a littlemore fingering, to get it\nunfolded. Obviously there must be a message of some kind written on it. For a\nmoment he was tempted to take it into one of the water-closets and read it at\nonce. But that would be shocking folly, as he well knew. There was no place\nwhere you could be more certain that the telescreens were watched continuously.\n\nHe went back to his cubicle, sat down, threw the fragment of paper casually\namong the other papers on the desk, put on his spectacles and hitched the\nspeakwrite towards him. \u2018Five minutes,\u2019 he told himself, \u2018five minutes at the\nvery least!\u2019 His heart bumped in his breast with frightening loudness.\nFortunately the piece of work he was engaged on was mere routine, the\nrectification of a long list of figures, not needing close attention.\n\nWhatever was written on the paper, it must have some kind of political meaning.\nSo far as he could see there were two possibilities. One, much the more likely,\nwas that the girl was an agent of the Thought Police, just as he had feared. He\ndid not know why the Thought Police should choose to deliver their messages in\nsuch a fashion, but perhaps they had their reasons. The thing that was written\non the paper might be a threat, a summons, an order to commit suicide, a trap of\nsome description. But there was another, wilder possibility that kept raising\nits head, though he tried vainly to suppress it. This was, that the message did\nnot come from the Thought Police at all, but from some kind of underground\norganization. Perhaps the Brotherhood existed after all! Perhaps the girl was\npart of it! No doubt the idea was absurd, but it had sprung into his mind in the\nvery instant of feeling the scrap of paper in his hand. It was not till a couple\nof minutes later that the other, more probable explanation had occurred to him.\nAnd even now, though his intellect told him that the message probably meant\ndeath\u2014 still, that was not what he believed, and the unreasonable hope\npersisted, and his heart banged, and it was with difficulty that he kept his\nvoice from trembling as he murmured his figures into the speakwrite.\n\nHe rolled up the completed bundle of work and slid it into the pneumatic tube.\nEight minutes had gone by. He readjusted his spectacles on his nose, sighed, and\ndrew the next batch of work towards him, with the scrap of paper on top of it.\nHe flattened it out. On it was written, in a large unformed handwriting:\n\nI LOVE YOU.\n\nFor several seconds he was too stunned even to throw the incriminating thing\ninto the memory hole. When he did so, although he knew very well the danger of\nshowing too much interest, he could not resist reading it once again, just to\nmake sure that the words were really there.\n\nFor the rest of the morning it was very difficult to work. What was even worse\nthan having to focus his mind on a series of niggling jobs was the need to\nconceal his agitation from the telescreen. He felt as though a fire were burning\nin his belly. Lunch in the hot, crowded, noise-filled canteen was torment. He\nhad hoped to be alone for a little while during the lunch hour, but as bad luck\nwould have it theimbecile Parsons flopped down beside him, the tang of his sweat\nalmost defeating the tinny smell of stew, and kept up a stream of talk about the\npreparations for Hate Week. He was particularly enthusiastic about a papier-\nmache model of Big Brother\u2019s head, two metres wide, which was being made for the\noccasion by his daughter\u2019s troop of Spies. The irritating thing was that in the\nracket of voices Winston could hardly hear what Parsons was saying, and was\nconstantly having to ask for some fatuous remark to be repeated. Just once he\ncaught a glimpse of the girl, at a table with two other girls at the far end of\nthe room. She appeared not to have seen him, and he did not look in that\ndirection again.\n\nThe afternoon was more bearable. Immediately after lunch there arrived a\ndelicate, difficult piece of work which would take several hours and\nnecessitated putting everything else aside. It consisted in falsifying a series\nof production reports of two years ago, in such a way as to cast discredit on a\nprominent member of the Inner Party, who was now under a cloud. This was the\nkind of thing that Winston was good at, and for more than two hours he succeeded\nin shutting the girl out of his mind altogether. Then the memory of her face\ncame back, and with it a raging, intolerable desire to be alone. Until he could\nbe alone it was impossible to think this new development out. Tonight was one of\nhis nights at the Community Centre. He wolfed another tasteless meal in the\ncanteen, hurried off to the Centre, took part in the solemn foolery of a\n\u2018discussion group\u2019, played two games of table tennis, swallowed several glasses\nof gin, and sat for half an hour through a lecture entitled \u2018Ingsoc in relation\ntochess\u2019. His soul writhed with boredom, but for once he had had no impulse to\nshirk his evening at the Centre. At the sight of the words I LOVE YOU the desire\nto stay alive had welled up in him, and the taking of minor risks suddenly\nseemed stupid. It was not till twenty-three hours, when he was home and in\nbed\u2014in the darkness, where you were safe even from the telescreen so long as you\nkept silent\u2014that he was able to think continuously.\n\nIt was a physical problem that had to be solved: how to get in touch with the\ngirl and arrange a meeting. He did not consider any longer the possibility that\nshe might be laying some kind of trap for him. He knew that it was not so,\nbecause of her unmistakable agitation when she handed him the note. Obviously\nshe had been frightened out of her wits, as well she might be. Nor did the idea\nof refusing her advances even cross his mind. Only five nights ago he had\ncontemplated smashing her skull in with a cobblestone, but that was of no\nimportance. He thought of her naked, youthful body, as he had seen it in his\ndream. He had imagined her a fool like all the rest of them, her head stuffed\nwith lies and hatred, her belly full of ice. A kind of fever seized him at the\nthought that he might lose her, the white youthful body might slip away from\nhim! What he feared more than anything else was that she would simply change her\nmind if he did not get in touch with her quickly. But the physical difficulty of\nmeeting was enormous. It was like trying to make a move at chess when you were\nalready mated. Whichever way you turned, the telescreen faced you. Actually, all\nthe possible ways of communicating with her had occurred tohim within five\nminutes of reading the note; but now, with time to think, he went over them one\nby one, as though laying out a row of instruments on a table.\n\nObviously the kind of encounter that had happened this morning could not be\nrepeated. If she had worked in the Records Department it might have been\ncomparatively simple, but he had only a very dim idea whereabouts in the\nbuilding the Fiction Department lay, and he had no pretext for going there. If\nhe had known where she lived, and at what time she left work, he could have\ncontrived to meet her somewhere on her way home; but to try to follow her home\nwas not safe, because it would mean loitering about outside the Ministry, which\nwas bound to be noticed. As for sending a letter through the mails, it was out\nof the question. By a routine that was not even secret, all letters were opened\nin transit. Actually, few people ever wrote letters. For the messages that it\nwas occasionally necessary to send, there were printed postcards with long lists\nof phrases, and you struck out the ones that were inapplicable. In any case he\ndid not know the girl\u2019s name, let alone her address. Finally he decided that the\nsafest place was the canteen. If he could get her at a table by herself,\nsomewhere in the middle of the room, not too near the telescreens, and with a\nsufficient buzz of conversation all round\u2014if these conditions endured for, say,\nthirty seconds, it might be possible to exchange a few words.\n\nFor a week after this, life was like a restless dream. On the next day she did\nnot appear in the canteen until he was leaving it, the whistle having already\nblown. Presumably she had been changed on to a later shift. They passed each\nother without a glance. On the day after that she was in the canteen at the\nusual time, but with three other girls and immediately under a telescreen. Then\nfor three dreadful days she did not appear at all. His whole mind and body\nseemed to be afflicted with an unbearable sensitivity, a sort of transparency,\nwhich made every movement, every sound, every contact, every word that he had to\nspeak or listen to, an agony. Even in sleep he could not altogether escape from\nher image. He did not touch the diary during those days. If there was any\nrelief, it was in his work, in which he could sometimes forget himself for ten\nminutes at a stretch. He had absolutely no clue as to what had happened to her.\nThere was no enquiry he could make. She might have been vaporized, she might\nhave committed suicide, she might have been transferred to the other end of\nOceania: worst and likeliest of all, she might simply have changed her mind and\ndecided to avoid him.\n\nThe next day she reappeared. Her arm was out of the sling and she had a band of\nsticking-plaster round her wrist. The relief of seeing her was so great that he\ncould not resist staring directly at her for several seconds. On the following\nday he very nearly succeeded in speaking to her. When he came into the canteen\nshe was sitting at a table well out from the wall, and was quite alone. It was\nearly, and the place was not very full. The queue edged forward till Winston was\nalmost at the counter, then was held up for two minutes because someone in front\nwas complaining that he had not received his tablet of saccharine. But the girl\nwas still alonewhen Winston secured his tray and began to make for her table. He\nwalked casually towards her, his eyes searching for a place at some table beyond\nher. She was perhaps three metres away from him. Another two seconds would do\nit. Then a voice behind him called, \u2018Smith!\u2019 He pretended not to hear. \u2018Smith!\u2019\nrepeated the voice, more loudly. It was no use. He turned round. A blond-headed,\nsilly-faced young man named Wilsher, whom he barely knew, was inviting him with\na smile to a vacant place at his table. It was not safe to refuse. After having\nbeen recognized, he could not go and sit at a table with an unattended girl. It\nwas too noticeable. He sat down with a friendly smile. The silly blond face\nbeamed into his. Winston had a hallucination of himself smashing a pick-axe\nright into the middle of it. The girl\u2019s table filled up a few minutes later.\n\nBut she must have seen him coming towards her, and perhaps she would take the\nhint. Next day he took care to arrive early. Surely enough, she was at a table\nin about the same place, and again alone. The person immediately ahead of him in\nthe queue was a small, swiftly-moving, beetle-like man with a flat face and\ntiny, suspicious eyes. As Winston turned away from the counter with his tray, he\nsaw that the little man was making straight for the girl\u2019s table. His hopes sank\nagain. There was a vacant place at a table further away, but something in the\nlittle man\u2019s appearance suggested that he would be sufficiently attentive to his\nown comfort to choose the emptiest table. With ice at his heart Winston\nfollowed. It was no use unless he could get the girl alone. At this moment there\nwas a tremendous crash. The littleman was sprawling on all fours, his tray had\ngone flying, two streams of soup and coffee were flowing across the floor. He\nstarted to his feet with a malignant glance at Winston, whom he evidently\nsuspected of having tripped him up. But it was all right. Five seconds later,\nwith a thundering heart, Winston was sitting at the girl\u2019s table.\n\nHe did not look at her. He unpacked his tray and promptly began eating. It was\nall-important to speak at once, before anyone else came, but now a terrible fear\nhad taken possession of him. A week had gone by since she had first approached\nhim. She would have changed her mind, she must have changed her mind! It was\nimpossible that this affair should end successfully; such things did not happen\nin real life. He might have flinched altogether from speaking if at this moment\nhe had not seen Ampleforth, the hairy-eared poet, wandering limply round the\nroom with a tray, looking for a place to sit down. In his vague way Ampleforth\nwas attached to Winston, and would certainly sit down at his table if he caught\nsight of him. There was perhaps a minute in which to act. Both Winston and the\ngirl were eating steadily. The stuff they were eating was a thin stew, actually\na soup, of haricot beans. In a low murmur Winston began speaking. Neither of\nthem looked up; steadily they spooned the watery stuff into their mouths, and\nbetween spoonfuls exchanged the few necessary words in low expressionless\nvoices.\n\n\u2018What time do you leave work?\u2019\n\n\u2018Eighteen-thirty.\u2019\n\n\u2018Where can we meet?\u2019\n\n\u2018Victory Square, near the monument.\u2019\n\n\u2018It\u2019s full of telescreens.\u2019\n\n\u2018It doesn\u2019t matter if there\u2019s a crowd.\u2019\n\n\u2018Any signal?\u2019\n\n\u2018No. Don\u2019t come up to me until you see me among a lot of people. And don\u2019t look\nat me. Just keep somewhere near me.\u2019\n\n\u2018What time?\u2019\n\n\u2018Nineteen hours.\u2019\n\n\u2018All right.\u2019\n\nAmpleforth failed to see Winston and sat down at another table. They did not\nspeak again, and, so far as it was possible for two people sitting on opposite\nsides of the same table, they did not look at one another. The girl finished her\nlunch quickly and made off, while Winston stayed to smoke a cigarette.\n\nWinston was in Victory Square before the appointed time. He wandered round the\nbase of the enormous fluted column, at the top of which Big Brother\u2019s statue\ngazed southward towards the skies where he had vanquished the Eurasian\naeroplanes (the Eastasian aeroplanes, it had been, a few years ago) in the\nBattle of Airstrip One. In the street in front of it there was a statue of a man\non horseback which was supposed to represent Oliver Cromwell. At five minutes\npast the hour the girl had still not appeared. Again the terrible fear seized\nupon Winston. She was not coming, she had changed her mind! He walked slowly up\nto the north side of the square and got a sort of pale-coloured pleasure from\nidentifying St Martin\u2019s Church, whose bells, when ithad bells, had chimed \u2018You\nowe me three farthings.\u2019 Then he saw the girl standing at the base of the\nmonument, reading or pretending to read a poster which ran spirally up the\ncolumn. It was not safe to go near her until some more people had accumulated.\nThere were telescreens all round the pediment. But at this moment there was a\ndin of shouting and a zoom of heavy vehicles from somewhere to the left.\nSuddenly everyone seemed to be running across the square. The girl nipped nimbly\nround the lions at the base of the monument and joined in the rush. Winston\nfollowed. As he ran, he gathered from some shouted remarks that a convoy of\nEurasian prisoners was passing.\n\nAlready a dense mass of people was blocking the south side of the square.\nWinston, at normal times the kind of person who gravitates to the outer edge of\nany kind of scrimmage, shoved, butted, squirmed his way forward into the heart\nof the crowd. Soon he was within arm\u2019s length of the girl, but the way was\nblocked by an enormous prole and an almost equally enormous woman, presumably\nhis wife, who seemed to form an impenetrable wall of flesh. Winston wriggled\nhimself sideways, and with a violent lunge managed to drive his shoulder between\nthem. For a moment it felt as though his entrails were being ground to pulp\nbetween the two muscular hips, then he had broken through, sweating a little. He\nwas next to the girl. They were shoulder to shoulder, both staring fixedly in\nfront of them.\n\nA long line of trucks, with wooden-faced guards armed with sub-machine guns\nstanding upright in each corner, was passing slowly down the street. In the\ntrucks little yellowmen in shabby greenish uniforms were squatting, jammed close\ntogether. Their sad, Mongolian faces gazed out over the sides of the trucks\nutterly incurious. Occasionally when a truck jolted there was a clank-clank of\nmetal: all the prisoners were wearing leg-irons. Truck-load after truck-load of\nthe sad faces passed. Winston knew they were there but he saw them only\nintermittently. The girl\u2019s shoulder, and her arm right down to the elbow, were\npressed against his. Her cheek was almost near enough for him to feel its\nwarmth. She had immediately taken charge of the situation, just as she had done\nin the canteen. She began speaking in the same expressionless voice as before,\nwith lips barely moving, a mere murmur easily drowned by the din of voices and\nthe rumbling of the trucks.\n\n\u2018Can you hear me?\u2019\n\n\u2018Yes.\u2019\n\n\u2018Can you get Sunday afternoon off?\u2019\n\n\u2018Yes.\u2019\n\n\u2018Then listen carefully. You\u2019ll have to remember this. Go to Paddington\nStation\u2014\u2014\u2019\n\nWith a sort of military precision that astonished him, she outlined the route\nthat he was to follow. A half-hour railway journey; turn left outside the\nstation; two kilometres along the road; a gate with the top bar missing; a path\nacross a field; a grass-grown lane; a track between bushes; a dead tree with\nmoss on it. It was as though she had a map inside her head. \u2018Can you remember\nall that?\u2019 she murmured finally.\n\n\u2018Yes.\u2019\n\n\u2018You turn left, then right, then left again. And the gate\u2019s got no top bar.\u2019\n\n\u2018Yes. What time?\u2019\n\n\u2018About fifteen. You may have to wait. I\u2019ll get there by another way. Are you\nsure you remember everything?\u2019\n\n\u2018Yes.\u2019\n\n\u2018Then get away from me as quick as you can.\u2019\n\nShe need not have told him that. But for the moment they could not extricate\nthemselves from the crowd. The trucks were still filing past, the people still\ninsatiably gaping. At the start there had been a few boos and hisses, but it\ncame only from the Party members among the crowd, and had soon stopped. The\nprevailing emotion was simply curiosity. Foreigners, whether from Eurasia or\nfrom Eastasia, were a kind of strange animal. One literally never saw them\nexcept in the guise of prisoners, and even as prisoners one never got more than\na momentary glimpse of them. Nor did one know what became of them, apart from\nthe few who were hanged as war-criminals: the others simply vanished, presumably\ninto forced-labour camps. The round Mogol faces had given way to faces of a more\nEuropean type, dirty, bearded and exhausted. From over scrubby cheekbones eyes\nlooked into Winston\u2019s, sometimes with strange intensity, and flashed away again.\nThe convoy was drawing to an end. In the last truck he could see an aged man,\nhis face a mass of grizzled hair, standing upright with wrists crossed in front\nof him, as though he were used to having them bound together. It was almost time\nfor Winston and the girl to part. But at the last moment, while the crowd\nstillhemmed them in, her hand felt for his and gave it a fleeting squeeze.\n\nIt could not have been ten seconds, and yet it seemed a long time that their\nhands were clasped together. He had time to learn every detail of her hand. He\nexplored the long fingers, the shapely nails, the work-hardened palm with its\nrow of callouses, the smooth flesh under the wrist. Merely from feeling it he\nwould have known it by sight. In the same instant it occurred to him that he did\nnot know what colour the girl\u2019s eyes were. They were probably brown, but people\nwith dark hair sometimes had blue eyes. To turn his head and look at her would\nhave been inconceivable folly. With hands locked together, invisible among the\npress of bodies, they stared steadily in front of them, and instead of the eyes\nof the girl, the eyes of the aged prisoner gazed mournfully at Winston out of\nnests of hair.\n\nChapter 2\n\nW      inston picked his way up the lane through dappledlight and shade,\nstepping out into pools of gold wherever the boughs parted. Under the trees to\nthe left of him the ground was misty with bluebells. The air seemed to kiss\none\u2019s skin. It was the second of May. From somewhere deeper in the heart of the\nwood came the droning of ring doves.\n\nHe was a bit early. There had been no difficulties about the journey, and the\ngirl was so evidently experienced that he was less frightened than he would\nnormally have been. Presumably she could be trusted to find a safe place. In\ngeneral you could not assume that you were much safer in the country than in\nLondon. There were no telescreens, of course, but there was always the danger of\nconcealed microphones by which your voice might be picked up and recognized;\nbesides, it was not easy to make a journey by yourself without attracting\nattention. For distances of less than 100 kilometres it was not necessary to get\nyour passport endorsed, but sometimes there were patrols hanging about the\nrailway stations, who examined the papers of any Party member they found there\nand asked awkward questions. However, no patrols had appeared, and on the walk\nfrom the station he had made sure by cautious backward glances that he was not\nbeing followed. The train was full of proles, in holiday mood because of the\nsummery weather.\n\nThe wooden-seated carriage in which he travelled was filled to overflowing by a\nsingle enormous family, ranging from a toothless great-grandmother to a month-\nold baby, going out to spend an afternoon with \u2018in-laws\u2019 in the country, and, as\nthey freely explained to Winston, to get hold of a little blackmarket butter.\n\nThe lane widened, and in a minute he came to the footpath she had told him of, a\nmere cattle-track which plunged between the bushes. He had no watch, but it\ncould not be fifteen yet. The bluebells were so thick underfoot that it was\nimpossible not to tread on them. He knelt down and began picking some partly to\npass the time away, but also from a vague idea that he would like to have a\nbunch of flowers to offer to the girl when they met. He had got together a big\nbunch and was smelling their faint sickly scent when a sound at his back froze\nhim, the unmistakable crackle of a foot on twigs. He went on picking bluebells.\nIt was the best thing to do. It might be the girl, or he might have been\nfollowed after all. To look round was to show guilt. He picked another and\nanother. A hand fell lightly on his shoulder.\n\nHe looked up. It was the girl. She shook her head, evidently as a warning that\nhe must keep silent, then parted the bushes and quickly led the way along the\nnarrow track into the wood. Obviously she had been that way before, for she\ndodged the boggy bits as though by habit. Winston followed, still clasping his\nbunch of flowers. His first feeling was relief, but as he watched the strong\nslender body moving in front of him, with the scarlet sash that was just tight\nenough to bring out the curve of her hips, the sense of hisown inferiority was\nheavy upon him. Even now it seemed quite likely that when she turned round and\nlooked at him she would draw back after all. The sweetness of the air and the\ngreenness of the leaves daunted him. Already on the walk from the station the\nMay sunshine had made him feel dirty and etiolated, a creature of indoors, with\nthe sooty dust of London in the pores of his skin. It occurred to him that till\nnow she had probably never seen him in broad daylight in the open. They came to\nthe fallen tree that she had spoken of. The girl hopped over and forced apart\nthe bushes, in which there did not seem to be an opening. When Winston followed\nher, he found that they were in a natural clearing, a tiny grassy knoll\nsurrounded by tall saplings that shut it in completely. The girl stopped and\nturned.\n\n\u2018Here we are,\u2019 she said.\n\nHe was facing her at several paces\u2019 distance. As yet he did not dare move nearer\nto her.\n\n\u2018I didn\u2019t want to say anything in the lane,\u2019 she went on, \u2018in case there\u2019s a\nmike hidden there. I don\u2019t suppose there is, but there could be. There\u2019s always\nthe chance of one of those swine recognizing your voice. We\u2019re all right here.\u2019\n\nHe still had not the courage to approach her. \u2018We\u2019re all right here?\u2019 he\nrepeated stupidly.\n\n\u2018Yes. Look at the trees.\u2019 They were small ashes, which at some time had been cut\ndown and had sprouted up again into a forest of poles, none of them thicker than\none\u2019s wrist. \u2018There\u2019s nothing big enough to hide a mike in. Besides, I\u2019ve been\nhere before.\u2019\n\nThey were only making conversation. He had managedto move closer to her now. She\nstood before him very upright, with a smile on her face that looked faintly\nironical, as though she were wondering why he was so slow to act. The bluebells\nhad cascaded on to the ground. They seemed to have fallen of their own accord.\nHe took her hand.\n\n\u2018Would you believe,\u2019 he said, \u2018that till this moment I didn\u2019t know what colour\nyour eyes were?\u2019 They were brown, he noted, a rather light shade of brown, with\ndark lashes. \u2018Now that you\u2019ve seen what I\u2019m really like, can you still bear to\nlook at me?\u2019\n\n\u2018Yes, easily.\u2019\n\n\u2018I\u2019m thirty-nine years old. I\u2019ve got a wife that I can\u2019t get rid of. I\u2019ve got\nvaricose veins. I\u2019ve got five false teeth.\u2019\n\n\u2018I couldn\u2019t care less,\u2019 said the girl.\n\nThe next moment, it was hard to say by whose act, she was in his his arms. At\nthe beginning he had no feeling except sheer incredulity. The youthful body was\nstrained against his own, the mass of dark hair was against his face, and yes!\nactually she had turned her face up and he was kissing the wide red mouth. She\nhad clasped her arms about his neck, she was calling him darling, precious one,\nloved one. He had pulled her down on to the ground, she was utterly unresisting,\nhe could do what he liked with her. But the truth was that he had no physical\nsensation, except that of mere contact. All he felt was incredulity and pride.\nHe was glad that this was happening, but he had no physical desire. It was too\nsoon, her youth and prettiness had frightened him, he was too much used to\nliving without women\u2014he did not know the reason. The girl picked herself up and\npulleda bluebell out of her hair. She sat against him, putting her arm round his\nwaist.\n\n\u2018Never mind, dear. There\u2019s no hurry. We\u2019ve got the whole afternoon. Isn\u2019t this a\nsplendid hide-out? I found it when I got lost once on a community hike. If\nanyone was coming you could hear them
