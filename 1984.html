 original figures by making them agree with the later ones. As\nfor the third message, it referred to a very simple error which could be set\nright in a couple of minutes. As short a time ago as February, the Ministry of\nPlenty had issued a promise (a \u2018categorical pledge\u2019 were the official words)\nthat there would be no reduction of the chocolate ration during 1984. Actually,\nas Winston was aware, the chocolate ration was to be reduced from thirty grammes\nto twenty at the end of the present week. All that was needed was to substitute\nfor the original promise a warning that it would probably be necessary to reduce\nthe ration at some time in April.\n\nAs soon as Winston had dealt with each of the messages, he clipped his\nspeakwritten corrections to the appropriate copy of \u2018The Times\u2019 and pushed them\ninto the pneumatic tube. Then, with a movement which was as nearly as possible\nunconscious, he crumpled up the original message and any notes that he himself\nhad made, and dropped them intothe memory hole to be devoured by the flames.\n\nWhat happened in the unseen labyrinth to which the pneumatic tubes led, he did\nnot know in detail, but he did know in general terms. As soon as all the\ncorrections which happened to be necessary in any particular number of \u2018The\nTimes\u2019 had been assembled and collated, that number would be reprinted, the\noriginal copy destroyed, and the corrected copy placed on the files in its\nstead. This process of continuous alteration was applied not only to newspapers,\nbut to books, periodicals, pamphlets, posters, leaflets, films, sound-tracks,\ncartoons, photographs\u2014to every kind of literature or documentation which might\nconceivably hold any political or ideological significance. Day by day and\nalmost minute by minute the past was brought up to date. In this way every\nprediction made by the Party could be shown by documentary evidence to have been\ncorrect, nor was any item of news, or any expression of opinion, which\nconflicted with the needs of the moment, ever allowed to remain on record. All\nhistory was a palimpsest, scraped clean and reinscribed exactly as often as was\nnecessary. In no case would it have been possible, once the deed was done, to\nprove that any falsification had taken place. The largest section of the Records\nDepartment, far larger than the one on which Winston worked, consisted simply of\npersons whose duty it was to track down and collect all copies of books,\nnewspapers, and other documents which had been superseded and were due for\ndestruction. A number of \u2018The Times\u2019 which might, because of changes in\npolitical alignment, or mistaken prophecies uttered by Big Brother, havebeen\nrewritten a dozen times still stood on the files bearing its original date, and\nno other copy existed to contradict it. Books, also, were recalled and rewritten\nagain and again, and were invariably reissued without any admission that any\nalteration had been made. Even the written instructions which Winston received,\nand which he invariably got rid of as soon as he had dealt with them, never\nstated or implied that an act of forgery was to be committed: always the\nreference was to slips, errors, misprints, or misquotations which it was\nnecessary to put right in the interests of accuracy.\n\nBut actually, he thought as he re-adjusted the Ministry of Plenty\u2019s figures, it\nwas not even forgery. It was merely the substitution of one piece of nonsense\nfor another. Most of the material that you were dealing with had no connexion\nwith anything in the real world, not even the kind of connexion that is\ncontained in a direct lie. Statistics were just as much a fantasy in their\noriginal version as in their rectified version. A great deal of the time you\nwere expected to make them up out of your head. For example, the Ministry of\nPlenty\u2019s forecast had estimated the output of boots for the quarter at 145\nmillion pairs. The actual output was given as sixty-two millions. Winston,\nhowever, in rewriting the forecast, marked the figure down to fifty-seven\nmillions, so as to allow for the usual claim that the quota had been\noverfulfilled. In any case, sixty-two millions was no nearer the truth than\nfifty-seven millions, or than 145 millions. Very likely no boots had been\nproduced at all. Likelier still, nobody knew how many had been produced, much\nlesscared. All one knew was that every quarter astronomical numbers of boots\nwere produced on paper, while perhaps half the population of Oceania went\nbarefoot. And so it was with every class of recorded fact, great or small.\nEverything faded away into a shadow-world in which, finally, even the date of\nthe year had become uncertain.\n\nWinston glanced across the hall. In the corresponding cubicle on the other side\na small, precise-looking, darkchinned man named Tillotson was working steadily\naway, with a folded newspaper on his knee and his mouth very close to the\nmouthpiece of the speakwrite. He had the air of trying to keep what he was\nsaying a secret between himself and the telescreen. He looked up, and his\nspectacles darted a hostile flash in Winston\u2019s direction.\n\nWinston hardly knew Tillotson, and had no idea what work he was employed on.\nPeople in the Records Department did not readily talk about their jobs. In the\nlong, windowless hall, with its double row of cubicles and its endless rustle of\npapers and hum of voices murmuring into speakwrites, there were quite a dozen\npeople whom Winston did not even know by name, though he daily saw them hurrying\nto and fro in the corridors or gesticulating in the Two Minutes Hate. He knew\nthat in the cubicle next to him the little woman with sandy hair toiled day in\nday out, simply at tracking down and deleting from the Press the names of people\nwho had been vaporized and were therefore considered never to have existed.\nThere was a certain fitness in this, since her own husband had been vaporized a\ncouple of years earlier. And a few cubicles away a mild, ineffectual, dreamy\ncreature named Ampleforth, with very hairy ears and a surprising talent for\njuggling with rhymes and metres, was engaged in producing garbled\nversions\u2014definitive texts, they were called\u2014of poems which had become\nideologically offensive, but which for one reason or another were to be retained\nin the anthologies. And this hall, with its fifty workers or thereabouts, was\nonly one sub-section, a single cell, as it were, in the huge complexity of the\nRecords Department. Beyond, above, below, were other swarms of workers engaged\nin an unimaginable multitude of jobs. There were the huge printing-shops with\ntheir sub-editors, their typography experts, and their elaborately equipped\nstudios for the faking of photographs. There was the teleprogrammes section with\nits engineers, its producers, and its teams of actors specially chosen for their\nskill in imitating voices. There were the armies of reference clerks whose job\nwas simply to draw up lists of books and periodicals which were due for recall.\nThere were the vast repositories where the corrected documents were stored, and\nthe hidden furnaces where the original copies were destroyed. And somewhere or\nother, quite anonymous, there were the directing brains who co-ordinated the\nwhole effort and laid down the lines of policy which made it necessary that this\nfragment of the past should be preserved, that one falsified, and the other\nrubbed out of existence.\n\nAnd the Records Department, after all, was itself only a single branch of the\nMinistry of Truth, whose primary job was not to reconstruct the past but to\nsupply the citizens of Oceania with newspapers, films, textbooks,\ntelescreenprogrammes, plays, novels\u2014with every conceivable kind of information,\ninstruction, or entertainment, from a statue to a slogan, from a lyric poem to a\nbiological treatise, and from a child\u2019s spelling-book to a Newspeak dictionary.\nAnd the Ministry had not only to supply the multifarious needs of the party, but\nalso to repeat the whole operation at a lower level for the benefit of the\nproletariat. There was a whole chain of separate departments dealing with\nproletarian literature, music, drama, and entertainment generally. Here were\nproduced rubbishy newspapers containing almost nothing except sport, crime and\nastrology, sensational five-cent novelettes, films oozing with sex, and\nsentimental songs which were composed entirely by mechanical means on a special\nkind of kaleidoscope known as a versificator. There was even a whole sub-\nsection\u2014Pornosec, it was called in Newspeak\u2014engaged in producing the lowest kind\nof pornography, which was sent out in sealed packets and which no Party member,\nother than those who worked on it, was permitted to look at.\n\nThree messages had slid out of the pneumatic tube while Winston was working, but\nthey were simple matters, and he had disposed of them before the Two Minutes\nHate interrupted him. When the Hate was over he returned to his cubicle, took\nthe Newspeak dictionary from the shelf, pushed the speakwrite to one side,\ncleaned his spectacles, and settled down to his main job of the morning.\n\nWinston\u2019s greatest pleasure in life was in his work. Most of it was a tedious\nroutine, but included in it there were also jobs so difficult and intricate that\nyou could lose yourself inthem as in the depths of a mathematical\nproblem\u2014delicate pieces of forgery in which you had nothing to guide you except\nyour knowledge of the principles of Ingsoc and your estimate of what the Party\nwanted you to say. Winston was good at this kind of thing. On occasion he had\neven been entrusted with the rectification of \u2018The Times\u2019 leading articles,\nwhich were written entirely in Newspeak. He unrolled the message that he had set\naside earlier. It ran:\n\ntimes 3.12.83 reporting bb dayorder doubleplusungood refsunpersons rewrite fullwise upsub antefiling\n\nIn Oldspeak (or standard English) this might be rendered:\n\nThe reporting of Big Brother\u2019s Order for the Day in \u2018The Times\u2019\n\nof December 3rd 1983 is extremely unsatisfactory and makesreferences to non-existent persons. Rewrite it in full and\n\nsubmit your draft to higher authority before filing.\n\nWinston read through the offending article. Big Brother\u2019s Order for the Day, it\nseemed, had been chiefly devoted to praising the work of an organization known\nas FFCC, which supplied cigarettes and other comforts to the sailors in the\nFloating Fortresses. A certain Comrade Withers, a prominent member of the Inner\nParty, had been singled out for special mention and awarded a decoration, the\nOrder of Conspicuous Merit, Second Class.\n\nThree months later FFCC had suddenly been dissolvedwith no reasons given. One\ncould assume that Withers and his associates were now in disgrace, but there had\nbeen no report of the matter in the Press or on the telescreen. That was to be\nexpected, since it was unusual for political offenders to be put on trial or\neven publicly denounced. The great purges involving thousands of people, with\npublic trials of traitors and thought- criminals who made abject confession of\ntheir crimes and were afterwards executed, were special show-pieces not\noccurring oftener than once in a couple of years. More commonly, people who had\nincurred the displeasure of the Party simply disappeared and were never heard of\nagain. One never had the smallest clue as to what had happened to them. In some\ncases they might not even be dead. Perhaps thirty people personally known to\nWinston, not counting his parents, had disappeared at one time or another.\n\nWinston stroked his nose gently with a paper-clip. In the cubicle across the way\nComrade Tillotson was still crouching secretively over his speakwrite. He raised\nhis head for a moment: again the hostile spectacle-flash. Winston wondered\nwhether Comrade Tillotson was engaged on the same job as himself. It was\nperfectly possible. So tricky a piece of work would never be entrusted to a\nsingle person: on the other hand, to turn it over to a committee would be to\nadmit openly that an act of fabrication was taking place. Very likely as many as\na dozen people were now working away on rival versions of what Big Brother had\nactually said. And presently some master brain in the Inner Party would select\nthis version or that, would re-edit it and set in motionthe complex processes of\ncross-referencing that would be required, and then the chosen lie would pass\ninto the permanent records and become truth.\n\nWinston did not know why Withers had been disgraced. Perhaps it was for\ncorruption or incompetence. Perhaps Big Brother was merely getting rid of a too-\npopular subordinate. Perhaps Withers or someone close to him had been suspected\nof heretical tendencies. Or perhaps\u2014what was likeliest of all\u2014the thing had\nsimply happened because purges and vaporizations were a necessary part of the\nmechanics of government. The only real clue lay in the words \u2018refs unpersons\u2019,\nwhich indicated that Withers was already dead. You could not invariably assume\nthis to be the case when people were arrested. Sometimes they were released and\nallowed to remain at liberty for as much as a year or two years before being\nexecuted. Very occasionally some person whom you had believed dead long since\nwould make a ghostly reappearance at some public trial where he would implicate\nhundreds of others by his testimony before vanishing, this time for ever.\nWithers, however, was already an UNPERSON. He did not exist: he had never\nexisted. Winston decided that it would not be enough simply to reverse the\ntendency of Big Brother\u2019s speech. It was better to make it deal with something\ntotally unconnected with its original subject.\n\nHe might turn the speech into the usual denunciation of traitors and thought-\ncriminals, but that was a little too obvious, while to invent a victory at the\nfront, or some triumph of over-production in the Ninth Three-Year Plan,\nmightcomplicate the records too much. What was needed was a piece of pure\nfantasy. Suddenly there sprang into his mind, ready made as it were, the image\nof a certain Comrade Ogilvy, who had recently died in battle, in heroic\ncircumstances. There were occasions when Big Brother devoted his Order for the\nDay to commemorating some humble, rank-and-file Party member whose life and\ndeath he held up as an example worthy to be followed. Today he should\ncommemorate Comrade Ogilvy. It was true that there was no such person as Comrade\nOgilvy, but a few lines of print and a couple of faked photographs would soon\nbring him into existence.\n\nWinston thought for a moment, then pulled the speakwrite towards him and began\ndictating in Big Brother\u2019s familiar style: a style at once military and\npedantic, and, because of a trick of asking questions and then promptly\nanswering them (\u2019What lessons do we learn from this fact, comrades? The\nlesson\u2014which is also one of the fundamental principles of Ingsoc\u2014that,\u2019 etc.,\netc.), easy to imitate.\n\nAt the age of three Comrade Ogilvy had refused all toys except a drum, a sub-\nmachine gun, and a model helicopter. At six\u2014a year early, by a special\nrelaxation of the rules\u2014he had joined the Spies, at nine he had been a troop\nleader. At eleven he had denounced his uncle to the Thought Police after\noverhearing a conversation which appeared to him to have criminal tendencies. At\nseventeen he had been a district organizer of the Junior Anti-Sex League. At\nnineteen he had designed a hand-grenade which had been adopted by the Ministry\nof Peace and which, at its first trial, had killed thirty-one Eurasian prisoners\nin one burst. At twenty-three he had perished in action. Pursued by enemy jet\nplanes while flying over the Indian Ocean with important despatches, he had\nweighted his body with his machine gun and leapt out of the helicopter into deep\nwater, despatches and all\u2014an end, said Big Brother, which it was impossible to\ncontemplate without feelings of envy. Big Brother added a few remarks on the\npurity and single- mindedness of Comrade Ogilvy\u2019s life. He was a total abstainer\nand a nonsmoker, had no recreations except a daily hour in the gymnasium, and\nhad taken a vow of celibacy, believing marriage and the care of a family to be\nincompatible with a twenty-four-houra-day devotion to duty. He had no subjects\nof conversation except the principles of Ingsoc, and no aim in life except the\ndefeat of the Eurasian enemy and the hunting-down of spies, saboteurs,\nthoughtcriminals, and traitors generally.\n\nWinston debated with himself whether to award Comrade Ogilvy the Order of\nConspicuous Merit: in the end he decided against it because of the unnecessary\ncross-referencing that it would entail.\n\nOnce again he glanced at his rival in the opposite cubicle. Something seemed to\ntell him with certainty that Tillotson was busy on the same job as himself.\nThere was no way of knowing whose job would finally be adopted, but he felt a\nprofound conviction that it would be his own. Comrade Ogilvy, unimagined an hour\nago, was now a fact. It struck him as curious that you could create dead men but\nnot living ones. Comrade Ogilvy, who had never existed in the present, now\nexisted in the past, and when once the act of forgery was forgotten, he would\nexist just as authentically, and upon the same evidence, as Charlemagne or\nJulius Caesar.\n\nChapter 5\n\nI  n the low-ceilinged canteen, deep underground, thelunch queue jerked slowly\nforward. The room was already very full and deafeningly noisy. From the grille\nat the counter the steam of stew came pouring forth, with a sour metallic smell\nwhich did not quite overcome the fumes of Victory Gin. On the far side of the\nroom there was a small bar, a mere hole in the wall, where gin could be bought\nat ten cents the large nip.\n\n\u2018Just the man I was looking for,\u2019 said a voice at Winston\u2019s back.\n\nHe turned round. It was his friend Syme, who worked in the Research Department.\nPerhaps \u2018friend\u2019 was not exactly the right word. You did not have friends\nnowadays, you had comrades: but there were some comrades whose society was\npleasanter than that of others. Syme was a philologist, a specialist in\nNewspeak. Indeed, he was one of the enormous team of experts now engaged in\ncompiling the Eleventh Edition of the Newspeak Dictionary. He was a tiny\ncreature, smaller than Winston, with dark hair and large, protuberant eyes, at\nonce mournful and derisive, which seemed to search your face closely while he\nwas speaking to you.\n\n\u2018I wanted to ask you whether you\u2019d got any razor blades,\u2019 he said.\n\n\u2018Not one!\u2019 said Winston with a sort of guilty haste. \u2018I\u2019vetried all over the place. They don\u2019t exist any longer.\u2019\n\nEveryone kept asking you for razor blades. Actually he had two unused ones which\nhe was hoarding up. There had been a famine of them for months past. At any\ngiven moment there was some necessary article which the Party shops were unable\nto supply. Sometimes it was buttons, sometimes it was darning wool, sometimes it\nwas shoelaces; at present it was razor blades. You could only get hold of them,\nif at all, by scrounging more or less furtively on the \u2018free\u2019 market.\n\n\u2018I\u2019ve been using the same blade for six weeks,\u2019 he added untruthfully.\n\nThe queue gave another jerk forward. As they halted he turned and faced Syme\nagain. Each of them took a greasy metal tray from a pile at the end of the\ncounter.\n\n\u2018Did you go and see the prisoners hanged yesterday?\u2019 said Syme.\n\n\u2018I was working,\u2019 said Winston indifferently. \u2018I shall see it on the flicks, I\nsuppose.\u2019\n\n\u2018A very inadequate substitute,\u2019 said Syme.\n\nHis mocking eyes roved over Winston\u2019s face. \u2018I know you,\u2019 the eyes seemed to\nsay, \u2018I see through you. I know very well why you didn\u2019t go to see those\nprisoners hanged.\u2019 In an intellectual way, Syme was venomously orthodox. He\nwould talk with a disagreeable gloating satisfaction of helicopter raids on\nenemy villages, and trials and confessions of thought-criminals, the executions\nin the cellars of the Ministry of Love. Talking to him was largely a matter of\ngetting him away from such subjects and entangling him,\n\nif possible, in the technicalities of Newspeak, on which he was authoritative\nand interesting. Winston turned his head a little aside to avoid the scrutiny of\nthe large dark eyes.\n\n\u2018It was a good hanging,\u2019 said Syme reminiscently. \u2018I think it spoils it when\nthey tie their feet together. I like to see them kicking. And above all, at the\nend, the tongue sticking right out, and blue\u2014a quite bright blue. That\u2019s the\ndetail that appeals to me.\u2019\n\n\u2018Nex\u2019, please!\u2019 yelled the white-aproned prole with the ladle.\n\nWinston and Syme pushed their trays beneath the grille. On to each was dumped\nswiftly the regulation lunch\u2014a metal pannikin of pinkish-grey stew, a hunk of\nbread, a cube of cheese, a mug of milkless Victory Coffee, and one saccharine\ntablet.\n\n\u2018There\u2019s a table over there, under that telescreen,\u2019 said Syme. \u2018Let\u2019s pick up a\ngin on the way.\u2019\n\nThe gin was served out to them in handleless china mugs. They threaded their way\nacross the crowded room and unpacked their trays on to the metal-topped table,\non one corner of which someone had left a pool of stew, a filthy liquid mess\nthat had the appearance of vomit. Winston took up his mug of gin, paused for an\ninstant to collect his nerve, and gulped the oily-tasting stuff down. When he\nhad winked the tears out of his eyes he suddenly discovered that he was hungry.\nHe began swallowing spoonfuls of the stew, which, in among its general\nsloppiness, had cubes of spongy pinkish stuff which was probably a preparation\nof meat. Neither of them spoke again till they had emptiedtheir pannikins. From\nthe table at Winston\u2019s left, a little behind his back, someone was talking\nrapidly and continuously, a harsh gabble almost like the quacking of a duck,\nwhich pierced the general uproar of the room.\n\n\u2018How is the Dictionary getting on?\u2019 said Winston, raising his voice to overcome\nthe noise.\n\n\u2018Slowly,\u2019 said Syme. \u2018I\u2019m on the adjectives. It\u2019s fascinating.\u2019\n\nHe had brightened up immediately at the mention of Newspeak. He pushed his\npannikin aside, took up his hunk of bread in one delicate hand and his cheese in\nthe other, and leaned across the table so as to be able to speak without\nshouting.\n\n\u2018The Eleventh Edition is the definitive edition,\u2019 he said. \u2018We\u2019re getting the\nlanguage into its final shape\u2014the shape it\u2019s going to have when nobody speaks\nanything else. When we\u2019ve finished with it, people like you will have to learn\nit all over again. You think, I dare say, that our chief job is inventing new\nwords. But not a bit of it! We\u2019re destroying words\u2014scores of them, hundreds of\nthem, every day. We\u2019re cutting the language down to the bone. The Eleventh\nEdition won\u2019t contain a single word that will become obsolete before the year\n2050.\u2019\n\nHe bit hungrily into his bread and swallowed a couple of mouthfuls, then\ncontinued speaking, with a sort of pedant\u2019s passion. His thin dark face had\nbecome animated, his eyes had lost their mocking expression and grown almost\ndreamy.\n\n\u2018It\u2019s a beautiful thing, the destruction of words. Of coursethe great wastage is\nin the verbs and adjectives, but there are hundreds of nouns that can be got rid\nof as well. It isn\u2019t only the synonyms; there are also the antonyms. After all,\nwhat justification is there for a word which is simply the opposite of some\nother word? A word contains its opposite in itself. Take \u2018good\u2019, for instance.\nIf you have a word like \u2018good\u2019, what need is there for a word like \u2018bad\u2019?\n\u2018Ungood\u2019 will do just as well\u2014better, because it\u2019s an exact opposite, which the\nother is not. Or again, if you want a stronger version of \u2018good\u2019, what sense is\nthere in having a whole string of vague useless words like \u2018excellent\u2019 and\n\u2018splendid\u2019 and all the rest of them? \u2018Plusgood\u2019 covers the meaning, or\n\u2018doubleplusgood\u2019 if you want something stronger still. Of course we use those\nforms already. but in the final version of Newspeak there\u2019ll be nothing else. In\nthe end the whole notion of goodness and badness will be covered by only six\nwords\u2014 in reality, only one word. Don\u2019t you see the beauty of that, Winston? It\nwas B.B.\u2019s idea originally, of course,\u2019 he added as an afterthought.\n\nA sort of vapid eagerness flitted across Winston\u2019s face at the mention of Big\nBrother. Nevertheless Syme immediately detected a certain lack of enthusiasm.\n\n\u2018You haven\u2019t a real appreciation of Newspeak, Winston,\u2019 he said almost sadly.\n\u2018Even when you write it you\u2019re still thinking in Oldspeak. I\u2019ve read some of\nthose pieces that you write in \u2018The Times\u2019 occasionally. They\u2019re good enough,\nbut they\u2019re translations. In your heart you\u2019d prefer to stick to Oldspeak, with\nall its vagueness and its useless shades of meaning. You don\u2019t grasp the beauty\nof the destruction ofwords. Do you know that Newspeak is the only language in\nthe world whose vocabulary gets smaller every year?\u2019\n\nWinston did know that, of course. He smiled, sympathetically he hoped, not\ntrusting himself to speak. Syme bit off another fragment of the dark-coloured\nbread, chewed it briefly, and went on:\n\n\u2018Don\u2019t you see that the whole aim of Newspeak is to narrow the range of thought?\nIn the end we shall make thoughtcrime literally impossible, because there will\nbe no words in which to express it. Every concept that can ever be needed, will\nbe expressed by exactly one word, with its meaning rigidly defined and all its\nsubsidiary meanings rubbed out and forgotten. Already, in the Eleventh Edition,\nwe\u2019re not far from that point. But the process will still be continuing long\nafter you and I are dead. Every year fewer and fewer words, and the range of\nconsciousness always a little smaller. Even now, of course, there\u2019s no reason or\nexcuse for committing thoughtcrime. It\u2019s merely a question of self-discipline,\nreality-control. But in the end there won\u2019t be any need even for that. The\nRevolution will be complete when the language is perfect. Newspeak is Ingsoc and\nIngsoc is Newspeak,\u2019 he added with a sort of mystical satisfaction. \u2018Has it ever\noccurred to you, Winston, that by the year 2050, at the very latest, not a\nsingle human being will be alive who could understand such a conversation as we\nare having now?\u2019\n\n\u2018Except\u2014\u2014\u2019 began Winston doubtfully, and he stopped.\n\nIt had been on the tip of his tongue to say \u2018Except the proles,\u2019 but he checked\nhimself, not feeling fully certain thatthis remark was not in some way\nunorthodox. Syme, however, had divined what he was about to say.\n\n\u2018The proles are not human beings,\u2019 he said carelessly. \u2018By 2050\u2014earlier,\nprobably\u2014all real knowledge of Oldspeak will have disappeared. The whole\nliterature of the past will have been destroyed. Chaucer, Shakespeare, Milton,\nByron\u2014they\u2019ll exist only in Newspeak versions, not merely changed into something\ndifferent, but actually changed into something contradictory of what they used\nto be. Even the literature of the Party will change. Even the slogans will\nchange. How could you have a slogan like \u2018freedom is slavery\u2019 when the concept\nof freedom has been abolished? The whole climate of thought will be different.\nIn fact there will be no thought, as we understand it now. Orthodoxy means not\nthinking\u2014not needing to think. Orthodoxy is unconsciousness.\u2019\n\nOne of these days, thought Winston with sudden deep conviction, Syme will be\nvaporized. He is too intelligent. He sees too clearly and speaks too plainly.\nThe Party does not like such people. One day he will disappear. It is written in\nhis face.\n\nWinston had finished his bread and cheese. He turned a little sideways in his\nchair to drink his mug of coffee. At the table on his left the man with the\nstrident voice was still talking remorselessly away. A young woman who was\nperhaps his secretary, and who was sitting with her back to Winston, was\nlistening to him and seemed to be eagerly agreeing with everything that he said.\nFrom time to time Winston caught some such remark as \u2018I think you\u2019re so right,\n\nI do so agree with you\u2019, uttered in a youthful and rather silly feminine voice.\nBut the other voice never stopped for an instant, even when the girl was\nspeaking. Winston knew the man by sight, though he knew no more about him than\nthat he held some important post in the Fiction Department. He was a man of\nabout thirty, with a muscular throat and a large, mobile mouth. His head was\nthrown back a little, and because of the angle at which he was sitting, his\nspectacles caught the light and presented to Winston two blank discs instead of\neyes. What was slightly horrible, was that from the stream of sound that poured\nout of his mouth it was almost impossible to distinguish a single word. Just\nonce Winston caught a phrase\u2014\u2019complete and final elimination of\nGoldsteinism\u2019\u2014jerked out very rapidly and, as it seemed, all in one piece, like\na line of type cast solid. For the rest it was just a noise, a quack-quack-\nquacking. And yet, though you could not actually hear what the man was saying,\nyou could not be in any doubt about its general nature. He might be denouncing\nGoldstein and demanding sterner measures against thought-criminals and\nsaboteurs, he might be fulminating against the atrocities of the Eurasian army,\nhe might be praising Big Brother or the heroes on the Malabar front\u2014it made no\ndifference. Whatever it was, you could be certain that every word of it was pure\northodoxy, pure Ingsoc. As he watched the eyeless face with the jaw moving\nrapidly up and down, Winston had a curious feeling that this was not a real\nhuman being but some kind of dummy. It was not the man\u2019s brain that was\nspeaking, it was his larynx. The stuff that was coming out of him consisted of\nwords, butit was not speech in the true sense: it was a noise uttered in\nunconsciousness, like the quacking of a duck.\n\nSyme had fallen silent for a moment, and with the handle of his spoon was\ntracing patterns in the puddle of stew. The voice from the other table quacked\nrapidly on, easily audible in spite of the surrounding din.\n\n\u2018There is a word in Newspeak,\u2019 said Syme, \u2018I don\u2019t know whether you know it:\nDUCKSPEAK, to quack like a duck. It is one of those interesting words that have\ntwo contradictory meanings. Applied to an opponent, it is abuse, applied to\nsomeone you agree with, it is praise.\u2019\n\nUnquestionably Syme will be vaporized, Winston thought again. He thought it with\na kind of sadness, although well knowing that Syme despised him and slightly\ndisliked him, and was fully capable of denouncing him as a thought-criminal if\nhe saw any reason for doing so. There was something subtly wrong with Syme.\nThere was something that he lacked: discretion, aloofness, a sort of saving\nstupidity. You could not say that he was unorthodox. He believed in the\nprinciples of Ingsoc, he venerated Big Brother, he rejoiced over victories, he\nhated heretics, not merely with sincerity but with a sort of restless zeal, an\nup-to-dateness of information, which the ordinary Party member did not approach.\nYet a faint air of disreputability always clung to him. He said things that\nwould have been better unsaid, he had read too many books, he frequented the\nChestnut Tree Cafe, haunt of painters and musicians. There was no law, not even\nan unwritten law, against frequenting the Chestnut Tree Cafe, yet the place was\nsomehow ill-omened. Theold, discredited leaders of the Party had been used to\ngather there before they were finally purged. Goldstein himself, it was said,\nhad sometimes been seen there, years and decades ago. Syme\u2019s fate was not\ndifficult to foresee. And yet it was a fact that if Syme grasped, even for three\nseconds, the nature of his, Winston\u2019s, secret opinions, he would betray him\ninstantly to the Thought Police. So would anybody else, for that matter: but\nSyme more than most. Zeal was not enough. Orthodoxy was unconsciousness.\n\nSyme looked up. \u2018Here comes Parsons,\u2019 he said.\n\nSomething in the tone of his voice seemed to add, \u2018that bloody fool\u2019. Parsons,\nWinston\u2019s fellow-tenant at Victory Mansions, was in fact threading his way\nacross the room\u2014 a tubby, middle-sized man with fair hair and a froglike face.\nAt thirty-five he was already putting on rolls of fat at neck and waistline, but\nhis movements were brisk and boyish. His whole appearance was that of a little\nboy grown large, so much so that although he was wearing the regulation\noveralls, it was almost impossible not to think of him as being dressed in the\nblue shorts, grey shirt, and red neckerchief of the Spies. In visualizing him\none saw always a picture of dimpled knees and sleeves rolled back from pudgy\nforearms. Parsons did, indeed, invariably revert to shorts when a community hike\nor any other physical activity gave him an excuse for doing so. He greeted them\nboth with a cheery \u2018Hullo, hullo!\u2019 and sat down at the table, giving off an\nintense smell of sweat. Beads of moisture stood out all over his pink face. His\npowers of sweating were extraordinary. At the Community Centre you could always\ntell when hehad been playing table-tennis by the dampness of the bat handle.\nSyme had produced a strip of paper on which there was a long column of words,\nand was studying it with an ink-pencil between his fingers.\n\n\u2018Look at him working away in the lunch hour,\u2019 said Parsons, nudging Winston.\n\u2018Keenness, eh? What\u2019s that you\u2019ve got there, old boy? Something a bit too brainy\nfor me, I expect. Smith, old boy, I\u2019ll tell you why I\u2019m chasing you. It\u2019s that\nsub you forgot to give me.\u2019\n\n\u2018Which sub is that?\u2019 said Winston, automatically feeling for money. About a\nquarter of one\u2019s salary had to be earmarked for voluntary subscriptions, which\nwere so numerous that it was difficult to keep track of them.\n\n\u2018For Hate Week. You know\u2014the house-by-house fund. I\u2019m treasurer for our block.\nWe\u2019re making an all-out effort\u2014 going to put on a tremendous show. I tell you,\nit won\u2019t be my fault if old Victory Mansions doesn\u2019t have the biggest outfit of\nflags in the whole street. Two dollars you promised me.\u2019\n\nWinston found and handed over two creased and filthy notes, which Parsons\nentered in a small notebook, in the neat handwriting of the illiterate.\n\n\u2018By the way, old boy,\u2019 he said. \u2018I hear that little beggar of mine let fly at\nyou with his catapult yesterday. I gave him a good dressing-down for it. In fact\nI told him I\u2019d take the catapult away if he does it again.\u2019\n\n\u2018I think he was a little upset at not going to the execution,\u2019 said Winston.\n\n\u2018Ah, well\u2014what I mean to say, shows the right spirit, doesn\u2019t it? Mischievous\nlittle beggars they are, both of them,\n\nbut talk about keenness! All they think about is the Spies, and the war, of\ncourse. D\u2019you know what that little girl of mine did last Saturday, when her\ntroop was on a hike out Berkhamsted way? She got two other girls to go with her,\nslipped off from the hike, and spent the whole afternoon following a strange\nman. They kept on his tail for two hours, right through the woods, and then,\nwhen they got into Amersham, handed him over to the patrols.\u2019\n\n\u2018What did they do that for?\u2019 said Winston, somewhat taken aback. Parsons went on\ntriumphantly:\n\n\u2018My kid made sure he was some kind of enemy agent\u2014 might have been dropped by\nparachute, for instance. But here\u2019s the point, old boy. What do you think put\nher on to him in the first place? She spotted he was wearing a funny kind of\nshoes\u2014said she\u2019d never seen anyone wearing shoes like that before. So the\nchances were he was a foreigner. Pretty smart for a nipper of seven, eh?\u2019\n\n\u2018What happened to the man?\u2019 said Winston.\n\n\u2018Ah, that I couldn\u2019t say, of course. But I wouldn\u2019t be altogether surprised\nif\u2014\u2014\u2019 Parsons made the motion of aiming a rifle, and clicked his tongue for the\nexplosion.\n\n\u2018Good,\u2019 said Syme abstractedly, without looking up from his strip of paper.\n\n\u2018Of course we can\u2019t afford to take chances,\u2019 agreed Winston dutifully.\n\n\u2018What I mean to say, there is a war on,\u2019 said Parsons.\n\nAs though in confirmation of this, a trumpet call floated from the telescreen\njust above their heads. However, it was not the proclamation of a military\nvictory this time, butmerely an announcement from the Ministry of Plenty.\n\n\u2018Comrades!\u2019 cried an eager youthful voice. \u2018Attention, comrades! We have\nglorious news for you. We have won the battle for production! Returns now\ncompleted of the output of all classes of consumption goods show that the\nstandard of living has risen by no less than 20 per cent over the past year. All\nover Oceania this morning there were irrepressible spontaneous demonstrations\nwhen workers marched out of factories and offices and paraded through the\nstreets with banners voicing their gratitude to Big Brother for the new, happy\nlife which his wise leadership has bestowed upon us. Here are some of the\ncompleted figures. Foodstuffs\u2014\u2014\u2019\n\nThe phrase \u2018our new, happy life\u2019 recurred several times. It had been a favourite\nof late with the Ministry of Plenty. Parsons, his attention caught by the\ntrumpet call, sat listening with a sort of gaping solemnity, a sort of edified\nboredom. He could not follow the figures, but he was aware that they were in\nsome way a cause for satisfaction. He had lugged out a huge and filthy pipe\nwhich was already half full of charred tobacco. With the tobacco ration at 100\ngrammes a week it was seldom possible to fill a pipe to the top. Winston was\nsmoking a Victory Cigarette which he held carefully horizontal. The new ration\ndid not start till tomorrow and he had only four cigarettes left. For the moment\nhe had shut his ears to the remoter noises and was listening to the stuff that\nstreamed out of the telescreen. It appeared that there had even been\ndemonstrations to thank Big Brother for raising the chocolate ration to twenty\ngrammes a week. And only yesterday, he reflected, it had been announced that the\nration was to be REDUCED to twenty grammes a week. Was it possible that they\ncould swallow that, after only twenty-four hours? Yes, they swallowed it.\nParsons swallowed it easily, with the stupidity of an animal. The eyeless\ncreature at the other table swallowed it fanatically, passionately, with a\nfurious desire to track down, denounce, and vaporize anyone who should suggest\nthat last week the ration had been thirty grammes. Syme, too\u2014in some more\ncomplex way, involving doublethink, Syme swallowed it. Was he, then, ALONE in\nthe possession of a memory?\n\nThe fabulous statistics continued to pour out of the telescreen. As compared\nwith last year there was more food, more clothes, more houses, more furniture,\nmore cooking-pots, more fuel, more ships, more helicopters, more books, more\nbabies\u2014more of everything except disease, crime, and insanity. Year by year and\nminute by minute, everybody and everything was whizzing rapidly upwards. As Syme\nhad done earlier Winston had taken up his spoon and was dabbling in the pale-\ncoloured gravy that dribbled across the table, drawing a long streak of it out\ninto a pattern. He meditated resentfully on the physical texture of life. Had it\nalways been like this? Had food always tasted like this? He looked round the\ncanteen. A low-ceilinged, crowded room, its walls grimy from the contact of\ninnumerable bodies; battered metal tables and chairs, placed so close together\nthat you sat with elbows touching; bent spoons, dented trays, coarse white mugs;\nall surfaces greasy, grime in every crack; and a sourish, composite smell of bad\ngin and bad coffee and metallic stew and dirty clothes. Always in your stomach\nand in your skin there was a sort of protest, a feeling that you had been\ncheated of something that you had a right to. It was true that he had no\nmemories of anything greatly different. In any time that he could accurately\nremember, there had never been quite enough to eat, one had never had socks or\nunderclothes that were not full of holes, furniture had always been battered and\nrickety, rooms underheated, tube trains crowded, houses falling to pieces, bread\ndark-coloured, tea a rarity, coffee filthy-tasting, cigarettes\ninsufficient\u2014nothing cheap and plentiful except synthetic gin. And though, of\ncourse, it grew worse as one\u2019s body aged, was it not a sign that this was NOT\nthe natural order of things, if one\u2019s heart sickened at the discomfort and dirt\nand scarcity, the interminable winters, the stickiness of one\u2019s socks, the lifts\nthat never worked, the cold water, the gritty soap, the cigarettes that came to\npieces, the food with its strange evil tastes? Why should one feel it to be\nintolerable unless one had some kind of ancestral memory that things had once\nbeen different?\n\nHe looked round the canteen again. Nearly everyone was ugly, and would still\nhave been ugly even if dressed otherwise than in the uniform blue overalls. On\nthe far side of the room, sitting at a table alone, a small, curiously beetle-\nlike man was drinking a cup of coffee, his little eyes darting suspicious\nglances from side to side. How easy it was, thought Winston, if you did not look\nabout you, to believe that the physical type set up by the Party as an\nideal\u2014tall muscular youths and deep-bosomed maidens, blond-haired, vital,\nsunburnt, carefree\u2014existed and even predominated. Actually, so far as he could\njudge, the majority of people in Airstrip One were small, dark, and ill-\nfavoured. It was curious how that beetle-like type proliferated in the\nMinistries: little dumpy men, growing stout very early in life, with short legs,\nswift scuttling movements, and fat inscrutable faces with very small eyes. It\nwas the type that seemed to flourish best under the dominion of the Party.\n\nThe announcement from the Ministry of Plenty ended on another trumpet call and\ngave way to tinny music. Parsons, stirred to vague enthusiasm by the bombardment\nof figures, took his pipe out of his mouth.\n\n\u2018The Ministry of Plenty\u2019s certainly done a good job this year,\u2019 he said with a\nknowing shake of his head. \u2018By the way, Smith old boy, I suppose you haven\u2019t got\nany razor blades you can let me have?\u2019\n\n\u2018Not one,\u2019 said Winston. \u2018I\u2019ve been using the same blade for six weeks myself.\u2019\n\n\u2018Ah, well\u2014just thought I\u2019d ask you, old boy.\u2019\n\n\u2018Sorry,\u2019 said Winston.\n\nThe quacking voice from the next table, temporarily silenced during the\nMinistry\u2019s announcement, had started up again, as loud as ever. For some reason\nWinston suddenly found himself thinking of Mrs Parsons, with her wispy hair and\nthe dust in the creases of her face. Within two years those children would be\ndenouncing her to the Thought Police. Mrs Parsons would be vaporized. Syme would\nbe vaporized. Winston would be vaporized. O\u2019Brien would be vaporized. Parsons,\non the other hand, would never be vaporized. The eyeless creature with the\nquacking voicewould never be vaporized. The little beetle-like men who scuttle\nso nimbly through the labyrinthine corridors of Ministries they, too, would\nnever be vaporized. And the girl with dark hair, the girl from the Fiction\nDepartment\u2014she would never be vaporized either. It seemed to him that he knew\ninstinctively who would survive and who would perish: though just what it was\nthat made for survival, it was not easy to say.\n\nAt this moment he was dragged out of his reverie with a violent jerk. The girl\nat the next table had turned partly round and was looking at him. It was the\ngirl with dark hair. She was looking at him in a sidelong way, but with curious\nintensity. The instant she caught his eye she looked away again.\n\nThe sweat started out on Winston\u2019s backbone. A horrible pang of terror went\nthrough him. It was gone almost at once, but it left a sort of nagging\nuneasiness behind. Why was she watching him? Why did she keep following him\nabout? Unfortunately he could not remember whether she had already been at the\ntable when he arrived, or had come there afterwards. But yesterday, at any rate,\nduring the Two Minutes Hate, she had sat immediately behind him when there was\nno apparent need to do so. Quite likely her real object had been to listen to\nhim and make sure whether he was shouting loudly enough.\n\nHis earlier thought returned to him: probably she was not actually a member of\nthe Thought Police, but then it was precisely the amateur spy who was the\ngreatest danger of all. He did not know how long she had been looking athim, but\nperhaps for as much as five minutes, and it was possible that his features had\nnot been perfectly under control. It was terribly dangerous to let your thoughts\nwander when you were in any public place or within range of a telescreen. The\nsmallest thing could give you away. A nervous tic, an unconscious look of\nanxiety, a habit of muttering to yourself\u2014anything that carried with it the\nsuggestion of abnormality, of having something to hide. In any case, to wear an\nimproper expression on your face (to look incredulous when a victory was\nannounced, for example) was itself a punishable offence. There was even a word\nfor it in Newspeak: FACECRIME, it was called.\n\nThe girl had turned her back on him again. Perhaps after all she was not really\nfollowing him about, perhaps it was coincidence that she had sat so close to him\ntwo days running. His cigarette had gone out, and he laid it carefully on the\nedge of the table. He would finish smoking it after work, if he could keep the\ntobacco in it. Quite likely the person at the next table was a spy of the\nThought Police, and quite likely he would be in the cellars of the Ministry of\nLove within three days, but a cigarette end must not be wasted. Syme had folded\nup his strip of paper and stowed it away in his pocket. Parsons had begun\ntalking again.\n\n\u2018Did I ever tell you, old boy,\u2019 he said, chuckling round the stem of his pipe,\n\u2018about the time when those two nippers of mine set fire to the old market-\nwoman\u2019s skirt because they saw her wrapping up sausages in a poster of B.B.?\nSneaked up behind her and set fire to it with a box of matches. Burned her quite\nbadly, I believe. Little beggars, eh? Butkeen as mustard! That\u2019s a first-rate\ntraining they give them in the Spies nowadays\u2014better than in my day, even. What\nd\u2019you think\u2019s the latest thing they\u2019ve served them out with? Ear trumpets for\nlistening through keyholes! My little girl brought one home the other\nnight\u2014tried it out on our sitting-room door, and reckoned she could hear twice\nas much as with her ear to the hole. Of course it\u2019s only a toy, mind you. Still,\ngives \u2018em the right idea, eh?\u2019\n\nAt this moment the telescreen let out a piercing whistle. It was the signal to\nreturn to work. All three men sprang to their feet to join in the struggle round\nthe lifts, and the remaining tobacco fell out of Winston\u2019s cigarette.\n\nChapter 6\n\nW     inston was writing in his diary:\n\nIt was three years ago. It was on a dark evening, in anarrow side-street near one of the big railway stations. She\n\nwas standing near a doorway in the wall, under a street lampthat hardly gave any light. She had a young face, painted\n\nvery thick. It was really the paint that appealed to me, thewhiteness of it, like a mask, and the bright red lips. Party\n\nwomen never paint their faces. There was nobody else in thestreet, and no telescreens. She said two dollars. I\u2014\u2014\n\nFor the moment it was too difficult to go on. He shut his eyes and pressed his\nfingers against them, trying to squeeze out the vision that kept recurring. He\nhad an almost overwhelming temptation to shout a string of filthy words at the\ntop of his voice. Or to bang his head against the wall, to kick over the table,\nand hurl the inkpot through the window\u2014to do any violent or noisy or painful\nthing that might black out the memory that was tormenting him.\n\nYour worst enemy, he reflected, was your own nervous system. At any moment the\ntension inside you was liable to translate itself into some visible symptom. He\nthought of a man whom he had passed in the street a few weeks back; a quite\nordinary-looking man, a Party member, aged thirty-five to forty, tallish and\nthin, carrying a brief-case. They were a few metres apart when the left side of\nthe man\u2019s face was suddenly contorted by a sort of spasm. It happened again just\nas they were passing one another: it was only a twitch, a quiver, rapid as the\nclicking of a camera shutter, but obviously habitual. He remembered thinking at\nthe time: That poor devil is done for. And what was frightening was that the\naction was quite possibly unconscious. The most deadly danger of all was talking\nin your sleep. There was no way of guarding against that, so far as he could\nsee.\n\nHe drew his breath and went on writing:\n\nI went with her through the doorway and across a backyardinto a basement kitchen. There was a bed against the wall,\n\nand a lamp on the table, turned down very low. She\u2014\u2014\n\nHis teeth were set on edge. He would have liked to spit. Simultaneously with the\nwoman in the basement kitchen he thought of Katharine, his wife. Winston was\nmarried\u2014 had been married, at any rate: probably he still was married, so far as\nhe knew his wife was not dead. He seemed to breathe again the warm stuffy odour\nof the basement kitchen, an odour compounded of bugs and dirty clothes and\nvillainous cheap scent, but nevertheless alluring, because no woman of the Party\never used scent, or could be imagined as doing so. Only the proles used scent.\nIn his mind the smell of it was inextricably mixed up with fornication.\n\nWhen he had gone with that woman it had been his first lapse in two years or\nthereabouts. Consorting with prostitutes was forbidden, of course, but it was\none of those rules that you could occasionally nerve yourself to break. It was\ndangerous, but it was not a life- and-death matter. To be caught with a\nprostitute might mean five years in a forcedlabour camp: not more, if you had\ncommitted no other offence. And it was easy enough, provided that you could\navoid being caught in the act. The poorer quarters swarmed with women who were\nready to sell themselves. Some could even be purchased for a bottle of gin,\nwhich the proles were not supposed to drink. Tacitly the Party was even inclined\nto encourage prostitution, as an outlet for instincts which could not be\naltogether suppressed. Mere debauchery did not matter very much, so long as it\nwas furtive and joyless and only involved the women of a submerged and despised\nclass. The unforgivable crime was promiscuity between Party members. But\u2014though\nthis was one of the crimes that the accused in the great purges invariably\nconfessed to\u2014it was difficult to imagine any such thing actually happening.\n\nThe aim of the Party was not merely to prevent men and women from forming\nloyalties which it might not be able to control. Its real, undeclared purpose\nwas to remove all pleasure from the sexual act. Not love so much as eroticism\nwas the enemy, inside marriage as well as outside it. All marriages between\nParty members had to be approved by a committee appointed for the purpose,\nand\u2014though the principle was never clearly stated\u2014permission was always refused\nif the couple concerned gave the impression of being physically attracted to one\nanother. The only recognized purpose of marriage was to beget children for the\nservice of the Party. Sexual intercourse was to be looked on as a slightly\ndisgusting minor operation, like having an enema. This again was never put into\nplain words, but in an indirect way it was rubbed into every Party member from\nchildhood onwards. There were even organizations such as the Junior Anti-Sex\nLeague, which advocated complete celibacy for both sexes. All children were to\nbe begotten by artificial insemination (ARTSEM, it was called in Newspeak) and\nbrought up in public institutions. This, Winston was aware, was not meant\naltogether seriously, but somehow it fitted in with the general ideology of the\nParty. The Party was trying to kill the sex instinct, or, if it could not be\nkilled, then to distort it and dirty it. He did not know why this was so, but it\nseemed natural that it should be so. And as far as the women were concerned, the\nParty\u2019s efforts were largely successful.\n\nHe thought again of Katharine. It must be nine, ten\u2014 nearly eleven years since\nthey had parted. It was curious how seldom he thought of her. For days at a time\nhe was capable of forgetting that he had ever been married. They had only been\ntogether for about fifteen months. The Party did not permit divorce, but it\nrather encouraged separation in cases where there were no children.\n\nKatharine was a tall, fair-haired girl, very straight, with splendid movements.\nShe had a bold, aquiline face, a face that one might have called noble until one\ndiscovered that there was as nearly as possible nothing behind it. Very early in\nher married life he had decided\u2014though perhaps it wasonly that he knew her more\nintimately than he knew most people\u2014that she had without exception the most\nstupid, vulgar, empty mind that he had ever encountered. She had not a thought\nin her head that was not a slogan, and there was no imbecility, absolutely none\nthat she was not capable of swallowing if the Party handed it out to her. \u2018The\nhuman sound-track\u2019 he nicknamed her in his own mind. Yet he could have endured\nliving with her if it had not been for just one thing\u2014sex.\n\nAs soon as he touched her she seemed to wince and stiffen. To embrace her was\nlike embracing a jointed wooden image. And what was strange was that even when\nshe was clasping him against her he had the feeling that she was simultaneously\npushing him away with all her strength. The rigidlty of her muscles managed to\nconvey that impression. She would lie there with shut eyes, neither resisting\nnor co-operating but SUBMITTING. It was extraordinarily embarrassing, and, after\na while, horrible. But even then he could have borne living with her if it had\nbeen agreed that they should remain celibate. But curiously enough it was\nKatharine who refused this. They must, she said, produce a child if they could.\nSo the performance continued to happen, once a week quite regulariy, whenever it\nwas not impossible. She even used to remind him of it in the morning, as\nsomething which had to be done that evening and which must not be forgotten. She\nhad two names for it. One was \u2018making a baby\u2019, and the other was \u2018our duty to\nthe Party\u2019 (yes, she had actually used that phrase). Quite soon he grew to have\na feeling of positive dread when the appointedday came round. But luckily no\nchild appeared, and in the end she agreed to give up trying, and soon afterwards\nthey parted. Winston sighed inaudibly. He picked up his pen again and wrote:\n\nShe threw herself down on the bed, and at once, without anykind of preliminary in the most coarse, horrible way you can\n\nimagine, pulled up her skirt. I\u2014\u2014\n\nHe saw himself standing there in the dim lamplight, with the smell of bugs and\ncheap scent in his nostrils, and in his heart a feeling of defeat and resentment\nwhich even at that moment was mixed up with the thought of Katharine\u2019s white\nbody, frozen for ever by the hypnotic power of the Party. Why did it always have\nto be like this? Why could he not have a woman of his own instead of these\nfilthy scuffles at intervals of years? But a real love affair was an almost\nunthinkable event. The women of the Party were all alike. Chastity was as deep\ningrained in them as Party loyalty. By careful early conditioning, by games and\ncold water, by the rubbish that was dinned into them at school and in the Spies\nand the Youth League, by lectures, parades, songs, slogans, and martial music,\nthe natural feeling had been driven out of them. His reason told him that there\nmust be exceptions, but his heart did not believe it. They were all impregnable,\nas the Party intended that they should be. And what he wanted, more even than to\nbe loved, was to break down that wall of virtue, even if it were only once in\nhiswhole life. The sexual act, successfully performed, was rebellion. Desire was\nthoughtcrime. Even to have awakened Katharine, if he could have achieved it,\nwould have been like a seduction, although she was his wife.\n\nBut the rest of the story had got to be written down. He wrote:\n\nI turned up the lamp. When I saw her in the light\u2014\u2014\n\nAfter the darkness the feeble light of the paraffin lamp had seemed very bright.\nFor the first time he could see the woman properly. He had taken a step towards\nher and then halted, full of lust and terror. He was painfully conscious of the\nrisk he had taken in coming here. It was perfectly possible that the patrols\nwould catch him on the way out: for that matter they might be waiting outside\nthe door at this moment. If he went away without even doing what he had come\nhere to do\u2014\u2014!\n\nIt had got to be written down, it had got to be confessed. What he had suddenly\nseen in the lamplight was that the woman was OLD. The paint was plastered so\nthick on her face that it looked as though it might crack like a cardboard mask.\nThere were streaks of white in her hair; but the truly dreadful detail was that\nher mouth had fallen a little open, revealing nothing except a cavernous\nblackness. She had no teeth at all.\n\nHe wrote hurriedly, in scrabbling handwriting:\n\nWhen I saw her in the light she was quite an old woman, fiftyyears old at least. But I went ahead and did it just the same.\n\nHe pressed his fingers against his eyelids again. He had written it down at\nlast, but it made no difference. The therapy had not worked. The urge to shout\nfilthy words at the top of his voice was as strong as ever.\n\nChapter 7\n\n\u2018If there is hope,\u2019 wrote Winston, \u2018it lies in the proles.\u2019\n\nIf there was hope, it MUST lie in the proles, because only there in those\nswarming disregarded masses, 85 per cent of the population of Oceania, could the\nforce to destroy the Party ever be generated. The Party could not be overthrown\nfrom within. Its enemies, if it had any enemies, had no way of coming together\nor even of identifying one another. Even if the legendary Brotherhood existed,\nas just possibly it might, it was inconceivable that its members could ever\nassemble in larger numbers than twos and threes. Rebellion meant a look in the\neyes, an inflexion of the voice, at the most, an occasional whispered word. But\nthe proles, if only they could somehow become conscious of their own strength.\nwould have no need to conspire. They needed only to rise up and shake themselves\nlike a horse shaking off flies. If they chose they could blow the Party to\npieces tomorrow morning. Surely sooner or later it must occur to them to do it?\nAnd yet\u2014\u2014!\n\nHe remembered how once he had been walking down a crowded street when a\ntremendous shout of hundreds of voices women\u2019s voices\u2014had burst from a side-\nstreet a little way ahead. It was a great formidable cry of anger and despair, a\ndeep, loud \u2018Oh-o-o-o-oh!\u2019 that went humming on like the reverberation of a bell.\nHis heart had leapt. It\u2019s started! he had thought. A riot! The proles are\nbreaking loose at last! When he had reached the spot it was to see a mob of two\nor three hundred women crowding round the stalls of a street market, with faces\nas tragic as though they had been the doomed passengers on a sinking ship. But\nat this moment the general despair broke down into a multitude of individual\nquarrels. It appeared that one of the stalls had been selling tin saucepans.\nThey were wretched, flimsy things, but cooking-pots of any kind were always\ndifficult to get. Now the supply had unexpectedly given out. The successful\nwomen, bumped and jostled by the rest, were trying to make off with their\nsaucepans while dozens of others clamoured round the stall, accusing the stall-\nkeeper of favouritism and of having more saucepans somewhere in reserve. There\nwas a fresh outburst of yells. Two bloated women, one of them with her hair\ncoming down, had got hold of the same saucepan and were trying to tear it out of\none another\u2019s hands. For a moment they were both tugging, and then the handle\ncame off. Winston watched them disgustedly. And yet, just for a moment, what\nalmost frightening power had sounded in that cry from only a few hundred\nthroats! Why was it that they could never shout like that about anything that\nmattered?\n\nHe wrote:\n\nUntil they become conscious they will never rebel, and untilafter they have rebelled they cannot become conscious.\n\nThat, he reflected, might almost have been a transcription from one of the Party\ntextbooks. The Party claimed, of course, to have liberated the proles from\nbondage. Before the Revolution they had been hideously oppressed by the\ncapitalists, they had been starved and flogged, women had been forced to work in\nthe coal mines (women still did work in the coal mines, as a matter of fact),\nchildren had been sold into the factories at the age of six. But simultaneously,\ntrue to the Principles of doublethink, the Party taught that the proles were\nnatural inferiors who must be kept in subjection, like animals, by the\napplication of a few simple rules. In reality very little was known about the\nproles. It was not necessary to know much. So long as they continued to work and\nbreed, their other activities were without importance. Left to themselves, like\ncattle turned loose upon the plains of Argentina, they had reverted to a style\nof life that appeared to be natural to them, a sort of ancestral pattern. They\nwere born, they grew up in the gutters, they went to work at twelve, they passed\nthrough a brief blossoming-period of beauty and sexual desire, they married at\ntwenty, they were middle-aged at thirty, they died, for the most part, at sixty.\nHeavy physical work, the care of home and children, petty quarrels with\nneighbours, films, football, beer, and above all, gambling, filled up the\nhorizon of their minds. To keep them in control was not difficult. A few agents\nof the Thought Police moved always among them, spreading false rumours and\nmarking down and eliminating the few individuals who were judged capable of\nbecoming dangerous; but no attempt was made to indoctrinate them with the\nideology of the Party. It was not desirable\n\nthat the proles should have strong political feelings. All that was required of\nthem was a primitive patriotism which could be appealed to whenever it was\nnecessary to make them accept longer working-hours or shorter rations. And even\nwhen they became discontented, as they sometimes did, their discontent led\nnowhere, because being without general ideas, they could only focus it on petty\nspecific grievances. The larger evils invariably escaped their notice. The great\nmajority of proles did not even have telescreens in their homes. Even the civil\npolice interfered with them very little. There was a vast amount of criminality\nin London, a whole world-within-a-world of thieves, bandits, prostitutes, drug-\npeddlers, and racketeers of every description; but since it all happened among\nthe proles themselves, it was of no importance. In all questions of morals they\nwere allowed to follow their ancestral code. The sexual puritanism of the Party\nwas not imposed upon them. Promiscuity went unpunished, divorce was permitted.\nFor that matter, even religious worship would have been permitted if the proles\nhad shown any sign of needing or wanting it. They were beneath suspicion. As the\nParty slogan put it: \u2018Proles and animals are free.\u2019\n\nWinston reached down and cautiously scratched his varicose ulcer. It had begun\nitching again. The thing you invariably came back to was the impossibility of\nknowing what life before the Revolution had really been like. He took out of the\ndrawer a copy of a children\u2019s history textbook which he had borrowed from Mrs\nParsons, and began copying a passage into the diary:\n\nIn the old days (it ran), before the glorious Revolution,\n\nLondon was not the beautiful city that we know today. Itwas a dark, dirty, miserable place where hardly anybody\n\nhad enough to eat and where hundreds and thousands ofpoor people had no boots on their feet and not even a roof to\n\nsleep under. Children no older than you had to work twelvehours a day for cruel masters who flogged them with whips\n\nif they worked too slowly and fed them on nothing but stalebreadcrusts and water. But in among all this terrible poverty\n\nthere were just a few great big beautiful houses that werelived in by rich men who had as many as thirty servants to\n\nlook after them. These rich men were called capitalists. Theywere fat, ugly men with wicked faces, like the one in the\n\npicture on the opposite page. You can see that he is dressed ina long black coat which was called a frock coat, and a queer,\n\nshiny hat shaped like a stovepipe, which was called a top hat.\n\nThis was the uniform of the capitalists, and no one else wasallowed to wear it. The capitalists owned everything in the\n\nworld, and everyone else was their slave. They owned all theland, all the houses, all the factories, and all the money. If\n\nanyone disobeyed them they could throw them into prison, orthey could take his job away and starve him to death. When\n\nany ordinary person spoke to a capitalist he had to cringe andbow to him, and take off his cap and address him as \u2018Sir\u2019. The\n\nchief of all the capitalists was called the King, and\u2014\u2014\n\nBut he knew the rest of the catalogue. There would be mention of the bishops in\ntheir lawn sleeves, the judges in their ermine robes, the pillory, the stocks,\nthe treadmill, thecat-o\u2019-nine tails, the Lord Mayor\u2019s Banquet, and the practice\nof kissing the Pope\u2019s toe. There was also something called the JUS PRIMAE\nNOCTIS, which would probably not be mentioned in a textbook for children. It was\nthe law by which every capitalist had the right to sleep with any woman working\nin one of his factories.\n\nHow could you tell how much of it was lies? It MIGHT be true that the average\nhuman being was better off now than he had been before the Revolution. The only\nevidence to the contrary was the mute protest in your own bones, the instinctive\nfeeling that the conditions you lived in were intolerable and that at some other\ntime they must have been different. It struck him that the truly characteristic\nthing about modern life was not its cruelty and insecurity, but simply its\nbareness, its dinginess, its listlessness. Life, if you looked about you, bore\nno resemblance not only to the lies that streamed out of the telescreens, but\neven to the ideals that the Party was trying to achieve. Great areas of it, even\nfor a Party member, were neutral and non-political, a matter of slogging through\ndreary jobs, fighting for a place on the Tube, darning a worn-out sock, cadging\na saccharine tablet, saving a cigarette end. The ideal set up by the Party was\nsomething huge, terrible, and glittering\u2014a world of steel and concrete, of\nmonstrous machines and terrifying weapons\u2014a nation of warriors and fanatics,\nmarching forward in perfect unity, all thinking the same thoughts and shouting\nthe same slogans, perpetually working, fighting, triumphing, persecuting\u2014three\nhundred million people all with the same face. The reality was decaying, dingy\ncitieswhere underfed people shuffled to and fro in leaky shoes, in patched-up\nnineteenth-century houses that smelt always of cabbage and bad lavatories. He\nseemed to see a vision of London, vast and ruinous, city of a million dustbins,\nand mixed up with it was a picture of Mrs Parsons, a woman with lined face and\nwispy hair, fiddling helplessly with a blocked waste-pipe.\n\nHe reached down and scratched his ankle again. Day and night the telescreens\nbruised your ears with statistics proving that people today had more food, more\nclothes, better houses, better recreations\u2014that they lived longer, worked\nshorter hours, were bigger, healthier, stronger, happier, more intelligent,\nbetter educated, than the people of fifty years ago. Not a word of it could ever\nbe proved or disproved. The Party claimed, for example, that today 40 per cent\nof adult proles were literate: before the Revolution, it was said, the number\nhad only been 15 per cent. The Party claimed that the infant mortality rate was\nnow only 160 per thousand, whereas before the Revolution it had been 300\u2014 and so\nit went on. It was like a single equation with two unknowns. It might very well\nbe that literally every word in the history books, even the things that one\naccepted without question, was pure fantasy. For all he knew there might never\nhave been any such law as the JUS PRIMAE NOCTIS, or any such creature as a\ncapitalist, or any such garment as a top hat.\n\nEverything faded into mist. The past was erased, the erasure was forgotten, the\nlie became truth. Just once in his life he had possessed\u2014AFTER the event: that\nwas whatcounted\u2014concrete, unmistakable evidence of an act of falsification. He\nhad held it between his fingers for as long as thirty seconds. In 1973, it must\nhave been\u2014at any rate, it was at about the time when he and Katharine had\nparted. But the really relevant date was seven or eight years earlier.\n\nThe story really began in the middle sixties, the period of the great purges in\nwhich the original leaders of the Revolution were wiped out once and for all. By\n1970 none of them was left, except Big Brother himself. All the rest had by that\ntime been exposed as traitors and counter-revolutionaries. Goldstein had fled\nand was hiding no one knew where, and of the others, a few had simply\ndisappeared, while the majority had been executed after spectacular public\ntrials at which they made confession of their crimes. Among the last survivors\nwere three men named Jones, Aaronson, and Rutherford. It must have been in 1965\nthat these three had been arrested. As often happened, they had vanished for a\nyear or more, so that one did not know whether they were alive or dead, and then\nhad suddenly been brought forth to incriminate themselves in the usual way. They\nhad confessed to intelligence with the enemy (at that date, too, the enemy was\nEurasia), embezzlement of public funds, the murder of various trusted Party\nmembers, intrigues against the leadership of Big Brother which had started long\nbefore the Revolution happened, and acts of sabotage causing the death of\nhundreds of thousands of people. After confessing to these things they had been\npardoned, reinstated in the Party, and given posts which were in fact sinecures\nbut which sounded important. All three had written long, abject articles in \u2018The\nTimes\u2019, analysing the reasons for their defection and promising to make amends.\n\nSome time after their release Winston had actually seen all three of them in the\nChestnut Tree Cafe. He remembered the sort of terrified fascination with which\nhe had watched them out of the corner of his eye. They were men far older than\nhimself, relics of the ancient world, almost the last great figures left over\nfrom the heroic days of the Party. The glamour of the underground struggle and\nthe civil war still faintly clung to them. He had the feeling, though already at\nthat time facts and dates were growing blurry, that he had known their names\nyears earlier than he had known that of Big Brother. But also they were outlaws,\nenemies, untouchables, doomed with absolute certainty to extinction within a\nyear or two. No one who had once fallen into the hands of the Thought Police\never escaped in the end. They were corpses waiting to be sent back to the grave.\n\nThere was no one at any of the tables nearest to them. It was not wise even to\nbe seen in the neighbourhood of such people. They were sitting in silence before\nglasses of the gin flavoured with cloves which was the speciality of the cafe.\nOf the three, it was Rutherford whose appearance had most impressed Winston.\nRutherford had once been a famous caricaturist, whose brutal cartoons had helped\nto inflame popular opinion before and during the Revolution. Even now, at long\nintervals, his cartoons were appearing in The Times. They were simply an\nimitation of his earlier manner, and curiously lifeless and unconvincing. Always\nthey were a rehashing of the ancient themes\u2014slum tenements, starving children,\nstreet battles, capitalists in top hats\u2014even on the barricades the capitalists\nstill seemed to cling to their top hats an endless, hopeless effort to get back\ninto the past. He was a monstrous man, with a mane of greasy grey hair, his face\npouched and seamed, with thick negroid lips. At one time he must have been\nimmensely strong; now his great body was sagging, sloping, bulging, falling away\nin every direction. He seemed to be breaking up before one\u2019s eyes, like a\nmountain crumbling.\n\nIt was the lonely hour of fifteen. Winston could not now remember how he had\ncome to be in the cafe at such a time. The place was almost empty. A tinny music\nwas trickling from the telescreens. The three men sat in their corner almost\nmotionless, never speaking. Uncommanded, the waiter brought fresh glasses of\ngin. There was a chessboard on the table beside them, with the pieces set out\nbut no game started. And then, for perhaps half a minute in all, something\nhappened to the telescreens. The tune that they were playing changed, and the\ntone of the music changed too. There came into it\u2014but it was something hard to\ndescribe. It was a peculiar, cracked, braying, jeering note: in his mind Winston\ncalled it a yellow note. And then a voice from the telescreen was singing:\n\nUnder the spreading chestnut tree\n\nI sold you and you sold me:\n\nThere lie they, and here lie we\n\nUnder the spreading chestnut tree.\n\nThe three men never stirred. But when Winston glanced again at Rutherford\u2019s\nruinous face, he saw that his eyes were full of tears. And for the first time he\nnoticed, with a kind of inward shudder, and yet not knowing AT WHAT he\nshuddered, that both Aaronson and Rutherford had broken noses.\n\nA little later all three were re-arrested. It appeared that they had engaged in\nfresh conspiracies from the very moment of their release. At their second trial\nthey confessed to all their old crimes over again, with a whole string of new\nones. They were executed, and their fate was recorded in the Party histories, a\nwarning to posterity. About five years after this, in 1973, Winston was\nunrolling a wad of documents which had just flopped out of the pneumatic tube on\nto his desk when he came on a fragment of paper which had evidently been slipped\nin among the others and then forgotten. The instant he had flattened it out he\nsaw its significance. It was a half-page torn out of \u2018The Times\u2019 of about ten\nyears earlier\u2014the top half of the page, so that it included the date\u2014and it\ncontained a photograph of the delegates at some Party function in New York.\nProminent in the middle of the group were Jones, Aaronson, and Rutherford. There\nwas no mistaking them, in any case their names were in the caption at the\nbottom.\n\nThe point was that at both trials all three men had confessed that on that date\nthey had been on Eurasian soil. They had flown from a secret airfield in Canada\nto a rendezvous somewhere in Siberia, and had conferred with members of the\nEurasian General Staff, to whom they had betrayed important military secrets.\nThe date had stuck in Winston\u2019s memory because it chanced to be midsummer day;\nbut the whole story must be on record in countless other places as well. There\nwas only one possible conclusion: the confessions were lies.\n\nOf course, this was not in itself a discovery. Even at that time Winston had not\nimagined that the people who were wiped out in the purges had actually committed\nthe crimes that they were accused of. But this was concrete evidence; it was a\nfragment of the abolished past, like a fossil bone which turns up in the wrong\nstratum and destroys a geological theory. It was enough to blow the Party to\natoms, if in some way it could have been published to the world and its\nsignificance made known.\n\nHe had gone straight on working. As soon as he saw what the photograph was, and\nwhat it meant, he had covered it up with another sheet of paper. Luckily, when\nhe unrolled it, it had been upside-down from the point of view of the\ntelescreen.\n\nHe took his scribbling pad on his knee and pushed back his chair so as to get as\nfar away from the telescreen as possible. To keep your face expressionless was\nnot difficult, and even your breathing could be controlled, with an effort: but\nyou could not control the beating of your heart, and the telescreen was quite\ndelicate enough to pick it up. He let what he judged to be ten minutes go by,\ntormented all the while by the fear that some accident\u2014a sudden draught blowing\nacross his desk, for instance\u2014would betray him. Then, without uncovering it\nagain, he dropped the photograph into the memory hole, along with some other\nwaste papers. Within another minute, perhaps, it would have crumbled into ashes.\n\nThat was ten\u2014eleven years ago. Today, probably, he would have kept that\nphotograph. It was curious that the fact of having held it in his fingers seemed\nto him to make a difference even now, when the photograph itself, as well as the\nevent it recorded, was only memory. Was the Party\u2019s hold upon the past less\nstrong, he wondered, because a piece of evidence which existed no longer HAD\nONCE existed?\n\nBut today, supposing that it could be somehow resurrected from its ashes, the\nphotograph might not even be evidence. Already, at the time when he made his\ndiscovery, Oceania was no longer at war
