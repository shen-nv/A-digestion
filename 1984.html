tions, the\npiles of rubble everywhere, the unintelligible proclamations posted at street\ncorners, the gangs of youths in shirts all the same colour, the enormous queues\noutside the bakeries, the intermittent machine-gun fire in the distance\u2014above\nall, the fact that there was never enough to eat. He remembered long afternoons\nspent with other boys in scrounging round dustbins and rubbish heaps, picking\nout the ribs of cabbage leaves, potato peelings, sometimes even scraps of stale\nbreadcrust from which they carefully scraped away the cinders; and also in\nwaiting for the passing of trucks which travelled over a certain route and were\nknown to carry cattle feed, and which, when they jolted over the bad patches in\nthe road, sometimes spilt a few fragments of oil-cake.\n\nWhen his father disappeared, his mother did not show any surprise or any violent\ngrief, but a sudden change came over her. She seemed to have become completely\nspiritless. It was evident even to Winston that she was waiting forsomething\nthat she knew must happen. She did everything that was needed\u2014cooked, washed,\nmended, made the bed, swept the floor, dusted the mantelpiece\u2014always very slowly\nand with a curious lack of superfluous motion, like an artist\u2019s lay- figure\nmoving of its own accord. Her large shapely body seemed to relapse naturally\ninto stillness. For hours at a time she would sit almost immobile on the bed,\nnursing his young sister, a tiny, ailing, very silent child of two or three,\nwith a face made simian by thinness. Very occasionally she would take Winston in\nher arms and press him against her for a long time without saying anything. He\nwas aware, in spite of his youthfulness and selfishness, that this was somehow\nconnected with the never-mentioned thing that was about to happen.\n\nHe remembered the room where they lived, a dark, closesmelling room that seemed\nhalf filled by a bed with a white counterpane. There was a gas ring in the\nfender, and a shelf where food was kept, and on the landing outside there was a\nbrown earthenware sink, common to several rooms. He remembered his mother\u2019s\nstatuesque body bending over the gas ring to stir at something in a saucepan.\nAbove all he remembered his continuous hunger, and the fierce sordid battles at\nmealtimes. He would ask his mother naggingly, over and over again, why there was\nnot more food, he would shout and storm at her (he even remembered the tones of\nhis voice, which was beginning to break prematurely and sometimes boomed in a\npeculiar way), or he would attempt a snivelling note of pathos in his efforts to\nget more than his share. His mother was quite ready to give him more thanhis\nshare. She took it for granted that he, \u2018the boy\u2019, should have the biggest\nportion; but however much she gave him he invariably demanded more. At every\nmeal she would beseech him not to be selfish and to remember that his little\nsister was sick and also needed food, but it was no use. He would cry out with\nrage when she stopped ladling, he would try to wrench the saucepan and spoon out\nof her hands, he would grab bits from his sister\u2019s plate. He knew that he was\nstarving the other two, but he could not help it; he even felt that he had a\nright to do it. The clamorous hunger in his belly seemed to justify him. Between\nmeals, if his mother did not stand guard, he was constantly pilfering at the\nwretched store of food on the shelf.\n\nOne day a chocolate-ration was issued. There had been no such issue for weeks or\nmonths past. He remembered quite clearly that precious little morsel of\nchocolate. It was a two-ounce slab (they still talked about ounces in those\ndays) between the three of them. It was obvious that it ought to be divided into\nthree equal parts. Suddenly, as though he were listening to somebody else,\nWinston heard himself demanding in a loud booming voice that he should be given\nthe whole piece. His mother told him not to be greedy. There was a long, nagging\nargument that went round and round, with shouts, whines, tears, remonstrances,\nbargainings. His tiny sister, clinging to her mother with both hands, exactly\nlike a baby monkey, sat looking over her shoulder at him with large, mournful\neyes. In the end his mother broke off three-quarters of the chocolate and gave\nit to Winston, giving the other quarter to his sister. The little girl took\nholdof it and looked at it dully, perhaps not knowing what it was. Winston stood\nwatching her for a moment. Then with a sudden swift spring he had snatched the\npiece of chocolate out of his sister\u2019s hand and was fleeing for the door.\n\n\u2018Winston, Winston!\u2019 his mother called after him. \u2018Come back! Give your sister\nback her chocolate!\u2019\n\nHe stopped, but did not come back. His mother\u2019s anxious eyes were fixed on his\nface. Even now he was thinking about the thing, he did not know what it was that\nwas on the point of happening. His sister, conscious of having been robbed of\nsomething, had set up a feeble wail. His mother drew her arm round the child and\npressed its face against her breast. Something in the gesture told him that his\nsister was dying. He turned and fled down the stairs, with the chocolate growing\nsticky in his hand.\n\nHe never saw his mother again. After he had devoured the chocolate he felt\nsomewhat ashamed of himself and hung about in the streets for several hours,\nuntil hunger drove him home. When he came back his mother had disappeared. This\nwas already becoming normal at that time. Nothing was gone from the room except\nhis mother and his sister. They had not taken any clothes, not even his mother\u2019s\novercoat. To this day he did not know with any certainty that his mother was\ndead. It was perfectly possible that she had merely been sent to a forced-labour\ncamp. As for his sister, she might have been removed, like Winston himself, to\none of the colonies for homeless children (Reclamation Centres, they were\ncalled) which had grown up as a result of the civil war, or she might have been\nsent to the labourcamp along with his mother, or simply left somewhere or other\nto die.\n\nThe dream was still vivid in his mind, especially the enveloping protecting\ngesture of the arm in which its whole meaning seemed to be contained. His mind\nwent back to another dream of two months ago. Exactly as his mother had sat on\nthe dingy whitequilted bed, with the child clinging to her, so she had sat in\nthe sunken ship, far underneath him, and drowning deeper every minute, but still\nlooking up at him through the darkening water.\n\nHe told Julia the story of his mother\u2019s disappearance. Without opening her eyes\nshe rolled over and settled herself into a more comfortable position.\n\n\u2018I expect you were a beastly little swine in those days,\u2019 she said indistinctly.\n\u2018All children are swine.\u2019\n\n\u2018Yes. But the real point of the story\u2014\u2014\u2019\n\nFrom her breathing it was evident that she was going off to sleep again. He\nwould have liked to continue talking about his mother. He did not suppose, from\nwhat he could remember of her, that she had been an unusual woman, still less an\nintelligent one; and yet she had possessed a kind of nobility, a kind of purity,\nsimply because the standards that she obeyed were private ones. Her feelings\nwere her own, and could not be altered from outside. It would not have occurred\nto her that an action which is ineffectual thereby becomes meaningless. If you\nloved someone, you loved him, and when you had nothing else to give, you still\ngave him love. When the last of the chocolate was gone, his mother had clasped\nthe child in her arms. It was no use, it changednothing, it did not produce more\nchocolate, it did not avert the child\u2019s death or her own; but it seemed natural\nto her to do it. The refugee woman in the boat had also covered the little boy\nwith her arm, which was no more use against the bullets than a sheet of paper.\nThe terrible thing that the Party had done was to persuade you that mere\nimpulses, mere feelings, were of no account, while at the same time robbing you\nof all power over the material world. When once you were in the grip of the\nParty, what you felt or did not feel, what you did or refrained from doing, made\nliterally no difference. Whatever happened you vanished, and neither you nor\nyour actions were ever heard of again. You were lifted clean out of the stream\nof history. And yet to the people of only two generations ago this would not\nhave seemed all-important, because they were not attempting to alter history.\nThey were governed by private loyalties which they did not question. What\nmattered were individual relationships, and a completely helpless gesture, an\nembrace, a tear, a word spoken to a dying man, could have value in itself. The\nproles, it suddenly occurred to him, had remained in this condition. They were\nnot loyal to a party or a country or an idea, they were loyal to one another.\nFor the first time in his life he did not despise the proles or think of them\nmerely as an inert force which would one day spring to life and regenerate the\nworld. The proles had stayed human. They had not become hardened inside. They\nhad held on to the primitive emotions which he himself had to re-learn by\nconscious effort. And in thinking this he remembered, without apparent\nrelevance, how a few weeks ago he had seen a severed\n\nhand lying on the pavement and had kicked it into the gutter as though it had\nbeen a cabbage-stalk.\n\n\u2018The proles are human beings,\u2019 he said aloud. \u2018We are not human.\u2019\n\n\u2018Why not?\u2019 said Julia, who had woken up again.\n\nHe thought for a little while. \u2018Has it ever occurred to you,\u2019 he said, \u2018that the\nbest thing for us to do would be simply to walk out of here before it\u2019s too\nlate, and never see each other again?\u2019\n\n\u2018Yes, dear, it has occurred to me, several times. But I\u2019m not going to do it,\nall the same.\u2019\n\n\u2018We\u2019ve been lucky,\u2019 he said \u2018but it can\u2019t last much longer. You\u2019re young. You\nlook normal and innocent. If you keep clear of people like me, you might stay\nalive for another fifty years.\u2019\n\n\u2018No. I\u2019ve thought it all out. What you do, I\u2019m going to do. And don\u2019t be too\ndownhearted. I\u2019m rather good at staying alive.\u2019\n\n\u2018We may be together for another six months\u2014a year\u2014 there\u2019s no knowing. At the\nend we\u2019re certain to be apart. Do you realize how utterly alone we shall be?\nWhen once they get hold of us there will be nothing, literally nothing, that\neither of us can do for the other. If I confess, they\u2019ll shoot you, and if I\nrefuse to confess, they\u2019ll shoot you just the same. Nothing that I can do or\nsay, or stop myself from saying, will put off your death for as much as five\nminutes. Neither of us will even know whether the other is alive or dead. We\nshall be utterly without power of any kind. The one thing that matters is that\nwe shouldn\u2019t betray one another, althougheven that can\u2019t make the slightest\ndifference.\u2019\n\n\u2018If you mean confessing,\u2019 she said, \u2018we shall do that, right enough. Everybody\nalways confesses. You can\u2019t help it. They torture you.\u2019\n\n\u2018I don\u2019t mean confessing. Confession is not betrayal. What you say or do doesn\u2019t\nmatter: only feelings matter. If they could make me stop loving you\u2014that would\nbe the real betrayal.\u2019\n\nShe thought it over. \u2018They can\u2019t do that,\u2019 she said finally. \u2018It\u2019s the one thing\nthey can\u2019t do. They can make you say anything\u2014ANYTHING\u2014but they can\u2019t make you\nbelieve it. They can\u2019t get inside you.\u2019\n\n\u2018No,\u2019 he said a little more hopefully, \u2018no; that\u2019s quite true. They can\u2019t get\ninside you. If you can FEEL that staying human is worth while, even when it\ncan\u2019t have any result whatever, you\u2019ve beaten them.\u2019\n\nHe thought of the telescreen with its never-sleeping ear. They could spy upon\nyou night and day, but if you kept your head you could still outwit them. With\nall their cleverness they had never mastered the secret of finding out what\nanother human being was thinking. Perhaps that was less true when you were\nactually in their hands. One did not know what happened inside the Ministry of\nLove, but it was possible to guess: tortures, drugs, delicate instruments that\nregistered your nervous reactions, gradual wearing-down by sleeplessness and\nsolitude and persistent questioning. Facts, at any rate, could not be kept\nhidden. They could be tracked down by enquiry, they could be squeezed out of you\nby torture. But if the object was not to stay alive but to stayhuman, what\ndifference did it ultimately make? They could not alter your feelings: for that\nmatter you could not alter them yourself, even if you wanted to. They could lay\nbare in the utmost detail everything that you had done or said or thought; but\nthe inner heart, whose workings were mysterious even to yourself, remained\nimpregnable.\n\nChapter 8\n\nT   hey had done it, they had done it at last!\n\nThe room they were standing in was long-shaped and softly lit. The telescreen\nwas dimmed to a low murmur; the richness of the dark-blue carpet gave one the\nimpression of treading on velvet. At the far end of the room O\u2019Brien was sitting\nat a table under a green-shaded lamp, with a mass of papers on either side of\nhim. He had not bothered to look up when the servant showed Julia and Winston\nin.\n\nWinston\u2019s heart was thumping so hard that he doubted whether he would be able to\nspeak. They had done it, they had done it at last, was all he could think. It\nhad been a rash act to come here at all, and sheer folly to arrive together;\nthough it was true that they had come by different routes and only met on\nO\u2019Brien\u2019s doorstep. But merely to walk into such a place needed an effort of the\nnerve. It was only on very rare occasions that one saw inside the dwelling-\nplaces of the Inner Party, or even penetrated into the quarter of the town where\nthey lived. The whole atmosphere of the huge block of flats, the richness and\nspaciousness of everything, the unfamiliar smells of good food and good tobacco,\nthe silent and incredibly rapid lifts sliding up and down, the white-jacketed\nservants hurrying to and fro\u2014everything was intimidating. Although he had a good\npretext for coming here, he was haunted at every step by the fear that ablack-\nuniformed guard would suddenly appear from round the corner, demand his papers,\nand order him to get out. O\u2019Brien\u2019s servant, however, had admitted the two of\nthem without demur. He was a small, dark-haired man in a white jacket, with a\ndiamond-shaped, completely expressionless face which might have been that of a\nChinese. The passage down which he led them was softly carpeted, with\ncreampapered walls and white wainscoting, all exquisitely clean. That too was\nintimidating. Winston could not remember ever to have seen a passageway whose\nwalls were not grimy from the contact of human bodies.\n\nO\u2019Brien had a slip of paper between his fingers and seemed to be studying it\nintently. His heavy face, bent down so that one could see the line of the nose,\nlooked both formidable and intelligent. For perhaps twenty seconds he sat\nwithout stirring. Then he pulled the speakwrite towards him and rapped out a\nmessage in the hybrid jargon of the Ministries:\n\n\u2019Items one comma five comma seven approved fullwisestop suggestion contained item six doubleplus ridiculous\n\nverging crimethink cancel stop unproceed constructionwiseantegetting plusfull estimates machinery overheads stop end\n\nmessage.\u2019\n\nHe rose deliberately from his chair and came towards them across the soundless\ncarpet. A little of the official atmosphere seemed to have fallen away from him\nwith the Newspeak words, but his expression was grimmer thanusual, as though he\nwere not pleased at being disturbed. The terror that Winston already felt was\nsuddenly shot through by a streak of ordinary embarrassment. It seemed to him\nquite possible that he had simply made a stupid mistake. For what evidence had\nhe in reality that O\u2019Brien was any kind of political conspirator? Nothing but a\nflash of the eyes and a single equivocal remark: beyond that, only his own\nsecret imaginings, founded on a dream. He could not even fall back on the\npretence that he had come to borrow the dictionary, because in that case Julia\u2019s\npresence was impossible to explain. As O\u2019Brien passed the telescreen a thought\nseemed to strike him. He stopped, turned aside and pressed a switch on the wall.\nThere was a sharp snap. The voice had stopped.\n\nJulia uttered a tiny sound, a sort of squeak of surprise. Even in the midst of\nhis panic, Winston was too much taken aback to be able to hold his tongue.\n\n\u2018You can turn it off!\u2019 he said.\n\n\u2018Yes,\u2019 said O\u2019Brien, \u2018we can turn it off. We have that privilege.\u2019\n\nHe was opposite them now. His solid form towered over the pair of them, and the\nexpression on his face was still indecipherable. He was waiting, somewhat\nsternly, for Winston to speak, but about what? Even now it was quite conceivable\nthat he was simply a busy man wondering irritably why he had been interrupted.\nNobody spoke. After the stopping of the telescreen the room seemed deadly\nsilent. The seconds marched past, enormous. With difficulty Winston continued to\nkeep his eyes fixed on O\u2019Brien\u2019s. Thensuddenly the grim face broke down into\nwhat might have been the beginnings of a smile. With his characteristic gesture\nO\u2019Brien resettled his spectacles on his nose.\n\n\u2018Shall I say it, or will you?\u2019 he said.\n\n\u2018I will say it,\u2019 said Winston promptly. \u2018That thing is really turned off?\u2019\n\n\u2018Yes, everything is turned off. We are alone.\u2019\n\n\u2018We have come here because\u2014\u2014\u2019\n\nHe paused, realizing for the first time the vagueness of his own motives. Since\nhe did not in fact know what kind of help he expected from O\u2019Brien, it was not\neasy to say why he had come here. He went on, conscious that what he was saying\nmust sound both feeble and pretentious:\n\n\u2018We believe that there is some kind of conspiracy, some kind of secret\norganization working against the Party, and that you are involved in it. We want\nto join it and work for it. We are enemies of the Party. We disbelieve in the\nprinciples of Ingsoc. We are thought-criminals. We are also adulterers. I tell\nyou this because we want to put ourselves at your mercy. If you want us to\nincriminate ourselves in any other way, we are ready.\u2019\n\nHe stopped and glanced over his shoulder, with the feeling that the door had\nopened. Sure enough, the little yellow-faced servant had come in without\nknocking. Winston saw that he was carrying a tray with a decanter and glasses.\n\n\u2018Martin is one of us,\u2019 said O\u2019Brien impassively. \u2018Bring the drinks over here,\nMartin. Put them on the round table. Have we enough chairs? Then we may as well\nsit down and talk in comfort. Bring a chair for yourself, Martin. This\nisbusiness. You can stop being a servant for the next ten minutes.\u2019\n\nThe little man sat down, quite at his ease, and yet still with a servant-like\nair, the air of a valet enjoying a privilege. Winston regarded him out of the\ncorner of his eye. It struck him that the man\u2019s whole life was playing a part,\nand that he felt it to be dangerous to drop his assumed personality even for a\nmoment. O\u2019Brien took the decanter by the neck and filled up the glasses with a\ndark-red liquid. It aroused in Winston dim memories of something seen long ago\non a wall or a hoarding\u2014a vast bottle composed of electric lights which seemed\nto move up and down and pour its contents into a glass. Seen from the top the\nstuff looked almost black, but in the decanter it gleamed like a ruby. It had a\nsour-sweet smell. He saw Julia pick up her glass and sniff at it with frank\ncuriosity.\n\n\u2018It is called wine,\u2019 said O\u2019Brien with a faint smile. \u2018You will have read about\nit in books, no doubt. Not much of it gets to the Outer Party, I am afraid.\u2019 His\nface grew solemn again, and he raised his glass: \u2018I think it is fitting that we\nshould begin by drinking a health. To our Leader: To Emmanuel Goldstein.\u2019\n\nWinston took up his glass with a certain eagerness. Wine was a thing he had read\nand dreamed about. Like the glass paperweight or Mr Charrington\u2019s half-\nremembered rhymes, it belonged to the vanished, romantic past, the olden time as\nhe liked to call it in his secret thoughts. For some reason he had always\nthought of wine as having an intensely sweet taste, like that of blackberry jam\nand an immediate intoxicating effect. Actually, when he came to swallow it, the\nstuff was distinctly disappointing. The truth was that after years of gin-\ndrinking he could barely taste it. He set down the empty glass.\n\n\u2018Then there is such a person as Goldstein?\u2019 he said.\n\n\u2018Yes, there is such a person, and he is alive. Where, I do not know.\u2019\n\n\u2018And the conspiracy\u2014the organization? Is it real? It is not simply an invention\nof the Thought Police?\u2019\n\n\u2018No, it is real. The Brotherhood, we call it. You will never learn much more\nabout the Brotherhood than that it exists and that you belong to it. I will come\nback to that presently.\u2019 He looked at his wrist-watch. \u2018It is unwise even for\nmembers of the Inner Party to turn off the telescreen for more than half an\nhour. You ought not to have come here together, and you will have to leave\nseparately. You, comrade\u2019\u2014he bowed his head to Julia\u2014\u2019will leave first. We have\nabout twenty minutes at our disposal. You will understand that I must start by\nasking you certain questions. In general terms, what are you prepared to do?\u2019\n\n\u2018Anything that we are capable of,\u2019 said Winston.\n\nO\u2019Brien had turned himself a little in his chair so that he was facing Winston.\nHe almost ignored Julia, seeming to take it for granted that Winston could speak\nfor her. For a moment the lids flitted down over his eyes. He began asking his\nquestions in a low, expressionless voice, as though this were a routine, a sort\nof catechism, most of whose answers were known to him already.\n\n\u2018You are prepared to give your lives?\u2019\n\n\u2018Yes.\u2019\n\n\u2018You are prepared to commit murder?\u2019\n\n\u2018Yes.\u2019\n\n\u2018To commit acts of sabotage which may cause the death of hundreds of innocent\npeople?\u2019\n\n\u2018Yes.\u2019\n\n\u2018To betray your country to foreign powers?\u2019\n\n\u2018Yes.\u2019\n\n\u2018You are prepared to cheat, to forge, to blackmail, to corrupt the minds of\nchildren, to distribute habit-forming drugs, to encourage prostitution, to\ndisseminate venereal diseases\u2014to do anything which is likely to cause\ndemoralization and weaken the power of the Party?\u2019\n\n\u2018Yes.\u2019\n\n\u2018If, for example, it would somehow serve our interests to throw sulphuric acid\nin a child\u2019s face\u2014are you prepared to do that?\u2019\n\n\u2018Yes.\u2019\n\n\u2018You are prepared to lose your identity and live out the rest of your life as a\nwaiter or a dock-worker?\u2019\n\n\u2018Yes.\u2019\n\n\u2018You are prepared to commit suicide, if and when we order you to do so?\u2019\n\n\u2018Yes.\u2019\n\n\u2018You are prepared, the two of you, to separate and never see one another again?\u2019\n\n\u2018No!\u2019 broke in Julia.\n\nIt appeared to Winston that a long time passed before he answered. For a moment\nhe seemed even to have beendeprived of the power of speech. His tongue worked\nsoundlessly, forming the opening syllables first of one word, then of the other,\nover and over again. Until he had said it, he did not know which word he was\ngoing to say. \u2018No,\u2019 he said finally.\n\n\u2018You did well to tell me,\u2019 said O\u2019Brien. \u2018It is necessary for us to know\neverything.\u2019\n\nHe turned himself toward Julia and added in a voice with somewhat more\nexpression in it:\n\n\u2018Do you understand that even if he survives, it may be as a different person? We\nmay be obliged to give him a new identity. His face, his movements, the shape of\nhis hands, the colour of his hair\u2014even his voice would be different. And you\nyourself might have become a different person. Our surgeons can alter people\nbeyond recognition. Sometimes it is necessary. Sometimes we even amputate a\nlimb.\u2019\n\nWinston could not help snatching another sidelong glance at Martin\u2019s Mongolian\nface. There were no scars that he could see. Julia had turned a shade paler, so\nthat her freckles were showing, but she faced O\u2019Brien boldly. She murmured\nsomething that seemed to be assent.\n\n\u2018Good. Then that is settled.\u2019\n\nThere was a silver box of cigarettes on the table. With a rather absent-minded\nair O\u2019Brien pushed them towards the others, took one himself, then stood up and\nbegan to pace slowly to and fro, as though he could think better standing. They\nwere very good cigarettes, very thick and well-packed, with an unfamiliar\nsilkiness in the paper. O\u2019Brien looked at his wrist-watch again.\n\n\u2018You had better go back to your Pantry, Martin,\u2019 he said. \u2018I shall switch on in\na quarter of an hour. Take a good look at these comrades\u2019 faces before you go.\nYou will be seeing them again. I may not.\u2019\n\nExactly as they had done at the front door, the little man\u2019s dark eyes flickered\nover their faces. There was not a trace of friendliness in his manner. He was\nmemorizing their appearance, but he felt no interest in them, or appeared to\nfeel none. It occurred to Winston that a synthetic face was perhaps incapable of\nchanging its expression. Without speaking or giving any kind of salutation,\nMartin went out, closing the door silently behind him. O\u2019Brien was strolling up\nand down, one hand in the pocket of his black overalls, the other holding his\ncigarette.\n\n\u2018You understand,\u2019 he said, \u2018that you will be fighting in the dark. You will\nalways be in the dark. You will receive orders and you will obey them, without\nknowing why. Later I shall send you a book from which you will learn the true\nnature of the society we live in, and the strategy by which we shall destroy it.\nWhen you have read the book, you will be full members of the Brotherhood. But\nbetween the general aims that we are fighting for and the immedi ate tasks of\nthe moment, you will never know anything. I tell you that the Brotherhood\nexists, but I cannot tell you whether it numbers a hundred members, or ten\nmillion. From your personal knowledge you will never be able to say that it\nnumbers even as many as a dozen. You will have three or four contacts, who will\nbe renewed from time to time as they disappear. As this was your first contact,\nit will bepreserved. When you receive orders, they will come from me. If we find\nit necessary to communicate with you, it will be through Martin. When you are\nfinally caught, you will confess. That is unavoidable. But you will have very\nlittle to confess, other than your own actions. You will not be able to betray\nmore than a handful of unimportant people. Probably you will not even betray me.\nBy that time I may be dead, or I shall have become a different person, with a\ndifferent face.\u2019\n\nHe continued to move to and fro over the soft carpet. In spite of the bulkiness\nof his body there was a remarkable grace in his movements. It came out even in\nthe gesture with which he thrust a hand into his pocket, or manipulated a\ncigarette. More even than of strength, he gave an impression of confidence and\nof an understanding tinged by irony. However much in earnest he might be, he had\nnothing of the single-mindedness that belongs to a fanatic. When he spoke of\nmurder, suicide, venereal disease, amputated limbs, and altered faces, it was\nwith a faint air of persiflage. \u2018This is unavoidable,\u2019 his voice seemed to say;\n\u2018this is what we have got to do, unflinchingly. But this is not what we shall be\ndoing when life is worth living again.\u2019 A wave of admiration, almost of worship,\nflowed out from Winston towards O\u2019Brien. For the moment he had forgotten the\nshadowy figure of Goldstein. When you looked at O\u2019Brien\u2019s powerful shoulders and\nhis blunt-featured face, so ugly and yet so civilized, it was impossible to\nbelieve that he could be defeated. There was no stratagem that he was not equal\nto, no danger that he could not foresee. Even Juliaseemed to be impressed. She\nhad let her cigarette go out and was listening intently. O\u2019Brien went on:\n\n\u2018You will have heard rumours of the existence of the Brotherhood. No doubt you\nhave formed your own picture of it. You have imagined, probably, a huge\nunderworld of conspirators, meeting secretly in cellars, scribbling messages on\nwalls, recognizing one another by codewords or by special movements of the hand.\nNothing of the kind exists. The members of the Brotherhood have no way of\nrecognizing one another, and it is impossible for any one member to be aware of\nthe identity of more than a few others. Goldstein himself, if he fell into the\nhands of the Thought Police, could not give them a complete list of members, or\nany information that would lead them to a complete list. No such list exists.\nThe Brotherhood cannot be wiped out because it is not an organization in the\nordinary sense. Nothing holds it together except an idea which is\nindestructible. You will never have anything to sustain you, except the idea.\nYou will get no comradeship and no encouragement. When finally you are caught,\nyou will get no help. We never help our members. At most, when it is absolutely\nnecessary that someone should be silenced, we are occasionally able to smuggle a\nrazor blade into a prisoner\u2019s cell. You will have to get used to living without\nresults and without hope. You will work for a while, you will be caught, you\nwill confess, and then you will die. Those are the only results that you will\never see. There is no possibility that any perceptible change will happen within\nour own lifetime. We are the dead. Our only true life is in the future. We shall\ntake partin it as handfuls of dust and splinters of bone. But how far away that\nfuture may be, there is no knowing. It might be a thousand years. At present\nnothing is possible except to extend the area of sanity little by little. We\ncannot act collectively. We can only spread our knowledge outwards from\nindividual to individual, generation after generation. In the face of the\nThought Police there is no other way.\u2019\n\nHe halted and looked for the third time at his wristwatch.\n\n\u2018It is almost time for you to leave, comrade,\u2019 he said to Julia. \u2018Wait. The\ndecanter is still half full.\u2019\n\nHe filled the glasses and raised his own glass by the stem.\n\n\u2018What shall it be this time?\u2019 he said, still with the same faint suggestion of\nirony. \u2018To the confusion of the Thought Police? To the death of Big Brother? To\nhumanity? To the future?\u2019\n\n\u2018To the past,\u2019 said Winston.\n\n\u2018The past is more important,\u2019 agreed O\u2019Brien gravely.\n\nThey emptied their glasses, and a moment later Julia stood up to go. O\u2019Brien\ntook a small box from the top of a cabinet and handed her a flat white tablet\nwhich he told her to place on her tongue. It was important, he said, not to go\nout smelling of wine: the lift attendants were very observant. As soon as the\ndoor had shut behind her he appeared to forget her existence. He took another\npace or two up and down, then stopped.\n\n\u2018There are details to be settled,\u2019 he said. \u2018I assume that you have a hiding-\nplace of some kind?\u2019\n\nWinston explained about the room over Mr Charrington\u2019s shop.\n\n\u2018That will do for the moment. Later we will arrange something else for you. It\nis important to change one\u2019s hiding-place frequently. Meanwhile I shall send you\na copy of THE BOOK\u2019\u2014even O\u2019Brien, Winston noticed, seemed to pronounce the words\nas though they were in italics\u2014\u2019Goldstein\u2019s book, you understand, as soon as\npossible. It may be some days before I can get hold of one. There are not many\nin existence, as you can imagine. The Thought Police hunt them down and destroy\nthem almost as fast as we can produce them. It makes very little difference. The\nbook is indestructible. If the last copy were gone, we could reproduce it almost\nword for word. Do you carry a brief-case to work with you?\u2019 he added.\n\n\u2018As a rule, yes.\u2019\n\n\u2018What is it like?\u2019\n\n\u2018Black, very shabby. With two straps.\u2019\n\n\u2018Black, two straps, very shabby\u2014good. One day in the fairly near future\u2014I cannot\ngive a date\u2014one of the messages among your morning\u2019s work will contain a\nmisprinted word, and you will have to ask for a repeat. On the following day you\nwill go to work without your brief-case. At some time during the day, in the\nstreet, a man will touch you on the arm and say \u2018I think you have dropped your\nbrief-case.\u2019 The one he gives you will contain a copy of Goldstein\u2019s book. You\nwill return it within fourteen days.\u2019\n\nThey were silent for a moment.\n\n\u2018There are a couple of minutes before you need go,\u2019 said\n\nO\u2019Brien. \u2018We shall meet again\u2014if we do meet again\u2014\u2014\u2019\n\nWinston looked up at him. \u2018In the place where there is no darkness?\u2019 he said\nhesitantly.\n\nO\u2019Brien nodded without appearance of surprise. \u2018In the place where there is no\ndarkness,\u2019 he said, as though he had recognized the allusion. \u2018And in the\nmeantime, is there anything that you wish to say before you leave? Any message?\nAny question?.\u2019\n\nWinston thought. There did not seem to be any further question that he wanted to\nask: still less did he feel any impulse to utter high-sounding generalities.\nInstead of anything directly connected with O\u2019Brien or the Brotherhood, there\ncame into his mind a sort of composite picture of the dark bedroom where his\nmother had spent her last days, and the little room over Mr Charrington\u2019s shop,\nand the glass paperweight, and the steel engraving in its rosewood frame. Almost\nat random he said:\n\n\u2018Did you ever happen to hear an old rhyme that begins \u2018Oranges and lemons, say\nthe bells of St Clement\u2019s\u2019?\u2019\n\nAgain O\u2019Brien nodded. With a sort of grave courtesy he completed the stanza:\n\n\u2019Oranges and lemons, say the bells of St Clement\u2019s,\n\nYou owe me three farthings, say the bells of St Martin\u2019s,\n\nWhen will you pay me? say the bells of Old Bailey,\n\nWhen I grow rich, say the bells of Shoreditch.\u2019\n\n\u2018You knew the last line!\u2019 said Winston.\n\n\u2018Yes, I knew the last line. And now, I am afraid, it is timefor you to go. But wait. You had better let me give you one of these tablets.\u2019\n\nAs Winston stood up O\u2019Brien held out a hand. His powerful grip crushed the bones\nof Winston\u2019s palm. At the door Winston looked back, but O\u2019Brien seemed already\nto be in process of putting him out of mind. He was waiting with his hand on the\nswitch that controlled the telescreen. Beyond him Winston could see the writing-\ntable with its green-shaded lamp and the speakwrite and the wire baskets deep-\nladen with papers. The incident was closed. Within thirty seconds, it occurred\nto him, O\u2019Brien would be back at his interrupted and important work on behalf of\nthe Party.\n\nChapter 9\n\nW       inston was gelatinous with fatigue. Gelatinous wasthe right word. It had\ncome into his head spontaneously. His body seemed to have not only the weakness\nof a jelly, but its translucency. He felt that if he held up his hand he would\nbe able to see the light through it. All the blood and lymph had been drained\nout of him by an enormous debauch of work, leaving only a frail structure of\nnerves, bones, and skin. All sensations seemed to be magnified. His overalls\nfretted his shoulders, the pavement tickled his feet, even the opening and\nclosing of a hand was an effort that made his joints creak.\n\nHe had worked more than ninety hours in five days. So had everyone else in the\nMinistry. Now it was all over, and he had literally nothing to do, no Party work\nof any description, until tomorrow morning. He could spend six hours in the\nhiding-place and another nine in his own bed. Slowly, in mild afternoon\nsunshine, he walked up a dingy street in the direction of Mr Charrington\u2019s shop,\nkeeping one eye open for the patrols, but irrationally convinced that this\nafternoon there was no danger of anyone interfering with him. The heavy brief-\ncase that he was carrying bumped against his knee at each step, sending a\ntingling sensation up and down the skin of his leg. Inside it was the book,\nwhich he had now had in his possession for six days and had not yetopened, nor\neven looked at.\n\nOn the sixth day of Hate Week, after the processions, the speeches, the\nshouting, the singing, the banners, the posters, the films, the waxworks, the\nrolling of drums and squealing of trumpets, the tramp of marching feet, the\ngrinding of the caterpillars of tanks, the roar of massed planes, the booming of\nguns\u2014after six days of this, when the great orgasm was quivering to its climax\nand the general hatred of Eurasia had boiled up into such delirium that if the\ncrowd could have got their hands on the 2,000 Eurasian war-criminals who were to\nbe publicly hanged on the last day of the proceedings, they would unquestionably\nhave torn them to pieces\u2014at just this moment it had been announced that Oceania\nwas not after all at war with Eurasia. Oceania was at war with Eastasia. Eurasia\nwas an ally.\n\nThere was, of course, no admission that any change had taken place. Merely it\nbecame known, with extreme suddenness and everywhere at once, that Eastasia and\nnot Eurasia was the enemy. Winston was taking part in a demonstration in one of\nthe central London squares at the moment when it happened. It was night, and the\nwhite faces and the scarlet banners were luridly floodlit. The square was packed\nwith several thousand people, including a block of about a thousand\nschoolchildren in the uniform of the Spies. On a scarlet-draped platform an\norator of the Inner Party, a small lean man with disproportionately long arms\nand a large bald skull over which a few lank locks straggled, was haranguing the\ncrowd. A little Rumpelstiltskin figure, contorted with hatred, he gripped the\nneck of themicrophone with one hand while the other, enormous at the end of a\nbony arm, clawed the air menacingly above his head. His voice, made metallic by\nthe amplifiers, boomed forth an endless catalogue of atrocities, massacres,\ndeportations, lootings, rapings, torture of prisoners, bombing of civilians,\nlying propaganda, unjust aggressions, broken treaties. It was almost impossible\nto listen to him without being first convinced and then maddened. At every few\nmoments the fury of the crowd boiled over and the voice of the speaker was\ndrowned by a wild beast-like roaring that rose uncontrollably from thousands of\nthroats. The most savage yells of all came from the schoolchildren. The speech\nhad been proceeding for perhaps twenty minutes when a messenger hurried on to\nthe platform and a scrap of paper was slipped into the speaker\u2019s hand. He\nunrolled and read it without pausing in his speech. Nothing altered in his voice\nor manner, or in the content of what he was saying, but suddenly the names were\ndifferent. Without words said, a wave of understanding rippled through the\ncrowd. Oceania was at war with Eastasia! The next moment there was a tremendous\ncommotion. The banners and posters with which the square was decorated were all\nwrong! Quite half of them had the wrong faces on them. It was sabotage! The\nagents of Goldstein had been at work! There was a riotous interlude while\nposters were ripped from the walls, banners torn to shreds and trampled\nunderfoot. The Spies performed prodigies of activity in clambering over the\nrooftops and cutting the streamers that fluttered from the chimneys. But within\ntwo or three minutes it was all over. The orator, still gripping\n\nthe neck of the microphone, his shoulders hunched forward, his free hand clawing\nat the air, had gone straight on with his speech. One minute more, and the feral\nroars of rage were again bursting from the crowd. The Hate continued exactly as\nbefore, except that the target had been changed.\n\nThe thing that impressed Winston in looking back was that the speaker had\nswitched from one line to the other actually in midsentence, not only without a\npause, but without even breaking the syntax. But at the moment he had other\nthings to preoccupy him. It was during the moment of disorder while the posters\nwere being torn down that a man whose face he did not see had tapped him on the\nshoulder and said, \u2018Excuse me, I think you\u2019ve dropped your briefcase.\u2019 He took\nthe brief-case abstractedly, without speaking. He knew that it would be days\nbefore he had an opportunity to look inside it. The instant that the\ndemonstration was over he went straight to the Ministry of Truth, though the\ntime was now nearly twenty-three hours. The entire staff of the Ministry had\ndone likewise. The orders already issuing from the telescreen, recalling them to\ntheir posts, were hardly necessary.\n\nOceania was at war with Eastasia: Oceania had always been at war with Eastasia.\nA large part of the political literature of five years was now completely\nobsolete. Reports and records of all kinds, newspapers, books, pamphlets, films,\nsound-tracks, photographs\u2014all had to be rectified at lightning speed. Although\nno directive was ever issued, it was known that the chiefs of the Department\nintended that within one week no reference to the war with Eurasia,\n\nor the alliance with Eastasia, should remain in existence anywhere. The work was\noverwhelming, all the more so because the processes that it involved could not\nbe called by their true names. Everyone in the Records Department worked\neighteen hours in the twenty-four, with two threehour snatches of sleep.\nMattresses were brought up from the cellars and pitched all over the corridors:\nmeals consisted of sandwiches and Victory Coffee wheeled round on trolleys by\nattendants from the canteen. Each time that Winston broke off for one of his\nspells of sleep he tried to leave his desk clear of work, and each time that he\ncrawled back sticky-eyed and aching, it was to find that another shower of paper\ncylinders had covered the desk like a snowdrift, halfburying the speakwrite and\noverflowing on to the floor, so that the first job was always to stack them into\na neat enough pile to give him room to work. What was worst of all was that the\nwork was by no means purely mechanical. Often it was enough merely to substitute\none name for another, but any detailed report of events demanded care and\nimagination. Even the geographical knowledge that one needed in transferring the\nwar from one part of the world to another was considerable.\n\nBy the third day his eyes ached unbearably and his spectacles needed wiping\nevery few minutes. It was like struggling with some crushing physical task,\nsomething which one had the right to refuse and which one was nevertheless\nneurotically anxious to accomplish. In so far as he had time to remember it, he\nwas not troubled by the fact that every word he murmured into the speakwrite,\nevery strokeof his ink-pencil, was a deliberate lie. He was as anxious as anyone\nelse in the Department that the forgery should be perfect. On the morning of the\nsixth day the dribble of cylinders slowed down. For as much as half an hour\nnothing came out of the tube; then one more cylinder, then nothing. Everywhere\nat about the same time the work was easing off. A deep and as it were secret\nsigh went through the Department. A mighty deed, which could never be mentioned,\nhad been achieved. It was now impossible for any human being to prove by\ndocumentary evidence that the war with Eurasia had ever happened. At twelve\nhundred it was unexpectedly announced that all workers in the Ministry were free\ntill tomorrow morning. Winston, still carrying the brief-case containing the\nbook, which had remained between his feet while he worked and under his body\nwhile he slept, went home, shaved himself, and almost fell asleep in his bath,\nalthough the water was barely more than tepid.\n\nWith a sort of voluptuous creaking in his joints he climbed the stair above Mr\nCharrington\u2019s shop. He was tired, but not sleepy any longer. He opened the\nwindow, lit the dirty little oilstove and put on a pan of water for coffee.\nJulia would arrive presently: meanwhile there was the book. He sat down in the\nsluttish armchair and undid the straps of the brief-case.\n\nA heavy black volume, amateurishly bound, with no name or title on the cover.\nThe print also looked slightly irregular. The pages were worn at the edges, and\nfell apart, easily, as though the book had passed through many hands. The\ninscription on the title-page ran:\n\nTHE THEORY AND PRACTICE OF\n\nOLIGARCHICAL COLLECTIVISMby\n\nEmmanuel Goldstein\n\nWinston began reading:\n\nChapter I\n\nIgnorance is Strength\n\nThroughout recorded time, and probably since the end of the Neolithic Age, there\nhave been three kinds of people in the world, the High, the Middle, and the Low.\nThey have been subdivided in many ways, they have borne countless different\nnames, and their relative numbers, as well as their attitude towards one\nanother, have varied from age to age: but the essential structure of society has\nnever altered. Even after enormous upheavals and seemingly irrevocable changes,\nthe same pattern has always reasserted itself, just as a gyroscope will always\nreturn to equilibrium, however far it is pushed one way or the other.\n\nThe aims of these groups are entirely irreconcilable...\n\nWinston stopped reading, chiefly in order to appreciate the fact that he was\nreading, in comfort and safety. He was alone: no telescreen, no ear at the\nkeyhole, no nervous impulse to glance over his shoulder or cover the page with\nhis hand. The sweet summer air played against his cheek. From somewhere far away\nthere floated the faint shouts of children: in the room itself there was no\nsound except the insect voice of the clock. He settled deeper into the arm-chair\nand put his feet up on the fender. It was bliss, it was etemity. Suddenly, as\none sometimes does with a book of which one knows that one will ultimately read\nand re-read every word, he opened it at a different place and found himself at\nChapter III. He went on reading:\n\nChapter III\n\nWar is Peace\n\nThe splitting up of the world into three great super-states was an event which\ncould be and indeed was foreseen before the middle of the twentieth century.\nWith the absorption of Europe by Russia and of the British Empire by the United\nStates, two of the three existing powers, Eurasia and Oceania, were already\neffectively in being. The third, Eastasia, only emerged as a distinct unit after\nanother decade of confused fighting. The frontiers between the three super-\nstates are in some places arbitrary, and in others they fluctuate according to\nthe fortunes of war, but in general they follow geographical lines. Eurasia\ncomprises the whole of the northern part of the European and Asiatic land-mass,\nfrom Portugal to the Bering Strait. Oceania comprises the Americas, the Atlantic\nislands including the British Isles, Australasia, and the southern portion of\nAfrica. Eastasia, smaller than the others and with a less definite western\nfrontier, comprises China and the countries to the south ofit, the Japanese\nislands and a large but fluctuating portion of Manchuria, Mongolia, and Tibet.\n\nIn one combination or another, these three super-states are permanently at war,\nand have been so for the past twenty-five years. War, however, is no longer the\ndesperate, annihilating struggle that it was in the early decades of the\ntwentieth century. It is a warfare of limited aims between combatants who are\nunable to destroy one another, have no material cause for fighting and are not\ndivided by any genuine ideological difference This is not to say that either the\nconduct of war, or the prevailing attitude towards it, has become less\nbloodthirsty or more chivalrous. On the contrary, war hysteria is continuous and\nuniversal in all countries, and such acts as raping, looting, the slaughter of\nchildren, the reduction of whole populations to slavery, and reprisals against\nprisoners which extend even to boiling and burying alive, are looked upon as\nnormal, and, when they are committed by one\u2019s own side and not by the enemy,\nmeritorious. But in a physical sense war involves very small numbers of people,\nmostly highly-trained specialists, and causes comparatively few casualties. The\nfighting, when there is any, takes place on the vague frontiers whose\nwhereabouts the average man can only guess at, or round the Floating Fortresses\nwhich guard strategic spots on the sea lanes. In the centres of civilization war\nmeans no more than a continuous shortage of consumption goods, and the\noccasional crash of a rocket bomb which may cause a few scores of deaths. War\nhas in fact changed its character. More exactly, the reasons for which war is\nwaged have changed in theirorder of importance. Motives which were already\npresent to some small extent in the great wars of the early twentieth centuury\nhave now become dominant and are consciously recognized and acted upon.\n\nTo understand the nature of the present war\u2014for in spite of the regrouping which\noccurs every few years, it is always the same war\u2014one must realize in the first\nplace that it is impossible for it to be decisive. None of the three super-\nstates could be definitively conquered even by the other two in combination.\nThey are too evenly matched, and their natural defences are too formidable.\nEurasia is protected by its vast land spaces, Oceania by the width of the\nAtlantic and the Pacific, Eastasia by the fecundity and indus triousness of its\ninhabitants. Secondly, there is no longer, in a material sense, anything to\nfight about. With the establishment of self-contained economies, in which\nproduction and consumption are geared to one another, the scramble for markets\nwhich was a main cause of previous wars has come to an end, while the\ncompetition for raw materials is no longer a matter of life and death. In any\ncase each of the three super-states is so vast that it can obtain almost all the\nmaterials that it needs within its own boundaries. In so far as the war has a\ndirect economic purpose, it is a war for labour power. Between the frontiers of\nthe super-states, and not permanently in the possession of any of them, there\nlies a rough quadrilateral with its corners at Tangier, Brazzaville, Darwin, and\nHong Kong, containing within it about a fifth of the population of the earth. It\nis for the possession of these thickly-populated regions, and of the\nnorthernice-cap, that the three powers are constantly struggling. In practice no\none power ever controls the whole of the disputed area. Portions of it are\nconstantly changing hands, and it is the chance of seizing this or that fragment\nby a sudden stroke of treachery that dictates the endless changes of alignment.\n\nAll of the disputed territories contain valuable minerals, and some of them\nyield important vegetable products such as rubber which in colder climates it is\nnecessary to synthesize by comparatively expensive methods. But above all they\ncontain a bottomless reserve of cheap labour. Whichever power controls\nequatorial Africa, or the countries of the Middle East, or Southern India, or\nthe Indonesian Archipelago, disposes also of the bodies of scores or hundreds of\nmillions of ill-paid and hard-working coolies. The inhabitants of these areas,\nreduced more or less openly to the status of slaves, pass continually from\nconqueror to conqueror, and are expended like so much coal or oil in the race to\nturn out more armaments, to capture more territory, to control more labour\npower, to turn out more armaments, to capture more territory, and so on\nindefinitely. It should be noted that the fighting never really moves beyond the\nedges of the disputed areas. The frontiers of Eurasia flow back and forth\nbetween the basin of the Congo and the northern shore of the Mediterranean; the\nislands of the Indian Ocean and the Pacific are constantly being captured and\nrecaptured by Oceania or by Eastasia; in Mongolia the dividing line between\nEurasia and Eastasia is never stable; round the Pole all three powers lay claim\nto enormous territories which in fact are largely unihabited and unexplored: but\nthe balance of power always remains roughly even, and the territory which forms\nthe heartland of each super-state always remains inviolate. Moreover, the labour\nof the exploited peoples round the Equator is not really necessary to the\nworld\u2019s economy. They add nothing to the wealth of the world, since whatever\nthey produce is used for purposes of war, and the object of waging a war is\nalways to be in a better position in which to wage another war. By their labour\nthe slave populations allow the tempo of continuous warfare to be speeded up.\nBut if they did not exist, the structure of world society, and the process by\nwhich it maintains itself, would not be essentially different.\n\nThe primary aim of modern warfare (in accordance with the principles of\nDOUBLETHINK, this aim is simultaneously recognized and not recognized by the\ndirecting brains of the Inner Party) is to use up the products of the machine\nwithout raising the general standard of living. Ever since the end of the\nnineteenth century, the problem of what to do with the surplus of consumption\ngoods has been latent in industrial society. At present, when few human beings\neven have enough to eat, this problem is obviously not urgent, and it might not\nhave become so, even if no artificial processes of destruction had been at work.\nThe world of today is a bare, hungry, dilapidated place compared with the world\nthat existed before 1914, and still more so if compared with the imaginary\nfuture to which the people of that period looked forward. In the early twentieth\ncentury, the vision of a future society unbelievably rich, leisured, orderly,\n\nand efficient\u2014a glittering antiseptic world of glass and steel and snow-white\nconcrete\u2014was part of the consciousness of nearly every literate person. Science\nand technology were developing at a prodigious speed, and it seemed natural to\nassume that they would go on developing. This failed to happen, partly because\nof the impoverishment caused by a long series of wars and revolutions, partly\nbecause scientific and technical progress depended on the empirical habit of\nthought, which could not survive in a strictly regimented society. As a whole\nthe world is more primitive today than it was fifty years ago. Certain backward\nareas have advanced, and various devices, always in some way connected with\nwarfare and police espionage, have been developed, but experiment and invention\nhave largely stopped, and the ravages of the atomic war of the nineteen-fifties\nhave never been fully repaired. Nevertheless the dangers inherent in the machine\nare still there. From the moment when the machine first made its appearance it\nwas clear to all thinking people that the need for human drudgery, and therefore\nto a great extent for human inequality, had disappeared. If the machine were\nused deliberately for that end, hunger, overwork, dirt, illiteracy, and disease\ncould be eliminated within a few generations. And in fact, without being used\nfor any such purpose, but by a sort of automatic process\u2014 by producing wealth\nwhich it was sometimes impossible not to distribute\u2014the machine did raise the\nliving standards of the average humand being very greatly over a period of about\nfifty years at the end of the nineteenth and the beginning of the twentieth\ncenturies.\n\nBut it was also clear that an all-round increase in wealth threatened the\ndestruction\u2014indeed, in some sense was the destruction\u2014of a hierarchical society.\nIn a world in which everyone worked short hours, had enough to eat, lived in a\nhouse with a bathroom and a refrigerator, and possessed a motor-car or even an\naeroplane, the most obvious and perhaps the most important form of inequality\nwould already have disappeared. If it once became general, wealth would confer\nno distinction. It was possible, no doubt, to imagine a society in which WEALTH,\nin the sense of personal possessions and luxuries, should be evenly distributed,\nwhile POWER remained in the hands of a small privileged caste. But in practice\nsuch a society could not long remain stable. For if leisure and security were\nenjoyed by all alike, the great mass of human beings who are normally stupefied\nby poverty would become literate and would learn to think for themselves; and\nwhen once they had done this, they would sooner or later realize that the\nprivileged minority had no function, and they would sweep it away. In the long\nrun, a hierarchical society was only possible on a basis of poverty and\nignorance. To return to the agricultural past, as some thinkers about the\nbeginning of the twentieth century dreamed of doing, was not a practicable\nsolution. It conflicted with the tendency towards mechanization which had become\nquasi-instinctive throughout almost the whole world, and moreover, any country\nwhich remained industrially backward was helpless in a military sense and was\nbound to be dominated, directly or indirectly, by its more advanced rivals.\n\nNor was it a satisfactory solution to keep the masses in poverty by restricting\nthe output of goods. This happened to a great extent during the final phase of\ncapitalism, roughly between 1920 and 1940. The economy of many countries was\nallowed to stagnate, land went out of cultivation, capital equipment was not\nadded to, great blocks of the population were prevented from working and kept\nhalf alive by State charity. But this, too, entailed military weakness, and\nsince the privations it inflicted were obviously unnecessary, it made opposition\ninevitable. The problem was how to keep the wheels of industry turning without\nincreasing the real wealth of the world. Goods must be produced, but they must\nnot be distributed. And in practice the only way of achieving this was by\ncontinuous warfare.\n\nThe essential act of war is destruction, not necessarily of human lives, but of\nthe products of human labour. War is a way of shattering to pieces, or pouring\ninto the stratosphere, or sinking in the depths of the sea, materials which\nmight otherwise be used to make the masses too comfortable, and hence, in the\nlong run, too intelligent. Even when weapons of war are not actually destroyed,\ntheir manufacture is still a convenient way of expending labour power without\nproducing anything that can be consumed. A Floating Fortress, for example, has\nlocked up in it the labour that would build several hundred cargo-ships.\nUltimately it is scrapped as obsolete, never having brought any material benefit\nto anybody, and with further enormous labours another Floating Fortress is\nbuilt. In principle the war effort is always so planned as to eat up any surplus\nthat might exist after meeting the bare needs of the population. In practice the\nneeds of the population are always underestimated, with the result that there is\na chronic shortage of half the necessities of life; but this is looked on as an\nadvantage. It is deliberate policy to keep even the favoured groups somewhere\nnear the brink of hardship, because a general state of scarcity increases the\nimportance of small privileges and thus magnifies the distinction between one\ngroup and another. By the standards of the early twentieth century, even a\nmember of the Inner Party lives an austere, laborious kind of life.\nNevertheless, the few luxuries that he does enjoy his large, well-appointed\nflat, the better texture of his clothes, the better quality of his food and\ndrink and tobacco, his two or three servants, his private motor-car or\nhelicopter\u2014set him in a different world from a member of the Outer Party, and\nthe members of the Outer Party have a similar advantage in comparison with the\nsubmerged masses whom we call \u2018the proles\u2019. The social atmosphere is that of a\nbesieged city, where the possession of a lump of horseflesh makes the difference\nbetween wealth and poverty. And at the same time the consciousness of being at\nwar, and therefore in danger, makes the handing- over of all power to a small\ncaste seem the natural, unavoidable condition of survival.\n\nWar, it will be seen, accomplishes the necessary destruction, but accomplishes\nit in a psychologically acceptable way. In principle it would be quite simple to\nwaste the surplus labour of the world by building temples and pyramids, by\ndigging holes and filling them up again, or even by producing vast quantities of\ngoods and then setting fire to them.\n\nBut this would provide only the economic and not the emotional basis for a\nhierarchical society. What is concerned here is not the morale of masses, whose\nattitude is unimportant so long as they are kept steadily at work, but the\nmorale of the Party itself. Even the humblest Party member is expected to be\ncompetent, industrious, and even intelligent within narrow limits, but it is\nalso necessary that he should be a credulous and ignorant fanatic whose\nprevailing moods are fear, hatred, adulation, and orgiastic triumph. In other\nwords it is necessary that he should have the mentality appropriate to a state\nof war. It does not matter whether the war is actually happening, and, since no\ndecisive victory is possible, it does not matter whether the war is going well\nor badly. All that is needed is that a state of war should exist. The splitting\nof the intelligence which the Party requires of its members, and which is more\neasily achieved in an atmosphere of war, is now almost universal, but the higher\nup the ranks one goes, the more marked it becomes. It is precisely in the Inner\nParty that war hysteria and hatred of the enemy are strongest. In his capacity\nas an administrator, it is often necessary for a member of the Inner Party to\nknow that this or that item of war news is untruthful, and he may often be aware\nthat the entire war is spurious and is either not happening or is being waged\nfor purposes quite other than the declared ones: but such knowledge is easily\nneutralized by the technique of DOUBLETHINK. Meanwhile no Inner Party member\nwavers for an instant in his mystical belief that the war is real, and that it\nis bound to end victoriously, with Oceania the undisputed master ofthe entire\nworld.\n\nAll members of the Inner Party believe in this coming conquest as an article of\nfaith. It is to be achieved either by gradually acquiring more and more\nterritory and so building up an overwhelming preponderance of power, or by the\ndiscovery of some new and unanswerable weapon. The search for new weapons\ncontinues unceasingly, and is one of the very few remaining activities in which\nthe inventive or speculative type of mind can find any outlet. In Oceania at the\npresent day, Science, in the old sense, has almost ceased to exist. In Newspeak\nthere is no word for \u2018Science\u2019. The empirical method of thought, on which all\nthe scientific achievements of the past were founded, is opposed to the most\nfundamental principles of Ingsoc. And even technological progress only happens\nwhen its products can in some way be used for the diminution of human liberty.\nIn all the useful arts the world is either standing still or going backwards.\nThe fields are cultivated with horse-ploughs while books are written by\nmachinery. But in matters of vital importance\u2014meaning, in effect, war and police\nespionage\u2014the empirical approach is still encouraged, or at least tolerated. The\ntwo aims of the Party are to conquer the whole surface of the earth and to\nextinguish once and for all the possibility of independent thought. There are\ntherefore two great problems which the Party is concerned to solve. One is how\nto discover, against his will, what another human being is thinking, and the\nother is how to kill several hundred million people in a few seconds without\ngiving warning beforehand. In so far as scientific research still continues,\nthisis its subject matter. The scientist of today is either a mixture of\npsychologist and inquisitor, studying with real ordinary minuteness the meaning\nof facial expressions, gestures, and tones of voice, and testing the truth-\nproducing effects of drugs, shock therapy, hypnosis, and physical torture; or he\nis chemist, physicist, or biologist concerned only with such branches of his\nspecial subject as are relevant to the taking of life. In the vast laboratories\nof the Ministry of Peace, and in the experimental stations hidden in the\nBrazilian forests, or in the Australian desert, or on lost islands of the\nAntarctic, the teams of experts are indefatigably at work. Some are concerned\nsimply with planning the logistics of future wars; others devise larger and\nlarger rocket bombs, more and more powerful explosives, and more and more\nimpenetrable armour-plating; others search for new and deadlier gases, or for\nsoluble poisons capable of being produced in such quantities as to destroy the\nvegetation of whole continents, or for breeds of disease germs immunized against\nall possible antibodies; others strive to produce a vehicle that shall bore its\nway under the soil like a submarine under the water, or an aeroplane as\nindependent of its base as a sailing-ship; others explore even remoter\npossibilities such as focusing the sun\u2019s rays through lenses suspended thousands\nof kilometres away in space, or producing artificial earthquakes and tidal waves\nby tapping the heat at the earth\u2019s centre.\n\nBut none of these projects ever comes anywhere near realization, and none of the\nthree super-states ever gains a significant lead on the others. What is more\nremarkable isthat all three powers already possess, in the atomic bomb, a weapon\nfar more powerful than any that their present researches are likely to discover.\nAlthough the Party, according to its habit, claims the invention for itself,\natomic bombs first appeared as early as the nineteen-forties, and were first\nused on a large scale about ten years later. At that time some hundreds of bombs\nwere dropped on industrial centres, chiefly in European Russia, Western Europe,\nand North America. The effect was to convince the ruling groups of all countries\nthat a few more atomic bombs would mean the end of organized society, and hence\nof their own power. Thereafter, although no formal agreement was ever made or\nhinted at, no more bombs were dropped. All three powers merely continue to\nproduce atomic bombs and store them up against the decisive opportunity which\nthey all believe will come sooner or later. And meanwhile the art of war has\nremained almost stationary for thirty or forty years. Helicopters are more used\nthan they were formerly, bombing planes have been largely superseded by self-\npropelled projectiles, and the fragile movable battleship has given way to the\nalmost unsinkable Floating Fortress; but otherwise there has been little\ndevelopment. The tank, the submarine, the torpedo, the machine gun, even the\nrifle and the hand grenade are still in use. And in spite of the endless\nslaughters reported in the Press and on the telescreens, the desperate battles\nof earlier wars, in which hundreds of thousands or even millions of men were\noften killed in a few weeks, have never been repeated.\n\nNone of the three super-states ever attempts any manoeuvre which involves the\nrisk of serious defeat. When any large operation is undertaken, it is usually a\nsurprise attack against an ally. The strategy that all three powers are\nfollowing, or pretend to themselves that they are following, is the same. The\nplan is, by a combination of fighting, bargaining, and well-timed strokes of\ntreachery, to acquire a ring of bases completely encircling one or other of the\nrival states, and then to sign a pact of friendship with that rival and remain\non peaceful terms for so many years as to lull suspicion to sleep. During this\ntime rockets loaded with atomic bombs can be assembled at all the strategic\nspots; finally they will all be fired simultaneously, with effects so\ndevastating as to make retaliation impossible. It will then be time to sign a\npact of friendship with the remaining worldpower, in preparation for another\nattack. This scheme, it is hardly necessary to say, is a mere daydream,\nimpossible of realization. Moreover, no fighting ever occurs except in the\ndisputed areas round the Equator and the Pole: no invasion of enemy territory is\never undertaken. This explains the fact that in some places the frontiers\nbetween the superstates are arbitrary. Eurasia, for example, could easily\nconquer the British Isles, which are geographically part of Europe, or on the\nother hand it would be possible for Oceania to push its frontiers to the Rhine\nor even to the Vistula. But this would violate the principle, followed on all\nsides though never formulated, of cultural integrity. If Oceania were to conquer\nthe areas that used once to be known as France and Germany, it would be\nnecessary either to exterminate the inhabitants, a task of great physical\ndifficulty, or to assimil\n\nate a population of about a hundred million people, who, so far as technical\ndevelopment goes, are roughly on the Oceanic level. The problem is the same for\nall three superstates. It is absolutely necessary to their structure that there\nshould be no contact with foreigners, except, to a limited extent, with war\nprisoners and coloured slaves. Even the official ally of the moment is always\nregarded with the darkest suspicion. War prisoners apart, the average citizen of\nOceania never sets eyes on a citizen of either Eurasia or Eastasia, and he is\nforbidden the knowledge of foreign languages. If he were allowed contact with\nforeigners he would discover that they are creatures similar to himself and that\nmost of what he has been told about them is lies. The sealed world in which he\nlives would be broken, and the fear, hatred, and self-righteousness on which his\nmorale depends might evaporate. It is therefore realized on all sides that\nhowever often Persia, or Egypt, or Java, or Ceylon may change hands, the main\nfrontiers must never be crossed by anything except bombs.\n\nUnder this lies a fact never mentioned aloud, but tacitly understood and acted\nupon: namely, that the conditions of life in all three super-states are very\nmuch the same. In Oceania the prevailing philosophy is called Ingsoc, in Eurasia\nit is called Neo-Bolshevism, and in Eastasia it is called by a Chinese name\nusually translated as Death-Worship, but perhaps better rendered as Obliteration\nof the Self. The citizen of Oceania is not allowed to know anything of the\ntenets of the other two philosophies, but he is taught to execrate them as\nbarbarous outrages upon morality and commonsense. Actually the three\nphilosophies are barely distinguishable, and the social systems which they\nsupport are not distinguishable at all. Everywhere there is the same pyramidal\nstructure, the same worship of semi-divine leader, the same economy existing by\nand for continuous warfare. It follows that the three super-states not only\ncannot conquer one another, but would gain no advantage by doing so. On the\ncontrary, so long as they remain in conflict they prop one another up, like\nthree sheaves of corn. And, as usual, the ruling groups of all three powers are\nsimultaneously aware and unaware of what they are doing. Their lives are\ndedicated to world conquest, but they also know that it is necessary that the\nwar should continue everlastingly and without victory. Meanwhile the fact that\nthere IS no danger of conquest makes possible the denial of reality which is the\nspecial feature of Ingsoc and its rival systems of thought. Here it is necessary\nto repeat what has been said earlier, that by becoming continuous war has\nfundamentally changed its character.\n\nIn past ages, a war, almost by definition, was something that sooner or later\ncame to an end, usually in unmistakable victory or defeat. In the past, also,\nwar was one of the main instruments by which human societies were kept in touch\nwith physical reality. All rulers in all ages have tried to impose a false view\nof the world upon their followers, but they could not afford to encourage any\nillusion that tended to impair military efficiency. So long as defeat meant the\nloss of independence, or some other result generally held to be undesirable, the\nprecautions against defeat had to beserious. Physical facts could not be\nignored. In philosophy, or religion, or ethics, or politics, two and two might\nmake five, but when one was designing a gun or an aeroplane they had to make\nfour. Inefficient nations were always conquered sooner or later, and the\nstruggle for efficiency was inimical to illusions. Moreover, to be efficient it\nwas necessary to be able to learn from the past, which meant having a fairly\naccurate idea of what had happened in the past. Newspapers and history books\nwere, of course, always coloured and biased, but falsification of the kind that\nis practised today would have been impossible. War was a sure safeguard of\nsanity, and so far as the ruling classes were concerned it was probably the most\nimportant of all safeguards. While wars could be won or lost, no ruling class\ncould be completely irresponsible.\n\nBut when war becomes literally continuous, it also ceases to be dangerous. When\nwar is continuous there is no such thing as military necessity. Technical\nprogress can cease and the most palpable facts can be denied or disregarded. As\nwe have seen, researches that could be called scientific are still carried out\nfor the purposes of war, but they are essentially a kind of daydreaming, and\ntheir failure to show results is not important. Efficiency, even military\nefficiency, is no longer needed. Nothing is efficient in Oceania except the\nThought Police. Since each of the three super-states is unconquerable, each is\nin effect a separate universe within which almost any perversion of thought can\nbe safely practised. Reality only exerts its pressure through the needs of\neveryday life\u2014the need to eat and drink, to get shelter andclothing, to avoid\nswallowing poison or stepping out of topstorey windows, and the like. Between\nlife and death, and between physical pleasure and physical pain, there is still\na distinction, but that is all. Cut off from contact with the outer world, and\nwith the past, the citizen of Oceania is like a man in interstellar space, who\nhas no way of knowing which direction is up and which is down. The rulers of\nsuch a state are absolute, as the Pharaohs or the Caesars could not be. They are\nobliged to prevent their followers from starving to death in numbers large\nenough to be inconvenient, and they are obliged to remain at the same low level\nof military technique as their rivals; but once that minimum is achieved, they\ncan twist reality into whatever shape they choose.\n\nThe war, therefore, if we judge it by the standards of previous wars, is merely\nan imposture. It is like the battles between certain ruminant animals whose\nhorns are set at such an angle that they are incapable of hurting one another.\nBut though it is unreal it is not meaningless. It eats up the surplus of\nconsumable goods, and it helps to preserve the special mental atmosphere that a\nhierarchical society needs. War, it will be seen, is now a purely internal\naffair. In the past, the ruling groups of all countries, although they might\nrecognize their common interest and therefore limit the destructiveness of war,\ndid fight against one another, and the victor always plundered the vanquished.\nIn our own day they are not fighting against one another at all. The war is\nwaged by each ruling group against its own subjects, and the object of the war\nis not to make or preventconquests of territory, but to keep the structure of\nsociety intact. The very word \u2018war\u2019, therefore, has become misleading. It would\nprobably be accurate to say that by becoming continuous war has ceased to exist.\nThe peculiar pressure that it exerted on human beings between the Neolithic Age\nand the early twentieth century has disappeared and been replaced by something\nquite different. The effect would be much the same if the three super-states,\ninstead of fighting one another, should agree to live in perpetual peace, each\ninviolate within its own boundaries. For in that case each would still be a\nself-contained universe, freed for ever from the sobering influence of external\ndanger. A peace that was truly permanent would be the same as a permanent war.\nThis\u2014although the vast majority of Party members understand it only in a\nshallower sense\u2014is the inner meaning of the Party slogan: WAR IS PEACE.\n\nWinston stopped reading for a moment. Somewhere in remote distance a rocket bomb\nthundered. The blissful feeling of being alone with the forbidden book, in a\nroom with no telescreen, had not worn off. Solitude and safety were physical\nsensations, mixed up somehow with the tiredness of his body, the softness of the\nchair, the touch of the faint breeze from the window that played upon his cheek.\nThe book fascinated him, or more exactly it reassured him. In a sense it told\nhim nothing that was new, but that was part of the attraction. It said what he\nwould have said, if it had been possible for him to set his scattered thoughts\nin order. It was the product of a mind similar to his own, but enormously more\npowerful, more systematic, less fear-ridden. The best books, he perceived, are\nthose that tell you what you know already. He had just turned back to Chapter I\nwhen he heard Julia\u2019s footstep on the stair and started out of his chair to meet\nher. She dumped her brown tool- bag on the floor and flung herself into his\narms. It was more than a week since they had seen one another.\n\n\u2018I\u2019ve got THE BOOK,\u2019 he said as they disentangled themselves.\n\n\u2018Oh, you\u2019ve got it? Good,\u2019 she said without much interest, and almost\nimmediately knelt down beside the oil stove to make the coffee.\n\nThey did not return to the subject until they had been in bed for half an hour.\nThe evening was just cool enough to make it
