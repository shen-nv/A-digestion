side him could turn over. And then suddenly, without a word uttered,\nwithout a check in his step, without the changing of a line in his face\u2014suddenly\nthe camouflage would be down and bang! would go the batteries of his hatred.\nHatred would fill him like an enormous roaring flame. And almost in the same\ninstant bang! would go the bullet, too late, or too early. They would have blown\nhis brain to pieces before they could reclaim it. The heretical thought would be\nunpunished, unrepented, out of their reach for ever. They would have blown a\nhole in their own perfection. To die hating them, that was freedom.\n\nHe shut his eyes. It was more difficult than acceptingan intellectual\ndiscipline. It was a question of degrading himself, mutilating himself. He had\ngot to plunge into the filthiest of filth. What was the most horrible, sickening\nthing of all? He thought of Big Brother. The enormous face (because of\nconstantly seeing it on posters he always thought of it as being a metre wide),\nwith its heavy black moustache and the eyes that followed you to and fro, seemed\nto float into his mind of its own accord. What were his true feelings towards\nBig Brother?\n\nThere was a heavy tramp of boots in the passage. The steel door swung open with\na clang. O\u2019Brien walked into the cell. Behind him were the waxen-faced officer\nand the black-uniformed guards.\n\n\u2018Get up,\u2019 said O\u2019Brien. \u2018Come here.\u2019\n\nWinston stood opposite him. O\u2019Brien took Winston\u2019s shoulders between his strong\nhands and looked at him closely.\n\n\u2018You have had thoughts of deceiving me,\u2019 he said. \u2018That was stupid. Stand up\nstraighter. Look me in the face.\u2019\n\nHe paused, and went on in a gentler tone:\n\n\u2018You are improving. Intellectually there is very little wrong with you. It is\nonly emotionally that you have failed to make progress. Tell me, Winston\u2014and\nremember, no lies: you know that I am always able to detect a lie\u2014tell me, what\nare your true feelings towards Big Brother?\u2019\n\n\u2018I hate him.\u2019\n\n\u2018You hate him. Good. Then the time has come for you to take the last step. You\nmust love Big Brother. It is not enough to obey him: you must love him.\u2019\n\nHe released Winston with a little push towards the guards. \u2018Room 101,\u2019 he said.\n\nChapter 5\n\nA     t each stage of his imprisonment he had known, orseemed to know,\nwhereabouts he was in the windowless building. Possibly there were slight\ndifferences in the air pressure. The cells where the guards had beaten him were\nbelow ground level. The room where he had been interrogated by O\u2019Brien was high\nup near the roof. This place was many metres underground, as deep down as it was\npossible to go.\n\nIt was bigger than most of the cells he had been in. But he hardly noticed his\nsurroundings. All he noticed was that there were two small tables straight in\nfront of him, each covered with green baize. One was only a metre or two from\nhim, the other was further away, near the door. He was strapped upright in a\nchair, so tightly that he could move nothing, not even his head. A sort of pad\ngripped his head from behind, forcing him to look straight in front of him.\n\nFor a moment he was alone, then the door opened and O\u2019Brien came in.\n\n\u2018You asked me once,\u2019 said O\u2019Brien, \u2018what was in Room 101. I told you that you\nknew the answer already. Everyone knows it. The thing that is in Room 101 is the\nworst thing in the world.\u2019\n\nThe door opened again. A guard came in, carrying something made of wire, a box\nor basket of some kind. He set it down on the further table. Because of the\nposition in which O\u2019Brien was standing. Winston could not see what the thing\nwas.\n\n\u2018The worst thing in the world,\u2019 said O\u2019Brien, \u2018varies from individual to\nindividual. It may be burial alive, or death by fire, or by drowning, or by\nimpalement, or fifty other deaths. There are cases where it is some quite\ntrivial thing, not even fatal.\u2019\n\nHe had moved a little to one side, so that Winston had a better view of the\nthing on the table. It was an oblong wire cage with a handle on top for carrying\nit by. Fixed to the front of it was something that looked like a fencing mask,\nwith the concave side outwards. Although it was three or four metres away from\nhim, he could see that the cage was divided lengthways into two compartments,\nand that there was some kind of creature in each. They were rats.\n\n\u2018In your case,\u2019 said O\u2019Brien, \u2018the worst thing in the world happens to be rats.\u2019\n\nA sort of premonitory tremor, a fear of he was not certain what, had passed\nthrough Winston as soon as he caught his first glimpse of the cage. But at this\nmoment the meaning of the mask-like attachment in front of it suddenly sank into\nhim. His bowels seemed to turn to water.\n\n\u2018You can\u2019t do that!\u2019 he cried out in a high cracked voice. \u2018You couldn\u2019t, you\ncouldn\u2019t! It\u2019s impossible.\u2019\n\n\u2018Do you remember,\u2019 said O\u2019Brien, \u2018the moment of panic that used to occur in your\ndreams? There was a wall of blackness in front of you, and a roaring sound in\nyour ears.\n\nThere was something terrible on the other side of the wall. You knew that you\nknew what it was, but you dared not drag it into the open. It was the rats that\nwere on the other side of the wall.\u2019\n\n\u2018O\u2019Brien!\u2019 said Winston, making an effort to control his voice. \u2018You know this\nis not necessary. What is it that you want me to do?\u2019\n\nO\u2019Brien made no direct answer. When he spoke it was in the schoolmasterish\nmanner that he sometimes affected. He looked thoughtfully into the distance, as\nthough he were addressing an audience somewhere behind Winston\u2019s back.\n\n\u2018By itself,\u2019 he said, \u2018pain is not always enough. There are occasions when a\nhuman being will stand out against pain, even to the point of death. But for\neveryone there is something unendurable\u2014something that cannot be contemplated.\nCourage and cowardice are not involved. If you are falling from a height it is\nnot cowardly to clutch at a rope. If you have come up from deep water it is not\ncowardly to fill your lungs with air. It is merely an instinct which cannot be\ndestroyed. It is the same with the rats. For you, they are unendurable. They are\na form of pressure that you cannot withstand, even if you wished to. You will do\nwhat is required of you.\u2019\n\n\u2018But what is it, what is it? How can I do it if I don\u2019t know what it is?\u2019\n\nO\u2019Brien picked up the cage and brought it across to the nearer table. He set it\ndown carefully on the baize cloth. Winston could hear the blood singing in his\nears. He had the feeling of sitting in utter loneliness. He was in the middleof\na great empty plain, a flat desert drenched with sunlight, across which all\nsounds came to him out of immense distances. Yet the cage with the rats was not\ntwo metres away from him. They were enormous rats. They were at the age when a\nrat\u2019s muzzle grows blunt and fierce and his fur brown instead of grey.\n\n\u2018The rat,\u2019 said O\u2019Brien, still addressing his invisible audience, \u2018although a\nrodent, is carnivorous. You are aware of that. You will have heard of the things\nthat happen in the poor quarters of this town. In some streets a woman dare not\nleave her baby alone in the house, even for five minutes. The rats are certain\nto attack it. Within quite a small time they will strip it to the bones. They\nalso attack sick or dying people. They show astonishing intelligence in knowing\nwhen a human being is helpless.\u2019\n\nThere was an outburst of squeals from the cage. It seemed to reach Winston from\nfar away. The rats were fighting; they were trying to get at each other through\nthe partition. He heard also a deep groan of despair. That, too, seemed to come\nfrom outside himself.\n\nO\u2019Brien picked up the cage, and, as he did so, pressed something in it. There\nwas a sharp click. Winston made a frantic effort to tear himself loose from the\nchair. It was hopeless; every part of him, even his head, was held immovably.\nO\u2019Brien moved the cage nearer. It was less than a metre from Winston\u2019s face.\n\n\u2018I have pressed the first lever,\u2019 said O\u2019Brien. \u2018You understand the construction\nof this cage. The mask will fit over your head, leaving no exit. When I press\nthis other lever,\n\nthe door of the cage will slide up. These starving brutes will shoot out of it\nlike bullets. Have you ever seen a rat leap through the air? They will leap on\nto your face and bore straight into it. Sometimes they attack the eyes first.\nSometimes they burrow through the cheeks and devour the tongue.\u2019\n\nThe cage was nearer; it was closing in. Winston heard a succession of shrill\ncries which appeared to be occurring in the air above his head. But he fought\nfuriously against his panic. To think, to think, even with a split second\nleft\u2014to think was the only hope. Suddenly the foul musty odour of the brutes\nstruck his nostrils. There was a violent convulsion of nausea inside him, and he\nalmost lost consciousness. Everything had gone black. For an instant he was\ninsane, a screaming animal. Yet he came out of the blackness clutching an idea.\nThere was one and only one way to save himself. He must interpose another human\nbeing, the BODY of another human being, between himself and the rats.\n\nThe circle of the mask was large enough now to shut out the vision of anything\nelse. The wire door was a couple of hand-spans from his face. The rats knew what\nwas coming now. One of them was leaping up and down, the other, an old scaly\ngrandfather of the sewers, stood up, with his pink hands against the bars, and\nfiercely sniffed the air. Winston could see the whiskers and the yellow teeth.\nAgain the black panic took hold of him. He was blind, helpless, mindless.\n\n\u2018It was a common punishment in Imperial China,\u2019 said O\u2019Brien as didactically as\never.\n\nThe mask was closing on his face. The wire brushed hischeek. And then\u2014no, it was\nnot relief, only hope, a tiny fragment of hope. Too late, perhaps too late. But\nhe had suddenly understood that in the whole world there was just ONE person to\nwhom he could transfer his punishment\u2014 ONE body that he could thrust between\nhimself and the rats. And he was shouting frantically, over and over.\n\n\u2018Do it to Julia! Do it to Julia! Not me! Julia! I don\u2019t care what you do to her.\nTear her face off, strip her to the bones. Not me! Julia! Not me!\u2019\n\nHe was falling backwards, into enormous depths, away from the rats. He was still\nstrapped in the chair, but he had fallen through the floor, through the walls of\nthe building, through the earth, through the oceans, through the atmosphere,\ninto outer space, into the gulfs between the stars\u2014always away, away, away from\nthe rats. He was light years distant, but O\u2019Brien was still standing at his\nside. There was still the cold touch of wire against his cheek. But through the\ndarkness that enveloped him he heard another metallic click, and knew that the\ncage door had clicked shut and not open.\n\nChapter 6\n\nT    he Chestnut Tree was almost empty. A ray of sunlightslanting through a\nwindow fell on dusty table-tops. It was the lonely hour of fifteen. A tinny\nmusic trickled from the telescreens.\n\nWinston sat in his usual corner, gazing into an empty glass. Now and again he\nglanced up at a vast face which eyed him from the opposite wall. BIG BROTHER IS\nWATCH- ING YOU, the caption said. Unbidden, a waiter came and filled his glass\nup with Victory Gin, shaking into it a few drops from another bottle with a\nquill through the cork. It was saccharine flavoured with cloves, the speciality\nof the cafe.\n\nWinston was listening to the telescreen. At present only music was coming out of\nit, but there was a possibility that at any moment there might be a special\nbulletin from the Ministry of Peace. The news from the African front was\ndisquieting in the extreme. On and off he had been worrying about it all day. A\nEurasian army (Oceania was at war with Eurasia: Oceania had always been at war\nwith Eurasia) was moving southward at terrifying speed. The mid-day bulletin had\nnot mentioned any definite area, but it was probable that already the mouth of\nthe Congo was a battlefield. Brazzaville and Leopoldville were in danger. One\ndid not have to look at the map to see what it meant. It was not merelya\nquestion of losing Central Africa: for the first time in the whole war, the\nterritory of Oceania itself was menaced.\n\nA violent emotion, not fear exactly but a sort of undifferentiated excitement,\nflared up in him, then faded again. He stopped thinking about the war. In these\ndays he could never fix his mind on any one subject for more than a few moments\nat a time. He picked up his glass and drained it at a gulp. As always, the gin\nmade him shudder and even retch slightly. The stuff was horrible. The cloves and\nsaccharine, themselves disgusting enough in their sickly way, could not disguise\nthe flat oily smell; and what was worst of all was that the smell of gin, which\ndwelt with him night and day, was inextricably mixed up in his mind with the\nsmell of those\u2014\u2014\n\nHe never named them, even in his thoughts, and so far as it was possible he\nnever visualized them. They were something that he was half-aware of, hovering\nclose to his face, a smell that clung to his nostrils. As the gin rose in him he\nbelched through purple lips. He had grown fatter since they released him, and\nhad regained his old colour\u2014 indeed, more than regained it. His features had\nthickened, the skin on nose and cheekbones was coarsely red, even the bald scalp\nwas too deep a pink. A waiter, again unbidden, brought the chessboard and the\ncurrent issue of \u2018The Times\u2019, with the page turned down at the chess problem.\nThen, seeing that Winston\u2019s glass was empty, he brought the gin bottle and\nfilled it. There was no need to give orders. They knew his habits. The\nchessboard was always waiting for him, his corner table was always reserved;\neven whenthe place was full he had it to himself, since nobody cared to be seen\nsitting too close to him. He never even bothered to count his drinks. At\nirregular intervals they presented him with a dirty slip of paper which they\nsaid was the bill, but he had the impression that they always undercharged him.\nIt would have made no difference if it had been the other way about. He had\nalways plenty of money nowadays. He even had a job, a sinecure, more highly-paid\nthan his old job had been.\n\nThe music from the telescreen stopped and a voice took over. Winston raised his\nhead to listen. No bulletins from the front, however. It was merely a brief\nannouncement from the Ministry of Plenty. In the preceding quarter, it appeared,\nthe Tenth Three-Year Plan\u2019s quota for bootlaces had been overfulfilled by 98 per\ncent.\n\nHe examined the chess problem and set out the pieces. It was a tricky ending,\ninvolving a couple of knights. \u2018White to play and mate in two moves.\u2019 Winston\nlooked up at the portrait of Big Brother. White always mates, he thought with a\nsort of cloudy mysticism. Always, without exception, it is so arranged. In no\nchess problem since the beginning of the world has black ever won. Did it not\nsymbolize the eternal, unvarying triumph of Good over Evil? The huge face gazed\nback at him, full of calm power. White always mates.\n\nThe voice from the telescreen paused and added in a different and much graver\ntone: \u2018You are warned to stand by for an important announcement at fifteen-\nthirty. Fifteenthirty! This is news of the highest importance. Take care not to\nmiss it. Fifteen-thirty!\u2019 The tinkling music struck upagain.\n\nWinston\u2019s heart stirred. That was the bulletin from the front; instinct told him\nthat it was bad news that was coming. All day, with little spurts of excitement,\nthe thought of a smashing defeat in Africa had been in and out of his mind. He\nseemed actually to see the Eurasian army swarming across the never-broken\nfrontier and pouring down into the tip of Africa like a column of ants. Why had\nit not been possible to outflank them in some way? The outline of the West\nAfrican coast stood out vividly in his mind. He picked up the white knight and\nmoved it across the board. THERE was the proper spot. Even while he saw the\nblack horde racing southward he saw another force, mysteriously assembled,\nsuddenly planted in their rear, cutting their comunications by land and sea. He\nfelt that by willing it he was bringing that other force into existence. But it\nwas necessary to act quickly. If they could get control of the whole of Africa,\nif they had airfields and submarine bases at the Cape, it would cut Oceania in\ntwo. It might mean anything: defeat, breakdown, the redivision of the world, the\ndestruction of the Party! He drew a deep breath. An extraordinary medley of\nfeeling\u2014but it was not a medley, exactly; rather it was successive layers of\nfeeling, in which one could not say which layer was undermost\u2014struggled inside\nhim.\n\nThe spasm passed. He put the white knight back in its place, but for the moment\nhe could not settle down to serious study of the chess problem. His thoughts\nwandered again. Almost unconsciously he traced with his finger in the dust on\nthe table:\n\n2+2=5\n\n\u2018They can\u2019t get inside you,\u2019 she had said. But they could get inside you. \u2018What\nhappens to you here is FOR EVER,\u2019 O\u2019Brien had said. That was a true word. There\nwere things, your own acts, from which you could never recover. Something was\nkilled in your breast: burnt out, cauterized out.\n\nHe had seen her; he had even spoken to her. There was no danger in it. He knew\nas though instinctively that they now took almost no interest in his doings. He\ncould have arranged to meet her a second time if either of them had wanted to.\nActually it was by chance that they had met. It was in the Park, on a vile,\nbiting day in March, when the earth was like iron and all the grass seemed dead\nand there was not a bud anywhere except a few crocuses which had pushed\nthemselves up to be dismembered by the wind. He was hurrying along with frozen\nhands and watering eyes when he saw her not ten metres away from him. It struck\nhim at once that she had changed in some ill-defined way. They almost passed one\nanother without a sign, then he turned and followed her, not very eagerly. He\nknew that there was no danger, nobody would take any interest in him. She did\nnot speak. She walked obliquely away across the grass as though trying to get\nrid of him, then seemed to resign herself to having him at her side. Presently\nthey were in among a clump of ragged leafless shrubs, useless either for\nconcealment or as protection from the wind. They halted. It was vilely cold. The\nwind whistled through the twigs and fretted the occasional, dirty-looking\ncrocuses. He put hisarm round her waist.\n\nThere was no telescreen, but there must be hidden microphones: besides, they\ncould be seen. It did not matter, nothing mattered. They could have lain down on\nthe ground and done THAT if they had wanted to. His flesh froze with horror at\nthe thought of it. She made no response whatever to the clasp of his arm; she\ndid not even try to disengage herself. He knew now what had changed in her. Her\nface was sallower, and there was a long scar, partly hidden by the hair, across\nher forehead and temple; but that was not the change. It was that her waist had\ngrown thicker, and, in a surprising way, had stiffened. He remembered how once,\nafter the explosion of a rocket bomb, he had helped to drag a corpse out of some\nruins, and had been astonished not only by the incredible weight of the thing,\nbut by its rigidity and awkwardness to handle, which made it seem more like\nstone than flesh. Her body felt like that. It occurred to him that the texture\nof her skin would be quite different from what it had once been.\n\nHe did not attempt to kiss her, nor did they speak. As they walked back across\nthe grass, she looked directly at him for the first time. It was only a\nmomentary glance, full of contempt and dislike. He wondered whether it was a\ndislike that came purely out of the past or whether it was inspired also by his\nbloated face and the water that the wind kept squeezing from his eyes. They sat\ndown on two iron chairs, side by side but not too close together. He saw that\nshe was about to speak. She moved her clumsy shoe a few centimetres and\ndeliberately crushed a twig. Her feet seemed to have grownbroader, he noticed.\n\n\u2018I betrayed you,\u2019 she said baldly.\n\n\u2018I betrayed you,\u2019 he said.\n\nShe gave him another quick look of dislike.\n\n\u2018Sometimes,\u2019 she said, \u2018they threaten you with something something you can\u2019t\nstand up to, can\u2019t even think about. And then you say, \u2018Don\u2019t do it to me, do it\nto somebody else, do it to so-and-so.\u2019 And perhaps you might pretend,\nafterwards, that it was only a trick and that you just said it to make them stop\nand didn\u2019t really mean it. But that isn\u2019t true. At the time when it happens you\ndo mean it. You think there\u2019s no other way of saving yourself, and you\u2019re quite\nready to save yourself that way. You WANT it to happen to the other person. You\ndon\u2019t give a damn what they suffer. All you care about is yourself.\u2019\n\n\u2018All you care about is yourself,\u2019 he echoed.\n\n\u2018And after that, you don\u2019t feel the same towards the other person any longer.\u2019\n\n\u2018No,\u2019 he said, \u2018you don\u2019t feel the same.\u2019\n\nThere did not seem to be anything more to say. The wind plastered their thin\noveralls against their bodies. Almost at once it became embarrassing to sit\nthere in silence: besides, it was too cold to keep still. She said something\nabout catching her Tube and stood up to go.\n\n\u2018We must meet again,\u2019 he said.\n\n\u2018Yes,\u2019 she said, \u2018we must meet again.\u2019\n\nHe followed irresolutely for a little distance, half a pace behind her. They did\nnot speak again. She did not actually try to shake him off, but walked at just\nsuch a speed as toprevent his keeping abreast of her. He had made up his mind\nthat he would accompany her as far as the Tube station, but suddenly this\nprocess of trailing along in the cold seemed pointless and unbearable. He was\noverwhelmed by a desire not so much to get away from Julia as to get back to the\nChestnut Tree Cafe, which had never seemed so attractive as at this moment. He\nhad a nostalgic vision of his corner table, with the newspaper and the\nchessboard and the everflowing gin. Above all, it would be warm in there. The\nnext moment, not altogether by accident, he allowed himself to become separated\nfrom her by a small knot of people. He made a halfhearted attempt to catch up,\nthen slowed down, turned, and made off in the opposite direction. When he had\ngone fifty metres he looked back. The street was not crowded, but already he\ncould not distinguish her. Any one of a dozen hurrying figures might have been\nhers. Perhaps her thickened, stiffened body was no longer recognizable from\nbehind.\n\n\u2018At the time when it happens,\u2019 she had said, \u2018you do mean it.\u2019 He had meant it.\nHe had not merely said it, he had wished it. He had wished that she and not he\nshould be delivered over to the\u2014\u2014\n\nSomething changed in the music that trickled from the telescreen. A cracked and\njeering note, a yellow note, came into it. And then\u2014perhaps it was not\nhappening, perhaps it was only a memory taking on the semblance of sound\u2014a voice\nwas singing:\n\n\u2018Under the spreading chestnut tree\n\nI sold you and you sold me\u2014\u2014\u2019\n\nThe tears welled up in his eyes. A passing waiter noticed that his glass was\nempty and came back with the gin bottle.\n\nHe took up his glass and sniffed at it. The stuff grew not less but more\nhorrible with every mouthful he drank. But it had become the element he swam in.\nIt was his life, his death, and his resurrection. It was gin that sank him into\nstupor every night, and gin that revived him every morning. When he woke, seldom\nbefore eleven hundred, with gummed-up eyelids and fiery mouth and a back that\nseemed to be broken, it would have been impossible even to rise from the\nhorizontal if it had not been for the bottle and teacup placed beside the bed\novernight. Through the midday hours he sat with glazed face, the bottle handy,\nlistening to the telescreen. From fifteen to closing-time he was a fixture in\nthe Chestnut Tree. No one cared what he did any longer, no whistle woke him, no\ntelescreen admonished him. Occasionally, perhaps twice a week, he went to a\ndusty, forgotten-looking office in the Ministry of Truth and did a little work,\nor what was called work. He had been appointed to a sub-committee of a sub-\ncommittee which had sprouted from one of the innumerable committees dealing with\nminor difficulties that arose in the compilation of the Eleventh Edition of the\nNewspeak Dictionary. They were engaged in producing something called an Interim\nReport, but what it was that they were reporting on he had never definitely\nfound out. It was something to do with the question of whether commas should be\nplaced inside brackets,\n\nor outside. There were four others on the committee, all of them persons similar\nto himself. There were days when they assembled and then promptly dispersed\nagain, frankly admitting to one another that there was not really anything to be\ndone. But there were other days when they settled down to their work almost\neagerly, making a tremendous show of entering up their minutes and drafting long\nmemoranda which were never finished\u2014when the argument as to what they were\nsupposedly arguing about grew extraordinarily involved and abstruse, with subtle\nhaggling over definitions, enormous digressions, quarrels\u2014threats, even, to\nappeal to higher authority. And then suddenly the life would go out of them and\nthey would sit round the table looking at one another with extinct eyes, like\nghosts fading at cock-crow.\n\nThe telescreen was silent for a moment. Winston raised his head again. The\nbulletin! But no, they were merely changing the music. He had the map of Africa\nbehind his eyelids. The movement of the armies was a diagram: a black arrow\ntearing vertically southward, and a white arrow horizontally eastward, across\nthe tail of the first. As though for reassurance he looked up at the\nimperturbable face in the portrait. Was it conceivable that the second arrow did\nnot even exist?\n\nHis interest flagged again. He drank another mouthful of gin, picked up the\nwhite knight and made a tentative move. Check. But it was evidently not the\nright move, because\u2014\u2014\n\nUncalled, a memory floated into his mind. He saw a candle-lit room with a vast\nwhite-counterpaned bed, and himself, a boy of nine or ten, sitting on the floor,\nshakinga dice-box, and laughing excitedly. His mother was sitting opposite him\nand also laughing.\n\nIt must have been about a month before she disappeared. It was a moment of\nreconciliation, when the nagging hunger in his belly was forgotten and his\nearlier affection for her had temporarily revived. He remembered the day well, a\npelting, drenching day when the water streamed down the window-pane and the\nlight indoors was too dull to read by. The boredom of the two children in the\ndark, cramped bedroom became unbearable. Winston whined and grizzled, made\nfutile demands for food, fretted about the room pulling everything out of place\nand kicking the wainscoting until the neighbours banged on the wall, while the\nyounger child wailed intermittently. In the end his mother said, \u2018Now be good,\nand I\u2019Il buy you a toy. A lovely toy\u2014 you\u2019ll love it\u2019; and then she had gone out\nin the rain, to a little general shop which was still sporadically open nearby,\nand came back with a cardboard box containing an outfit of Snakes and Ladders.\nHe could still remember the smell of the damp cardboard. It was a miserable\noutfit. The board was cracked and the tiny wooden dice were so ill-cut that they\nwould hardly lie on their sides. Winston looked at the thing sulkily and without\ninterest. But then his mother lit a piece of candle and they sat down on the\nfloor to play. Soon he was wildly excited and shouting with laughter as the\ntiddly-winks climbed hopefully up the ladders and then came slithering down the\nsnakes again, almost to the startingpoint. They played eight games, winning four\neach. His tiny sister, too young to understand what the game was about,\n\nhad sat propped up against a bolster, laughing because the others were laughing.\nFor a whole afternoon they had all been happy together, as in his earlier\nchildhood.\n\nHe pushed the picture out of his mind. It was a false memory. He was troubled by\nfalse memories occasionally. They did not matter so long as one knew them for\nwhat they were. Some things had happened, others had not happened. He turned\nback to the chessboard and picked up the white knight again. Almost in the same\ninstant it dropped on to the board with a clatter. He had started as though a\npin had run into him.\n\nA shrill trumpet-call had pierced the air. It was the bulletin! Victory! It\nalways meant victory when a trumpet-call preceded the news. A sort of electric\ndrill ran through the cafe. Even the waiters had started and pricked up their\nears.\n\nThe trumpet-call had let loose an enormous volume of noise. Already an excited\nvoice was gabbling from the telescreen, but even as it started it was almost\ndrowned by a roar of cheering from outside. The news had run round the streets\nlike magic. He could hear just enough of what was issuing from the telescreen to\nrealize that it had all happened, as he had foreseen; a vast seaborne armada had\nsecretly assembled a sudden blow in the enemy\u2019s rear, the white arrow tearing\nacross the tail of the black. Fragments of triumphant phrases pushed themselves\nthrough the din: \u2018Vast strategic manoeuvre\u2014perfect co-ordination\u2014utter rout\u2014half\na million prisoners\u2014complete demoralization\u2014control of the whole of Africa\u2014bring\nthe war withinmeasurable distance of its end\u2014victory\u2014greatest victory in human\nhistory\u2014victory, victory, victory!\u2019\n\nUnder the table Winston\u2019s feet made convulsive movements. He had not stirred\nfrom his seat, but in his mind he was running, swiftly running, he was with the\ncrowds outside, cheering himself deaf. He looked up again at the portrait of Big\nBrother. The colossus that bestrode the world! The rock against which the hordes\nof Asia dashed themselves in vain! He thought how ten minutes ago\u2014yes, only ten\nminutes\u2014there had still been equivocation in his heart as he wondered whether\nthe news from the front would be of victory or defeat. Ah, it was more than a\nEurasian army that had perished! Much had changed in him since that first day in\nthe Ministry of Love, but the final, indispensable, healing change had never\nhappened, until this moment.\n\nThe voice from the telescreen was still pouring forth its tale of prisoners and\nbooty and slaughter, but the shouting outside had died down a little. The\nwaiters were turning back to their work. One of them approached with the gin\nbottle. Winston, sitting in a blissful dream, paid no attention as his glass was\nfilled up. He was not running or cheering any longer. He was back in the\nMinistry of Love, with everything forgiven, his soul white as snow. He was in\nthe public dock, confessing everything, implicating everybody. He was walking\ndown the white-tiled corridor, with the feeling of walking in sunlight, and an\narmed guard at his back. The long-hoped-for bullet was entering his brain.\n\nHe gazed up at the enormous face. Forty years it had taken him to learn what\nkind of smile was hidden beneath the dark moustache. O cruel, needless\nmisunderstanding! O stubborn, self-willed exile from the loving breast! Two\nginscented tears trickled down the sides of his nose. But it was all right,\neverything was all right, the struggle was finished. He had won the victory over\nhimself. He loved Big Brother.\n\nTHE END\n\nAPPENDIX.\n\nThe Principles of Newspeak\n\nNewspeak was the official language of Oceania and had been devised to meet the\nideological needs of Ingsoc, or English Socialism. In the year 1984 there was\nnot as yet anyone who used Newspeak as his sole means of communication, either\nin speech or writing. The leading articles in \u2018The Times\u2019 were written in it,\nbut this was a TOUR DE FORCE which could only be carried out by a specialist. It\nwas expected that Newspeak would have finally superseded Oldspeak (or Standard\nEnglish, as we should call it) by about the year 2050. Meanwhile it gained\nground steadily, all Party members tending to use Newspeak words and grammatical\nconstructions more and more in their everyday speech. The version in use in\n1984, and embodied in the Ninth and Tenth Editions of the Newspeak Dictionary,\nwas a provisional one, and contained many superfluous words and archaic\nformations which were due to be suppressed later. It is with the final,\nperfected version, as embodied in the Eleventh Edition of the Dictionary, that\nwe are concerned here.\n\nThe purpose of Newspeak was not only to provide amedium of expression for the\nworld-view and mental habits proper to the devotees of Ingsoc, but to make all\nother modes of thought impossible. It was intended that when Newspeak had been\nadopted once and for all and Oldspeak forgotten, a heretical thought\u2014that is, a\nthought diverging from the principles of Ingsoc\u2014should be literally unthinkable,\nat least so far as thought is dependent on words. Its vocabulary was so\nconstructed as to give exact and often very subtle expression to every meaning\nthat a Party member could properly wish to express, while excluding all other\nmeanings and also the possibility of arriving at them by indirect methods. This\nwas done partly by the invention of new words, but chiefly by eliminating\nundesirable words and by stripping such words as remained of unorthodox\nmeanings, and so far as possible of all secondary meanings whatever. To give a\nsingle example. The word FREE still existed in Newspeak, but it could only be\nused in such statements as \u2018This dog is free from lice\u2019 or \u2018This field is free\nfrom weeds\u2019. It could not be used in its old sense of \u2018politically free\u2019 or\n\u2018intellectually free\u2019 since political and intellectual freedom no longer existed\neven as concepts, and were therefore of necessity nameless. Quite apart from the\nsuppression of definitely heretical words, reduction of vocabulary was regarded\nas an end in itself, and no word that could be dispensed with was allowed to\nsurvive. Newspeak was designed not to extend but to DIMINISH the range of\nthought, and this purpose was indirectly assisted by cutting the choice of words\ndown to a minimum.\n\nNewspeak was founded on the English language as wenow know it, though many\nNewspeak sentences, even when not containing newly- created words, would be\nbarely intelligible to an English-speaker of our own day. Newspeak words were\ndivided into three distinct classes, known as the A vocabulary, the B vocabulary\n(also called compound words), and the C vocabulary. It will be simpler to\ndiscuss each class separately, but the grammatical peculiarities of the language\ncan be dealt with in the section devoted to the A vocabulary, since the same\nrules held good for all three categories.\n\nTHE A VOCABULARY. The A vocabulary consisted of the words needed for the\nbusiness of everyday life\u2014for such things as eating, drinking, working, putting\non one\u2019s clothes, going up and down stairs, riding in vehicles, gardening,\ncooking, and the like. It was composed almost entirely of words that we already\npossess words like HIT, RUN, DOG, TREE, SUGAR, HOUSE, FIELD\u2014but in comparison\nwith the present-day English vocabulary their number was extremely small, while\ntheir meanings were far more rigidly defined. All ambiguities and shades of\nmeaning had been purged out of them. So far as it could be achieved, a Newspeak\nword of this class was simply a staccato sound expressing ONE clearly understood\nconcept. It would have been quite impossible to use the A vocabulary for\nliterary purposes or for political or philosophical discussion. It was intended\nonly to express simple, purposive thoughts, usually involving concrete objects\nor physical actions.\n\nThe grammar of Newspeak had two outstanding peculiarities. The first of these\nwas an almost completeinterchangeability between different parts of speech. Any\nword in the language (in principle this applied even to very abstract words such\nas IF or WHEN) could be used either as verb, noun, adjective, or adverb. Between\nthe verb and the noun form, when they were of the same root, there was never any\nvariation, this rule of itself involving the destruction of many archaic forms.\nThe word THOUGHT, for example, did not exist in Newspeak. Its place was taken by\nTHINK, which did duty for both noun and verb. No etymological principle was\nfollowed here: in some cases it was the original noun that was chosen for\nretention, in other cases the verb. Even where a noun and verb of kindred\nmeaning were not etymologically connected, one or other of them was frequently\nsuppressed. There was, for example, no such word as CUT, its meaning being\nsufficiently covered by the noun-verb KNIFE. Adjectives were formed by adding\nthe suffix -FUL to the noun-verb, and adverbs by adding -WISE. Thus for example,\nSPEEDFUL meant \u2018rapid\u2019 and SPEEDWISE meant \u2018quickly\u2019. Certain of our presentday\nadjectives, such as GOOD, STRONG, BIG, BLACK, SOFT, were retained, but their\ntotal number was very small. There was little need for them, since almost any\nadjectival meaning could be arrived at by adding -FUL to a noun-verb. None of\nthe now-existing adverbs was retained, except for a very few already ending in\n-WISE: the -WISE termination was invariable. The word WELL, for example, was\nreplaced by GOODWISE.\n\nIn addition, any word\u2014this again applied in principle to every word in the\nlanguage\u2014could be negatived by adding the affix UN-, or could be strengthened by\nthe affix PLUS-, or, for still greater emphasis, DOUBLEPLUS-. Thus, for example,\nUNCOLD meant \u2018warm\u2019, while PLUSCOLD and DOUBLEPLUSCOLD meant, respectively,\n\u2018very cold\u2019 and \u2018superlatively cold\u2019. It was also possible, as in presentday\nEnglish, to modify the meaning of almost any word by prepositional affixes such\nas ANTE-, POST-, UP-, DOWN-, etc. By such methods it was found possible to bring\nabout an enormous diminution of vocabulary. Given, for instance, the word GOOD,\nthere was no need for such a word as BAD, since the required meaning was equally\nwell\u2014indeed, better\u2014expressed by UNGOOD. All that was necessary, in any case\nwhere two words formed a natural pair of opposites, was to decide which of them\nto suppress. DARK, for example, could be replaced by UNLIGHT, or LIGHT by\nUNDARK, according to preference.\n\nThe second distinguishing mark of Newspeak grammar was its regularity. Subject\nto a few exceptions which are mentioned below all inflexions followed the same\nrules. Thus, in all verbs the preterite and the past participle were the same\nand ended in -ED. The preterite of STEAL was STEALED, the preterite of THINK was\nTHINKED, and so on throughout the language, all such forms as SWAM, GAVE,\nBROUGHT, SPOKE, TAKEN, etc., being abolished. All plurals were made by adding -S\nor -ES as the case might be. The plurals OF MAN, OX, LIFE, were MANS, OXES,\nLIFES. Comparison of adjectives was invariably made by adding -ER, -EST (GOOD,\nGOODER, GOODEST), irregular forms and the MORE, MOST formation beingsuppressed.\n\nThe only classes of words that were still allowed to inflect irregularly were\nthe pronouns, the relatives, the demonstrative adjectives, and the auxiliary\nverbs. All of these followed their ancient usage, except that WHOM had been\nscrapped as unnecessary, and the SHALL, SHOULD tenses had been dropped, all\ntheir uses being covered by WILL and WOULD. There were also certain\nirregularities in word-formation arising out of the need for rapid and easy\nspeech. A word which was difficult to utter, or was liable to be incorrectly\nheard, was held to be ipso facto a bad word; occasionally therefore, for the\nsake of euphony, extra letters were inserted into a word or an archaic formation\nwas retained. But this need made itself felt chiefly in connexion with the B\nvocabulary. WHY so great an importance was attached to ease of pronunciation\nwill be made clear later in this essay.\n\nTHE B VOCABULARY. The B vocabulary consisted of words which had been\ndeliberately constructed for political purposes: words, that is to say, which\nnot only had in every case a political implication, but were intended to impose\na desirable mental attitude upon the person using them. Without a full\nunderstanding of the principles of Ingsoc it was difficult to use these words\ncorrectly. In some cases they could be translated into Oldspeak, or even into\nwords taken from the A vocabulary, but this usually demanded a long paraphrase\nand always involved the loss of certain overtones. The B words were a sort of\nverbal shorthand, often packing whole ranges of ideas into a few syllables, and\nat the same time more accurate and forcible than ordinarylanguage.\n\nThe B words were in all cases compound words. [Compound words such as\nSPEAKWRITE, were of course to be found in the A vocabulary, but these were\nmerely convenient abbreviations and had no special ideologcal colour.] They\nconsisted of two or more words, or portions of words, welded together in an\neasily pronounceable form. The resulting amalgam was always a noun-verb, and\ninflected according to the ordinary rules. To take a single example: the word\nGOODTHINK, meaning, very roughly, \u2018orthodoxy\u2019, or, if one chose to regard it as\na verb, \u2018to think in an orthodox manner\u2019. This inflected as follows: noun-verb,\nGOOD- THINK; past tense and past participle, GOODTHINKED; present participle,\nGOOD-THINKING; adjective, GOOD- THINKFUL; adverb, GOODTHINKWISE; verbal noun,\nGOODTHINKER.\n\nThe B words were not constructed on any etymological plan. The words of which\nthey were made up could be any parts of speech, and could be placed in any order\nand mutilated in any way which made them easy to pronounce while indicating\ntheir derivation. In the word CRIMETHINK (thoughtcrime), for instance, the THINK\ncame second, whereas in THINKPOL (Thought Police) it came first, and in the\nlatter word POLICE had lost its second syllable. Because of the great difficulty\nin securing euphony, irregular formations were commoner in the B vocabulary than\nin the A vocabulary. For example, the adjective forms of MINITRUE, MINIPAX, and\nMINILUV were, respectively, MINITRUTHFUL, MINIPEACEFUL, and MINILOVELY,\n\nsimply because -TRUEFUL, -PAXFUL, and -LOVEFUL were slightly awkward to\npronounce. In principle, however, all B words could inflect, and all inflected\nin exactly the same way.\n\nSome of the B words had highly subtilized meanings, barely intelligible to\nanyone who had not mastered the language as a whole. Consider, for example, such\na typical sentence from a \u2018Times\u2019 leading article as OLDTHINKERS UNBELLYFEEL\nINGSOC. The shortest rendering that one could make of this in Oldspeak would be:\n\u2018Those whose ideas were formed before the Revolution cannot have a full\nemotional understanding of the principles of English Socialism.\u2019 But this is not\nan adequate translation. To begin with, in order to grasp the full meaning of\nthe Newspeak sentence quoted above, one would have to have a clear idea of what\nis meant by INGSOC. And in addition, only a person thoroughly grounded in Ingsoc\ncould appreciate the full force of the word BELLYFEEL, which implied a blind,\nenthusiastic acceptance difficult to imagine today; or of the word OLDTHINK,\nwhich was inextricably mixed up with the idea of wickedness and decadence. But\nthe special function of certain Newspeak words, of which OLDTHINK was one, was\nnot so much to express meanings as to destroy them. These words, necessarily few\nin number, had had their meanings extended until they contained within\nthemselves whole batteries of words which, as they were sufficiently covered by\na single comprehensive term, could now be scrapped and forgotten. The greatest\ndifficulty facing the compilers of the Newspeak Dictionary was not toinvent new\nwords, but, having invented them, to make sure what they meant: to make sure,\nthat is to say, what ranges of words they cancelled by their existence.\n\nAs we have already seen in the case of the word FREE, words which had once borne\na heretical meaning were sometimes retained for the sake of convenience, but\nonly with the undesirable meanings purged out of them. Countless other words\nsuch as HONOUR, JUSTICE, MORALITY, INTERNATIONALISM, DEMOCRACY, SCIENCE, and\nRELIGION had simply ceased to exist. A few blanket words covered them, and, in\ncovering them, abolished them. All words grouping themselves round the concepts\nof liberty and equality, for instance, were contained in the single word\nCRIMETHINK, while all words grouping themselves round the concepts of\nobjectivity and rationalism were contained in the single word OLDTHINK. Greater\nprecision would have been dangerous. What was required in a Party member was an\noutlook similar to that of the ancient Hebrew who knew, without knowing much\nelse, that all nations other than his own worshipped \u2018false gods\u2019. He did not\nneed to know that these gods were called Baal, Osiris, Moloch, Ashtaroth, and\nthe like: probably the less he knew about them the better for his orthodoxy. He\nknew Jehovah and the commandments of Jehovah: he knew, therefore, that all gods\nwith other names or other attributes were false gods. In somewhat the same way,\nthe party member knew what constituted right conduct, and in exceedingly vague,\ngeneralized terms he knew what kinds of departure from it were possible. His\nsexual life, for example, was entirelyregulated by the two Newspeak words\nSEXCRIME (sexual immorality) and GOODSEX (chastity). SEXCRIME covered all sexual\nmisdeeds whatever. It covered fornication, adultery, homosexuality, and other\nperversions, and, in addition, normal intercourse practised for its own sake.\nThere was no need to enumerate them separately, since they were all equally\nculpable, and, in principle, all punishable by death. In the C vocabulary, which\nconsisted of scientific and technical words, it might be necessary to give\nspecialized names to certain sexual aberrations, but the ordinary citizen had no\nneed of them. He knew what was meant by GOODSEX\u2014that is to say, normal\nintercourse between man and wife, for the sole purpose of begetting children,\nand without physical pleasure on the part of the woman: all else was SEXCRIME.\nIn Newspeak it was seldom possible to follow a heretical thought further than\nthe perception that it WAS heretical: beyond that point the necessary words were\nnonexistent.\n\nNo word in the B vocabulary was ideologically neutral. A great many were\neuphemisms. Such words, for instance, as JOYCAMP (forced-labour camp) or MINIPAX\nMinistry of Peace, i.e. Ministry of War) meant almost the exact opposite of what\nthey appeared to mean. Some words, on the other hand, displayed a frank and\ncontemptuous understanding of the real nature of Oceanic society. An example was\nPROLEFEED, meaning the rubbishy entertainment and spurious news which the Party\nhanded out to the masses. Other words, again, were ambivalent, having the\nconnotation \u2018good\u2019 when applied to the Party and\n\n\u2018bad\u2019 when applied to its enemies. But in addition there were great numbers of\nwords which at first sight appeared to be mere abbreviations and which derived\ntheir ideological colour not from their meaning, but from their structure.\n\nSo far as it could be contrived, everything that had or might have political\nsignificance of any kind was fitted into the B vocabulary. The name of every\norganization, or body of people, or doctrine, or country, or institution, or\npublic building, was invariably cut down into the familiar shape; that is, a\nsingle easily pronounced word with the smallest number of syllables that would\npreserve the original derivation. In the Ministry of Truth, for example, the\nRecords Department, in which Winston Smith worked, was called RECDEP, the\nFiction Department was called FICDEP, the Teleprogrammes Department was called\nTELEDEP, and so on. This was not done solely with the object of saving time.\nEven in the early decades of the twentieth century, telescoped words and phrases\nhad been one of the characteristic features of political language; and it had\nbeen noticed that the tendency to use abbreviations of this kind was most marked\nin totalitarian countries and totalitarian organizations. Examples were such\nwords as NAZI, GESTAPO, COMINTERN, INPRECORR, AGITPROP. In the beginning the\npractice had been adopted as it were instinctively, but in Newspeak it was used\nwith a conscious purpose. It was perceived that in thus abbreviating a name one\nnarrowed and subtly altered its meaning, by cutting out most of the associations\nthat would otherwise cling to it. The words COMMUNIST INTERNATIONAL, for\ninstance, call upa composite picture of universal human brotherhood, red flags,\nbarricades, Karl Marx, and the Paris Commune. The word COMINTERN, on the other\nhand, suggests merely a tightly-knit organization and a well-defined body of\ndoctrine. It refers to something almost as easily recognized, and as limited in\npurpose, as a chair or a table. COMIN- TERN is a word that can be uttered almost\nwithout taking thought, whereas COMMUNIST INTERNATIONAL is a phrase over which\none is obliged to linger at least momentarily. In the same way, the associations\ncalled up by a word like MINITRUE are fewer and more controllable than those\ncalled up by MINISTRY OF TRUTH. This accounted not only for the habit of\nabbreviating whenever possible, but also for the almost exaggerated care that\nwas taken to make every word easily pronounceable.\n\nIn Newspeak, euphony outweighed every consideration other than exactitude of\nmeaning. Regularity of grammar was always sacrificed to it when it seemed\nnecessary. And rightly so, since what was required, above all for political\npurposes, was short clipped words of unmistakable meaning which could be uttered\nrapidly and which roused the minimum of echoes in the speaker\u2019s mind. The words\nof the B vocabulary even gained in force from the fact that nearly all of them\nwere very much alike. Almost invariably these words\u2014GOODTHINK, MINIPAX,\nPROLEFEED, SEX- CRIME, JOYCAMP, INGSOC, BELLYFEEL, THINKPOL, and countless\nothers\u2014were words of two or three syllables, with the stress distributed equally\nbetween the first syllable and the last. The use of them encouraged a gabbling\nstyle ofspeech, at once staccato and monotonous. And this was exactly what was\naimed at. The intention was to make speech, and especially speech on any subject\nnot ideologically neutral, as nearly as possible independent of consciousness.\nFor the purposes of everyday life it was no doubt necessary, or sometimes\nnecessary, to reflect before speaking, but a Party member called upon to make a\npolitical or ethical judgement should be able to spray forth the correct\nopinions as automatically as a machine gun spraying forth bullets. His training\nfitted him to do this, the language gave him an almost foolproof instrument, and\nthe texture of the words, with their harsh sound and a certain wilful ugliness\nwhich was in accord with the spirit of Ingsoc, assisted the process still\nfurther.\n\nSo did the fact of having very few words to choose from. Relative to our own,\nthe Newspeak vocabulary was tiny, and new ways of reducing it were constantly\nbeing devised. Newspeak, indeed, differed from most all other languages in that\nits vocabulary grew smaller instead of larger every year. Each reduction was a\ngain, since the smaller the area of choice, the smaller the temptation to take\nthought. Ultimately it was hoped to make articulate speech issue from the larynx\nwithout involving the higher brain centres at all. This aim was frankly admitted\nin the Newspeak word DUCKSPEAK, meaning \u2018to quack like a duck\u2019. Like various\nother words in the B vocabulary, DUCKSPEAK was ambivalent in meaning. Provided\nthat the opinions which were quacked out were orthodox ones, it implied nothing\nbut praise, and when \u2018The Times\u2019 referred to one of the oratorsof the Party as a\nDOUBLEPLUSGOOD DUCKSPEAKER it was paying a warm and valued compliment.\n\nTHE C VOCABULARY. The C vocabulary was supplementary to the others and consisted\nentirely of scientific and technical terms. These resembled the scientific terms\nin use today, and were constructed from the same roots, but the usual care was\ntaken to define them rigidly and strip them of undesirable meanings. They\nfollowed the same grammatical rules as the words in the other two vocabularies.\nVery few of the C words had any currency either in everyday speech or in\npolitical speech. Any scientific worker or technician could find all the words\nhe needed in the list devoted to his own speciality, but he seldom had more than\na smattering of the words occurring in the other lists. Only a very few words\nwere common to all lists, and there was no vocabulary expressing the function of\nScience as a habit of mind, or a method of thought, irrespective of its\nparticular branches. There was, indeed, no word for \u2018Science\u2019, any meaning that\nit could possibly bear being already sufficiently covered by the word INGSOC.\n\nFrom the foregoing account it will be seen that in Newspeak the expression of\nunorthodox opinions, above a very low level, was well-nigh impossible. It was of\ncourse possible to utter heresies of a very crude kind, a species of blasphemy.\nIt would have been possible, for example, to say BIG BROTHER IS UNGOOD. But this\nstatement, which to an orthodox ear merely conveyed a self-evident absurdity,\ncould not have been sustained by reasoned argument, because the necessary words\nwere not available. Ideas inimical to Ingsoc could only be entertained in a\nvague wordless form, and could only be named in very broad terms which lumped\ntogether and condemned whole groups of heresies without defining them in doing\nso. One could, in fact, only use Newspeak for unorthodox purposes by\nillegitimately translating some of the words back into Oldspeak. For example,\nALL MANS ARE EQUAL was a possible Newspeak sentence, but only in the same sense\nin which ALL MEN ARE REDHAIRED is a possible Oldspeak sentence. It did not\ncontain a grammatical error, but it expressed a palpable untruth\u2014i.e. that all\nmen are of equal size, weight, or strength. The concept of political equality no\nlonger existed, and this secondary meaning had accordingly been purged out of\nthe word EQUAL. In 1984, when Oldspeak was still the normal means of\ncommunication, the danger theoretically existed that in using Newspeak words one\nmight remember their original meanings. In practice it was not difficult for any\nperson well grounded in DOUBLETHINK to avoid doing this, but within a couple of\ngenerations even the possibility of such a lapse would have vaished. A person\ngrowing up with Newspeak as his sole language would no more know that EQUAL had\nonce had the secondary meaning of \u2018politically equal\u2019, or that FREE had once\nmeant \u2018intellectually free\u2019, than for instance, a person who had never heard of\nchess would be aware of the secondary meanings attaching to QUEEN and ROOK.\nThere would be many crimes and errors which it would be beyond his power to\ncommit, simply because they were nameless and therefore unimaginable. And it was\nto be foreseen that with\n\nthe passage of time the distinguishing characteristics of Newspeak would become\nmore and more pronounced\u2014its words growing fewer and fewer, their meanings more\nand more rigid, and the chance of putting them to improper uses always\ndiminishing.\n\nWhen Oldspeak had been once and for all superseded, the last link with the past\nwould have been severed. History had already been rewritten, but fragments of\nthe literature of the past survived here and there, imperfectly censored, and so\nlong as one retained one\u2019s knowledge of Oldspeak it was possible to read them.\nIn the future such fragments, even if they chanced to survive, would be\nunintelligible and untranslatable. It was impossible to translate any passage of\nOldspeak into Newspeak unless it either referred to some technical process or\nsome very simple everyday action, or was already orthodox (GOODTHINKFUL would be\nthe Newspeak expression) in tendency. In practice this meant that no book\nwritten before approximately 1960 could be translated as a whole. Pre-\nrevolutionary literature could only be subjected to ideological translation\u2014that\nis, alteration in sense as well as language. Take for example the well-known\npassage from the Declaration of Independence:\n\nWE HOLD THESE TRUTHS TO BE SELF-EVIDENT,\n\nTHAT ALL MEN ARE CREATED EQUAL, THAT THEY\n\nARE ENDOWED BY THEIR CREATOR WITH CERTAIN\n\nINALIENABLE RIGHTS, THAT AMONG THESE ARE\n\nLIFE, LIBERTY, AND THE PURSUIT OF HAPPINESS.\n\nTHAT TO SECURE THESE RIGHTS, GOVERNMENTS ARE\n\nINSTITUTED AMONG MEN, DERIVING THEIR POWERS\n\nFROM THE CONSENT OF THE GOVERNED. THAT\n\nWHENEVER ANY FORM OF GOVERNMENT BECOMES\n\nDESTRUCTIVE OF THOSE ENDS, IT IS THE RIGHT OF THE\n\nPEOPLE TO ALTER OR ABOLISH IT, AND TO INSTITUTE\n\nNEW GOVERNMENT...\n\nIt would have been quite impossible to render this into Newspeak while keeping\nto the sense of the original. The nearest one could come to doing so would be to\nswallow the whole passage up in the single word CRIMETHINK. A full translation\ncould only be an ideological translation, whereby Jefferson\u2019s words would be\nchanged into a panegyric on absolute government.\n\nA good deal of the literature of the past was, indeed, already being transformed\nin this way. Considerations of prestige made it desirable to preserve the memory\nof certain historical figures, while at the same time bringing their\nachievements into line with the philosophy of Ingsoc. Various writers, such as\nShakespeare, Milton, Swift, Byron, Dickens, and some others were therefore in\nprocess of translation: when the task had been completed, their original\nwritings, with all else that survived of the literature of the past, would be\ndestroyed. These translations were a slow and difficult business, and it was not\nexpected that they would be finished before the first or second decade of the\ntwenty-first century. There were also large quantities of merely utilitarian\nliterature\u2014indispensable technical manuals, and the like\u2014that had to be treated\nin the same way. It was chiefly in order to allow time for the preliminary work\nof translation that the final adoption of Newspeak had been fixed for so late a\ndate as 2050.";

// ---- BroadcastChannel ----
const bc = new BroadcastChannel('1984_deletion');

// AI word buffer: accumulate random chars until a word boundary
let aiWordBuffer = '';

function flushAIWord() {
  const words = aiWordBuffer.split(/\s+/).filter(w => w.length > 1);
  if (words.length > 0) {
    bc.postMessage({ text: words.join(' '), source: 'ai' });
  }
  aiWordBuffer = '';
}

// ---- Rendering ----
// We render in chunks for performance
const CHUNK_SIZE = 2000;
const container = document.getElementById('text-container');
const counter = document.getElementById('counter');
const hint = document.getElementById('delete-hint');
const deleteBtn = document.getElementById('delete-btn');
const endScreen = document.getElementById('end-screen');

// Map from char index to span element (only for rendered chars)
// We use a flat text node approach: render chunks as <span> elements
// Each span covers CHUNK_SIZE chars; we rebuild dirty chunks

let chunkCount = Math.ceil(chars.length / CHUNK_SIZE);
let chunkSpans = [];
let dirtyChunks = new Set();

function buildChunks() {
  container.innerHTML = '';
  chunkSpans = [];
  for (let i = 0; i < chunkCount; i++) {
    const span = document.createElement('span');
    span.className = 'chunk';
    container.appendChild(span);
    chunkSpans.push(span);
    renderChunk(i);
  }
}

function renderChunk(ci) {
  const start = ci * CHUNK_SIZE;
  const end = Math.min(start + CHUNK_SIZE, chars.length);
  let text = '';
  for (let i = start; i < end; i++) {
    if (!deleted[i]) text += chars[i];
  }
  chunkSpans[ci].textContent = text;
}

function flushDirty() {
  for (const ci of dirtyChunks) {
    if (chunkSpans[ci]) renderChunk(ci);
  }
  dirtyChunks.clear();
  updateCounter();
  if (aliveCount <= 0) triggerEnd();
}

function updateCounter() {
  const pct = Math.round((1 - aliveCount / totalOriginal) * 100);
  counter.textContent = aliveCount.toLocaleString() + ' chars remaining';
  counter.classList.toggle('low', aliveCount < totalOriginal * 0.1);
}

// ---- AI Deletion ----
// AI deletes random chars at a steady rate
const AI_RATE_MS = 80;     // interval
const AI_BATCH = 12;       // chars per tick

function getRandomAlive() {
  if (aliveCount === 0) return -1;
  // Try random positions
  for (let attempt = 0; attempt < 50; attempt++) {
    const i = Math.floor(Math.random() * chars.length);
    if (!deleted[i]) return i;
  }
  // Fallback: scan
  for (let i = 0; i < chars.length; i++) {
    if (!deleted[i]) return i;
  }
  return -1;
}

let aiTimer = null;

function aiTick() {
  for (let b = 0; b < AI_BATCH; b++) {
    const i = getRandomAlive();
    if (i === -1) { clearInterval(aiTimer); return; }
    aiWordBuffer += chars[i];
    deleted[i] = 1;
    aliveCount--;
    dirtyChunks.add(Math.floor(i / CHUNK_SIZE));
  }
  // Emit when we hit whitespace or buffer is long enough
  if (/\s/.test(aiWordBuffer) || aiWordBuffer.length > 30) {
    flushAIWord();
  }
}

// ---- Human Deletion ----
// We need to map selected text back to char indices.
// Strategy: when mouseup occurs, get window.getSelection(),
// find which chunk spans are involved, and compute char indices.

function getCharIndexFromNode(node, offsetInNode) {
  // Walk up to find chunk span
  let el = node;
  while (el && !el.classList?.contains('chunk')) {
    el = el.parentElement;
  }
  if (!el) return -1;
  const ci = chunkSpans.indexOf(el);
  if (ci === -1) return -1;

  // offsetInNode is position in the chunk's text content (only alive chars)
  // We need to map it to the original char array
  const start = ci * CHUNK_SIZE;
  const end = Math.min(start + CHUNK_SIZE, chars.length);
  let alivePos = 0;
  for (let i = start; i < end; i++) {
    if (!deleted[i]) {
      if (alivePos === offsetInNode) return i;
      alivePos++;
    }
  }
  return end - 1;
}

function getSelectionCharRange() {
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed || sel.rangeCount === 0) return null;
  const range = sel.getRangeAt(0);

  const startIdx = getCharIndexFromNode(range.startContainer, range.startOffset);
  const endIdx = getCharIndexFromNode(range.endContainer, range.endOffset);
  if (startIdx === -1 || endIdx === -1) return null;
  return [Math.min(startIdx, endIdx), Math.max(startIdx, endIdx)];
}

function deleteSelection() {
  const range = getSelectionCharRange();
  if (!range) return;
  const [start, end] = range;
  let collected = '';
  for (let i = start; i <= end; i++) {
    if (!deleted[i]) {
      collected += chars[i];
      deleted[i] = 1;
      aliveCount--;
      dirtyChunks.add(Math.floor(i / CHUNK_SIZE));
    }
  }
  // Send full selected text as-is
  const trimmed = collected.replace(/\n+/g, ' ').trim();
  if (trimmed.length > 0) bc.postMessage({ text: trimmed, source: 'human' });
  window.getSelection().removeAllRanges();
  deleteBtn.style.display = 'none';
  flushDirty();
  playClick();
}

// Show delete button on selection
let selTimeout = null;
document.addEventListener('mouseup', (e) => {
  if (e.target === deleteBtn) return;
  clearTimeout(selTimeout);
  selTimeout = setTimeout(() => {
    const sel = window.getSelection();
    if (sel && !sel.isCollapsed && sel.toString().length > 0) {
      deleteBtn.style.display = 'block';
      deleteBtn.style.left = (e.clientX - 40) + 'px';
      deleteBtn.style.top = (e.clientY - 40) + 'px';
      hint.classList.add('hidden');
    } else {
      deleteBtn.style.display = 'none';
    }
  }, 10);
});

document.addEventListener('mousedown', (e) => {
  if (e.target !== deleteBtn) {
    deleteBtn.style.display = 'none';
  }
});

deleteBtn.addEventListener('click', () => {
  deleteSelection();
});

// Keyboard: Delete or Backspace
document.addEventListener('keydown', (e) => {
  if (e.key === 'Delete' || e.key === 'Backspace') {
    const sel = window.getSelection();
    if (sel && !sel.isCollapsed) {
      e.preventDefault();
      deleteSelection();
    }
  }
});

// ---- End State ----
function triggerEnd() {
  clearInterval(aiTimer);
  clearInterval(renderTimer);
  setTimeout(() => {
    endScreen.classList.add('visible');
  }, 800);
}

// ---- Audio ----
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playClick() {
  const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.04, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < data.length; i++) {
    // Sharp transient decaying rapidly
    const t = i / audioCtx.sampleRate;
    data[i] = (Math.random() * 2 - 1) * Math.exp(-t * 180) * 0.6;
  }
  const source = audioCtx.createBufferSource();
  source.buffer = buf;

  // Low-pass filter to make it low frequency, dull
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = 280;
  filter.Q.value = 0.8;

  // Slight gain
  const gain = audioCtx.createGain();
  gain.gain.value = 1.2;

  source.connect(filter);
  filter.connect(gain);
  gain.connect(audioCtx.destination);
  source.start();
}

// Resume audio context on first interaction
document.addEventListener('mousedown', () => {
  if (audioCtx.state === 'suspended') audioCtx.resume();
}, { once: true });

// ---- Init ----
buildChunks();
updateCounter();

// Render flush loop (60fps-ish but only when dirty)
const renderTimer = setInterval(() => {
  if (dirtyChunks.size > 0) flushDirty();
}, 50);

// AI starts immediately
aiTimer = setInterval(aiTick, AI_RATE_MS);

// Hide hint after first interaction
document.addEventListener('mousedown', () => {
  hint.classList.add('hidden');
}, { once: true });
</script>
</body>
