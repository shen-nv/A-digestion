<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>双网站同时显示</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    .container {
      display: flex;
      width: 100vw;
      height: 100vh;
    }
    iframe {
      width: 50%; /* 左右各占 50% */
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 替换为你的第一个网站地址 -->
    <iframe src="1984.html"></iframe>
    
    <!-- 替换为你的第二个网站地址 -->
    <iframe src="receiver.html"></iframe>
  </div>
</body>
</html>
